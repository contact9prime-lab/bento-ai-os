<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Minimalism: paper, a hairline grid, one accent dot. Anything more would
       be a different theme. -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#0b0b0b" stroke-width="1" opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#f4f4f2"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <g stroke="#0b0b0b" opacity="0.12">
    <path d="M160 0 V1000" stroke-width="1"/>
    <path d="M1440 0 V1000" stroke-width="1"/>
    <path d="M0 160 H1600" stroke-width="1"/>
    <path d="M0 840 H1600" stroke-width="1"/>
  </g>
  <circle cx="1440" cy="160" r="9" fill="#4d9d2f"/>
</svg>
