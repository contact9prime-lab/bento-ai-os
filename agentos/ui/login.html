<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Bento Box AI — sign in</title>
<style>
/* Standalone on purpose: the desktop is 600KB and none of it should load for
   someone who has not signed in yet. */
:root{--bg:#0b0d10;--bg2:#111419;--line:#232a35;--txt:#e6ebf2;--dim:#8a94a6;
  --acc:#5eead4;--acc2:#22d3ee;--err:#f87171;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:
    radial-gradient(1100px 700px at 78% 18%,rgba(34,211,238,.13),transparent 60%),
    radial-gradient(900px 650px at 15% 85%,rgba(94,234,212,.10),transparent 60%),
    linear-gradient(160deg,#0a0f16,#0b0d10 55%,#0d1118);
  color:var(--txt);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
  font:400 15px/1.5 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('/assets/InterVariable.woff2') format('woff2')}
form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.mark{width:64px;height:64px;margin:0 auto 4px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 12px 34px rgba(0,0,0,.5)}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
p.sub{color:var(--dim);font-size:13px}
input{width:100%;padding:14px 16px;font:inherit;font-size:16px;   /* 16px: iOS zooms anything smaller */
  color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;outline:none}
input:focus{border-color:var(--acc)}
button{width:100%;padding:14px;font:inherit;font-weight:700;color:#04211c;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.err{min-height:18px;font-size:13px;color:var(--err)}
.tip{font-size:12px;color:var(--dim);opacity:.8;line-height:1.6}
button.link{width:auto;margin:-4px auto 0;padding:6px 10px;background:none;color:var(--dim);
  font-weight:400;font-size:13px;text-decoration:underline;text-underline-offset:3px}
button.link:hover{color:var(--txt)}
/* the recovery code: shown once, after the first sign-in that seals an account (seal.py) */
#seal{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
/* `display:flex` outranks the hidden attribute: without these the form stayed beside the panel */
#seal[hidden],form[hidden]{display:none}
.code{font:600 clamp(15px,4.6vw,20px)/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em;padding:16px;
  border:1px dashed var(--acc);border-radius:12px;background:rgba(94,234,212,.06);user-select:all}
.code span{display:inline-block;white-space:nowrap}
.row{display:flex;gap:10px}.row button{flex:1}
button.ghost{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line);font-weight:600}
label.tick{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14px;color:var(--txt);cursor:pointer}
label.tick input{width:20px;height:20px;margin-top:2px;flex:none}
.lent{min-height:16px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="mark"><svg viewBox="0 0 24 24" width="64%" height="64%">
    <path d="M12 4.3 L19.6 18.4 Q20.1 19.3 19.1 19.3 L4.9 19.3 Q3.9 19.3 4.4 18.4 Z" fill="#04211c"/>
    <path d="M12 10.2 L15.9 17.6 L8.1 17.6 Z" fill="rgba(255,255,255,.22)"/>
    <circle cx="12" cy="8.6" r="1.5" fill="#04211c"/></svg></div>
  <h1>Bento Box AI</h1>
  <p class="sub" id="sub">Sign in to open this desktop.</p>
  <input id="who" type="text" name="username" placeholder="Username" hidden
         autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next">
  <input id="pw" type="password" name="password" placeholder="Passphrase"
         autocomplete="current-password" autofocus enterkeyhint="go">
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err"></div>
  <!-- Only on a locked screen: the way out of somebody else's lock. -->
  <button id="other" class="link" type="button" hidden>Sign in as someone else</button>
  <div class="lent" id="lent"></div>
  <p class="tip">On iPhone: <b>Share → Add to Home Screen</b> for a full-screen app.</p>
</form>
<div id="seal" hidden></div>
<script>
const f=document.getElementById('f'),pw=document.getElementById('pw'),
      who=document.getElementById('who'),sub=document.getElementById('sub'),
      go=document.getElementById('go'),err=document.getElementById('err'),
      other=document.getElementById('other');

// One page, three questions, and the server decides which one is asked.
//
//   locked   this browser has a session and its owner locked the screen. Then we
//            already know WHO, so we ask for one password and nothing else — that
//            is the whole difference between a lock and a sign-out, and typing
//            your username again to get back into your own desktop would erase it.
//   accounts a machine with users has to ask WHO, because the answer decides which
//            private directory gets opened.
//   neither  a machine with nobody added asks for the remote passphrase — one
//            household, one secret.
//
// Asked of the server rather than guessed: /api/users/who is deliberately outside
// the gate so the locked page can find out what kind of door it is standing at.
let mode='pass';                 // 'lock' | 'accounts' | 'pass'
// A sign-in link (handoff.py) lands here first: say what signing in opens.
// a link from your phone chat: the hand-off of a page, or opening your secrets after a restart
const UNLOCK=location.pathname==='/unlock';
const LINK=location.pathname.indexOf('/handoff/')===0||UNLOCK;
const LINK_WORDS=UNLOCK?'Sign in to open your secrets for your missions.':'Sign in to open the page your agent is waiting on.';
if(LINK)sub.textContent=LINK_WORDS;
fetch('/api/users/who').then(r=>r.json()).then(d=>{
  if(!d)return;
  // a door this browser can't open with a password (Bento itself started it): say so, ask nothing
  if(d.refused&&!d.any&&!d.lock){sub.textContent=d.refused;f.hidden=true;return}
  if(d.locked){
    mode='lock';
    const nm=(d.display||d.name||'').trim();
    document.title='Bento Box AI — locked';
    sub.textContent=nm?'Locked. Signed in as '+nm+'.':'Locked.';
    pw.placeholder=d.lock==='passphrase'?'Passphrase':'Password';
    go.textContent='Unlock';
    // Somebody else's lock is not a wall: signing out drops the session and puts
    // the ordinary sign-in page back, with the username field on it.
    other.hidden=false;
    other.onclick=async()=>{
      try{await fetch('/api/users/logout',{method:'POST'})}catch(e){}
      location.replace('/login');
    };
    pw.focus();
    lendWhileLocked();
    return;
  }
  if(!d.any)return;
  mode='accounts';who.hidden=false;who.focus();
  pw.placeholder='Password';
  sub.textContent=LINK?LINK_WORDS:'Sign in to your desktop.';
}).catch(()=>{});

f.addEventListener('submit',async e=>{
  e.preventDefault();
  const busy=mode==='lock'?'Unlocking…':'Signing in…',label=mode==='lock'?'Unlock':'Sign in';
  err.textContent='';go.disabled=true;go.textContent=busy;
  try{
    const post=(url,body)=>fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const r=mode==='lock'
      ? await post('/api/session/unlock',{password:pw.value})
      : mode==='accounts'
        ? await post('/api/users/login',{name:who.value,password:pw.value})
        : await post('/api/remote/login',{passphrase:pw.value});
    const d=await r.json().catch(()=>({}));
    // a sign-in link (handoff.py) is served this page at its own address: go back to it
    if(r.ok&&(d.recovery_code||d.needs_recovery))return sealStep(d,pw.value);
    if(r.ok)return location.replace(LINK?location.pathname:'/');
    // The lock expired, or the account behind it is gone: the server says so by
    // pointing at /login, and reloading turns this back into a sign-in page.
    if(d.login&&mode==='lock')return location.replace('/login');
    err.textContent=d.error||'sign-in failed';
  }catch(e){err.textContent='could not reach Bento Box AI'}
  go.disabled=false;go.textContent=label;pw.select();
});

// ---- sealed secrets (seal.py) -------------------------------------------------------------
// Every line below is built from text nodes: a recovery code is shown exactly as it is.
const seal=document.getElementById('seal');
function el(tag,attrs,...kids){const e=document.createElement(tag);
  for(const k in attrs||{}){if(k==='on')for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);
    else if(k in e)e[k]=attrs[k];else e.setAttribute(k,attrs[k])}
  for(const k of kids)if(k!=null)e.append(k);return e}
function onward(){location.replace(LINK?location.pathname:'/')}
function sealShow(...kids){f.hidden=true;seal.replaceChildren(...kids);seal.hidden=false}

// The code is shown once, never stored: copy it, download it, and say it was kept.
function showCode(code,why){
  const ok=el('button',{type:'button',disabled:true,textContent:'Continue',on:{click:onward}});
  const tick=el('input',{type:'checkbox',on:{change:()=>{ok.disabled=!tick.checked}}});
  const copy=el('button',{type:'button',className:'ghost',textContent:'Copy',on:{click:async()=>{
    try{await navigator.clipboard.writeText(code);copy.textContent='Copied'}catch(e){copy.textContent='Select it and copy'}}}});
  const save=el('button',{type:'button',className:'ghost',textContent:'Download',on:{click:()=>{
    const a=el('a',{download:'bento-recovery-code.txt',
      href:URL.createObjectURL(new Blob(['Bento recovery code\n\n'+code+'\n\nKeep this somewhere safe, away from this computer.\n'],{type:'text/plain'}))});
    document.body.append(a);a.click();a.remove()}}});
  sealShow(
    el('h1',{textContent:'Save your recovery code'}),
    el('p',{className:'sub',textContent:why}),
    el('div',{className:'code'},...code.split('-').map((g,i,a)=>el('span',{textContent:g+(i<a.length-1?'-':'')}))),
    el('div',{className:'row'},copy,save),
    el('label',{className:'tick'},tick,el('span',{textContent:"I've saved it somewhere safe. Bento won't show it again."})),
    ok);
}

function sealStep(d,password){
  if(d.recovery_code)return showCode(d.recovery_code,
    'Your saved passwords and website sign-ins are now locked with your password. Nobody else '+
    'can open them, not even an admin. If you ever forget your password, this code is the only way back in.');
  // an admin reset the password: the recovery code opens the old seal, or the person starts fresh
  const code=el('input',{type:'text',placeholder:'Recovery code',autocomplete:'off',spellcheck:false});
  const msg=el('div',{className:'err'});
  const open=el('button',{type:'button',textContent:'Open my secrets'});
  const fresh=el('button',{type:'button',className:'link',textContent:"I don't have it: start fresh"});
  const send=async body=>{msg.textContent='';open.disabled=fresh.disabled=true;
    try{const r=await fetch('/api/seal/recover',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({...body,password})});const x=await r.json().catch(()=>({}));
      if(r.ok&&x.recovery_code)return showCode(x.recovery_code,(x.gone&&x.gone.length?
          'Started fresh. Removed: '+x.gone.join(', ')+'. ':'')+'Here is your new recovery code. The old one no longer works.');
      if(r.ok)return onward();
      msg.textContent=x.error||'that did not work'}catch(e){msg.textContent='could not reach Bento'}
    open.disabled=fresh.disabled=false};
  open.onclick=()=>send({code:code.value});
  fresh.onclick=()=>{if(confirm('Start fresh? Your saved passwords and website sign-ins on this account '+
      "can't be opened without the code, so they'll be removed. You'll set them up again."))send({fresh:true})};
  sealShow(
    el('h1',{textContent:'Enter your recovery code'}),
    el('p',{className:'sub',textContent:'Your password was reset by an admin. Your saved passwords and website '+
      'sign-ins are still locked with the old one, and your recovery code opens them.'}),
    code,open,msg,fresh);
  code.focus();
}

// A locked screen keeps lending its half of the key to a mission (the owner's choice), so it
// asks every few seconds what is waiting on it: it has no socket while locked.
function lendWhileLocked(){
  const lent=document.getElementById('lent');
  const tick=async()=>{
    try{const r=await fetch('/api/seal/wants');if(!r.ok)return;const d=await r.json();
      for(const w of d.wants||[]){
        const x=await fetch('/api/seal/lend',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ticket:w.ticket})});
        if(x.ok)lent.textContent='Opened for your mission while locked: '+(w.why||'a step');
      }}catch(e){}
  };
  tick();setInterval(tick,5000);
}
</script>
</body>
</html>
