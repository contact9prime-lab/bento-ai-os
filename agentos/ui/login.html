<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Bento Box AI — sign in</title>
<style>
/* Standalone on purpose: the desktop is 600KB and none of it should load for
   someone who has not signed in yet. */
:root{--bg:#0b0d10;--bg2:#111419;--line:#232a35;--txt:#e6ebf2;--dim:#8a94a6;
  --acc:#5eead4;--acc2:#22d3ee;--err:#f87171;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:
    radial-gradient(1100px 700px at 78% 18%,rgba(34,211,238,.13),transparent 60%),
    radial-gradient(900px 650px at 15% 85%,rgba(94,234,212,.10),transparent 60%),
    linear-gradient(160deg,#0a0f16,#0b0d10 55%,#0d1118);
  color:var(--txt);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
  font:400 15px/1.5 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('/assets/InterVariable.woff2') format('woff2')}
form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.mark{width:64px;height:64px;margin:0 auto 4px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 12px 34px rgba(0,0,0,.5)}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
p.sub{color:var(--dim);font-size:13px}
input{width:100%;padding:14px 16px;font:inherit;font-size:16px;   /* 16px: iOS zooms anything smaller */
  color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;outline:none}
input:focus{border-color:var(--acc)}
button{width:100%;padding:14px;font:inherit;font-weight:700;color:#04211c;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.err{min-height:18px;font-size:13px;color:var(--err)}
.tip{font-size:12px;color:var(--dim);opacity:.8;line-height:1.6}
button.link{width:auto;margin:-4px auto 0;padding:6px 10px;background:none;color:var(--dim);
  font-weight:400;font-size:13px;text-decoration:underline;text-underline-offset:3px}
button.link:hover{color:var(--txt)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="mark"><svg viewBox="0 0 24 24" width="64%" height="64%">
    <path d="M12 4.3 L19.6 18.4 Q20.1 19.3 19.1 19.3 L4.9 19.3 Q3.9 19.3 4.4 18.4 Z" fill="#04211c"/>
    <path d="M12 10.2 L15.9 17.6 L8.1 17.6 Z" fill="rgba(255,255,255,.22)"/>
    <circle cx="12" cy="8.6" r="1.5" fill="#04211c"/></svg></div>
  <h1>Bento Box AI</h1>
  <p class="sub" id="sub">Sign in to open this desktop.</p>
  <input id="who" type="text" name="username" placeholder="Username" hidden
         autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next">
  <input id="pw" type="password" name="password" placeholder="Passphrase"
         autocomplete="current-password" autofocus enterkeyhint="go">
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err"></div>
  <!-- Only on a locked screen: the way out of somebody else's lock. -->
  <button id="other" class="link" type="button" hidden>Sign in as someone else</button>
  <p class="tip">On iPhone: <b>Share → Add to Home Screen</b> for a full-screen app.</p>
</form>
<script>
const f=document.getElementById('f'),pw=document.getElementById('pw'),
      who=document.getElementById('who'),sub=document.getElementById('sub'),
      go=document.getElementById('go'),err=document.getElementById('err'),
      other=document.getElementById('other');

// One page, three questions, and the server decides which one is asked.
//
//   locked   this browser has a session and its owner locked the screen. Then we
//            already know WHO, so we ask for one password and nothing else — that
//            is the whole difference between a lock and a sign-out, and typing
//            your username again to get back into your own desktop would erase it.
//   accounts a machine with users has to ask WHO, because the answer decides which
//            private directory gets opened.
//   neither  a machine with nobody added asks for the remote passphrase — one
//            household, one secret.
//
// Asked of the server rather than guessed: /api/users/who is deliberately outside
// the gate so the locked page can find out what kind of door it is standing at.
let mode='pass';                 // 'lock' | 'accounts' | 'pass'
fetch('/api/users/who').then(r=>r.json()).then(d=>{
  if(!d)return;
  if(d.locked){
    mode='lock';
    const nm=(d.display||d.name||'').trim();
    document.title='Bento Box AI — locked';
    sub.textContent=nm?'Locked. Signed in as '+nm+'.':'Locked.';
    pw.placeholder=d.lock==='passphrase'?'Passphrase':'Password';
    go.textContent='Unlock';
    // Somebody else's lock is not a wall: signing out drops the session and puts
    // the ordinary sign-in page back, with the username field on it.
    other.hidden=false;
    other.onclick=async()=>{
      try{await fetch('/api/users/logout',{method:'POST'})}catch(e){}
      location.replace('/login');
    };
    pw.focus();
    return;
  }
  if(!d.any)return;
  mode='accounts';who.hidden=false;who.focus();
  pw.placeholder='Password';
  sub.textContent='Sign in to your desktop.';
}).catch(()=>{});

f.addEventListener('submit',async e=>{
  e.preventDefault();
  const busy=mode==='lock'?'Unlocking…':'Signing in…',label=mode==='lock'?'Unlock':'Sign in';
  err.textContent='';go.disabled=true;go.textContent=busy;
  try{
    const post=(url,body)=>fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const r=mode==='lock'
      ? await post('/api/session/unlock',{password:pw.value})
      : mode==='accounts'
        ? await post('/api/users/login',{name:who.value,password:pw.value})
        : await post('/api/remote/login',{passphrase:pw.value});
    const d=await r.json().catch(()=>({}));
    if(r.ok)return location.replace('/');
    // The lock expired, or the account behind it is gone: the server says so by
    // pointing at /login, and reloading turns this back into a sign-in page.
    if(d.login&&mode==='lock')return location.replace('/login');
    err.textContent=d.error||'sign-in failed';
  }catch(e){err.textContent='could not reach Bento Box AI'}
  go.disabled=false;go.textContent=label;pw.select();
});
</script>
</body>
</html>
