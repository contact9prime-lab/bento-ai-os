
<div id="menubar">
  <!-- The brand mark is the OS's front door: clicking it opens the omnibar, the
       same thing Ctrl+Space does. Every desktop has a corner you can hit to start
       something, and this was a dead label. -->
  <div id="mb-brand" role="button" tabindex="0" title="Search and run anything (Ctrl+Space)"
       onclick="omniFocus()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();omniFocus()}"><span class="mark"></span><span id="mb-name">Bento Box AI</span></div>
  <span id="mbapp" title="focused app"></span>
  <div id="mbmenus" role="menubar"></div>
  <div id="mbwidgets"></div>
  <!-- Which project you are working in. Inline inside the existing band: in SUI the
       menu bar is a layer-shell exclusive zone whose height the page measures and
       reports to the host, so nothing here may change the band's height. -->
  <span id="mbspace"></span>
  <div id="mb-spacer"></div>
  <div id="pager" title="Virtual desktops — click to switch, right-click to move the active window here"></div>
  <div id="tray">
    <button id="tray-voice" title="Voice mode — Alt+J"></button>
    <button id="tray-ctl" title="Sound & battery — click for Quick Settings"></button>
    <button id="tray-bell" title="Notifications"></button>
    <div id="spin" title="agent is working"></div>
    <!-- Forwarding is never silent: when this machine answers as another agent,
         it says so in the menu bar on every surface, and clicking opens the
         setting that turns it off. -->
    <button id="fwdchip" hidden onclick="openApp('settings');SETTAB='executors';localStorage.setItem('settab','executors')"></button>
    <div id="statdot" title="server connection"></div>
    <div id="tbclock"><span class="dt"></span><span class="tm">--:--</span></div>
    <button id="tray-power" title="Power &amp; session — lock, log out, restart, power off">⏻</button>
  </div>
</div>
<div id="powermenu">
  <button onclick="powerDo('lock','Lock the screen?')">Lock screen</button>
  <button onclick="powerDo('agentos-restart','Restart Bento Box AI? Running turns will stop.')">Restart Bento Box AI</button>
  <hr>
  <button onclick="powerDo('suspend','Suspend the machine?')">Suspend</button>
  <button class="danger" onclick="powerDo('logout','Log out of this session? Unsaved work in other apps will be lost.')">Log out…</button>
  <button class="danger" onclick="powerDo('restart','Restart the machine?')">Restart…</button>
  <button class="danger" onclick="powerDo('poweroff','Power off the machine?')">Power off…</button>
</div>
<div id="notifpanel">
  <div class="np-head"><span>Notifications</span>
    <span style="flex:1"></span>
    <button id="np-dnd" title="Do not disturb"></button>
    <button id="np-clear" title="Clear all">clear</button>
  </div>
  <div id="np-list"></div>
</div>

<div id="desktop">
  <div id="wall"></div>
  <canvas id="jarvis"></canvas>
  <div id="widgets"></div>
  <div id="jarvis-shell"></div>
  <div id="custom-shell"></div>
  <div id="icons"></div>
  <!-- the app deck: bento tiles above the bar. Inside #desktop on purpose —
       #desktop is position:fixed, which creates a stacking context, so a deck
       outside it would paint over every window regardless of z-index. -->
  <div id="deck"></div>
  <!-- the prompt bar lives in the desktop layer: a window covers it, and
       Ctrl+Space (or a double-tap of Ctrl) summons it back to the front. -->
  <div id="barwidgets"></div>
  
  <!-- the ever-present agent: answers rise as cards above the bar -->
  <div id="omnicards"></div>
  <div id="omnibar">
    <div id="omni-orb" title="your agent"></div>
    <div id="omnilist"></div>
    <input id="omni-in" placeholder="" autocomplete="off" spellcheck="false">
    <button id="omni-shot" title="Attach a screenshot"></button>
    <button id="omni-mic" title="Voice"></button>
    <button id="omni-chat" title="Open Chat">⤢</button>
  </div>
</div>
<button id="shell-exit" onclick="applyTheme('agentos')">⊞ Standard desktop</button>

<div id="startmenu">
  <div id="smhead"><div class="mark">▲</div><div><b>Bento Box AI</b><small>your machine, with a brain</small></div></div>
  <div id="smsearch"><input id="smq" placeholder="Search apps & system apps…" autocomplete="off"></div>
  <div id="smapps"></div>
  <div id="smfoot"><div id="smdot" style="width:8px;height:8px;border-radius:50%;background:var(--err)"></div><span id="smstat">connecting…</span></div>
</div>

<div id="ctxmenu"></div>
<div id="switcher"><div id="swbox"></div></div>
<div id="keyshelp"><div id="keysbox"></div></div>

<div id="jarvis-ov"><div class="jbox">
  <div class="jorb" id="j-orb"><span class="jring r1"></span><span class="jring r2"></span><span class="jring r3"></span><span class="jcore"></span></div>
  <div id="j-status">tap the mic to talk</div>
  <div id="j-transcript"></div>
  <div id="j-reply"></div>
  <div class="jbtns">
    <button id="j-mic" title="talk"></button>
    <button id="j-close" class="endbtn">✕ Exit voice</button>
  </div>
</div></div>


<div id="taskbar">
  <button id="startbtn" data-tip="Launcher"><span class="mark"></span></button>
  <span class="dsep"></span>
  <div id="dock"></div>
  <span class="dsep"></span>
  <div id="tbwins"></div>
  <div id="tbnative" title="Windows open on your host desktop — click to switch"></div>
</div>

<div id="boot"><div class="mark">▲</div><h1>Bento Box AI</h1><div class="bbar"><i></i></div></div>
