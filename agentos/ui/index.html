<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AgentOS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/assets/icon-192.png" type="image/png">
<title>AgentOS</title>
<style>
:root{
  /* ---- color (theme-controlled — names are the theme API, do not rename) ---- */
  --bg:#0b0d10; --bg2:#111419; --bg3:#171b22; --bg4:#1e242e;
  --line:#232a35; --txt:#e6ebf2; --dim:#8a94a6; --dim2:#5c6577;
  --acc:#5eead4; --acc2:#22d3ee; --warn:#fbbf24; --err:#f87171; --ok:#4ade80;
  --glass:rgba(17,20,25,.82);
  /* the glass recipe: translucent tint + heavy blur + a hairline of light along
     the top edge. Every floating surface (deck groups, widgets, cards, popovers)
     uses these so they read as one material. */
  --glass-tint:color-mix(in srgb,var(--bg2) 52%,transparent);
  --glass-blur:blur(30px) saturate(1.7);
  --glass-edge:inset 0 .5px 0 rgba(255,255,255,.14);
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mbh:30px;      /* top menu bar */
  --tbh:140px;     /* clearance above the dock + omnibar (toasts, start menu, cards) */
  /* ---- derived hairlines/scrims (flip with mode, not with theme hue) ---- */
  --hairline:rgba(255,255,255,.10);
  --hairline-strong:rgba(255,255,255,.16);
  --scrim:rgba(0,0,0,.45);
  /* ---- type ramp (the only sizes chrome and apps should use) ---- */
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px;
  --fs-lg:16px; --fs-xl:19px; --fs-2xl:24px; --fs-3xl:32px;
  /* ---- spacing scale ---- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  /* ---- radius scale ---- */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-full:999px;
  /* ---- elevation ladder ---- */
  --el-1:0 1px 2px rgba(0,0,0,.25);
  --el-2:0 2px 8px rgba(0,0,0,.30),0 1px 2px rgba(0,0,0,.22);
  --el-3:0 8px 24px rgba(0,0,0,.34),0 2px 6px rgba(0,0,0,.24);
  --el-4:0 18px 48px rgba(0,0,0,.42),0 4px 12px rgba(0,0,0,.26);
  --el-5:0 32px 80px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.3);
  /* ---- motion tokens ---- */
  --d-fast:120ms; --d-base:180ms; --d-slow:280ms; --d-slower:420ms;
  --ease-out:cubic-bezier(.22,1,.36,1);          /* decelerate — entrances, settles */
  --ease-in:cubic-bezier(.4,0,.7,.2);            /* accelerate — exits */
  --ease-spring:cubic-bezier(.34,1.4,.64,1);     /* gentle overshoot — playful UI */
  --ease-in-out:cubic-bezier(.65,0,.35,1);       /* moves between two on-screen states */
}
:root[data-theme=light]{
  --glass-tint:color-mix(in srgb,#fff 62%,transparent);
  --glass-edge:inset 0 .5px 0 rgba(255,255,255,.85);
  --hairline:rgba(0,0,0,.08);
  --hairline-strong:rgba(0,0,0,.14);
  --scrim:rgba(0,0,0,.28);
  --el-1:0 1px 2px rgba(0,0,0,.10);
  --el-2:0 2px 8px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
  --el-3:0 8px 24px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.10);
  --el-4:0 18px 48px rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.10);
  --el-5:0 32px 80px rgba(0,0,0,.22),0 8px 20px rgba(0,0,0,.12);
}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('/assets/InterVariable.woff2') format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:var(--fs-base);overflow:hidden;user-select:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-optical-sizing:auto}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--txt);background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
input[type=range]{accent-color:var(--acc);padding:0;border:none;background:none}
input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ================= app icons (SVG squircle tiles) ================= */
.aicon{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;
  border-radius:24.5%;border:.5px solid rgba(255,255,255,.14);
  box-shadow:0 5px 14px rgba(0,0,0,.42),0 1px 2px rgba(0,0,0,.35),inset 0 .5px 0 rgba(255,255,255,.32);
  background:linear-gradient(180deg,#6b7280,#374151)}
.aicon::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 40%,rgba(0,0,0,.06) 88%)}
.aicon svg{width:56%;height:56%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}
.aicon .em{line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}

/* ================= desktop ================= */
#desktop{position:fixed;inset:var(--mbh) 0 0 0;overflow:hidden;
  background:
    radial-gradient(1100px 700px at 78% 18%,rgba(34,211,238,.13),transparent 60%),
    radial-gradient(900px 650px at 15% 85%,rgba(94,234,212,.10),transparent 60%),
    radial-gradient(700px 500px at 45% 45%,rgba(56,80,120,.14),transparent 65%),
    linear-gradient(160deg,#0a0f16,#0b0d10 55%,#0d1118);
}
#desktop::after{content:'▲';position:absolute;right:4%;bottom:6%;font-size:220px;color:rgba(94,234,212,.035);pointer-events:none;line-height:1}
/* fixed, not absolute: the wallpaper fills the whole viewport so the translucent
   menu bar has something to blur, instead of floating over bare --bg */
#wall{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0;pointer-events:none}
#wall.has::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(11,13,16,.30),rgba(11,13,16,.55))}
#jarvis{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity .7s}
#jarvis.on{opacity:1}
#icons{z-index:2}
#widgets{position:absolute;inset:0;z-index:2;pointer-events:none}

/* ===== experience shells (a theme can replace the whole desktop layout) ===== */
#jarvis-shell{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;font-family:var(--sans)}
body.exp-jarvis #jarvis-shell{display:flex}
body.exp-jarvis #icons{display:none}
body.exp-jarvis #taskbar,body.exp-jarvis #menubar{display:none}   /* fully immersive — no chrome */
body.exp-jarvis #desktop{inset:0}                      /* reclaim the menu bar's space */
/* custom AI-designed shells: a theme can carry `shell` HTML that fully replaces the desktop */
#custom-shell{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;overflow:auto}
body.exp-custom #custom-shell{display:flex}
body.exp-custom #icons{display:none}
body.exp-custom #taskbar,body.exp-custom #menubar{display:none}
body.exp-custom #desktop{inset:0}
#shell-exit{position:fixed;top:10px;right:12px;z-index:9400;font-size:var(--fs-xs);color:var(--dim);
  border:1px solid var(--line);border-radius:var(--r-md);padding:5px 12px;background:var(--glass);display:none}
body.exp-custom #shell-exit{display:block}
#shell-exit:hover{color:var(--txt);border-color:var(--acc)}
#js-top{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;font-size:var(--fs-xs);letter-spacing:.14em;color:var(--dim2)}
#js-top .brand{font-family:'Orbitron',var(--sans);font-weight:700;font-size:var(--fs-base);letter-spacing:.2em;color:var(--acc)}
#js-top .tag{font-size:var(--fs-2xs);border:1px solid var(--line);border-radius:4px;padding:3px 8px;color:var(--dim2);margin-left:10px}
#js-top .stats{display:flex;gap:20px}
#js-top .stats b{color:var(--acc);font-weight:500}
#js-mid{flex:1;display:flex;min-height:0}
#js-side{width:300px;padding:0 0 20px 26px;display:flex;flex-direction:column;gap:14px}
.js-panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--glass);backdrop-filter:blur(10px);padding:14px 16px}
.js-panel .h{font-size:var(--fs-2xs);letter-spacing:.22em;color:var(--dim2);margin-bottom:10px}
#js-stream{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;font-size:var(--fs-xs)}
#js-stream .ln{display:flex;gap:9px;line-height:1.5}
#js-stream .ln .t{color:var(--dim2);flex:none}
#js-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
#js-ring{position:absolute;inset:0}
.js-node{position:absolute;width:78px;height:78px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:border-color var(--d-base) var(--ease-out),box-shadow var(--d-base) var(--ease-out),transform var(--d-base) var(--ease-out);transform:translate(-50%,-50%)}
.js-node:hover{border-color:var(--acc);box-shadow:0 0 24px rgba(94,234,212,.25);transform:translate(-50%,-50%) scale(1.06)}
.js-node .g{font-size:var(--fs-2xl)}
.js-node .n{font-size:8.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
#js-orb{width:220px;height:220px;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
#js-orb .core{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--acc),var(--acc2));box-shadow:0 0 60px 10px rgba(94,234,212,.45);transition:box-shadow var(--d-slow) var(--ease-out)}
#js-orb .rg{position:absolute;border-radius:50%;border:1.5px solid rgba(94,234,212,.24)}
#js-orb .rg.a{width:140px;height:140px}#js-orb .rg.b{width:180px;height:180px}#js-orb .rg.c{width:220px;height:220px}
#js-orb .lbl{position:absolute;font-family:'Orbitron',var(--sans);font-size:var(--fs-2xs);letter-spacing:.3em;color:var(--acc);pointer-events:none}
body.exp-jarvis.js-listening #js-orb .rg{animation:jpulse 1.6s ease-in-out infinite}
body.exp-jarvis.js-listening #js-orb .core{box-shadow:0 0 70px 14px rgba(94,234,212,.65)}
body.exp-jarvis.js-thinking #js-orb{animation:jspin 2.4s linear infinite}
body.exp-jarvis.js-speaking #js-orb .core{animation:jspeak .5s ease-in-out infinite}
#js-bottom{padding:0 26px 26px;display:flex;justify-content:center}
#js-ask{width:min(680px,86%);display:flex;align-items:center;gap:12px;padding:0 18px;height:54px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);box-shadow:0 0 30px rgba(94,234,212,.06)}
#js-ask input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:var(--sans);font-size:var(--fs-base)}
#js-ask .mic{cursor:pointer;font-size:var(--fs-lg);color:var(--acc)}
#js-exit{position:absolute;top:12px;right:26px;z-index:3;font-size:var(--fs-xs);color:var(--dim);border:1px solid var(--line);border-radius:var(--r-md);padding:5px 12px;background:var(--glass)}
#js-exit:hover{color:var(--txt);border-color:var(--acc)}
/* frameless by default — the app's own look shows through; controls appear on hover */
.widget{position:absolute;display:flex;flex-direction:column;pointer-events:auto;
  background:var(--glass-tint);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--el-2),var(--glass-edge);
  resize:both;min-width:150px;min-height:100px;transition:box-shadow var(--d-base) var(--ease-out),border-color var(--d-base) var(--ease-out)}
.widget:hover{border-color:color-mix(in srgb,var(--acc) 26%,var(--hairline-strong));box-shadow:var(--el-4),var(--glass-edge)}
/* a widget's page paints ON the glass, so it must not carry its own opaque backdrop */
.widget iframe{background:transparent}
.widget .wgh{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;gap:6px;
  padding:0 6px 0 10px;cursor:grab;z-index:2;touch-action:none;pointer-events:none;opacity:0;transition:opacity var(--d-base) var(--ease-out);
  background:linear-gradient(rgba(11,13,16,.75),rgba(11,13,16,0))}
.widget:hover .wgh{opacity:1;pointer-events:auto}
.widget .wgh:active{cursor:grabbing}
.widget .wgh::before{content:'⠿';color:var(--dim2);font-size:var(--fs-sm)}
.widget .wgt{flex:1;font-size:var(--fs-2xs);font-weight:600;color:#cfd6e2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.widget .wgh button{width:22px;height:20px;border-radius:var(--r-sm);color:#cfd6e2;font-size:var(--fs-xs);display:flex;align-items:center;justify-content:center;background:rgba(30,36,46,.6)}
.widget .wgh button:hover{background:var(--bg4);color:var(--txt)}
.widget .wgh .x:hover{background:var(--err);color:#fff}
.widget iframe{flex:1;border:none;background:transparent;width:100%;border-radius:var(--r-lg)}

/* desktop icons */
#icons{position:absolute;inset:0}
.dicon{position:absolute;width:88px;padding:10px 4px 8px;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:grab;border:1px solid transparent;touch-action:none}
.dicon.dragging{cursor:grabbing;opacity:.9;z-index:6}
.dicon.dragging .aicon{transform:scale(1.1);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 .5px 0 rgba(255,255,255,.35)}
.dicon.settle{transition:left var(--d-slow) cubic-bezier(.2,.8,.25,1),top var(--d-slow) cubic-bezier(.2,.8,.25,1)}
.dicon .aicon{transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out)}
.dicon:hover .aicon{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.35)}
.dicon:active .aicon{transform:translateY(0) scale(.95)}
.dicon .dlbl{font-size:var(--fs-xs);font-weight:500;color:#eef1f6;text-align:center;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.9);max-width:84px}
.dicon:hover{background:rgba(255,255,255,.05);border-color:var(--hairline)}
.dicon.sel{background:rgba(94,234,212,.12);border-color:rgba(94,234,212,.35)}
#marquee{position:absolute;display:none;z-index:5;pointer-events:none;border-radius:4px;
  border:1px solid rgba(94,234,212,.55);background:rgba(94,234,212,.10)}
.bento{position:absolute;border-radius:var(--r-xl);pointer-events:none;
  background:rgba(255,255,255,.045);border:1px solid var(--hairline)}
.bento .blbl{position:absolute;top:8px;left:15px;font-size:var(--fs-2xs);font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(255,255,255,.5);text-shadow:0 1px 3px rgba(0,0,0,.6)}
:root[data-theme=light] .bento{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.08)}
:root[data-theme=light] .bento .blbl{color:rgba(0,0,0,.45);text-shadow:none}


/* ---- widget mode: the size picker in App Studio and its live preview ---- */
.wgsize{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 10px;border-radius:999px;
  border:1px solid var(--hairline);background:rgba(255,255,255,.04)}
.wgsize .mut{font-size:var(--fs-2xs);letter-spacing:.04em;text-transform:uppercase}
.wgsize button{width:24px;height:20px;border-radius:var(--r-sm);font-size:var(--fs-2xs);font-weight:800;
  color:var(--dim);transition:background var(--d-fast) var(--ease-out),color var(--d-fast)}
.wgsize button:hover{background:rgba(255,255,255,.09);color:var(--txt)}
.wgsize button.on{background:var(--acc);color:#04211c}
.wgpreview{height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 0%,rgba(94,234,212,.07),transparent 60%),var(--bg)}
.wgpreview .widget{box-shadow:var(--el-4)}
/* ================= windows (desktop chrome) ================= */
.win{position:absolute;display:flex;flex-direction:column;min-width:360px;min-height:240px;
  background:var(--bg);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--hairline);border-radius:var(--r-lg);
  box-shadow:var(--el-4);
  resize:both;overflow:hidden}
.win.active{border-color:var(--hairline-strong);box-shadow:var(--el-5)}
.win.maxed{inset:0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win .ttl{display:grid;grid-template-columns:66px 1fr 66px;align-items:center;height:40px;flex:none;padding:0 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border-bottom:1px solid rgba(0,0,0,.28);cursor:default}
.win.active .ttl{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03))}
.win .tmid{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.win .ticon{display:flex}
.win .ticon .aicon{width:17px;height:17px;box-shadow:var(--el-1)}
.win .tname{font-size:var(--fs-sm);font-weight:600;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win.active .tname{color:var(--txt)}
.win .tbtns{display:flex;gap:8px;justify-self:start}
.win .tbtns button{width:13px;height:13px;border-radius:50%;padding:0;position:relative;
  border:.5px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:var(--fs-2xs);font-weight:800;line-height:1;transition:color var(--d-fast) var(--ease-out),background var(--d-fast) var(--ease-out)}
.win .tbtns .cls{background:#ff5f57}.win .tbtns .mn{background:#febc2e}.win .tbtns .mx{background:#28c840}
.win:not(.active) .tbtns button{background:#5a606c}
.win .tbtns:hover button{color:rgba(0,0,0,.55)}
.win .tbtns .cls{order:0}.win .tbtns .mn{order:1}.win .tbtns .mx{order:2}
.win .wbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pad{padding:16px 18px;overflow-y:auto;user-select:text}

/* ================= top menu bar ================= */
#menubar{position:fixed;left:0;right:0;top:0;height:var(--mbh);display:flex;align-items:center;gap:10px;padding:0 12px;
  background:rgba(13,16,21,.72);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border-bottom:1px solid var(--hairline);z-index:9000;font-size:var(--fs-sm);color:var(--txt)}
#mb-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-sm);padding:2px 8px;border-radius:var(--r-sm);cursor:default}
#mb-brand .mark{width:17px;height:17px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center}
#mb-spacer{flex:1}
#pager{display:flex;gap:4px;align-items:center}
.pgb{width:22px;height:20px;border-radius:var(--r-sm);font-size:var(--fs-2xs);font-weight:700;color:var(--dim);border:1px solid transparent;display:flex;align-items:center;justify-content:center}
.pgb:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.pgb.on{background:rgba(255,255,255,.14);color:var(--txt)}
.pgb.add{color:var(--dim2);font-size:var(--fs-md)}
#tray{display:flex;align-items:center;gap:11px;padding:0 0 0 10px}
#statdot{width:8px;height:8px;border-radius:50%;background:var(--err);transition:background var(--d-slow) var(--ease-out),box-shadow var(--d-slow) var(--ease-out)}
#statdot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#spin{display:none;width:12px;height:12px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
#spin.on{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
#tray-ctl{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);color:var(--txt);padding:2px 7px;border-radius:var(--r-sm)}
#tray-ctl:hover{background:rgba(255,255,255,.1)}
#tray-voice{font-size:var(--fs-md);padding:2px 7px;border-radius:var(--r-sm);color:var(--txt)}
#tray-voice:hover{background:rgba(255,255,255,.1)}
#tray-power{font-size:var(--fs-md);padding:2px 7px;border-radius:var(--r-sm);color:var(--txt)}
#tray-power:hover{background:rgba(255,255,255,.1);color:var(--err)}
#powermenu{position:fixed;z-index:9600;display:none;min-width:210px;right:8px;top:calc(var(--mbh) + 4px);
  background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--r-md);padding:5px;
  box-shadow:var(--el-4)}
#powermenu.show{display:block}
#powermenu button{display:flex;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r-sm);font-size:var(--fs-sm);text-align:left;color:var(--txt)}
#powermenu button:hover{background:var(--bg4)}
#powermenu button.danger:hover{background:var(--bg4);color:var(--err)}
#powermenu hr{border:none;border-top:1px solid var(--line);margin:4px 6px}

/* notification center */
#tray-bell{position:relative;display:flex;align-items:center;padding:2px 6px;border-radius:var(--r-sm);color:var(--txt)}
#tray-bell:hover{background:rgba(255,255,255,.1)}
#tray-bell .badge{position:absolute;top:-2px;right:-1px;min-width:13px;height:13px;border-radius:var(--r-sm);
  background:var(--err);color:#fff;font-size:var(--fs-2xs);line-height:13px;text-align:center;padding:0 3px}
#tray-bell.dnd{opacity:.55}
#notifpanel{position:fixed;z-index:9600;display:none;width:340px;max-height:70vh;right:8px;top:calc(var(--mbh) + 4px);
  background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--r-md);padding:8px;
  box-shadow:var(--el-4);overflow:auto}
#notifpanel.show{display:block}
#notifpanel .np-head{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:600;padding:2px 4px 8px}
#notifpanel .np-head button{font-size:var(--fs-xs);color:var(--mut,#8a94a6);padding:2px 7px;border-radius:var(--r-sm)}
#notifpanel .np-head button:hover{background:var(--bg4);color:var(--txt)}
#notifpanel .np-head button.on{color:var(--acc,#5eead4)}
.np-item{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;margin-bottom:6px;position:relative}
.np-item .np-app{font-size:var(--fs-2xs);opacity:.6}
.np-item .np-sum{font-size:var(--fs-sm);font-weight:600;margin:1px 0}
.np-item .np-body{font-size:var(--fs-xs);opacity:.8;white-space:pre-wrap;word-break:break-word}
.np-item .np-x{position:absolute;top:5px;right:7px;opacity:.5;font-size:var(--fs-sm)}
.np-item .np-x:hover{opacity:1;color:var(--err)}
.np-item.crit{border-color:var(--err)}


/* ---- application menus (File · Edit · View · Window · Help) ----
   Only the focused window's menus are shown, so the bar reads as belonging to
   that app rather than to the shell. */
#mbmenus{display:none;align-items:center;gap:1px;margin-left:8px;min-width:0}
#mbmenus.on{display:flex}
#mbmenus button{padding:3px 9px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--txt);
  opacity:.86;white-space:nowrap;transition:background var(--d-fast) var(--ease-out),opacity var(--d-fast)}
#mbmenus button:hover{background:rgba(255,255,255,.1);opacity:1}
#mbmenus button.on{background:var(--acc);color:#fff;opacity:1}
#ctxmenu .mk{margin-left:auto;padding-left:18px;color:var(--dim2);font-size:var(--fs-2xs);letter-spacing:.02em}
@media (max-width:900px){#mbmenus{display:none!important}}

/* ---- window controls for the native tile under the pointer ----
   Fixed-position and mounted on the desktop, because #tbnative scrolls and its
   overflow was clipping these into invisibility. */
#natctl{position:fixed;z-index:9500;display:none;gap:3px;padding:4px;border-radius:999px;
  background:var(--glass-tint);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--hairline);box-shadow:var(--el-4),var(--glass-edge)}
#natctl.on{display:flex}
#natctl button{width:24px;height:24px;border-radius:50%;font-size:12px;line-height:1;
  color:var(--txt);background:rgba(255,255,255,.09);transition:background var(--d-fast) var(--ease-out)}
#natctl button:hover{background:var(--acc);color:#04211c}
#natctl button[data-do="close"]:hover{background:var(--err);color:#fff}
.tbnat.mini{opacity:.45}
/* ================= dock (floating, centered) ================= */
#taskbar{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;height:auto;max-width:min(94vw,1100px);
  display:flex;align-items:flex-end;gap:4px;padding:7px 10px;border-radius:var(--r-xl);
  background:rgba(17,20,26,.58);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
  border:1px solid var(--hairline);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.12);z-index:9000}
#startbtn{display:flex;flex-direction:column;align-items:center;padding:0;position:relative;border-radius:var(--r-lg);
  transition:transform var(--d-base) var(--ease-out)}
#startbtn .mark{width:46px;height:46px;border-radius:24.5%;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;border:.5px solid rgba(255,255,255,.16);
  box-shadow:0 5px 14px rgba(0,0,0,.42),inset 0 .5px 0 rgba(255,255,255,.32)}
#startbtn:hover{transform:translateY(-7px) scale(1.12)}
#startbtn.on .mark{box-shadow:0 0 0 2px rgba(94,234,212,.5),0 5px 14px rgba(0,0,0,.42)}
.dsep{width:1px;align-self:stretch;margin:4px 5px;background:var(--hairline-strong);flex:none}
#dock,#tbwins,#tbnative{display:flex;align-items:flex-end;gap:4px}
#tbwins{overflow:visible}
#tbnative{max-width:30vw;overflow-x:auto}
.dockb,.tbwin,.tbnat{display:flex;flex-direction:column;align-items:center;padding:0;position:relative;border-radius:var(--r-lg);
  transition:transform var(--d-base) var(--ease-out);font-size:0}
.dockb .aicon,.tbwin .aicon,.tbnat .aicon{width:46px;height:46px}
.dockb:hover,.tbwin:hover,.tbnat:hover,.dicon:focus-visible{transform:translateY(-7px) scale(1.12)}
.dockb:active,.tbwin:active{transform:translateY(-3px) scale(1.02)}
.dockb.running::after,.tbwin::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 5px rgba(255,255,255,.6)}
.tbwin.mini::after{background:rgba(255,255,255,.35);box-shadow:none}
.tbwin.on::after{background:var(--acc);box-shadow:0 0 7px var(--acc)}
.tbwin.indock{display:none!important}
.dockb .aicon,.tbwin .aicon,.tbnat .aicon,#startbtn .mark{pointer-events:none}
/* dock tooltips */
.dockb::before,.tbwin::before,.tbnat::before,#startbtn::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 12px);left:50%;
  transform:translateX(-50%) translateY(3px);padding:4px 10px;border-radius:var(--r-sm);white-space:nowrap;font-size:var(--fs-xs);font-weight:600;
  color:var(--txt);background:rgba(20,24,31,.92);border:1px solid var(--hairline);box-shadow:var(--el-3);
  opacity:0;pointer-events:none;transition:opacity var(--d-fast) var(--ease-out),transform var(--d-fast) var(--ease-out);z-index:2}
.dockb:hover::before,.tbwin:hover::before,.tbnat:hover::before,#startbtn:hover::before{opacity:1;transform:translateX(-50%) translateY(0)}
.tbnat .aicon{background:linear-gradient(180deg,#3f4653,#242a34)}
.tbnat .aicon .em{font-size:var(--fs-xl);color:#fff;font-weight:700}
.naicon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:var(--r-md);border:1px solid transparent}
.naicon:hover{background:var(--bg3);border-color:var(--line)}
.naicon img{width:44px;height:44px;object-fit:contain}
.naicon .nafallback{width:44px;height:44px;border-radius:var(--r-md);background:linear-gradient(145deg,var(--bg4),var(--bg2));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xl);font-weight:800;color:var(--acc);text-transform:uppercase}
.naicon .nalbl{font-size:var(--fs-xs);color:#cfd6e2;text-align:center;line-height:1.2;max-width:88px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ===== light theme overrides ===== */
:root[data-theme=light] #desktop{background:
  radial-gradient(1100px 700px at 78% 18%,rgba(233,84,32,.10),transparent 60%),
  radial-gradient(900px 650px at 15% 85%,rgba(119,33,111,.07),transparent 60%),
  linear-gradient(160deg,#f3f1ef,#eceae8 55%,#e7e4e1)}
:root[data-theme=light] #desktop::after{color:rgba(0,0,0,.05)}
:root[data-theme=light] .body strong{color:#000}
:root[data-theme=light] #wall.has::after{background:linear-gradient(rgba(250,249,248,.12),rgba(250,249,248,.30))}
:root[data-theme=light] .dicon .dlbl,:root[data-theme=light] .naicon .nalbl,:root[data-theme=light] .widget .wgt{text-shadow:none;color:#1d1b19}
:root[data-theme=light] .msg.assistant .body strong{color:#000}
:root[data-theme=light] #send,:root[data-theme=light] .save{color:#fff}
:root[data-theme=light] #menubar{background:rgba(250,249,248,.72);border-bottom-color:rgba(0,0,0,.08);color:#1d1b19}
:root[data-theme=light] #taskbar{background:rgba(250,249,248,.6);border-color:rgba(0,0,0,.1)}
:root[data-theme=light] .pgb:hover,:root[data-theme=light] #tray-ctl:hover,:root[data-theme=light] #tray-voice:hover{background:rgba(0,0,0,.07)}
:root[data-theme=light] .pgb.on{background:rgba(0,0,0,.12);color:#1d1b19}
:root[data-theme=light] .dockb.running::after,:root[data-theme=light] .tbwin::after{background:rgba(0,0,0,.55);box-shadow:none}
:root[data-theme=light] .win .ttl{border-bottom-color:rgba(0,0,0,.12)}
#tbclock{text-align:right;line-height:1;cursor:default;display:flex;gap:8px;align-items:center}
#tbclock .tm{font-size:var(--fs-sm);font-weight:600}
#tbclock .dt{font-size:var(--fs-xs);color:var(--dim)}

/* ===== systematic light overrides ===== */
/* only surfaces hardcoded dark (or hardcoded white-wash) in files 01-12; var-driven
   surfaces (--bg*, --glass, --line, --txt) already flip with the theme and are untouched */
:root[data-theme=light] .win .ttl{background:linear-gradient(180deg,rgba(0,0,0,.035),rgba(0,0,0,.01))}
:root[data-theme=light] .win.active .ttl{background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.02))}
:root[data-theme=light] .dockb::before,:root[data-theme=light] .tbwin::before,:root[data-theme=light] .tbnat::before,:root[data-theme=light] #startbtn::before{background:rgba(250,249,248,.95)}
:root[data-theme=light] #tray-power:hover,:root[data-theme=light] #tray-bell:hover{background:rgba(0,0,0,.07)}
:root[data-theme=light] .dicon:hover{background:rgba(0,0,0,.05)}
:root[data-theme=light] .cside{background:rgba(0,0,0,.03)}
:root[data-theme=light] .widget .wgh{background:linear-gradient(rgba(250,249,248,.85),rgba(250,249,248,0))}
:root[data-theme=light] .widget .wgh button{background:rgba(0,0,0,.07);color:#1d1b19}
:root[data-theme=light] #swbox,:root[data-theme=light] #keysbox,:root[data-theme=light] #palbox{border-color:var(--hairline-strong)}


:root[data-theme=light] #mbmenus button:hover{background:rgba(0,0,0,.07)}
/* ================= start menu (launcher) ================= */
#startmenu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tbh) + 16px);width:min(680px,92vw);z-index:9500;display:none;
  background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--hairline);border-radius:var(--r-xl);
  box-shadow:var(--el-5);overflow:hidden}
#startmenu.show{display:block;animation:smpop .14s ease-out}
@keyframes smpop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
#smhead{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
#smhead .mark{width:30px;height:30px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center}
#smhead b{font-size:var(--fs-base)}
#smhead small{display:block;color:var(--dim2);font-size:var(--fs-xs);font-weight:400}
#smapps{padding:6px 12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:2px;max-height:52vh;overflow-y:auto}
.smapp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:var(--r-lg);text-align:center}
.smapp:hover{background:rgba(255,255,255,.07)}
.smapp .aicon{width:48px;height:48px}
.smapp .n{font-size:var(--fs-xs);font-weight:500;color:var(--txt);line-height:1.2;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#smsearch{padding:2px 14px 6px}
#smsearch input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--hairline);border-radius:var(--r-md);padding:8px 12px;font-size:var(--fs-sm);color:var(--txt)}
:root[data-theme=light] #smsearch input{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1)}
.smsect{grid-column:1/-1;font-size:var(--fs-2xs);font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2);padding:10px 6px 3px}
.smapp img.na{width:44px;height:44px;object-fit:contain;margin:2px 0}
.smapp .nafallback{width:44px;height:44px;border-radius:var(--r-md);background:linear-gradient(145deg,var(--bg4),var(--bg2));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xl);font-weight:800;color:var(--acc);text-transform:uppercase;margin:2px 0}
#smfoot{border-top:1px solid var(--hairline);padding:9px 18px;display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--dim)}
:root[data-theme=light] .smapp:hover{background:rgba(0,0,0,.06)}
:root[data-theme=light] #smfoot{border-top-color:rgba(0,0,0,.08)}

/* ================= context menu ================= */
#ctxmenu{position:fixed;z-index:9600;display:none;min-width:190px;background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--el-4);padding:5px}
#ctxmenu.show{display:block}
#ctxmenu button{display:flex;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r-sm);font-size:var(--fs-sm);text-align:left;color:var(--txt)}
#ctxmenu button:hover{background:var(--bg4)}
#ctxmenu hr{border:none;border-top:1px solid var(--line);margin:4px 6px}

/* ================= boot splash ================= */
#boot{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity var(--d-slower) var(--ease-out)}
#boot.off{opacity:0;pointer-events:none}
#boot .mark{width:74px;height:74px;border-radius:var(--r-xl);background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#04211c;font-size:var(--fs-3xl);font-weight:900;box-shadow:0 0 60px rgba(94,234,212,.3)}
#boot h1{font-size:var(--fs-2xl);letter-spacing:.5px}
#boot .bbar{width:180px;height:3px;border-radius:3px;background:var(--bg4);overflow:hidden}
#boot .bbar i{display:block;height:100%;width:35%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:boot 1s ease-in-out infinite}
@keyframes boot{0%{transform:translateX(-120%)}100%{transform:translateX(520%)}}

/* ================= chat app ================= */
.chatwrap{flex:1;display:flex;min-height:0}
.cside{width:210px;min-width:170px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(11,13,16,.4)}
#newchat{margin:10px 10px 8px;padding:8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg3);color:var(--txt);font-weight:600;font-size:var(--fs-sm);transition:border-color var(--d-base) var(--ease-out),color var(--d-base) var(--ease-out)}
#newchat:hover{border-color:var(--acc);color:var(--acc)}
#convs{flex:1;overflow-y:auto;padding:2px 6px 8px}
.conv{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r-md);color:var(--dim);font-size:var(--fs-sm);cursor:pointer;white-space:nowrap;overflow:hidden}
.conv:hover{background:var(--bg3);color:var(--txt)}
.conv.active{background:var(--bg4);color:var(--txt)}
.conv .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.conv .del{opacity:0;color:var(--dim2);font-size:var(--fs-base);padding:0 2px}
.conv:hover .del{opacity:1}
.conv .del:hover{color:var(--err)}
.cmain{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
#modelsel{max-width:240px;font-size:var(--fs-sm);padding:5px 8px;flex:1}
#autosel{font-size:var(--fs-sm);padding:5px 8px}
#chat{flex:1;overflow-y:auto;padding:18px 0 10px;user-select:text}
.inner{max-width:780px;margin:0 auto;padding:0 20px}

/* team / subagent wizard */
.sawrow{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-md);margin:5px 0;cursor:pointer;transition:border-color var(--d-fast) var(--ease-out),background var(--d-fast) var(--ease-out);background:var(--bg3)}
.sawrow:hover{border-color:var(--acc)}
.sawrow.on{border-color:var(--acc);background:var(--bg4)}
.sawrow input{width:auto;margin-top:2px;flex:0 0 auto;accent-color:var(--acc)}
.sawrow .n{font-size:var(--fs-md);font-weight:600;color:var(--txt);letter-spacing:.1px}
.sawrow .d{font-size:var(--fs-sm);color:var(--dim);margin-top:2px;line-height:1.45}
.sawgrp{font-size:var(--fs-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin:12px 2px 4px}
.sawchip{padding:5px 12px;border:1px solid var(--line);border-radius:var(--r-full);background:var(--bg3);color:var(--dim);font-size:var(--fs-sm);flex:0 0 auto}
.sawchip:hover{border-color:var(--acc);color:var(--txt)}
.sawh{font-size:var(--fs-lg);font-weight:700;margin:0 0 2px}
.sawsub{font-size:var(--fs-sm);color:var(--dim);margin:0 0 12px;line-height:1.5}
.teamcard{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:8px;cursor:pointer;transition:border-color var(--d-fast) var(--ease-out);background:var(--bg3)}
.teamcard:hover{border-color:var(--acc)}
.teamcard .tile{flex:0 0 38px;width:38px;height:38px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-base);color:var(--bg);background:linear-gradient(135deg,var(--acc),var(--acc2))}
.teamcard .n{font-size:var(--fs-base);font-weight:650;color:var(--txt)}
.teamcard .meta{font-size:var(--fs-sm);color:var(--dim);margin-top:3px;line-height:1.5}
.teamcard .meta b{color:var(--txt);font-weight:600}
.teamcard .persona{font-size:var(--fs-sm);color:var(--dim2);margin-top:3px;font-style:italic}
.badge{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:var(--r-full);font-size:var(--fs-2xs);color:var(--dim2);margin-left:6px;vertical-align:1px}

#welcome{text-align:center;padding-top:7vh}
#welcome h1{font-size:var(--fs-3xl);font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
#welcome p{color:var(--dim);margin-bottom:26px;font-size:var(--fs-base)}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:600px;margin:0 auto}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg2);color:var(--dim);font-size:var(--fs-sm);transition:border-color var(--d-base) var(--ease-out),color var(--d-base) var(--ease-out),transform var(--d-base) var(--ease-out);text-align:left}
.chip:hover{border-color:var(--acc);color:var(--txt);transform:translateY(-1px)}

.msg{margin-bottom:18px}
.msg.user .bubble{background:var(--bg4);border:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);padding:10px 14px;margin-left:auto;max-width:80%;width:fit-content;white-space:pre-wrap}
.msg.assistant .body{line-height:1.62}
.msg .who{font-size:var(--fs-2xs);color:var(--dim2);margin-bottom:5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.msg.user .who{text-align:right}
.body p{margin:0 0 10px}
.body h1,.body h2,.body h3{margin:14px 0 8px;font-size:1.1em}
.body ul,.body ol{margin:0 0 10px 22px}
.body li{margin:3px 0}
.body code{font-family:var(--mono);font-size:.88em;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 5px}
.body pre{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.body pre code{background:none;border:none;padding:0;font-size:var(--fs-sm);line-height:1.5}
.body table{border-collapse:collapse;margin:0 0 12px;font-size:var(--fs-sm)}
.body th,.body td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.body th{background:var(--bg3);font-weight:600}
.body blockquote{margin:0 0 12px;padding:7px 12px;border-left:3px solid var(--acc,#5eead4);background:var(--bg2);border-radius:0 var(--r-md) var(--r-md) 0;color:var(--dim)}
/* ---- Docs app typography ---- */
.docbody{font-size:var(--fs-md);line-height:1.65;color:var(--txt)}
.docbody>*{max-width:780px}
.docbody h1{font-size:var(--fs-2xl);margin:4px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.docbody h2{font-size:var(--fs-lg);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.docbody h3{font-size:var(--fs-base);margin:20px 0 8px}
.docbody h4{font-size:var(--fs-md);margin:16px 0 6px;color:var(--dim)}
.docbody p{margin:0 0 10px}
.docbody ul,.docbody ol{margin:0 0 12px 22px;padding:0}
.docbody li{margin:3px 0}
.docbody code{font-family:var(--mono);font-size:.87em;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 5px}
.docbody pre{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;overflow-x:auto;margin:0 0 14px}
.docbody pre code{background:none;border:none;padding:0;font-size:var(--fs-sm);line-height:1.55;display:block}
.docbody table{border-collapse:collapse;margin:0 0 14px;width:100%;max-width:780px;font-size:var(--fs-md)}
.docbody th,.docbody td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.docbody th{background:var(--bg3);font-weight:600}
.docbody tr:nth-child(even) td{background:var(--bg2)}
.docbody blockquote{margin:0 0 12px;padding:8px 14px;border-left:3px solid var(--acc,#5eead4);background:var(--bg2);border-radius:0 var(--r-md) var(--r-md) 0;color:var(--dim)}
.docbody hr{border:none;border-top:1px solid var(--line);margin:20px 0}
.docbody a{color:var(--acc,#5eead4);text-decoration:none}
.docbody a:hover{text-decoration:underline}
.doc-nav{flex:0 0 230px;overflow:auto;border-right:1px solid var(--line);padding:10px}
.doc-nav .item{border-radius:var(--r-md);margin-bottom:2px}
.doc-nav .item:hover{background:var(--bg3)}
.body a{color:var(--acc2)}
.body strong{color:#fff}

.tool{border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg2);margin:0 0 12px;overflow:hidden;font-size:var(--fs-md)}
.tool .head{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;user-select:none}
.tool .head:hover{background:var(--bg3)}
.tool .tname2{font-family:var(--mono);font-weight:600;color:var(--acc)}
.tool .targ{font-family:var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:var(--fs-sm)}
.tool .tstat{font-size:var(--fs-xs);padding:2px 8px;border-radius:var(--r-xl);background:var(--bg4);color:var(--dim)}
.tool .tstat.run{color:var(--acc2);animation:pulse 1.2s infinite}
.tool .tstat.ok{color:var(--ok)}
.tool .tstat.fail{color:var(--err)}
.tool .out{display:none;border-top:1px solid var(--line);padding:10px 12px;font-family:var(--mono);font-size:var(--fs-sm);white-space:pre-wrap;max-height:280px;overflow-y:auto;color:var(--dim);background:var(--bg)}
.tool.open .out{display:block}
@keyframes pulse{50%{opacity:.4}}
.think{color:var(--dim2);font-size:var(--fs-sm);font-style:italic;border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px;max-height:120px;overflow-y:auto;white-space:pre-wrap}
.working{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.working .orb{width:26px;height:26px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 45%,var(--acc),var(--acc2));
  box-shadow:0 0 0 0 rgba(94,234,212,.5);animation:orbpulse 1.3s ease-in-out infinite}
@keyframes orbpulse{0%,100%{transform:scale(.82);box-shadow:0 0 14px 2px rgba(94,234,212,.35)}50%{transform:scale(1);box-shadow:0 0 22px 6px rgba(34,211,238,.5)}}
.working .dots{display:flex;gap:4px}
.working .dots i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:dot 1.1s infinite}
.working .dots i:nth-child(2){animation-delay:.18s}.working .dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.working .wtxt{font-size:var(--fs-sm);color:var(--dim)}

.approval{border:1px solid var(--warn);border-radius:var(--r-lg);background:rgba(251,191,36,.06);padding:13px;margin:0 0 12px}
.approval .atitle{color:var(--warn);font-weight:700;font-size:var(--fs-md);margin-bottom:6px}
.approval .acmd{font-family:var(--mono);font-size:var(--fs-sm);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;margin:8px 0;white-space:pre-wrap;word-break:break-all}
.approval .areason{color:var(--dim);font-size:var(--fs-sm)}
.approval .btns{display:flex;gap:8px;margin-top:11px}
.approval .allow{background:var(--warn);color:#1c1503;font-weight:700;padding:7px 18px;border-radius:var(--r-md)}
.approval .deny{border:1px solid var(--line);color:var(--dim);padding:7px 18px;border-radius:var(--r-md)}
.approval .deny:hover{color:var(--err);border-color:var(--err)}
.approval.resolved{opacity:.55}
.approval.resolved .btns{display:none}
.errmsg{color:var(--err);background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.3);border-radius:var(--r-md);padding:10px 14px;margin-bottom:12px;font-size:var(--fs-md)}

#composer{padding:10px 16px 14px}
#attach{display:flex;gap:8px;padding:0 0 8px;flex-wrap:wrap}
#attach .att{position:relative;width:64px;height:64px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
#attach .att img{width:100%;height:100%;object-fit:cover;display:block}
#attach .att button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:var(--fs-sm);line-height:1;cursor:pointer}
.bubble .bimgs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bubble .bimgs img{max-width:220px;max-height:160px;border-radius:var(--r-md);display:block}
/* what you said while it was working, taken into the run in flight */
.steer{color:var(--acc);background:rgba(94,234,212,.06);border-left:2px solid var(--acc);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:7px 12px;margin:0 0 12px;
  font-size:var(--fs-sm);white-space:pre-wrap;overflow-wrap:anywhere}
.steer::before{content:'↩ ';opacity:.7}
/* the queue strip: this chat's to-do list while a turn is running */
#queue{display:none;max-width:780px;margin:0 auto 8px;flex-direction:column;gap:4px}
#queue.on{display:flex}
#queue .qhead{font-size:var(--fs-xs);color:var(--dim2);text-transform:uppercase;letter-spacing:.08em;padding:0 2px 2px}
#queue .qitem{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);
  border-radius:var(--r-md);padding:6px 6px 6px 11px;font-size:var(--fs-sm)}
#queue .qitem.deferred{border-style:dashed}
#queue .qt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
#queue .qs{flex:none;font-size:var(--fs-xs);color:var(--dim2);opacity:.8}
#queue .qx{flex:none;width:22px;height:22px;border-radius:var(--r-md);color:var(--dim2);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm)}
#queue .qx:hover{background:var(--bg4);color:var(--txt)}
#combox{max-width:780px;margin:0 auto;position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-lg);transition:border-color var(--d-base) var(--ease-out),box-shadow var(--d-base) var(--ease-out)}
#combox:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(94,234,212,.08)}
#input{width:100%;background:none;border:none;resize:none;padding:12px 88px 12px 14px;max-height:160px;line-height:1.5}
#mic{position:absolute;right:46px;bottom:8px;width:32px;height:32px;border-radius:var(--r-md);color:var(--dim);font-size:var(--fs-base);display:flex;align-items:center;justify-content:center}
#mic:hover{background:var(--bg4);color:var(--txt)}
#mic.rec{background:var(--err);color:#fff;animation:pulse 1.2s infinite}
#send{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04211c;font-weight:900;font-size:var(--fs-base);display:flex;align-items:center;justify-content:center;transition:opacity var(--d-base) var(--ease-out),background var(--d-base) var(--ease-out),color var(--d-base) var(--ease-out)}
#send:disabled{opacity:.35;cursor:default}
#send.stop{background:var(--err);color:#fff;font-size:var(--fs-sm)}

/* ================= settings / memory / tasks ================= */
label{display:block;font-size:var(--fs-sm);color:var(--dim);margin:12px 0 5px;font-weight:600}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pad input,.pad select,.pad textarea{width:100%}
.save{margin-top:18px;width:100%;padding:10px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04211c;font-weight:700}
.provbox{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:12px}
.provbox .ptitle{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:var(--fs-md)}
.provbox .ptitle input[type=checkbox]{width:auto}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px;font-size:var(--fs-md)}
.item .grow{flex:1;min-width:0}
.item .sub{color:var(--dim2);font-size:var(--fs-xs);margin-top:2px}
.item button{color:var(--dim2);font-size:var(--fs-base)}
.item button:hover{color:var(--err)}
.mut{color:var(--dim2);font-size:var(--fs-sm)}

/* ================= task manager ================= */
.tmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 13px;background:var(--bg2)}
.stat .lbl{font-size:var(--fs-2xs);color:var(--dim2);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.stat .val{font-size:var(--fs-2xl);font-weight:800;margin:3px 0 7px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:var(--fs-xs);color:var(--dim2);font-weight:500}
.bar{height:5px;border-radius:4px;background:var(--bg4);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width var(--d-slower) var(--ease-out)}
.bar i.hot{background:linear-gradient(90deg,var(--warn),var(--err))}
.tmsec{font-size:var(--fs-xs);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim2);margin:14px 0 8px}
table.plist{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.plist th{text-align:left;color:var(--dim2);font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:.5px;padding:4px 8px;border-bottom:1px solid var(--line)}
table.plist td{padding:5px 8px;border-bottom:1px solid rgba(35,42,53,.5);font-variant-numeric:tabular-nums}
table.plist td.n{font-family:var(--mono);font-size:var(--fs-sm)}
table.plist td.r{text-align:right}
table.plist th.r{text-align:right}
.endbtn{border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 10px;font-size:var(--fs-xs);color:var(--dim)}
.endbtn:hover{border-color:var(--err);color:var(--err)}

/* ================= mcp / telegram / logs / kg ================= */
.badge{font-size:var(--fs-2xs);padding:2px 9px;border-radius:var(--r-xl);background:var(--bg4);color:var(--dim);font-weight:600;white-space:nowrap}
.badge.ok{color:var(--ok)}
.badge.err{color:var(--err)}
.badge.run{color:var(--acc2)}
.tools-mini{font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim2);margin-top:3px;word-break:break-word}
details.mtools{margin-top:5px}
details.mtools summary{cursor:pointer;font-size:var(--fs-xs);color:var(--acc2);user-select:none;list-style:none}
details.mtools summary::before{content:'▸ ';font-size:var(--fs-2xs)}
details.mtools[open] summary::before{content:'▾ '}
.mtool{display:flex;gap:8px;padding:4px 0 4px 12px;font-size:var(--fs-xs);border-left:2px solid var(--line);margin-top:4px;align-items:baseline}
.mtool code{font-family:var(--mono);font-size:var(--fs-xs);color:var(--txt);flex:none}
.mtool span{color:var(--dim2);line-height:1.4}
.minstr{font-size:var(--fs-xs);color:var(--dim);border-left:2px solid var(--acc);padding:4px 0 4px 12px;margin-top:5px;line-height:1.45;white-space:pre-wrap}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px;margin:8px 0 4px}
.catcard{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 11px;background:var(--bg2);display:flex;flex-direction:column;gap:3px;text-align:left;position:relative}
.catcard:hover{border-color:var(--acc)}
.catcard .cn{font-size:var(--fs-sm);font-weight:700}
.catcard .cd{font-size:var(--fs-xs);color:var(--dim2);line-height:1.35}
.catcard .ck{font-size:var(--fs-2xs);color:var(--warn);margin-top:2px}
.catcard.inst{opacity:.5;pointer-events:none}
.catcard.inst::after{content:'✓ added';position:absolute;top:8px;right:9px;font-size:var(--fs-2xs);color:var(--ok)}
table.loglist{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.loglist td{padding:5px 8px;border-bottom:1px solid rgba(35,42,53,.5);vertical-align:top}
table.loglist td.lk{white-space:nowrap;color:var(--dim2);font-variant-numeric:tabular-nums}
.lbadge{font-size:var(--fs-2xs);padding:1px 7px;border-radius:var(--r-md);background:var(--bg4);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.lk-tool .lbadge{color:var(--acc)} .lk-turn .lbadge{color:var(--acc2)} .lk-error .lbadge{color:var(--err)}
.lk-telegram .lbadge{color:#60a5fa} .lk-mcp .lbadge{color:#c084fc} .lk-task .lbadge{color:var(--warn)} .lk-system .lbadge{color:var(--dim)}
#soul-ta{flex:1;resize:none;border-radius:0;border:none;background:var(--bg);font-family:var(--mono);font-size:var(--fs-md);line-height:1.6;padding:16px}
.apptop{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.apptop input{flex:1;min-width:90px}
.stepnum{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--bg4);color:var(--acc);font-size:var(--fs-xs);font-weight:800;align-items:center;justify-content:center;margin-right:8px;flex:none}
.fcrumb{cursor:pointer;color:var(--dim)}.fcrumb:hover{color:var(--acc)}.fsep{color:var(--dim2);margin:0 4px}
.fitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-md);cursor:pointer;font-size:var(--fs-md)}
.fitem:hover{background:var(--bg3)}
.fitem .fi{font-size:var(--fs-lg);flex:none}.fitem .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .fmeta{color:var(--dim2);font-size:var(--fs-xs);white-space:nowrap}

/* ================= shared panel shell ================= */
.pshell{display:flex;flex-direction:column;height:100%;min-height:0}
.phead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;background:var(--bg2)}
.phead .pt{font-size:var(--fs-md);font-weight:800;letter-spacing:.2px;white-space:nowrap}
.phead .ps{font-size:var(--fs-xs);color:var(--dim2)}
.phead .sp{flex:1}
.psearch{position:relative;flex:1;min-width:130px;max-width:300px}
.psearch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--dim2);fill:none;stroke-width:2;pointer-events:none}
.psearch input{width:100%;padding:7px 10px 7px 28px;font-size:var(--fs-sm)}
.pbody{flex:1;overflow:auto;padding:14px;min-height:0}
.pbody.flush{padding:0}
.pbody input,.pbody select,.pbody textarea{width:100%}
.pact{padding:8px 14px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04211c;font-weight:700;font-size:var(--fs-sm);white-space:nowrap}
.pact:disabled{opacity:.4}
.pact.stop{background:var(--err);color:#fff}
.pghost{padding:7px 12px;border:1px solid var(--line);border-radius:var(--r-md);color:var(--dim);font-size:var(--fs-sm);white-space:nowrap}
.pghost:hover{border-color:var(--acc);color:var(--txt)}
.seg{display:inline-flex;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-md);padding:2px;gap:2px;flex:none}
.seg button{padding:5px 12px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--dim);font-weight:600;white-space:nowrap}
.seg button.on{background:var(--bg4);color:var(--txt);box-shadow:var(--el-1)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:36px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-lg);margin:6px 0}
.empty .et{font-weight:700;font-size:var(--fs-md)}
.empty .eh{color:var(--dim2);font-size:var(--fs-sm);max-width:400px;line-height:1.5}
.empty svg{width:26px;height:26px;stroke:var(--dim2);fill:none;stroke-width:1.6;opacity:.8}
.sect{font-size:var(--fs-xs);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim2);margin:16px 0 8px}
.sect:first-child{margin-top:0}

/* ================= app studio ================= */
.stside{flex:0 0 208px;width:208px;max-width:208px;min-width:0;overflow:hidden;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
.stlist{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;min-width:0}
.stapp{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-md);cursor:pointer;font-size:var(--fs-sm);width:100%;text-align:left;color:var(--txt)}
.stapp:hover{background:var(--bg3)}
.stapp.on{background:var(--bg4);box-shadow:inset 2px 0 0 var(--acc)}
.stapp .mono{flex:none;width:26px;height:26px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-sm);color:#fff}
.stapp .nm{flex:1;min-width:0}
.stapp .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.stapp .nm span{display:block;color:var(--dim2);font-size:var(--fs-2xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stapp .stren{opacity:0;flex:none;font-size:var(--fs-xs);padding:2px 5px;border-radius:var(--r-sm);transition:opacity var(--d-fast) var(--ease-out)}
.stapp:hover .stren{opacity:.7}
.stapp .stren:hover{opacity:1;background:var(--bg3)}
.stcompose{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.stcompose input{flex:1}
.stcompose .stmodel{flex:0 0 auto;max-width:190px;font-size:var(--fs-sm);padding:5px 8px}


/* ===== first-run wizard (agent-led onboarding) ===== */
.wiz{position:fixed;inset:0;z-index:11500;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1100px 700px at 70% 20%,color-mix(in srgb,var(--acc) 7%,var(--bg)),var(--bg) 70%)}
.wiz-stage{width:min(560px,92vw);max-height:86vh;display:flex;flex-direction:column}
.wiz-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp-3);
  padding:var(--sp-6) var(--sp-5)}
.wiz-mark{width:74px;height:74px;border-radius:var(--r-xl);background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;color:#04211c;font-size:var(--fs-3xl);font-weight:900;
  box-shadow:0 0 60px rgba(94,234,212,.28)}
.wiz-mark-sm{width:46px;height:46px;font-size:var(--fs-xl);border-radius:var(--r-lg);align-self:center;flex:none}
.wiz-title{font-size:var(--fs-2xl);font-weight:800;letter-spacing:.3px}
.wiz-sub{font-size:var(--fs-md);color:var(--dim);max-width:40ch;line-height:1.5}
.wiz-q{font-size:var(--fs-md);font-weight:600;margin-top:var(--sp-3)}
.wiz-input{width:min(320px,80vw);text-align:center;font-size:var(--fs-lg);padding:10px 14px;border-radius:var(--r-md)}
.wiz-next{margin-top:var(--sp-4);padding:10px 26px;border-radius:var(--r-full);font-size:var(--fs-base);font-weight:700;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06211d;
  transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out)}
.wiz-next:hover{transform:translateY(-1px);box-shadow:var(--el-2)}
.wiz-back{font-size:var(--fs-sm);color:var(--dim)}
.wiz-back:hover{color:var(--txt)}
.wiz-dots{display:flex;gap:7px;margin-top:var(--sp-4)}
.wiz-dots span{width:7px;height:7px;border-radius:var(--r-full);background:var(--bg4);transition:background var(--d-base) var(--ease-out)}
.wiz-dots span.on{background:var(--acc)}
.wiz-picks{display:flex;flex-direction:column;gap:8px;width:min(420px,86vw);max-height:34vh;overflow-y:auto;text-align:left}
.wiz-pick{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-md);cursor:pointer;
  background:var(--bg3);border:1.5px solid var(--line);
  transition:border-color var(--d-fast) var(--ease-out),background var(--d-fast) var(--ease-out)}
.wiz-pick:hover{border-color:var(--dim2)}
.wiz-pick:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--bg3))}
.wiz-pick b{font-size:var(--fs-md)}
.wiz-pick span{font-size:var(--fs-xs);color:var(--dim);margin-left:auto}
.wiz-convwrap{align-items:stretch;text-align:left;gap:var(--sp-4)}
.wiz-convo{display:flex;flex-direction:column;gap:var(--sp-3);overflow-y:auto;max-height:62vh;padding:4px}
.wiz-msg{display:flex;gap:10px;align-items:flex-start}
.wiz-ava{width:34px;height:34px;flex:none;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:var(--fs-base);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06211d}
.wiz-say{background:var(--bg3);border:1px solid var(--line);border-radius:4px var(--r-lg) var(--r-lg) var(--r-lg);
  padding:10px 14px;font-size:var(--fs-base);line-height:1.55;min-height:20px;min-width:60px}
.wiz-chips{display:flex;flex-wrap:wrap;gap:8px;padding-left:44px}
.wiz-chip{position:relative;padding:8px 16px;border-radius:var(--r-full);font-size:var(--fs-md);font-weight:600;
  background:var(--bg3);border:1.5px solid var(--line);
  transition:border-color var(--d-fast) var(--ease-out),background var(--d-fast) var(--ease-out),opacity var(--d-fast) var(--ease-out)}
.wiz-chip:hover:not(:disabled){border-color:var(--acc)}
.wiz-chip.rec{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.wiz-chip em{font-style:normal;font-size:var(--fs-2xs);color:var(--acc);margin-left:7px;letter-spacing:.04em}
.wiz-chip:disabled{opacity:.45;cursor:default}
.wiz-chip.on{opacity:1;border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--bg3))}
.wiz-swatch span{display:inline-block;width:34px;height:20px;border-radius:5px;margin-right:8px;vertical-align:middle;
  border:1px solid var(--hairline-strong)}
.wiz-finish{padding-left:44px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.wiz-finish .sub{font-size:var(--fs-sm);color:var(--dim)}

/* ================= automations & hot corners ================= */
.auto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:4px}
.auto-card{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--bg2)}
.auto-top{display:flex;align-items:center;gap:9px}
.auto-ic{width:30px;height:30px;flex:none;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-lg);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04211c}
.auto-nm{font-size:var(--fs-base);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auto-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;
  font-size:var(--fs-sm);color:var(--dim);line-height:1.45}
.auto-steps li::marker{color:var(--dim2);font-size:var(--fs-xs)}
.auto-steps.edit{padding-left:20px}
.auto-steps.edit li{display:flex;align-items:center;gap:6px}
.auto-steps.edit li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.auto-steps.edit li button{padding:1px 7px;font-size:var(--fs-xs)}
.auto-foot{display:flex;align-items:center;gap:6px;margin-top:2px}
.auto-foot .mut{font-size:var(--fs-xs)}
/* a form is not more usable at 1400px — the builder keeps a readable measure
   even when the window is maximised */
.auto-builder{margin-bottom:16px;max-width:820px}
.auto-builder .row>button{flex:0 0 auto}
.auto-builder .save{width:auto}
.auto-add select,.auto-add input{max-width:none}
.auto-add>select{flex:0 0 auto}
/* an automation drives the desktop on its own — say so while it does */
body.auto-running #omni-orb{animation:obusy .9s ease-in-out infinite}

.hc-box{margin-top:18px}
.hc-box .row>button{flex:0 0 auto}
.hc-box .ptitle{display:flex;align-items:center;gap:10px}
.hc-on{margin-left:auto;font-size:var(--fs-xs);font-weight:400;color:var(--dim);display:flex;align-items:center;gap:5px}
.hc-on input{width:auto}
/* the four corners laid out as the screen they map to — the picker IS the map */
.hc-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:44px 10px;
  padding:10px;border:1px dashed var(--line);border-radius:var(--r-lg)}
.hc-cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.hc-cell select{width:100%}
.hc-cell-tr,.hc-cell-br{align-items:flex-end}
.hc-lbl{font-size:var(--fs-2xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.hc-screen{position:absolute;left:32%;right:32%;top:50%;transform:translateY(-50%);height:26px;
  border:1px solid var(--line);border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.5}
.hc-screen span{font-size:var(--fs-2xs);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}

/* ---- remote access ---- */
.rm-pill{margin-left:auto;font-size:var(--fs-2xs);font-weight:800;letter-spacing:.1em;
  padding:2px 9px;border-radius:var(--r-full);background:var(--bg4);color:var(--dim)}
.rm-pill.on{background:var(--ok);color:#04211c}
.provbox .ptitle{display:flex;align-items:center;gap:8px}
.rm-addr{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rm-row{display:flex;align-items:center;gap:8px}
.rm-row code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);
  font-size:var(--fs-sm);padding:7px 10px;border-radius:var(--r-md);
  background:var(--bg3);border:1px solid var(--line)}
.rm-notes{margin:8px 0 0 18px;display:flex;flex-direction:column;gap:6px;
  font-size:var(--fs-sm);color:var(--dim);line-height:1.55}
/* ================= jarvis voice mode ================= */
#jarvis-ov{position:fixed;inset:0;z-index:9750;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,rgba(11,20,26,.86),rgba(6,8,11,.96));backdrop-filter:blur(8px)}
#jarvis-ov.show{display:flex;animation:fadein .25s}
.jbox{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:640px;padding:0 24px;text-align:center}
.jorb{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.jorb .jcore{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--acc),var(--acc2));
  box-shadow:0 0 50px 6px rgba(94,234,212,.5);transition:background var(--d-slow) var(--ease-out),box-shadow var(--d-slow) var(--ease-out)}
.jorb .jring{position:absolute;border-radius:50%;border:1.5px solid rgba(94,234,212,.28)}
.jring.r1{width:120px;height:120px}.jring.r2{width:160px;height:160px;border-color:rgba(34,211,238,.2)}
.jring.r3{width:200px;height:200px;border-color:rgba(94,234,212,.12)}
#jarvis-ov.listening .jorb .jring{animation:jpulse 1.6s ease-in-out infinite}
#jarvis-ov.listening .jorb .jcore{background:radial-gradient(circle at 50% 40%,#7dffdf,#22d3ee);box-shadow:0 0 60px 10px rgba(94,234,212,.6)}
#jarvis-ov.thinking .jorb{animation:jspin 2.2s linear infinite}
#jarvis-ov.thinking .jorb .jring{border-top-color:var(--acc);border-right-color:var(--acc2)}
#jarvis-ov.speaking .jorb .jcore{animation:jspeak .5s ease-in-out infinite}
@keyframes jpulse{0%,100%{transform:scale(.92);opacity:.6}50%{transform:scale(1.06);opacity:1}}
@keyframes jspin{to{transform:rotate(360deg)}}
@keyframes jspeak{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#j-status{font-size:var(--fs-base);color:var(--acc);font-weight:600;letter-spacing:.4px}
#j-transcript{font-size:var(--fs-xl);color:var(--txt);min-height:28px;font-weight:500}
#j-reply{font-size:var(--fs-base);color:var(--dim);line-height:1.6;max-height:34vh;overflow-y:auto;user-select:text}
.jbtns{display:flex;gap:12px;align-items:center;margin-top:6px}
#j-mic{width:58px;height:58px;border-radius:50%;background:var(--bg4);border:1px solid var(--line);font-size:var(--fs-2xl);display:flex;align-items:center;justify-content:center}
#j-mic:hover{border-color:var(--acc)}
#jarvis-ov.listening #j-mic{background:var(--err);border-color:var(--err);animation:jpulse 1.2s infinite}

/* ================= window switcher (Ctrl+Tab) ================= */
#switcher{position:fixed;inset:0;z-index:9720;display:none;align-items:center;justify-content:center;background:rgba(5,7,10,.4);backdrop-filter:blur(4px)}
#switcher.show{display:flex}
#swbox{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:80vw;padding:22px;border-radius:var(--r-xl);
  background:var(--glass);backdrop-filter:blur(22px);border:1px solid #2f3947;box-shadow:var(--el-5)}
.swcard{width:120px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:var(--r-lg);border:2px solid transparent}
.swcard.sel{background:rgba(94,234,212,.12);border-color:var(--acc)}
.swcard .si{width:44px;height:44px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xl)}
.swcard .sn{font-size:var(--fs-xs);color:var(--txt);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}

/* ================= keyboard shortcuts help ================= */
#keyshelp{position:fixed;inset:0;z-index:9710;display:none;align-items:center;justify-content:center;background:rgba(5,7,10,.55);backdrop-filter:blur(4px)}
#keyshelp.show{display:flex}
#keysbox{width:min(720px,92vw);max-height:82vh;overflow-y:auto;background:var(--glass);backdrop-filter:blur(20px);border:1px solid #2f3947;border-radius:var(--r-lg);box-shadow:var(--el-5)}
#keysbox .kh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700}
#keysbox .kbody{padding:14px 20px 20px;columns:2;column-gap:34px}
.kgrp{break-inside:avoid;margin-bottom:16px}
.kgrp h4{font-size:var(--fs-xs);letter-spacing:.6px;text-transform:uppercase;color:var(--dim2);margin:0 0 8px}
.krow{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:var(--fs-sm)}
.krow .kk{display:flex;gap:4px}
kbd{font-family:var(--mono);font-size:var(--fs-xs);background:var(--bg4);border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--r-sm);padding:2px 6px;color:var(--txt)}

/* ================= command palette ================= */
#palette{position:fixed;inset:0;z-index:9700;display:none;background:rgba(5,7,10,.45);backdrop-filter:blur(3px);align-items:flex-start;justify-content:center;padding-top:16vh}
#palette.show{display:flex}
#palbox{width:min(640px,92vw);background:var(--glass);backdrop-filter:blur(20px);border:1px solid #2f3947;border-radius:var(--r-lg);box-shadow:var(--el-5),0 0 0 1px rgba(94,234,212,.08);overflow:hidden;animation:pop .12s ease-out}
#palin{width:100%;border:none;background:none;border-radius:0;font-size:var(--fs-lg);padding:16px 18px;border-bottom:1px solid var(--line)}
#pallist{max-height:46vh;overflow-y:auto;padding:6px}
.palitem{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-md);cursor:pointer}
.palitem .pi{width:32px;height:32px;border-radius:var(--r-md);background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--fs-lg);flex:none}
.palitem .pl{font-size:var(--fs-md);font-weight:600}
.palitem .ph{font-size:var(--fs-xs);color:var(--dim2)}
.palitem.sel{background:rgba(94,234,212,.12);outline:1px solid rgba(94,234,212,.3)}
#palfoot{padding:8px 16px;border-top:1px solid var(--line);font-size:var(--fs-2xs);color:var(--dim2);display:flex;gap:14px}

.toast{position:fixed;bottom:calc(var(--tbh) + 12px);right:14px;background:var(--bg4);border:1px solid var(--acc);border-radius:var(--r-md);padding:10px 15px;font-size:var(--fs-md);z-index:9800;animation:fadein .2s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}

/* ---- hot corner hint: a quarter-disc that fills over the dwell time, so the
   gesture is visible before it fires and you can pull away in time. The arc gets
   its own bright edge — on a wallpaper that happens to share the accent's hue, a
   soft glow alone disappears. ---- */
.hc-hint{position:fixed;width:78px;height:78px;z-index:10800;pointer-events:none;
  opacity:0;transform:scale(.3);
  background:radial-gradient(circle at var(--hx,0%) var(--hy,0%),
    color-mix(in srgb,var(--acc) 78%,transparent) 0%,
    color-mix(in srgb,var(--acc) 30%,transparent) 54%,
    transparent 76%);
  box-shadow:0 0 34px color-mix(in srgb,var(--acc) 40%,transparent);
  transition:opacity var(--hc-ms,240ms) linear,transform var(--hc-ms,240ms) var(--ease-out)}
.hc-hint::after{content:'';position:absolute;inset:0;border-radius:inherit;
  border:0 solid color-mix(in srgb,var(--acc) 92%,transparent)}
.hc-hint.on{opacity:.95;transform:scale(1)}
.hc-hint.hc-tl{top:0;left:0;border-radius:0 0 100% 0;--hx:0%;--hy:0%}
.hc-hint.hc-tr{top:0;right:0;border-radius:0 0 0 100%;--hx:100%;--hy:0%}
.hc-hint.hc-bl{bottom:0;left:0;border-radius:0 100% 0 0;--hx:0%;--hy:100%}
.hc-hint.hc-br{bottom:0;right:0;border-radius:100% 0 0 0;--hx:100%;--hy:100%}
/* only the two edges that form the curve carry the stroke, so the straight
   screen-edge sides stay invisible */
.hc-hint.hc-tl::after{border-right-width:2px;border-bottom-width:2px}
.hc-hint.hc-tr::after{border-left-width:2px;border-bottom-width:2px}
.hc-hint.hc-bl::after{border-right-width:2px;border-top-width:2px}
.hc-hint.hc-br::after{border-left-width:2px;border-top-width:2px}
/* ================= motion & window-system layer =================
   Loaded last: behavioral chrome added by the motion/WM rewrite.
   (resize handles, snap ghost, dialogs, control center, toasts, exposé) */

/* windows: real handles replace the browser's resize grip */
.win{resize:none;transition:box-shadow var(--d-base) var(--ease-out),border-color var(--d-base) var(--ease-out)}
.win.dragging{box-shadow:var(--el-5);cursor:grabbing;will-change:left,top,width,height}
.win.dragging iframe{pointer-events:none}   /* iframes swallow pointermove mid-drag */
.rz{position:absolute;z-index:5}
.rz-n{top:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}
.rz-s{bottom:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}
.rz-e{right:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
.rz-w{left:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
.rz-ne{top:-5px;right:-5px;width:14px;height:14px;cursor:nesw-resize}
.rz-nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nwse-resize}
.rz-se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:nwse-resize}
.rz-sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:nesw-resize}
.win.maxed .rz{display:none}

/* focused app name in the menu bar */
#mbapp{font-weight:700;font-size:var(--fs-md);margin-left:10px;opacity:.92}
#mbapp:empty{display:none}

/* drag-to-edge snap preview */
#snapghost{position:absolute;z-index:99;border-radius:var(--r-lg);pointer-events:none;opacity:0;
  background:color-mix(in srgb,var(--acc) 12%,transparent);
  border:1.5px solid color-mix(in srgb,var(--acc) 45%,transparent);
  backdrop-filter:blur(2px);transition:all var(--d-fast) var(--ease-out)}
#snapghost.on{opacity:1}

/* dock: magnification owns transforms now — retire the old discrete hover pop */
#taskbar .dockb:hover,#taskbar .tbwin:hover,#taskbar .tbnat:hover,#taskbar #startbtn:hover{transform:none}
#taskbar .dockb:active,#taskbar .tbwin:active{filter:brightness(1.25)}
/* auto-hide while a maximized window is focused; peek strip brings it back */
#taskbar{transition:transform var(--d-slow) var(--ease-out),opacity var(--d-slow) var(--ease-out)}
body.dock-hide #taskbar{transform:translateX(-50%) translateY(96px);opacity:0;pointer-events:none}
body.dock-hide.dock-peek #taskbar{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}

/* dialogs (replace window.confirm / alert) */
.dlg-scrim{position:fixed;inset:0;z-index:12000;background:var(--scrim);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center}
.dlg{width:340px;max-width:88vw;padding:22px 20px 16px;border-radius:var(--r-lg);text-align:center;
  background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--hairline-strong);box-shadow:var(--el-5)}
.dlg-icn{width:44px;height:44px;margin:0 auto 10px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-2xl);font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06211d}
.dlg .dlg-t{font-size:var(--fs-base);font-weight:700;margin-bottom:6px}
.dlg .dlg-m{font-size:var(--fs-sm);color:var(--dim);line-height:1.45;margin-bottom:14px}
.dlg-b{display:flex;gap:8px;justify-content:center}
.dlg-b button{flex:1;max-width:140px;padding:8px 12px;border-radius:var(--r-md);font-size:var(--fs-md);font-weight:600;
  background:var(--bg3);border:1px solid var(--line);transition:background var(--d-fast) var(--ease-out),filter var(--d-fast) var(--ease-out)}
.dlg-b button:hover{filter:brightness(1.15)}
.dlg-b .dlg-ok{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06211d;border:none}
.dlg-b .dlg-ok.danger{background:var(--err);color:#2b0606}

.dlg .dlg-in{width:100%;margin-bottom:14px;text-align:left}
/* notification grouping */
.np-group{border-bottom:1px solid var(--hairline)}
.np-group:last-child{border-bottom:none}
.np-gapp{font-size:var(--fs-2xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:8px 12px 0}
#np-dnd{position:relative}
#np-dnd .np-slash{position:absolute;inset:2px;pointer-events:none;
  background:linear-gradient(to top right,transparent 46%,var(--err) 46%,var(--err) 54%,transparent 54%)}

/* proactive surfaces: "For you" digest + desktop cards */
.np-foryou{margin:10px 12px;padding:10px 12px;border-radius:var(--r-md);
  background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 10%,var(--bg3)),color-mix(in srgb,var(--acc2) 7%,var(--bg3)));
  border:1px solid color-mix(in srgb,var(--acc) 30%,transparent)}
.np-fy-head{display:flex;align-items:center;gap:7px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em}
.np-fy-text{font-size:var(--fs-sm);color:var(--txt);margin-top:6px;line-height:1.5}
.np-item.imp{border-left:2px solid var(--acc)}
.procard{position:absolute;right:18px;bottom:calc(var(--tbh) + 14px);width:330px;z-index:8000;
