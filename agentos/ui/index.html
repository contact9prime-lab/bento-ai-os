/* ================= websocket ================= */
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>{setStatus(true);if(sendBtn&&input)sendBtn.disabled=!input.value.trim()};
  ws.onclose=()=>{setStatus(false);setRunning(false);RUNNING.clear();for(const k in STREAMS)delete STREAMS[k];
    removeWorking(); // never leave "thinking…" on screen with no live socket behind it
    if(window.STUDIO&&STUDIO.building)studioLog('<span class="mut">connection lost — reconnecting…</span>');
    setTimeout(connect,1500)};
  ws.onmessage=e=>handle(JSON.parse(e.data));
}
function setStatus(on){
  $('#statdot').classList.toggle('on',on);
  $('#smdot').style.background=on?'var(--ok)':'var(--err)';
  $('#smstat').textContent=on?'online · '+location.host:'reconnecting…';
}
function handle(ev){
  if(ev.type&&ev.type.startsWith('build_')){studioBuildEvent(ev);if(ev.type==='build_thinking')jrPulse=Math.min(1.6,jrPulse+.12);return;}
  const _cid=ev.conversation_id, _cur=!_cid||_cid===currentConv, _s=_cid?STREAMS[_cid]:null;
  switch(ev.type){
    case 'state_sync':{ // sent on every (re)connect: what is actually still running
      RUNNING.clear();
      (ev.running||[]).forEach(c=>{RUNNING.add(c);if(!STREAMS[c])STREAMS[c]={html:'',text:''}});
      if(currentConv&&RUNNING.has(currentConv)){setRunning(true);showWorking();}
      else{setRunning(false);removeWorking();}
      if(window.STUDIO){
        if(ev.build_running){
          if(!STUDIO.building){STUDIO.building=true;const b=$('#st-build');if(b){b.textContent='Cancel';b.classList.add('stop')}studioTickStart();studioLog('<span class="mut">re-attached to the running build…</span>');}
        }else if(STUDIO.building){studioBuildEnded();studioLog('<span class="mut">the build ended while disconnected — check the app list</span>');if(typeof loadUserApps==='function')loadUserApps();}
      }
      break;}
    case 'status':{ // model-side heartbeat ("loading model / evaluating prompt…")
      if(!_cur)break;
      WORK_MSG=ev.message||'';
      if(running)showWorking();       // keep a live indicator up between/after tool calls
      break;}
    case 'conversation': currentConv=ev.id; loadConvs(); break;
    case 'turn_start':{
      if(_cid){RUNNING.add(_cid);STREAMS[_cid]={html:'',text:''};}
      if(_cur)setRunning(true);
      loadConvs(); break;}
    case 'text_delta':{
      if(_s)_s.text+=ev.text;
      if(!_cur)break;
      curText+=ev.text;
      WORK_MSG='';removeWorking(); // real text is flowing now — drop the "working" placeholder
      if(JARVIS.busy){const r=$('#j-reply');if(r){r.textContent=curText;r.scrollTop=r.scrollHeight}}
      if(!curBody)startAssistant();
      if(curBody){curBody.innerHTML=md(curText);curBody.style.transform='translateZ(0)';scrollDown()} break;}
    case 'thinking_delta':{
      if(!_cur)break;
      if(!curBody)startAssistant();
      if(!curBody)break;
      if(!curThink){curThink=document.createElement('div');curThink.className='think';curBody.parentNode.insertBefore(curThink,curBody);}
      curThink.textContent+=ev.text; curThink.scrollTop=curThink.scrollHeight; scrollDown(); break;}
    case 'tool_start':{
      const argStr=ev.name==='run_command'?(ev.args.command||''):JSON.stringify(ev.args);
      if(_s){ // mirror into the buffer so switching chats mid-turn is lossless
        if(_s.text.trim())_s.html+='<div class="body">'+md(_s.text)+'</div>';
        _s.text='';
        _s.html+=`<div class="tool" data-buf="1"><div class="head"><span class="tname2">${esc(ev.name)}</span><span class="targ">${esc(argStr)}</span><span class="tstat run" data-b="${ev.call_id}">running</span></div><div class="out"></div></div>`;}
      if(!_cur)break;
      if(!curBody)startAssistant();
      if(!curBody)break;
      flushText();
      const card=document.createElement('div');card.className='tool';card.id='tc-'+ev.call_id;
      card.innerHTML=`<div class="head"><span class="tname2">${esc(ev.name)}</span><span class="targ">${esc(argStr)}</span><span class="tstat run">${ev.pending_approval?'awaiting approval':'running'}</span></div><div class="out"></div>`;
      card.querySelector('.head').onclick=()=>card.classList.toggle('open');
      curBody.parentNode.insertBefore(card,curBody); scrollDown(); break;}
    case 'tool_end':{
      if(_s)_s.html=_s.html.replace(`class="tstat run" data-b="${ev.call_id}">running`,
        `class="tstat ${ev.ok?'ok':'fail'}" data-b="${ev.call_id}">${ev.ok?'done':'failed'}`);
      if(!_cur)break;
      const card=$('#tc-'+ev.call_id);
      if(card){const st=card.querySelector('.tstat');st.className='tstat '+(ev.ok?'ok':'fail');st.textContent=ev.ok?'done':'failed';
        card.querySelector('.out').textContent=ev.output||'(no output)';
        if(!ev.ok)card.classList.add('open');}
      // the model is about to think about this result — often the slowest gap in a
      // turn; keep a live indicator so it never looks frozen (and repaints on macOS)
      if(running){WORK_MSG='';showWorking()}
      scrollDown(); break;}
    case 'approval_request':{
      const box=document.createElement('div');box.className='approval';box.id='ap-'+ev.id;
      const detail=ev.name==='run_command'?(ev.args.command||''):(ev.name+' '+JSON.stringify(ev.args,null,1));
      const who=ev.offer?permPrincipalLabel(ev.offer.principal_kind,ev.offer.principal_id):'';
      box.innerHTML=`<div class="atitle">Approval needed${who?' · '+esc(who):''}${_cur?'':' · another chat'}</div><div class="acmd">${esc(detail)}</div><div class="areason">${esc(ev.reason||'')}</div><div class="btns"><button class="allow">Allow</button><button class="deny">Deny</button><button class="deny always">${ev.offer?'Allow &amp; remember':'Always allow'}</button></div>`;
      box.querySelector('.allow').onclick=()=>resolveApproval(ev.id,true);
      box.querySelector('.deny:not(.always)').onclick=()=>resolveApproval(ev.id,false);
      box.querySelector('.always').onclick=async()=>{
        if(ev.offer){ // principal-scoped grant, written server-side; revocable in Permissions
          resolveApproval(ev.id,true,true);
          toast('granted to '+who+': '+ev.offer.action+' '+ev.offer.resource);
        }else{
          const pat=ev.name==='run_command'?('run_command '+((ev.args.command||'').trim().split(/\s+/)[0]||'')+' *'):(ev.name+' *');
          await addPolicy('allow',pat);
          resolveApproval(ev.id,true);
          toast('policy added: always allow "'+pat+'"');
        }
      };
      if(_cur&&feed){
        if(!curBody)startAssistant();
        if(curBody)curBody.parentNode.insertBefore(box,curBody);
      }else{ // approval from a chat you're not looking at — float it, never deadlock
        box.style.cssText='position:fixed;right:18px;bottom:70px;z-index:9999;max-width:440px;box-shadow:0 18px 50px rgba(0,0,0,.5)';
        document.body.appendChild(box);
        box.addEventListener('click',()=>setTimeout(()=>{if(box.classList.contains('resolved'))box.remove()},1000));
      }
      toast('approval needed'); scrollDown(); break;}
    case 'error':{
      if(_s){if(_s.text.trim()){_s.html+='<div class="body">'+md(_s.text)+'</div>';_s.text='';}
        _s.html+='<div class="errmsg">'+esc(ev.message)+'</div>';}
      if(!_cur){toast('chat error: '+ev.message);break}
      if(!curBody)startAssistant();
      if(!curBody){toast('error: '+ev.message);break}
      flushText();
      const d=document.createElement('div');d.className='errmsg';d.textContent=ev.message;
      curBody.parentNode.insertBefore(d,curBody); scrollDown(); break;}
    case 'turn_end':{
      if(_cid){RUNNING.delete(_cid);delete STREAMS[_cid];}
      if(!_cur){toast('✓ background chat finished');loadConvs();break}
      removeWorking();const reply=curText;
      if(JARVIS.on&&JARVIS.busy){JARVIS.busy=false;jarvisSpeakAndListen(reply);}
      else speak(reply);
      setRunning(false); curBody=null; curThink=null; curText=''; loadConvs(); break;}
    case 'task_started': toast('background task running…'); break;
    case 'task_finished': toast('task done: '+(ev.result||'').slice(0,80)); loadConvs(); break;
    case 'wallpaper': loadWallpaper(); toast('wallpaper updated'); break;
    case 'config': loadConfig().then(()=>{loadModels()}); toast('configuration updated'); refreshApp('policies'); refreshApp('mcp'); break;
    case 'telegram_chats': refreshApp('telegram'); break;
    case 'knowledge_update': refreshApp('memory'); refreshApp('kg'); refreshApp('profile'); break;
    case 'fabric_event': fabricLiveRefresh(); break;
    case 'fabric_defs': refreshApp('fabric'); break;
    case 'setup': location.reload(); break;
    case 'apps': loadUserApps(); refreshApp('studio'); toast('app library updated'); break;
    case 'grants': refreshApp('permissions'); if(ev.revoked)reloadAppFrames(); break;
    case 'widgets': if(Date.now()>widgetEchoUntil)loadWidgets(); break;
    case 'snapshots': refreshApp('snapshots'); break;
    case 'themes': loadThemes().then(()=>refreshApp('themes')); break;
    case 'theme_apply':{const t=ev.theme;if(t){if(t.name)CUSTOM_THEMES[t.name]=t;applyThemeObj(t);if(t.name){CURRENT_THEME=t.name;localStorage.setItem('theme',t.name)}toast('theme applied: '+(t.name||''));refreshApp('themes')} break;}
    case 'train_setup': TRAIN_SETUP_LISTENERS.forEach(fn=>{try{fn(ev)}catch(e){}}); break;
    case 'hermes_setup': HERMES_SETUP_LISTENERS.forEach(fn=>{try{fn(ev)}catch(e){}}); break;
    case 'files': refreshApp('files'); break;
    case 'models': refreshApp('models'); loadModels(); break;
    case 'model_pull':{const p=$('#mdl-prog');if(p)p.textContent=ev.done?'':(''+ev.name+': '+ev.status);
      if(ev.done){refreshApp('models');toast(''+ev.name+' '+(String(ev.status).startsWith('error')?ev.status:'ready'))} break;}
    case 'telegram_in':{
      toast('Telegram: '+ev.text); jarvisOn(3);
      loadConvs(); if(feed&&currentConv===ev.conversation_id&&!RUNNING.has(currentConv))openConv(currentConv); break;}
    case 'telegram_out':{
      jarvisOff();
      loadConvs(); if(feed&&currentConv===ev.conversation_id&&!RUNNING.has(currentConv))openConv(currentConv); break;}
  }
  if(ev.type==='thinking_delta')jrPulse=Math.min(1.6,jrPulse+.12);
}
function resolveApproval(id,approved,remember){
  ws.send(JSON.stringify({type:'approval',id,approved,remember:!!remember}));
  const box=$('#ap-'+id); if(box){box.classList.add('resolved');
    box.querySelector('.atitle').textContent=approved?'✓ Allowed':'✕ Denied';}
}
function permPrincipalLabel(kind,id){
  if(kind==='app'){const a=(USERAPPS||[]).find(x=>x.id===id);return 'app "'+(a?a.name:id)+'"';}
  return kind+(id?' "'+id+'"':'');
}
function flushText(){
  if(curText.trim()&&curBody){const d=document.createElement('div');d.className='body';d.innerHTML=md(curText);
    curBody.parentNode.insertBefore(d,curBody);}
  curText=''; if(curBody)curBody.innerHTML='';
}
function startAssistant(){
  if(!feed)return;
  removeWorking();
  $('#welcome')?.remove();
  const m=document.createElement('div');m.className='msg assistant';
  m.innerHTML='<div class="who">▲ '+esc(agentName())+'</div>';
  curBody=document.createElement('div');curBody.className='body';
  m.appendChild(curBody);feed.appendChild(m);curThink=null;
}

function setRunning(r){running=r;
  $('#spin').classList.toggle('on',r);
  if(r)jarvisOn();else jarvisOff();
  if(!sendBtn)return;
  sendBtn.classList.toggle('stop',r);
  sendBtn.textContent=r?'◼':'➤';
  sendBtn.disabled=r?false:(!input.value.trim()&&!PENDING_IMGS.length);
}
let PENDING_IMGS=[];
function bubbleImgs(el,urls){
  if(!urls||!urls.length)return;
  const g=document.createElement('div');g.className='bimgs';
  urls.forEach(u=>{const im=document.createElement('img');im.src=u;g.appendChild(im)});
  el.appendChild(g);
}
function addPastedImage(file){
  if(!file)return;
  if(PENDING_IMGS.length>=4){toast('up to 4 images per message');return}
  const img=new Image();
  img.onload=()=>{
    const MAX=1568,sc=Math.min(1,MAX/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    // downscale/recompress large pastes (screenshots) so history stays light
    PENDING_IMGS.push((sc<1||file.size>800000)?c.toDataURL('image/jpeg',.9):c.toDataURL('image/png'));
    URL.revokeObjectURL(img.src);renderAttach();
  };
  img.src=URL.createObjectURL(file);
}
function renderAttach(){
  let a=$('#attach');
  if(!PENDING_IMGS.length){a?.remove();if(sendBtn&&!running)sendBtn.disabled=!input.value.trim();return}
  if(!a){a=document.createElement('div');a.id='attach';const cb=$('#combox');cb.parentNode.insertBefore(a,cb)}
  a.innerHTML=PENDING_IMGS.map((u,i)=>`<div class="att"><img src="${u}"><button onclick="rmAttach(${i})" title="remove">×</button></div>`).join('');
  if(sendBtn&&!running)sendBtn.disabled=false;
}
function rmAttach(i){PENDING_IMGS.splice(i,1);renderAttach()}
function send(){
  if(running){ws.send(JSON.stringify({type:'abort',conversation_id:currentConv}));return}
  const text=input.value.trim();const imgs=PENDING_IMGS.slice();
  if((!text&&!imgs.length)||!ws||ws.readyState!==1)return;
  $('#welcome')?.remove();
  const m=document.createElement('div');m.className='msg user';
  m.innerHTML='<div class="who">you</div><div class="bubble"></div>';
  m.querySelector('.bubble').textContent=text;
  bubbleImgs(m.querySelector('.bubble'),imgs);
  feed.appendChild(m);
  showWorking();scrollDown();
  ws.send(JSON.stringify({type:'chat',text,images:imgs,conversation_id:currentConv,model:$('#modelsel').value}));
  input.value='';input.style.height='auto';PENDING_IMGS=[];renderAttach();setRunning(true);
}
let WORK_TICK=null, WORK_T0=0, WORK_MSG='';
function showWorking(){
  if(!feed)return;
  if(!$('#working')){
    const w=document.createElement('div');w.className='working';w.id='working';
    w.innerHTML=`<div class="orb"></div><div class="wtxt">${esc(agentName())} is working</div><div class="dots"><i></i><i></i><i></i></div><div class="wsub" style="font-size:11px;opacity:.6;margin-left:8px"></div>`;
    feed.appendChild(w);
  }
  WORK_T0=WORK_T0||Date.now();
  if(!WORK_TICK)WORK_TICK=setInterval(tickWorking,1000);
}
function tickWorking(){
  const w=$('#working'); if(!w){clearInterval(WORK_TICK);WORK_TICK=null;return}
  const s=Math.round((Date.now()-WORK_T0)/1000);
  const sub=w.querySelector('.wsub');
  if(sub)sub.textContent=WORK_MSG||(s>3?(s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s')+' · working…':'');
  // a visible per-second mutation forces the compositor to repaint — this is what
  // switching tabs was doing manually on macOS to make streamed text appear
  w.style.opacity=(0.999+(s%2)*0.001);
  scrollDown();
}
function removeWorking(){
  $('#working')?.remove();
  if(WORK_TICK){clearInterval(WORK_TICK);WORK_TICK=null}
  WORK_T0=0;WORK_MSG='';
}
async function loadConvs(){
  const box=$('#convs'); if(!box)return;
  const r=await fetch('/api/conversations');const d=await r.json();
  if(!$('#convs'))return;
  box.innerHTML='';
  d.conversations.forEach(c=>{
    const el=document.createElement('div');el.className='conv'+(c.id===currentConv?' active':'');
    el.innerHTML=`<span class="t"></span><button class="del">✕</button>`;
    el.querySelector('.t').textContent=(RUNNING.has(c.id)?'● ':'')+(c.title||'untitled');
    if(RUNNING.has(c.id))el.querySelector('.t').style.color='var(--acc,#5eead4)';
    el.onclick=e=>{if(!e.target.classList.contains('del'))openConv(c.id)};
    el.querySelector('.del').onclick=async e=>{e.stopPropagation();
      if(RUNNING.has(c.id))return toast('that chat has a turn running — stop it first');
      await fetch('/api/conversations/'+c.id,{method:'DELETE'});
      if(currentConv===c.id)newChat(); else loadConvs();};
    box.appendChild(el);
  });
}
async function openConv(cid){
  currentConv=cid;
  const r=await fetch('/api/conversations/'+cid);const d=await r.json();
  if(!feed)return;
  curBody=null;curThink=null;curText='';
  feed.innerHTML='';
  d.messages.forEach(msg=>{
    const m=document.createElement('div');m.className='msg '+msg.role;
    if(msg.role==='user'){m.innerHTML='<div class="who">you</div><div class="bubble"></div>';const bb=m.querySelector('.bubble');bb.textContent=msg.content;bubbleImgs(bb,msg.meta?.images);}
    else{m.innerHTML='<div class="who">▲ '+esc(agentName())+'</div>';
      (msg.meta?.steps||[]).forEach(s=>{
        if(s.type==='tool'){const card=document.createElement('div');card.className='tool';
          const argStr=s.name==='run_command'?(s.args.command||''):JSON.stringify(s.args);
          card.innerHTML=`<div class="head"><span class="tname2">${esc(s.name)}</span><span class="targ">${esc(argStr)}</span><span class="tstat ${s.ok?'ok':'fail'}">${s.ok?'done':'failed'}</span></div><div class="out"></div>`;
          card.querySelector('.out').textContent=s.output||'';
          card.querySelector('.head').onclick=()=>card.classList.toggle('open');
          m.appendChild(card);}
      });
      const b=document.createElement('div');b.className='body';b.innerHTML=md(msg.content||'');m.appendChild(b);}
    feed.appendChild(m);
  });
  // a turn is live in this conversation: replay its buffered stream and keep streaming
  if(RUNNING.has(cid)){
    startAssistant();
    const s=STREAMS[cid];
    if(s&&curBody){
      if(s.html){const holder=document.createElement('div');holder.innerHTML=s.html;
        [...holder.children].forEach(el=>{
          const h=el.querySelector?.('.head');
          if(h)h.onclick=()=>el.classList.toggle('open');
          curBody.parentNode.insertBefore(el,curBody)});}
      curText=s.text;curBody.innerHTML=md(curText);
    }
    showWorking();
  }
  setRunning(RUNNING.has(cid));
  loadConvs();scrollDown();
}
function newChat(){
  currentConv=null;curBody=null;curThink=null;curText='';
  if(feed){feed.innerHTML='';showWelcome()}
  setRunning(false);
  loadConvs();
}

async function loadModels(){
  try{
    const r=await fetch('/api/models');const d=await r.json();
    const sel=$('#modelsel');if(!sel)return;
    const prev=sel.value;
    sel.innerHTML='';
    // Engine choice: the built-in agent (Aria, model-backed) or Hermes as the backend
    let hermesOn=false;
    try{const h=await (await fetch('/api/hermes/status')).json();hermesOn=h.installed&&h.engine_enabled!==false}catch(e){}
    if(d.models.length){
      const g=document.createElement('optgroup');g.label='Aria (built-in agent) — model';
      d.models.forEach(m=>{const o=document.createElement('option');o.value=m.id;
        o.textContent=m.name+' · '+m.provider+(m.provider==='ollama'?' (local)':'');g.appendChild(o)});
      sel.appendChild(g);
    }else if(!hermesOn){sel.innerHTML='<option value="">no models — check Settings</option>';return}
    if(hermesOn){
      const g=document.createElement('optgroup');g.label='Other engine';
      const o=document.createElement('option');o.value='hermes';o.textContent='🜁 Hermes agent';
      g.appendChild(o);sel.appendChild(g);
    }
    // keep the prior choice if still present, else the config default, else first model
    const has=v=>[...sel.options].some(o=>o.value===v);
    sel.value=has(prev)?prev:(d.default&&has(d.default)?d.default:(d.models[0]?d.models[0].id:'hermes'));
  }catch(e){}
}

/* ================= memory app ================= */
let memTab='user';
async function renderMemory(body){
  await loadConfig();
  const r=await fetch('/api/memories');const d=await r.json();
  const auto=(cfg.memory||{}).auto_extract!==false;
  const srcBadge=m=>m.source==='auto'?'<span class="badge" title="learned automatically" style="font-size:9px;padding:1px 6px;margin-right:4px">auto</span>':'';
  const when=m=>new Date(m.created_at*1000).toLocaleString();
  const user=d.memories.filter(m=>(m.scope||'user')==='user');
  const sess=d.memories.filter(m=>m.scope==='session');
  let items='';
  if(memTab==='user'){
    items=user.map(m=>`<div class="item" data-f="${esc(m.content)}"><div class="grow">${srcBadge(m)}${esc(m.content)}<div class="sub">${when(m)}</div></div>
      <button title="${m.pinned?'unpin':'pin (always injected first)'}" style="${m.pinned?'':'opacity:.45'};font-size:11px" onclick="pinMemory('${m.id}',${m.pinned?0:1})">${m.pinned?'pinned':'pin'}</button>
      <button title="edit" onclick="editMemory('${m.id}')">✎</button>
      <button title="delete" onclick="delMemory('${m.id}')">✕</button></div>`).join('')
      ||emptyBox('No user memories yet','They appear here as you chat (auto-learn), when the agent calls <code>remember</code>, or when you add one below.');
  }else{
    const groups={};
    sess.forEach(m=>{(groups[m.conversation_id||'?']=groups[m.conversation_id||'?']||{title:m.conversation_title||'(deleted conversation)',items:[]}).items.push(m)});
    items=Object.entries(groups).map(([cid,g])=>`<div data-fgroup><div class="ptitle" style="margin-top:10px">${esc(g.title)}</div>`+
      g.items.map(m=>`<div class="item" data-f="${esc(g.title+' '+m.content)}"><div class="grow">${srcBadge(m)}${esc(m.content)}<div class="sub">${when(m)}</div></div>
        <button title="promote to user memory (durable)" onclick="promoteMemory('${m.id}')">⤴</button>
        <button title="edit" onclick="editMemory('${m.id}')">✎</button>
        <button title="delete" onclick="delMemory('${m.id}')">✕</button></div>`).join('')+'</div>').join('')
      ||emptyBox('No session memories yet','These capture the working context of each conversation (goals, decisions, constraints) and are injected only into that conversation.');
  }
  window.__mems=Object.fromEntries(d.memories.map(m=>[m.id,m.content]));
  const pb=panelShell(body,{
    title:'Memory',
    search:{id:'mem-q',placeholder:'Search memories…'},
    actions:segTabs('mem-tabs',[`User (${user.length})`,`Sessions (${sess.length})`],memTab==='user'?0:1,'memSetTab')
      +`<label class="row" style="flex:0 0 auto;align-items:center;gap:6px;margin:0;font-size:12px" title="After every chat turn, a background pass extracts user memories, session memories and knowledge-graph facts">
        <input type="checkbox" id="mem-auto" style="width:auto" ${auto?'checked':''} onchange="setAutoLearn(this.checked)">auto-learn</label>
      <button class="pghost" title="merge duplicate entities, roll up idle sessions, re-index memory" onclick="tidyKnowledge()">Tidy</button>`,
  });
  pb.innerHTML=`
    ${items}
    <div class="sect">Add a ${memTab==='user'?'user':'session'} memory</div>
    <div class="row"><input id="mem-new" placeholder="${memTab==='user'?'e.g. My name is Piyush; I work at Accacia.':'e.g. We decided to use SQLite for this project.'}">
      <button class="pact" style="flex:0 0 90px" onclick="addMemory()">Add</button></div>
    ${memTab==='session'&&!currentConv?'<p class="mut" style="margin-top:8px">Session memories attach to the active chat — open a conversation first.</p>':''}`;
}
function memSetTab(i){memTab=i===0?'user':'session';refreshApp('memory')}
async function addMemory(){const v=$('#mem-new').value.trim();if(!v)return;
  const b={content:v,scope:memTab};
  if(memTab==='session'){if(!currentConv){toast('open a conversation first');return}b.conversation_id=currentConv}
  await fetch('/api/memories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});refreshApp('memory');}
async function delMemory(id){await fetch('/api/memories/'+id,{method:'DELETE'});refreshApp('memory');}
async function pinMemory(id,p){await fetch('/api/memories/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({pinned:p})});refreshApp('memory');}
async function promoteMemory(id){await fetch('/api/memories/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({scope:'user'})});toast('promoted to user memory');refreshApp('memory');}
async function editMemory(id){
  const cur=(window.__mems||{})[id]||'';
  const v=prompt('Edit memory:',cur);
  if(v===null||!v.trim()||v.trim()===cur)return;
  await fetch('/api/memories/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:v.trim()})});refreshApp('memory');}
async function setAutoLearn(on){
  await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({memory:{auto_extract:!!on}})});
  toast(on?'auto-learn on — memory & knowledge graph populate from every chat':'auto-learn off');}
async function tidyKnowledge(){
  await fetch('/api/knowledge/maintain',{method:'POST'});
  toast('tidying knowledge in the background — merging duplicates, rolling up idle sessions, indexing memory');}

    <div class="ptitle" style="margin-top:14px">How things connect</div>
    ${facts.slice(0,50).map(f=>`<div class="item"><div class="grow">${esc(f.s)} <span class="mut">—${esc(f.r)}→</span> ${esc(f.o)}</div></div>`).join('')||'<p class="mut">The knowledge graph is empty.</p>'}
    <div class="ptitle" style="margin-top:14px">Soul</div>
    <pre style="white-space:pre-wrap;font-size:12px;opacity:.85;max-height:180px;overflow:auto">${esc((soul.content||'').slice(0,2500))}</pre>
    <div class="row" style="margin-top:10px">
      <button class="endbtn" onclick="openApp('memory')">◈ Manage memory</button>
      <button class="endbtn" onclick="openApp('kg')">Knowledge graph</button>
      <button class="endbtn" onclick="openApp('soul')">Edit soul</button>
      <button class="endbtn" onclick="tidyKnowledge()">Tidy now</button>

let SAW=null;
const SAW_PRESETS={
  'Read-only':['fetch_url','read_file','list_dir','recall','kg_query','system_info'],
  'Research':['fetch_url','read_file','list_dir','recall','kg_query','save_report'],

  'Builder':['create_app','read_file','list_dir','fetch_url','system_info'],

async function openSAW(name){
  const [tools,skills,models]=await Promise.all([
    fetch('/api/tools').then(r=>r.json()).catch(()=>({tools:[]})),
    fetch('/api/skills').then(r=>r.json()).catch(()=>({skills:[]})),
    fetch('/api/models').then(r=>r.json()).catch(()=>({models:[]}))]);
  const ex=name?(window.__subagents||{})[name]:null;
  SAW={step:1,exists:!!ex,tools:tools.tools||[],skills:skills.skills||[],models:models.models||[],q:'',
    d:ex?{...ex,tools:[...(ex.tools||[])],skills:[...(ex.skills||[])]}
        :{name:'',soul:'',model:'',tools:[],skills:[],autonomy_cap:'balanced',max_steps:12,max_seconds:300,builtin:0,target:'local'}};
  drawSAW();
}

    ov.onclick=e=>{if(e.target===ov){SAW=null;drawSAW()}};document.body.appendChild(ov);}
  const d=SAW.d,st=SAW.step;
  const dot=n=>`<span style="width:8px;height:8px;border-radius:50%;display:inline-block;margin:0 3px;background:${n<=st?'var(--acc,#5eead4)':'var(--line,#333)'}"></span>`;
  let inner='';
  if(st===1){
    const opts=['<option value="">inherit from control plane (OS default)</option>']

    inner=`<div class="sawh">${SAW.exists?'Edit':'New'} subagent</div>

      <p class="mut" style="font-size:12px">Pin a model to mix smartness across the team — e.g. this one on Claude while others run local.</p>`;
  }else if(st===2){
    const chips=Object.keys(SAW_PRESETS).map(p=>`<button class="sawchip" onclick="sawPreset('${p}')">${p}</button>`).join('')
      +`<button class="sawchip" onclick="SAW.d.tools=[];sawRefreshList()">Clear all</button>`;
    const skl=SAW.skills.map(s=>`<label class="sawrow ${d.skills.includes(s.name)?'on':''}"><input type="checkbox" ${d.skills.includes(s.name)?'checked':''} onchange="sawSkill('${esc(s.name)}',this.checked);this.closest('.sawrow').classList.toggle('on',this.checked)">
        <div class="grow"><div class="n">${esc(s.name)}</div><div class="d">${esc((s.description||'').slice(0,110))}</div></div></label>`).join('')
      ||'<p class="mut">No skills installed yet — add some in the Skills app.</p>';
    inner=`<div class="sawh">Capabilities</div>
      <div class="sawsub">Pick from what's already on this OS — tools, connected MCP servers, installed skills. Nothing to type.</div>
      <div class="row" style="margin:0 0 8px;flex-wrap:wrap;gap:6px">${chips}</div>
      <input id="sw-q" placeholder="Search ${SAW.tools.length} tools by name or what they do…" value="${esc(SAW.q)}" style="font-size:13.5px;padding:10px 12px">

function wfLayers(steps){
  const done=new Set(),layers=[];let rem=[...steps];
  while(rem.length){
    let layer=rem.filter(s=>(s.depends_on||[]).every(d=>done.has(d)));
    if(!layer.length)layer=[rem[0]];
    layer.forEach(s=>done.add(s.id));rem=rem.filter(s=>!layer.includes(s));layers.push(layer);
  }return layers;
}
function wfSvg(wf,stepStatus){
  const layers=wfLayers(wf.steps||[]);
  const BW=158,BH=46,GX=200,GY=64,pos={};
  layers.forEach((layer,c)=>layer.forEach((s,r)=>pos[s.id]={x:16+c*GX,y:14+r*GY,s}));
  const H=Math.max(...layers.map(l=>l.length))*GY+22, W=16+layers.length*GX;
  const col=st=>st==='ok'?'var(--ok,#34d399)':st==='running'||st==='start'?'var(--acc,#5eead4)':(st==='error'||st==='timeout')?'var(--err,#f87171)':'var(--line,#333)';
  let lines='',boxes='';
  (wf.steps||[]).forEach(s=>{(s.depends_on||[]).forEach(d=>{const a=pos[d],b=pos[s.id];if(!a||!b)return;
    lines+=`<path d="M${a.x+BW} ${a.y+BH/2} C ${a.x+BW+24} ${a.y+BH/2}, ${b.x-24} ${b.y+BH/2}, ${b.x} ${b.y+BH/2}" fill="none" stroke="rgba(138,148,166,.5)" stroke-width="1.5" marker-end="url(#arr)"/>`;})});
  Object.values(pos).forEach(({x,y,s})=>{const st=(stepStatus||{})[s.id]||'';
    boxes+=`<g><rect x="${x}" y="${y}" rx="9" width="${BW}" height="${BH}" fill="rgba(255,255,255,.04)" stroke="${col(st)}" stroke-width="1.6">${st==='running'||st==='start'?'<animate attributeName="stroke-opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/>':''}</rect>
      <text x="${x+10}" y="${y+19}" fill="var(--txt,#e6ebf2)" font-size="12" font-weight="600">${esc(s.name||s.id)}</text>
      <text x="${x+10}" y="${y+35}" fill="var(--dim,#8a94a6)" font-size="10">${esc(s.subagent)}${s.model?' · '+esc(s.model.split('/').pop()):''}${st?' · '+st:''}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:${H+10}px"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="rgba(138,148,166,.7)"/></marker></defs>${lines}${boxes}</svg>`;
}

function wizCollect(){
  const s=WIZ.step;
  if(s===1&&$('#wz-name'))WIZ.agent_name=$('#wz-name').value.trim()||'Aria';
  if(s===2){const v=document.querySelector('input[name="wz-model"]:checked')?.value||'';
    if(v==='cloud'){const p=$('#wz-prov').value,k=$('#wz-key').value.trim(),m=$('#wz-cmodel').value.trim();
      if(k)WIZ.providers={[p]:{api_key:k}};
      WIZ.default_model=m?(p+'/'+m):'';}
    else WIZ.default_model=v;}
  if(s===3)WIZ.autonomy=document.querySelector('input[name="wz-auto"]:checked')?.value||'balanced';
  if(s===4){WIZ.autostart=$('#wz-boot').checked;WIZ.open_at_login=$('#wz-login').checked;}

}
async function factoryReset(){

async function renderTasks(body){
  const r=await fetch('/api/tasks');const d=await r.json();
  const fmt=t=>t.schedule_type==='interval'?`every ${Math.round((t.interval_seconds||0)/60)} min`:t.schedule_type==='daily'?`daily at ${t.at_time}`:'once';
  const items=d.tasks.map(t=>`<div class="item" data-f="${esc(t.prompt)}"><div class="grow">${esc(t.prompt)}<div class="sub">${fmt(t)} · ${t.enabled?(t.next_run?'next: '+new Date(t.next_run*1000).toLocaleString():'running/done'):'disabled'}${t.last_result?' · last: '+esc(t.last_result.slice(0,90)):''}</div></div>
    <button title="toggle" onclick="toggleTask('${t.id}',${t.enabled?0:1})">${t.enabled?'⏸':'▶'}</button>
    <button onclick="delTask('${t.id}')">✕</button></div>`).join('');
  const pb=panelShell(body,{
    title:'Scheduler',
    sub:`${d.tasks.length} task${d.tasks.length===1?'':'s'} · ${d.tasks.filter(t=>t.enabled).length} active`,
    search:{id:'task-q',placeholder:'Search tasks…'},
  });

    ${items||emptyBox('Nothing scheduled yet','Schedule any prompt to run on its own — "check disk space every hour and notify me", "every morning summarize my unread mail". Add one below or just ask in chat.')}

    <input id="task-prompt" placeholder="What should the agent do when this fires?">
    <div class="row" style="margin-top:8px">
      <select id="task-type" style="flex:0 0 190px" onchange="taskTypeHint()">
        <option value="interval">every N minutes</option><option value="daily">daily at a time</option><option value="once">once, after N minutes</option></select>

      <button class="pact" style="flex:0 0 90px" onclick="addTask()">Add</button>

function taskTypeHint(){
  const t=$('#task-type').value,w=$('#task-when');if(!w)return;
  w.placeholder=t==='daily'?'time — e.g. 09:00':t==='once'?'minutes from now — e.g. 15':'minutes — e.g. 60';

async function addTask(){
  const type=$('#task-type').value,when=$('#task-when').value.trim(),prompt=$('#task-prompt').value.trim();
  if(!prompt)return;
  const body={prompt,schedule_type:type};
  if(type==='interval')body.interval_minutes=+when||60;
  if(type==='daily')body.at_time=when||'09:00';
  if(type==='once')body.delay_minutes=+when||0;
  await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});refreshApp('tasks');}
async function toggleTask(id,en){await fetch('/api/tasks/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!!en})});refreshApp('tasks');}

    <div class="mut" id="tm-meta">loading…</div>

      if(!document.getElementById('tm-cpu'))return;

      $('#tm-dsk').innerHTML=dskPct.toFixed(0)+'% <small>'+fmtBytes(d.disk.used)+' / '+fmtBytes(d.disk.total)+'</small>';
      const set=(id,p)=>{const b=$(id);b.style.width=Math.min(p,100)+'%';b.classList.toggle('hot',p>85)};
      set('#tm-cpub',d.cpu);set('#tm-memb',memPct);set('#tm-dskb',dskPct);
      const up=d.uptime,dd=Math.floor(up/86400),hh=Math.floor(up%86400/3600),mm=Math.floor(up%3600/60);
      $('#tm-meta').textContent=`${d.cores} cores · load ${d.load.map(x=>x.toFixed(2)).join(' ')} · up ${dd?dd+'d ':''}${hh}h ${mm}m`;
      $('#tm-procs').innerHTML=d.procs.map(p=>`<tr><td>${p.pid}</td><td class="n">${esc(p.name)}</td><td class="r">${p.cpu.toFixed(1)}</td><td class="r">${p.mem.toFixed(1)}</td></tr>`).join('');
    }catch(e){}
    const ag=$('#tm-agent');
    if(ag)ag.innerHTML=running
      ?`<div class="item"><div class="grow">agent turn in progress<div class="sub">the model is working in Agent Chat</div></div><button class="endbtn" onclick="ws&&ws.send(JSON.stringify({type:'abort'}))">End turn</button></div>`
      :'<p class="mut">idle — no turn running</p>';
    const wl=$('#tm-wins');
    if(wl){wl.innerHTML='';
      WM.wins.forEach(o=>{
        const row=document.createElement('div');row.className='item';
        row.innerHTML=`${appIcon(o.id,26)}<div class="grow">${esc(o.app.title)}<div class="sub">${o.min?'minimized':o.max?'maximized':'windowed'}</div></div>`;
        const b=document.createElement('button');b.className='endbtn';b.textContent='End task';
        b.onclick=()=>{closeWin(o)};
        row.appendChild(b);wl.appendChild(row);
      });
      if(!WM.wins.size)wl.innerHTML='<p class="mut">no open windows</p>';
    }
  };
  clearInterval(w.timer);
  poll();w.timer=setInterval(poll,2000);
}

  if(s.env&&Object.keys(s.env).length)c.env=s.env;
  if(s.headers&&Object.keys(s.headers).length)c.headers=s.headers;
  return c;
}

function mcpPreset(key){
  const e=MCP_CATALOG.find(x=>x.k===key);
  if(!e||MCPCFG[e.k])return;
  const fill=(s)=>{           // resolve {WS} and every {ASK:question}; null = user cancelled
    s=s.replace('{WS}',(cfg&&cfg.workspace)||'~');
    let m;
    while((m=s.match(/\{ASK:([^}]+)\}/))){
      const v=prompt(m[1]);
      if(!v)return null;
      s=s.replace(m[0],v.trim());
    }
    return s;
  };
  let conf;
  if(e.t==='http'){
    const url=fill(e.u);
    if(url===null)return;
    conf={transport:'http',url,enabled:true};
    if(e.bearer){
      const v=prompt(e.bearer);
      if(v===null)return;
      if(v.trim())conf.headers={Authorization:'Bearer '+v.trim()};
      else if(!e.opt)return;
    }
  }else{
    const args=fill(e.a);
    if(args===null)return;
    conf={transport:'stdio',command:e.c,args,enabled:true};
    if(e.env){
      conf.env={};
      for(const [k,hint] of e.env){
        const v=prompt(k+' — '+hint+':');
        if(!v)return;
        conf.env[k]=v.trim();
      }
    }
  }
  if(e.oauth)toast('first connect opens a browser tab to sign in — approve it there');
  MCPCFG[e.k]=conf;mcpSave();
}
function mcpToggle(name){if(MCPCFG[name]){MCPCFG[name].enabled=!MCPCFG[name].enabled;mcpSave()}}
function mcpDel(name){delete MCPCFG[name];mcpSave()}

/* ================= knowledge graph app ================= */
async function renderKG(body,w){
  body.innerHTML=`<div class="apptop">
      <span class="psearch" style="flex:0 1 210px">${SVG_SEARCH}<input id="kg-q" placeholder="Filter the graph…" value="${esc(w._kgq||'')}"></span>
      <input id="kg-s" placeholder="subject"><input id="kg-r" placeholder="relation"><input id="kg-o" placeholder="object">
      <button class="save" style="margin:0;flex:0 0 64px;padding:8px" onclick="kgAdd()">Add</button>
      <button class="endbtn" title="merge duplicate entities, roll up idle sessions, re-index memory" onclick="tidyKnowledge()">Tidy</button>
      <button class="endbtn" onclick="kgClear()">Clear graph</button>
    </div>
    <div style="flex:1;min-height:0;position:relative">
      <canvas id="kgc" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
      <div id="kg-empty" class="mut" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px">
        The graph is empty.<br>Ask the agent to "add what you know about me to the knowledge graph",<br>or add a (subject, relation, object) triple above.</div>
    </div>`;
  {const qi=$('#kg-q');let t;
   qi.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{w._kgq=qi.value;renderKG(body,w).then(()=>{const q2=$('#kg-q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}})},250)};}
  const r=await fetch('/api/kg');const g=await r.json();
  const q=(w._kgq||'').toLowerCase().trim();
  if(q){
    const keep=new Set(g.nodes.filter(n=>(n.name||'').toLowerCase().includes(q)).map(n=>n.id));
    g.edges.forEach(e=>{if(e.relation.toLowerCase().includes(q)){keep.add(e.src);keep.add(e.dst)}});
    g.edges.forEach(e=>{if(keep.has(e.src)||keep.has(e.dst)){keep.add(e.src);keep.add(e.dst)}}); // 1-hop neighbours
    g.nodes=g.nodes.filter(n=>keep.has(n.id));
    g.edges=g.edges.filter(e=>keep.has(e.src)&&keep.has(e.dst));
  }
  const canvas=$('#kgc');if(!canvas)return;
  cancelAnimationFrame(w.raf);
  if(!g.nodes.length){$('#kg-empty').style.display='flex';
    if(q)$('#kg-empty').innerHTML='Nothing in the graph matches “'+esc(w._kgq)+'”.';return}
  const dpr=devicePixelRatio||1;
  const nodes=g.nodes.map((n,i)=>({...n,
    x:Math.cos(i/g.nodes.length*6.283)*120+(i%7)*13, y:Math.sin(i/g.nodes.length*6.283)*120+(i%5)*11, vx:0,vy:0}));
  const byid={};nodes.forEach(n=>byid[n.id]=n);
  const edges=g.edges.filter(e=>byid[e.src]&&byid[e.dst]);
  const COLORS={person:'#5eead4',org:'#22d3ee',project:'#fbbf24',tool:'#c084fc','':'#8a94a6'};
  let ticks=0;
  const step=()=>{
    if(!canvas.isConnected)return;
    const W=canvas.clientWidth,H=canvas.clientHeight;
    canvas.width=W*dpr;canvas.height=H*dpr;
    // physics
    if(ticks<400){
      for(const a of nodes){
        for(const b of nodes){ if(a===b)continue;
          let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);
          const f=1800/d2; a.vx+=dx/d*f; a.vy+=dy/d*f; }
        a.vx-=a.x*.012; a.vy-=a.y*.012;   // gravity to center
      }
      for(const e of edges){
        const a=byid[e.src],b=byid[e.dst];
        let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01;
        const f=(d-110)*.02; a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;
      }
      for(const n of nodes){n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.6;n.vy*=.6}
      ticks++;
    }
    // draw
    const ctx=canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,H/2);
    ctx.font='10px sans-serif';
    for(const e of edges){
      const a=byid[e.src],b=byid[e.dst];
      ctx.strokeStyle='rgba(94,234,212,.22)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.fillStyle='rgba(138,148,166,.85)';
      ctx.fillText(e.relation,(a.x+b.x)/2+4,(a.y+b.y)/2-3);
    }
    ctx.font='600 11.5px sans-serif';
    for(const n of nodes){
      ctx.fillStyle=COLORS[n.type]||COLORS[''];
      ctx.beginPath();ctx.arc(n.x,n.y,7,0,6.283);ctx.fill();
      ctx.strokeStyle='#0b0d10';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#e6ebf2';ctx.fillText(n.name,n.x+11,n.y+4);
    }
    ctx.restore();
    w.raf=requestAnimationFrame(step);
  };
  step();
}

  const s=$('#kg-s').value.trim(),rel=$('#kg-r').value.trim(),o=$('#kg-o').value.trim();
  if(!s||!rel||!o)return toast('need subject, relation and object');
  await fetch('/api/kg',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({subject:s,relation:rel,object:o})});

async function renderTokens(body){
  const d=await (await fetch('/api/analytics/tokens')).json();
  const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':(''+n);
  const t=d.total||{in:0,out:0,turns:0};
  const models=Object.entries(d.by_model||{}).sort((a,b)=>(b[1].in+b[1].out)-(a[1].in+a[1].out));
  const maxM=Math.max(1,...models.map(([,v])=>v.in+v.out));
  const days=(d.by_day||[]).slice(-14);
  const maxD=Math.max(1,...days.map(x=>x.in+x.out));
  body.innerHTML=`<div class="pad">
    <div class="tmgrid">
      <div class="stat"><div class="lbl">Total tokens</div><div class="val">${fmt(t.in+t.out)}</div></div>

      <div class="stat"><div class="lbl">Output</div><div class="val">${fmt(t.out)}</div></div>
    </div>
    <div class="tmsec">By model · ${t.turns} turns</div>
    ${models.length?models.map(([m,v])=>`<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(m.split('/').pop())}</span>
        <span class="mut">${fmt(v.in+v.out)} · ${v.turns}t</span></div>
      <div class="bar"><i style="width:${(v.in+v.out)/maxM*100}%"></i></div></div>`).join('')
      :'<p class="mut">No usage yet. Token counts are recorded per turn (local models report via Ollama; cloud models via their usage API).</p>'}
    <div class="tmsec">Last ${days.length} days</div>
    <div style="display:flex;align-items:flex-end;gap:5px;height:90px;padding:6px 0">
      ${days.length?days.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%">
        <div style="flex:1;width:100%;display:flex;align-items:flex-end"><div title="${x.day}: ${fmt(x.in+x.out)}" style="width:100%;border-radius:4px 4px 0 0;background:linear-gradient(var(--acc),var(--acc2));height:${(x.in+x.out)/maxD*100}%;min-height:2px"></div></div>
        <div style="font-size:9px;color:var(--dim2)">${x.day.slice(5)}</div></div>`).join(''):'<p class="mut">no daily data yet</p>'}

/* ================= permissions app: the policy console ================= */
let PERM={tab:'map',sel:null,q:'',showRevoked:false,grants:[],apps:[],opts:{principals:[],actions:[],resources:{}},att:null,_attPs:[],_mapPs:[]};
const PERM_FAMS=[['Tools','tool.'],['MCP','mcp.'],['Skills','skill.'],['Models','model.'],['Files','fs.'],['Net','net.'],['Memory','memory.','kg.'],['Agents','agent.'],['App data','app.data.']];
function globMatch(pat,val){pat=(pat==null||pat==='')?'*':String(pat);
  return new RegExp('^'+pat.split('*').map(s=>s.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$').test(val||'')}
function permFamOf(action){if(action==='*')return 'Full access';if(action==='legacy policy')return 'Legacy rules';
  for(const f of PERM_FAMS)for(let i=1;i<f.length;i++)if(action.startsWith(f[i]))return f[0];return 'Other'}
async function renderPermissions(body){
  try{PERM.grants=(await (await fetch('/api/grants'+(PERM.showRevoked?'?all=1':''))).json()).grants||[]}catch(e){PERM.grants=[]}

  try{PERM.apps=(await (await fetch('/api/apps')).json()).apps||[]}catch(e){PERM.apps=[]}
  await loadConfig();
  const pending=PERM.apps.filter(a=>(a.manifest_status||'none')==='proposed').length;
  body.innerHTML=`<div class="apptop" style="gap:6px">
    ${[['map','Policy map'],['grants','All grants'],['review','Review'+(pending?' ('+pending+')':'')],['attach','＋ Attach']].map(([t,l])=>`<button class="endbtn perm-tab${PERM.tab===t?' on':''}" data-t="${t}" ${t==='review'&&pending?'style="color:var(--err,#f87171)"':''}>${l}</button>`).join('')}
    <input id="perm-q" placeholder="search apps, agents, rules…" style="flex:1;max-width:250px;margin-left:auto" value="${esc(PERM.q)}">
  </div>
  <div id="perm-body" style="flex:1;overflow-y:auto;padding:12px 14px"></div>`;
  body.querySelectorAll('.perm-tab').forEach(b=>b.onclick=()=>{PERM.tab=b.dataset.t;renderPermissions(body)});
  $('#perm-q').oninput=e=>{PERM.q=e.target.value;permBody()};
  permBody();
}
function permBody(){
  const box=$('#perm-body');if(!box)return;
  ({map:permMap,grants:permGrantsView,review:permReview,attach:permAttachView}[PERM.tab]||permMap)(box);
}
function permPrincipals(){
  const map=new Map();
  (PERM.opts.principals||[]).forEach(p=>map.set(p.kind+':'+p.id,{...p,label:p.label||p.id||p.kind}));
  PERM.grants.forEach(g=>{if(g.principal_kind==='user')return;
    const k=g.principal_kind+':'+(g.principal_id||'');
    if(!map.has(k))map.set(k,{kind:g.principal_kind,id:g.principal_id||'',label:permPrincipalLabel(g.principal_kind,g.principal_id)})});
  const out=[...map.values()].map(p=>({...p,
    grants:PERM.grants.filter(g=>!g.revoked_at&&g.principal_kind===p.kind&&globMatch(g.principal_id||'*',p.id))}));
  // the system principal: the main agent acting as you — legacy policies live here
  out.unshift({kind:'user',id:'',label:'System — main agent',system:true,
    grants:[...PERM.grants.filter(g=>!g.revoked_at&&g.principal_kind==='user'),
            ...((cfg&&cfg.policies)||[]).map((p,i)=>({id:'legacy:'+i,action:'legacy policy',
              resource:p.match,effect:p.action==='deny'?'deny':'allow',source:'Policies app',readonly:true}))]});
  return out;
}
function permMap(box){
  const q=PERM.q.toLowerCase();
  const ps=permPrincipals().filter(p=>!q||p.label.toLowerCase().includes(q)||p.kind.includes(q));
  PERM._mapPs=ps;
  const famChip=(p,f)=>{
    const gs=p.grants.filter(g=>permFamOf(g.action)===f);
    if(!gs.length)return '';
    const d=gs.filter(g=>g.effect==='deny').length,a=gs.length-d;
    const col=d&&a?'#f2c94c':d?'var(--err,#f87171)':'var(--ok,#5eead4)';
    return `<span style="font-size:10px;padding:2px 7px;border-radius:9px;border:1px solid ${col};color:${col}">${esc(f)} ${gs.length}</span>`;
  };
  const fams=['Full access','Legacy rules',...PERM_FAMS.map(f=>f[0]),'Other'];
  box.innerHTML=`<p class="mut" style="margin-bottom:10px">Who may do what, at a glance. Click a card for its policy map — toggle any permission between allow/deny, or revoke it.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
    ${ps.map((p,i)=>{

        <div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.label)}</b>

      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${full?'<span class="badge err">FULL ACCESS</span>':''}${st}
        ${fams.map(f=>famChip(p,f)).join('')||'<span class="mut" style="font-size:11px">no rules — every capability asks first</span>'}</div>
    </div>`}).join('')||'<p class="mut">no apps or agents yet</p>'}
  </div>
  <div id="perm-chart" style="margin-top:18px"></div>`;
  box.querySelectorAll('.perm-card').forEach(c=>c.onclick=()=>{
    const p=PERM._mapPs[+c.dataset.i];const k=p.kind+':'+p.id;
    PERM.sel=PERM.sel===k?null:k;permMap(box);
  });
  const selP=ps.find(p=>PERM.sel===p.kind+':'+p.id);
  if(selP)permChartInto($('#perm-chart'),selP);
}
function permChartInto(el,p){

      <span style="width:44px;height:44px;border-radius:11px;background:${tileBg(p.id||p.kind)};display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px">${esc((p.label[0]||'?').toUpperCase())}</span>

    </div>
    <div style="flex:1;position:relative;z-index:1">
      ${Object.keys(fams).length?Object.entries(fams).map(([f,gs])=>`<div style="margin-bottom:12px">
        <div class="mut" style="font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px">${esc(f)}</div>

      :'<p class="mut">No rules yet — every capability this principal touches will raise a consent prompt. Use ＋ Attach to pre-approve or block things.</p>'}
      ${p.system?'<p class="mut" style="font-size:11px;margin-top:8px">Hard-blocked commands (disk wipes, shutdown) stay blocked regardless of any rule. Legacy rules apply globally and are edited in the Policies app.</p>':''}

/* consent modal: manifest permissions with required/optional toggles + prerequisite installs.
   missing = [{label, run:async fn}] */
function showConsent(manifest,missing,onApprove){
  const perms=(manifest&&manifest.permissions)||[];
  const shield='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--acc,#5eead4)"><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/></svg>';
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:9700;display:flex;align-items:center;justify-content:center;background:rgba(5,7,10,.55);backdrop-filter:blur(4px)';
  ov.innerHTML=`<div style="width:min(560px,92vw);max-height:82vh;overflow:auto;background:var(--glass,#171b22);border:1px solid var(--border,#232a35);border-radius:14px;padding:20px">
    <div style="display:flex;align-items:center;gap:10px">${shield}<b style="font-size:15px">${esc(manifest.name||'This app')} requests permission</b></div>
    <p class="mut" style="margin:6px 0 12px">${esc(manifest.description||'')} You can untick optional items — and revoke anything later in Permissions.</p>
    ${perms.length?perms.map((p,i)=>`<label class="item" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
      <input type="checkbox" data-i="${i}" checked ${p.required?'disabled':''} style="margin-top:3px;accent-color:var(--acc,#5eead4)">
      <div class="grow"><div style="font-family:var(--mono);font-size:12.5px">${esc(p.action||'*')} · ${esc(p.resource||'*')}</div>
        <div class="mut" style="font-size:12px">${esc(p.reason||'')}${p.required?' · required':' · optional'}</div></div></label>`).join('')
      :'<p class="mut">No capabilities requested — this app only uses its own private data.</p>'}
    ${(missing&&missing.length)?'<label style="display:block;margin-top:12px">Missing prerequisites</label>'+missing.map((m,j)=>`<div class="item"><div class="grow">${esc(m.label)}</div><button class="prq" data-j="${j}">Install</button></div>`).join(''):''}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="c-cancel">Cancel</button><button class="c-ok save" style="margin:0">Grant selected</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.prq').forEach(b=>{b.onclick=async()=>{
    b.textContent='installing…';b.disabled=true;
    try{await missing[+b.dataset.j].run();b.textContent='installed'}
    catch(e){b.textContent='failed';b.disabled=false}
  }});
  ov.querySelector('.c-cancel').onclick=()=>ov.remove();
  ov.querySelector('.c-ok').onclick=()=>{
    const granted=[...ov.querySelectorAll('input[type=checkbox]')].filter(c=>c.checked).map(c=>+c.dataset.i);
    ov.remove(); onApprove(granted);
  };
}

async function renderFiles(body,w){
  w.path=w.path||'';
  const FCOLORS={html:'#38BDF8',htm:'#38BDF8',md:'#a5b4fc',txt:'#8a94a6',json:'#fbbf24',csv:'#4ade80',
    log:'#8a94a6',pdf:'#f87171',sh:'#94a3b8',py:'#60a5fa'};
  const IMG_EXT=new Set(['png','jpg','jpeg','gif','webp','svg']);
  const icon=e=>{
    const s='width:17px;height:17px;display:block';
    if(e.dir)return `<svg viewBox="0 0 24 24" style="${s}"><path d="M3.5 7c0-.9.7-1.6 1.5-1.6h4.2l2 2.4h7.8c.8 0 1.5.7 1.5 1.6v8c0 .9-.7 1.6-1.5 1.6H5c-.8 0-1.5-.7-1.5-1.6Z" fill="#5EA3F7"/></svg>`;
    if(IMG_EXT.has(e.ext))return `<svg viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="${s}"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4.4 16.4l4.3-3.8 3.4 2.9 3-2.5 4.5 3.6"/></svg>`;
    const c=FCOLORS[e.ext]||'#8a94a6';
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="${s}"><path d="M6.5 4h7l4 4v12h-11Z"/><path d="M13.5 4v4h4"/></svg>`;
  };
  const fmt=n=>n<1024?n+' B':n<1e6?(n/1024).toFixed(0)+' KB':(n/1e6).toFixed(1)+' MB';
  let d;try{d=await (await fetch('/api/files?path='+encodeURIComponent(w.path))).json()}catch(e){body.innerHTML='<p class="mut" style="padding:16px">could not read files</p>';return}
  w.path=d.path;
  const crumbs=['<span class="fcrumb" data-p="">workspace</span>'];
  let acc='';d.path.split('/').filter(Boolean).forEach(seg=>{acc=acc?acc+'/'+seg:seg;crumbs.push('<span class="fsep">/</span><span class="fcrumb" data-p="'+esc(acc)+'">'+esc(seg)+'</span>')});
  body.innerHTML=`<div class="apptop">
      ${w.path?'<button class="endbtn" id="f-up">Up</button>':''}
      <div style="flex:1;font-size:12.5px" id="f-crumbs">${crumbs.join('')}</div>
      <button class="endbtn" onclick="refreshApp('files')">⟳</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:6px 8px;user-select:text">
      ${d.entries.length?d.entries.map(e=>`<div class="fitem" data-rel="${esc(e.rel)}" data-dir="${e.dir?1:0}" data-ext="${esc(e.ext)}">
        <span class="fi">${icon(e)}</span><span class="fn">${esc(e.name)}</span>
        <span class="fmeta">${e.dir?'':fmt(e.size)+' · '+new Date(e.mtime*1000).toLocaleDateString()}</span>
      </div>`).join(''):'<p class="mut" style="padding:14px">empty folder</p>'}
    </div>`;
  $('#f-crumbs').querySelectorAll('.fcrumb').forEach(c=>c.onclick=()=>{w.path=c.dataset.p;renderFiles(body,w)});
  const up=$('#f-up');if(up)up.onclick=()=>{w.path=w.path.split('/').slice(0,-1).join('/');renderFiles(body,w)};
  body.querySelectorAll('.fitem').forEach(it=>it.onclick=()=>{
    const rel=it.dataset.rel;
    if(it.dataset.dir==='1'){w.path=rel;renderFiles(body,w)}
    else openFile(rel,it.dataset.ext);
  });
}

  // open the real file in the HOST OS default app (browser for html/pdf, viewer for images, etc.)
  openHost({path:rel});
}

async function studioLoadModels(){

      (d.models||[]).map(m=>`<option value="${esc(m.id)}">${esc(m.name+' · '+m.provider+(m.provider==='ollama'?' (local)':''))}</option>`).join('');
    sel.value=[...sel.options].some(o=>o.value===cur)?cur:'auto';

async function studioLoadHistory(sel){
  // each app has ONE persistent build conversation ("build: <name>") — show it so
  // picking the app back up continues the same session instead of a blank slate
  try{
    const app=STUDIO.apps.find(a=>a.id===sel);if(!app)return;
    const convs=(await (await fetch('/api/conversations')).json()).conversations||[];
    const c=convs.find(x=>x.title==='build: '+app.name);if(!c)return;
    const msgs=(await (await fetch('/api/conversations/'+c.id)).json()).messages||[];
    if(STUDIO.sel!==sel||!STUDIO.log||!STUDIO.log.isConnected||STUDIO.log.children.length)return;
    const lines=msgs.map(m=>{
      let t=(m.content||'').replace(/```[\s\S]*?(```|$)/g,'(code)').trim();
      if(!t)return'';
      if(t.length>280)t=t.slice(0,280)+'…';
      return `<div style="margin:4px 0">${m.role==='user'
        ?`<b style="color:var(--acc2)">You:</b> ${esc(t)}`
        :`<b>▲ ${esc(agentName())}:</b> ${esc(t)}`}</div>`;
    }).filter(Boolean).join('');
    if(!lines)return;
    STUDIO.log.innerHTML=`<div class="mut" style="margin:4px 0;font-size:11px">— session so far —</div>`+lines;
    STUDIO.logs[sel]=STUDIO.log.innerHTML;
    STUDIO.log.scrollTop=STUDIO.log.scrollHeight;
  }catch(e){}
}
/* built apps postMessage their runtime JS errors here — surface them with a one-click fix */
window.addEventListener('message',ev=>{

  if(!STUDIO.sel||d.app_id!==STUDIO.sel||!STUDIO.log||!STUDIO.log.isConnected||STUDIO.building)return;
  if(STUDIO._lastErr===d.message)return;   // don't spam repeats (e.g. errors in a poll loop)
  STUDIO._lastErr=d.message;
  studioLog(`<span style="color:var(--err)">app runtime error: ${esc(d.message)}${d.source&&d.source!==':0'?' @ '+esc(d.source):''}</span>
    <button style="font-size:11px;padding:3px 10px;margin-left:6px" onclick="studioAutoFix()">Fix automatically</button>`);
  // a just-deployed app that errors on first load gets ONE automatic repair build
  if(STUDIO._justBuilt&&Date.now()-STUDIO._justBuilt<8000&&!STUDIO._autofixed){
    STUDIO._autofixed=true;
    studioLog('<span class="mut">the fresh build crashed on load — repairing automatically…</span>');
    studioAutoFix();
  }
});
function studioAutoFix(){

async function studioVersions(){
  const box=$('#st-versions'),live=$('#st-live');
  if(!box)return;
  if(!STUDIO.sel){box.innerHTML='';if(live)live.innerHTML='';return}
  const d=await fetch('/api/apps/'+STUDIO.sel+'/versions').then(r=>r.json()).catch(()=>({versions:[]}));

    ?`<span style="font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 9px">deployed · v${cur.version}</span>`:'';
  const ago=t=>{const s=Math.max(1,Math.round(Date.now()/1000-t));return s<60?s+'s':s<3600?Math.round(s/60)+'m':s<86400?Math.round(s/3600)+'h':Math.round(s/86400)+'d'};

async function studioRestore(v){

  await fetch('/api/apps/'+STUDIO.sel+'/versions/'+v+'/restore',{method:'POST'});

function studioLog(html,cls){
  if(!STUDIO.log)return;
  const d=document.createElement('div');d.className=cls||'';d.style.margin='4px 0';d.innerHTML=html;
  STUDIO.log.appendChild(d);
  if(STUDIO._status&&STUDIO._status.isConnected&&STUDIO._status!==d)STUDIO.log.appendChild(STUDIO._status); // status line stays last
  STUDIO.log.scrollTop=STUDIO.log.scrollHeight;
  return d;
}
function studioTickStart(){
  studioTickStop();
  STUDIO._t0=Date.now();
  STUDIO._status=studioLog('<span class="mut">working…</span>');
  STUDIO._tick=setInterval(()=>{
    if(!STUDIO._status||!STUDIO._status.isConnected){if(STUDIO._tick){clearInterval(STUDIO._tick);STUDIO._tick=null}return}
    const s=Math.round((Date.now()-STUDIO._t0)/1000);
    STUDIO._status.innerHTML='<span class="mut">working… '+(s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s')
      +(STUDIO._smsg?' — '+esc(STUDIO._smsg):(s>45?' — the model is writing the app; large apps take a few minutes on local models. Cancel any time.':''))+'</span>';
  },1000);
}
function studioTickStop(){
  if(STUDIO._tick){clearInterval(STUDIO._tick);STUDIO._tick=null}
  if(STUDIO._status){STUDIO._status.remove();STUDIO._status=null}
}
function studioBuild(){
  if(STUDIO.building){                       // the button doubles as Cancel while a build runs
    if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'build_abort'}));
    return;
  }
  const p=$('#st-prompt');if(!p)return;
  const prompt=p.value.trim();if(!prompt)return;
  if(!ws||ws.readyState!==1)return toast('not connected');
  STUDIO.building=true;
  const b=$('#st-build');if(b){b.textContent='Cancel';b.classList.add('stop')}
  studioLog(`<b style="color:var(--acc2)">You:</b> ${esc(prompt)}`);
  STUDIO._cur=studioLog('');
  studioTickStart();
  jarvisOn();
  const bmodel=$('#st-model')?.value||STUDIO.model||'auto';
  ws.send(JSON.stringify({type:'build',prompt,app_id:STUDIO.sel,model:bmodel}));
  p.value='';
}
function studioBuildEnded(){
  STUDIO.building=false;STUDIO._smsg='';studioTickStop();jarvisOff();
  const b=$('#st-build');if(b){b.disabled=false;b.classList.remove('stop');b.textContent=STUDIO.sel?'Update':'Build'}
}
function studioBuildEvent(ev){
  switch(ev.type){
    case 'build_start': break;
    case 'build_thinking': break;   // keep the log clean; thinking drives the jarvis pulse
    case 'build_text':
      if(STUDIO._cur){STUDIO._cur._t=(STUDIO._cur._t||'')+ev.text;STUDIO._cur.innerHTML='<b>▲ '+esc(agentName())+':</b> '+esc(STUDIO._cur._t)}
      break;
    case 'build_tool':
      studioLog(`<span class="mut">▸ ${esc(ev.name)}${ev.name==='create_app'?' — deploying the app…':ev.name==='fetch_url'?' — checking the live data source…':''}</span>`);break;
    case 'build_tool_end':{ // failed tool calls must be VISIBLE — a silent retry loop looks like a hang
      const ok=ev.ok!==false;
      if(!ok)studioLog(`<span style="color:var(--err)">✗ ${esc(ev.name)} — ${esc((ev.output||'').slice(0,220))}</span>`);
      else if(ev.name==='create_app')studioLog(`<span class="mut">✓ create_app</span>`);
      break;}
    case 'build_status': // model-side heartbeat while it loads/evaluates
      STUDIO._smsg=ev.message||'';break;
    case 'build_error_note': // non-fatal error inside an attempt (the build continues/retries)
      studioLog(`<span style="color:var(--err)">${esc(ev.message||'error')}</span>`);break;
    case 'build_error':
      studioBuildEnded();
      studioLog(`<span style="color:var(--err)">${esc(ev.message||'error')}</span>`);break;
    case 'build_done':
      studioBuildEnded();
      if(ev.app_id){
        const wasNew=(STUDIO._logKey||'new')==='new';
        STUDIO.sel=ev.app_id;STUDIO._lastErr=null;
        STUDIO._justBuilt=Date.now();STUDIO._autofixed=false;   // arm the load-crash auto-repair
        studioLog(`<span style="color:var(--ok)">✓ ${esc(ev.name||'app')} ready — deployed live</span>`);
        if(ev.warnings&&ev.warnings.length)
          studioLog(`<span style="color:var(--warn,#e8b04b)">⚠ shipped with known issues: ${esc(ev.warnings.join('; ').slice(0,300))} — ask for a fix or rebuild</span>`);
        if(ev.manifest_status==='proposed')
          studioLog(`<span class="mut">it requests permissions — </span><button style="font-size:11px;padding:3px 10px" onclick="reviewManifest('${ev.app_id}')">Review &amp; grant</button>`);
        if(wasNew)delete STUDIO.logs['new'];   // this session now belongs to the built app
        STUDIO._logKey=ev.app_id;
        studioVersions();
        // re-render to refresh the picker, then preview + open action
        const w=WM.wins.get('studio');if(w){renderStudio(w.el.querySelector('.wbody'),w);}
        toast(''+(ev.name||'app')+' built');
      } else studioLog('<span class="mut">no app was produced — try rephrasing</span>');
      break;
  }
}

      const ta=$('#hz-config');
      const loadCfg=async()=>{try{const d=await (await fetch('/api/hermes/config')).json();if(ta)ta.value=d.text||''}catch(e){}};
      await loadCfg();
      $('#hz-reload').onclick=loadCfg;
      $('#hz-save').onclick=async()=>{const msg=$('#hz-cfgmsg');msg.textContent='saving…';
        const r=await fetch('/api/hermes/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:ta.value})});
        const d=await r.json();msg.textContent=r.ok?'saved ✓':(d.error||'error');msg.style.color=r.ok?'var(--ok)':'var(--err)';};
      $('#hz-gw').onclick=async()=>{$('#hz-gw').disabled=true;
        await fetch('/api/hermes/service',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:st.gateway?'gateway_stop':'gateway_start'})});
        setTimeout(paint,1500);};
      $('#hz-update').onclick=async()=>{log('updating…');
        await fetch('/api/hermes/service',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update'})});};
    }
  };
  w._onSetup=ev=>{if(ev.type==='hermes_setup'){log(ev.message||'');if(ev.done)setTimeout(paint,800)}};
  HERMES_SETUP_LISTENERS.add(w._onSetup);
  await paint();
  w.timer=setInterval(async()=>{const el=$('#hz-config');if(el&&document.activeElement===el)return;await paint()},8000);
}

/* ================= train app (TrainForge) ================= */
const TRAIN_SETUP_LISTENERS=new Set();
async function renderTrain(body,w){
  body.style.cssText='display:flex;flex-direction:column;height:100%;padding:0';
  body.innerHTML='<div class="mut" style="padding:24px">checking the training service…</div>';
  const paint=async()=>{
    let st={running:false};
    try{st=await (await fetch('/api/train/status')).json()}catch(e){}
    if(st.running){
      if(!body.querySelector('iframe')){
        body.innerHTML=`<iframe src="${esc(st.url||'http://127.0.0.1:8377')}" style="border:0;width:100%;height:100%;flex:1" title="TrainForge"></iframe>`;
        clearInterval(w.timer);
      }
      return;
    }
    if(body.querySelector('iframe'))return; // don't tear down a live UI on a blip
    const busy=st.setup==='fetching'||st.setup==='installing';
    const notHere=!st.path;
    const canGet=st.path||st.fetchable;   // on disk, or a repo URL is configured
    const btnLabel=busy?(st.setup==='fetching'?'downloading…':'installing…'):(notHere?'Get & start TrainForge':'Start TrainForge');
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;padding:30px;text-align:center">
        <div style="font-size:40px">🧬</div>
        <div style="font-size:17px;font-weight:600">Train your own models</div>
        <div class="mut" style="max-width:460px">TrainForge is AgentOS's training service: import datasets, fine-tune models
        (including LoRA fine-tunes of language models on your GPU), watch live loss curves, test every trained model as a
        live endpoint, and publish to Hugging Face. Everything stays on this machine.</div>
        ${notHere&&!st.fetchable?'<div class="errmsg">TrainForge isn\'t installed and no download URL is set — add <code>trainforge.repo</code> (or <code>trainforge.path</code>) in config.json.</div>':''}
        ${notHere&&st.fetchable?'<div class="mut" style="font-size:12px">Not installed yet — the button below downloads and sets it up (one-time, a few minutes; the GPU stack is a few GB).</div>':''}
        <button class="pact" id="tf-start" ${(canGet&&!busy)?'':'disabled'}>${btnLabel}</button>
        <div class="mut" style="font-size:11px">or just ask the agent: “fine-tune a model on …” — it fetches &amp; starts the service itself</div>
        <div id="tf-msg" class="mut" style="max-width:480px">${esc(busy?'setting up…':'')}</div>
      </div>`;
    const b=$('#tf-start');
    if(b&&!busy)b.onclick=async()=>{
      b.disabled=true;b.textContent=notHere?'downloading…':'starting…';
      fetch('/api/train/service',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start'})})
        .then(r=>r.json()).then(r=>{const el=$('#tf-msg');if(el)el.textContent=r.result||''})
        .catch(e=>{const el=$('#tf-msg');if(el)el.textContent=''+e});
      // start returns only when up (or on error) — the poller flips us to the iframe
    };
  };
  // live setup progress from the server (download / install messages)
  w._onSetup=ev=>{if(ev.type==='train_setup'){const el=$('#tf-msg');if(el)el.textContent=ev.message||''}};
  TRAIN_SETUP_LISTENERS.add(w._onSetup);
  await paint();
  w.timer=setInterval(paint,4000);
}

/* ================= terminal app ================= */
let xtermLoading=null;
function loadXterm(){
  if(window.Terminal&&window.FitAddon)return Promise.resolve();
  if(xtermLoading)return xtermLoading;
  xtermLoading=new Promise((res,rej)=>{
    const l=document.createElement('link');l.rel='stylesheet';l.href='/assets/xterm.css';document.head.appendChild(l);
    const s=document.createElement('script');s.src='/assets/xterm.js';
    s.onload=()=>{const s2=document.createElement('script');s2.src='/assets/xterm-addon-fit.js';
      s2.onload=res;s2.onerror=rej;document.head.appendChild(s2)};
    s.onerror=rej;document.head.appendChild(s);
  });
  return xtermLoading;
}
async function renderTerminal(body,w){
  body.innerHTML='<div style="flex:1;min-height:0;background:#0b0d10;padding:6px 2px 4px 8px"></div>';
  const holder=body.firstChild;
  try{await loadXterm()}catch(e){holder.innerHTML='<p class="mut" style="padding:16px">could not load terminal assets</p>';return}
  const term=new Terminal({fontSize:13,cursorBlink:true,scrollback:4000,
    fontFamily:"'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace",
    theme:{background:'#0b0d10',foreground:'#e6ebf2',cursor:'#5eead4',cursorAccent:'#0b0d10',
      selectionBackground:'#234a55',black:'#171b22',brightBlack:'#5c6577'}});
  const fit=new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(holder);
  const tws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/terminal');
  const sendResize=()=>{if(tws.readyState===1)tws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}))};
  tws.onopen=()=>{fit.fit();sendResize();term.focus()};
  tws.onmessage=e=>term.write(e.data);
  tws.onclose=()=>{try{term.write('\r\n\x1b[90m[session ended — close and reopen the Terminal to start a new one]\x1b[0m\r\n')}catch(e){}};
  term.onData(d=>{if(tws.readyState===1)tws.send(JSON.stringify({type:'input',data:d}))});
  const ro=new ResizeObserver(()=>{try{fit.fit();sendResize()}catch(e){}});
  ro.observe(holder);
  w.term=term;w.tws=tws;w.ro=ro;
  setTimeout(()=>{try{fit.fit();sendResize();term.focus()}catch(e){}},80);
}

/* ================= keyboard / shortcuts system ================= */
// "Command key": Cmd on Mac (metaKey), Ctrl on Linux/Windows — both accepted so it feels native.
const IS_MAC=/Mac/i.test(navigator.platform);
const CMD='⌘/Ctrl';
function cmd(e){return e.metaKey||e.ctrlKey}
const KEYMAP=[
  {group:'General',keys:[
    {k:['Ctrl','Space'],alt:['Alt','Space'],label:'Command palette / ask AI'},
    {k:[CMD,'K'],label:'Command palette'},
    {k:['Ctrl','/'],alt:['?'],label:'This shortcuts help'},
    {k:[CMD,','],label:'Settings'},
    {k:['F11'],label:'Toggle fullscreen'},
    {k:['Alt','J'],label:'Voice mode'},
  ]},
  {group:'Windows',keys:[
    {k:['Ctrl','Tab'],alt:['Alt','Tab'],label:'Switch window (hold, Tab to cycle)'},
    {k:['Ctrl','Shift','Tab'],label:'Switch window (backwards)'},
    {k:[CMD,'W'],label:'Close active window'},
    {k:[CMD,'M'],label:'Minimize active window'},
    {k:[CMD,'F'],label:'Maximize / restore active window'},
  ]},
  {group:'Desktops',keys:[
    {k:['Ctrl','1…6'],label:'Switch virtual desktop'},
  ]},
  {group:'Apps',keys:[
    {k:[CMD,'Enter'],label:'New chat'},
    {k:['Ctrl','Alt','T'],label:'Open terminal'},
  ]},
];
function activeWin(){let a=null;WM.wins.forEach(w=>{if(w.el.classList.contains('active'))a=w});return a}

// --- Ctrl+Tab window switcher (Cmd+Tab-style) ---
let SW={open:false,list:[],idx:0};
function switcherList(){
  const arr=[];WM.wins.forEach(w=>{if(deskVisible(w)&&!w.min)arr.push(w)});
  return arr.sort((a,b)=>(+b.el.style.zIndex||0)-(+a.el.style.zIndex||0));
}
function switcherOpen(dir){
  SW.list=switcherList();
  if(SW.list.length<2){if(SW.list.length===1)focusWin(SW.list[0]);return}
  if(!SW.open){SW.open=true;SW.idx=1;$('#switcher').classList.add('show')}
  else{SW.idx=(SW.idx+dir+SW.list.length)%SW.list.length}
  switcherRender();
}
function switcherRender(){
  $('#swbox').innerHTML=SW.list.map((w,i)=>`<div class="swcard${i===SW.idx?' sel':''}">
    ${appIcon(w.id,48)}<span class="sn">${esc(w.app.title)}</span></div>`).join('');
}
function switcherCommit(){
  if(!SW.open)return;SW.open=false;$('#switcher').classList.remove('show');
  const w=SW.list[SW.idx];if(w)focusWin(w);
}

// --- shortcuts help overlay ---
function keysHelp(on){
  const ov=$('#keyshelp');const show=on!==undefined?on:!ov.classList.contains('show');
  if(show){
    $('#keysbox').innerHTML=`<div class="kh"><span>Keyboard shortcuts</span><button class="mclose" onclick="keysHelp(false)">✕</button></div>
      <div class="kbody">${KEYMAP.map(g=>`<div class="kgrp"><h4>${esc(g.group)}</h4>${g.keys.map(r=>`<div class="krow"><span>${esc(r.label)}</span><span class="kk">${(r.k).map(x=>`<kbd>${esc(x)}</kbd>`).join('')}</span></div>`).join('')}</div>`).join('')}</div>`;
  }
  ov.classList.toggle('show',show);
}
$('#keyshelp').addEventListener('mousedown',e=>{if(e.target.id==='keyshelp')keysHelp(false)});

/* ================= command palette (quicksilver) ================= */
let palIdx=0,palMatches=[];
function paletteOpen(){return $('#palette').classList.contains('show')}
function togglePalette(force){
  const on=force!==undefined?force:!paletteOpen();
  $('#palette').classList.toggle('show',on);
  if(on){$('#palin').value='';palRender('');setTimeout(()=>$('#palin').focus(),10)}
}
function palActions(){
  const items=Object.keys(APPS).map(id=>({id,icon:APPS[id].icon,label:APPS[id].title,hint:APPS[id].desc,run:()=>openApp(id)}));
  const g=inner=>`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block">${inner}</svg>`;
  items.push(
    {icon:'＋',label:'New chat',hint:'start a fresh conversation',run:()=>{openApp('chat');newChat()}},
    {icon:g('<path d="M4.5 7h15M9.5 7V5.2h5V7M7 7l.9 12.3h8.2L17 7"/>'),label:'Clear session',hint:'wipe the current conversation',run:()=>{openApp('chat');clearSession()}},
    {icon:svgSpeaker(false),label:'Toggle voice',hint:'speak replies on/off',run:()=>{VOICE.tts=!VOICE.tts;saveVoice();toast(VOICE.tts?'voice on':'voice off')}},
    {icon:g('<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4.4 16.4l4.3-3.8 3.4 2.9 3-2.5 4.5 3.6"/>'),label:'Reset wallpaper',hint:'back to the default background',run:()=>fetch('/api/wallpaper',{method:'DELETE'})},
  );
  NATIVEAPPS.forEach(a=>items.push({nat:a,label:a.name,hint:(a.comment||'')+(a.comment?' · ':'')+'system app',run:()=>launchNative(a.id,a.name)}));
  return items;
}
function palScore(q,text){
  q=q.toLowerCase();text=text.toLowerCase();
  if(text.startsWith(q))return 3;
  if(text.includes(q))return 2;
  let i=0;for(const ch of text){if(ch===q[i])i++}
  return i>=q.length?1:0;
}
function palRender(q){
  q=q.trim();
  const items=palActions();
  palMatches=q?items.map(it=>({it,s:palScore(q,it.label+' '+(it.hint||''))})).filter(x=>x.s>0)
      .sort((a,b)=>b.s-a.s).map(x=>x.it).slice(0,8):items.slice(0,9);
  if(q)palMatches.push({icon:'▲',label:`Ask ${agentName()}: “${q}”`,hint:'send to the agent',run:()=>palAsk(q)});
  palIdx=Math.min(palIdx,palMatches.length-1)||0;
  $('#pallist').innerHTML=palMatches.map((it,i)=>`<div class="palitem${i===palIdx?' sel':''}" data-i="${i}">
    ${it.id?appIcon(it.id,32):it.nat?nativeIcon(it.nat,32):`<span class="pi">${it.icon}</span>`}<span><div class="pl">${esc(it.label)}</div><div class="ph">${esc(it.hint||'')}</div></span></div>`).join('');
  $('#pallist').querySelectorAll('.palitem').forEach(el=>{
    el.onclick=()=>{palRun(+el.dataset.i)};
    el.onmousemove=()=>{palIdx=+el.dataset.i;palHighlight()};
  });
}
function palHighlight(){$('#pallist').querySelectorAll('.palitem').forEach((el,i)=>el.classList.toggle('sel',i===palIdx))}
function palRun(i){
  const it=palMatches[i];if(!it)return;
  togglePalette(false);
  it.run();
}
function palAsk(q){
  openApp('chat');
  if(input){input.value=q;input.dispatchEvent(new Event('input'));send()}
}
$('#palin').addEventListener('input',e=>{palIdx=0;palRender(e.target.value)});
$('#palin').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palIdx+1,palMatches.length-1);palHighlight()}
  else if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(palIdx-1,0);palHighlight()}
  else if(e.key==='Enter'){e.preventDefault();palRun(palIdx)}
  else if(e.key==='Escape'){togglePalette(false)}
});
$('#palette').addEventListener('mousedown',e=>{if(e.target.id==='palette')togglePalette(false)});
document.addEventListener('keyup',e=>{if(e.key==='Control'||e.key==='Meta'||e.key==='Alt')switcherCommit()});
document.addEventListener('keydown',e=>{
  const inTerm=e.target.closest&&e.target.closest('.xterm');
  const k=e.key.toLowerCase();
  const typing=/^(input|textarea|select)$/i.test((e.target.tagName||''));
  // window switcher — Ctrl/Cmd+Tab (reliable), Alt+Tab (best-effort; the OS may grab it)
  if((cmd(e)||e.altKey)&&e.key==='Tab'){e.preventDefault();switcherOpen(e.shiftKey?-1:1);return}
  // Command-key window controls (Cmd on Mac, Ctrl elsewhere)
  if(cmd(e)&&!e.altKey){
    const a=activeWin();
    if(k==='a'&&!typing&&!inTerm&&!a){e.preventDefault();launcherIds().forEach(id=>setSel(id,true));return}
    if(k==='w'&&a){e.preventDefault();closeWin(a);return}
    if(k==='m'&&a){e.preventDefault();minimizeWin(a);return}
    if(k==='f'&&a){e.preventDefault();toggleMax(a);return}
    if(k===','){e.preventDefault();openApp('settings');return}
    if(e.key==='Enter'){e.preventDefault();openApp('chat');newChat();return}
    if(k==='/'){e.preventDefault();keysHelp();return}
  }
  if(e.key==='?'&&!typing){e.preventDefault();keysHelp();return}
  if(e.key==='Escape'){if(SW.open){switcherCommit();return}if($('#keyshelp').classList.contains('show')){keysHelp(false);return}}
  if(e.ctrlKey&&e.shiftKey&&k==='p'){e.preventDefault();togglePalette()}          // works everywhere, incl. terminal
  else if(e.key==='F11'){e.preventDefault();toggleFullscreen()}
  else if((e.altKey&&e.code==='Space')&&!inTerm){e.preventDefault();togglePalette()}   // Alt+Space quick launch / ask AI
  else if(!inTerm&&((e.ctrlKey&&e.code==='Space')||(e.ctrlKey&&!e.shiftKey&&!e.altKey&&k==='k'))){e.preventDefault();togglePalette()}
  else if(e.ctrlKey&&e.altKey&&k==='t'){e.preventDefault();togglePalette(false);openApp('terminal')}
  else if(e.altKey&&!e.ctrlKey&&!e.shiftKey&&k==='j'){e.preventDefault();jarvisMode(!JARVIS.on)}
  else if(e.ctrlKey&&!e.shiftKey&&!e.altKey&&/^[1-9]$/.test(e.key)&&!inTerm){
    const n=+e.key;if(n<=DESKS){e.preventDefault();switchDesk(n)}}
});
