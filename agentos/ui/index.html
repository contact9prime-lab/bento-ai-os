  padding:14px 16px;border-radius:var(--r-lg);background:var(--glass);
  backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--hairline-strong);box-shadow:var(--el-4)}
.procard .pc-head{display:flex;align-items:center;gap:7px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;color:var(--acc)}
.procard .pc-text{font-size:var(--fs-md);line-height:1.5;margin-top:8px;user-select:text}
.procard .pc-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.procard .pc-actions button{padding:5px 14px;border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:600;
  background:var(--bg3);border:1px solid var(--line)}
.procard .pc-actions .pc-go{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06211d;border:none}

/* files: semantic hit snippets */
.fitem .fsnip{font-size:var(--fs-2xs);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52ch;font-weight:400}
.fitem.fhit{align-items:flex-start;padding-top:6px;padding-bottom:6px}

/* palette: direct-action rows read as commands, not app entries */
.palitem.act .pi{color:var(--acc);font-weight:700}
.palitem.act .pl{color:var(--acc)}
.palitem.act.sel .pl{color:var(--txt)}

/* toasts: a real stack, newest on top */
#toasts{position:fixed;right:14px;bottom:calc(var(--tbh) + 12px);z-index:11000;display:flex;flex-direction:column;gap:8px;
  align-items:flex-end;pointer-events:none}
#toasts .toast{position:static;animation:none}

/* control center popover (tray) */
#ccpop{position:fixed;top:calc(var(--mbh) + 8px);right:10px;width:380px;max-height:min(72vh,640px);overflow:auto;z-index:10500;
  display:none;border-radius:var(--r-lg);background:var(--glass);backdrop-filter:blur(28px) saturate(1.6);
  border:1px solid var(--hairline-strong);box-shadow:var(--el-4);padding:6px 0}
#ccpop.show{display:block}
#ccpop .pad{padding:10px 14px}

/* ===== Spaces: desktops as cards, windows as tiles you can throw ===== */
#expose{position:absolute;inset:0;z-index:90;display:none;background:var(--scrim);backdrop-filter:blur(14px)}
#expose.show{display:block;animation:fadein .16s var(--ease-out)}
body.exposing .win{transition:transform var(--d-slow) var(--ease-out);will-change:transform}
body.exposing .win.exp-win{z-index:200!important;box-shadow:var(--el-4)}
#expose-spaces{position:absolute;top:18px;left:0;right:0;z-index:300;
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:0 20px}
.space{width:190px;cursor:pointer;border-radius:var(--r-md);overflow:hidden;
  border:1.5px solid var(--hairline-strong);background:var(--glass-tint);backdrop-filter:var(--glass-blur);
  box-shadow:var(--el-2);transition:border-color var(--d-fast) var(--ease-out),transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out)}
.space:hover{transform:translateY(-3px);box-shadow:var(--el-4)}
.space.on{border-color:var(--acc);box-shadow:var(--el-4),0 0 22px color-mix(in srgb,var(--acc) 26%,transparent)}
.space.drop{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,transparent);transform:scale(1.04)}
.space .sp-map{position:relative;height:96px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.space .sp-map i{position:absolute;background:color-mix(in srgb,var(--acc) 34%,transparent);
  border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);border-radius:3px}
.space .sp-lbl{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:var(--fs-xs);font-weight:600;
  border-top:1px solid var(--hairline)}
.space .sp-x{margin-left:auto;color:var(--dim2);font-size:var(--fs-2xs)}
.space .sp-x:hover{color:var(--err)}
.space.add{display:flex;flex-direction:column;align-items:center;justify-content:center;height:130px;
  font-size:var(--fs-2xl);color:var(--dim2);border-style:dashed;background:transparent}
.space.add:hover{color:var(--acc);border-color:var(--acc)}
#expose-grid{position:absolute;inset:0;z-index:250}
.exp-empty{position:absolute;top:52%;left:0;right:0;text-align:center;color:var(--dim);font-size:var(--fs-md)}
#expose-hint{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:var(--dim2);font-size:var(--fs-sm);z-index:300}
.exp-catch{position:absolute;z-index:300;cursor:pointer;border-radius:var(--r-md);
  outline:2px solid transparent;transition:outline-color var(--d-fast) var(--ease-out),background var(--d-fast) var(--ease-out)}
.exp-catch:hover{outline-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,transparent)}
.exp-catch.dragging{opacity:.5}
.exp-catch .exp-lbl{position:absolute;left:50%;transform:translateX(-50%);bottom:-30px;padding:4px 12px;white-space:nowrap;
  font-size:var(--fs-xs);font-weight:600;color:#fff;background:rgba(0,0,0,.55);border-radius:var(--r-full);
  display:flex;gap:6px;align-items:center}
.exp-catch .exp-x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:var(--r-full);
  background:rgba(0,0,0,.6);color:#fff;font-size:var(--fs-2xs);display:none;align-items:center;justify-content:center}
.exp-catch:hover .exp-x{display:flex}

/* a window taking the whole screen — over the menu bar and the dock */
.win.fullwin{position:fixed!important;inset:0!important;width:auto!important;height:auto!important;
  border-radius:0;border:none;z-index:9450!important}
.win.fullwin .rz{display:none}
body.has-fullwin #menubar,body.has-fullwin #taskbar,body.has-fullwin #omnibar{opacity:0;pointer-events:none;
  transition:opacity var(--d-base) var(--ease-out)}

/* the pager reflects what is actually on each desktop */
.pgb.has::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:10px;height:2px;border-radius:2px;background:currentColor;opacity:.55}
.pgb{position:relative}
.pgb.drop{background:color-mix(in srgb,var(--acc) 34%,transparent);color:var(--txt);outline:1px solid var(--acc)}


/* ================= the ever-present agent: omnibar + copilot panels ================= */

/* ---- omnibar ---- */
#omnibar{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;z-index:7;
  width:min(560px,86vw);height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-radius:var(--r-full);background:var(--glass-tint);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--hairline-strong);box-shadow:var(--el-3),var(--glass-edge);
  transition:box-shadow var(--d-base) var(--ease-out),border-color var(--d-base) var(--ease-out)}
#omnibar:focus-within{border-color:color-mix(in srgb,var(--acc) 55%,transparent);
  box-shadow:var(--el-4),0 0 24px color-mix(in srgb,var(--acc) 18%,transparent)}
#omni-orb{width:18px;height:18px;flex:none;border-radius:var(--r-full);
  background:radial-gradient(circle at 32% 30%,var(--acc),var(--acc2) 75%);
  box-shadow:0 0 10px color-mix(in srgb,var(--acc) 55%,transparent);
  animation:obreathe 4.5s ease-in-out infinite}
#omni-orb.busy{animation:obusy 1s ease-in-out infinite}
@keyframes obreathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
@keyframes obusy{0%,100%{transform:scale(1);box-shadow:0 0 10px color-mix(in srgb,var(--acc) 55%,transparent)}
  50%{transform:scale(1.25);box-shadow:0 0 22px var(--acc)}}
#omni-in{flex:1;background:none;border:none;padding:0;font-size:var(--fs-base);color:var(--txt)}
#omni-in::placeholder{color:var(--dim)}
/* popped: the launcher state (Ctrl+Space) — the bar itself grows, no overlay */
#omnibar.pop{width:min(680px,92vw);height:52px;
  border-color:color-mix(in srgb,var(--acc) 60%,transparent);
  box-shadow:var(--el-5),0 0 34px color-mix(in srgb,var(--acc) 22%,transparent)}
#omnibar.pop #omni-in{font-size:var(--fs-lg)}
body.omni-pop #omnicards{opacity:0;pointer-events:none;transition:opacity var(--d-fast) var(--ease-out)}
/* results list: direct actions, apps, and always the "ask" row */
#omnilist{position:absolute;bottom:calc(100% + 10px);left:0;right:0;display:none;
  max-height:min(52vh,420px);overflow-y:auto;padding:6px;border-radius:var(--r-lg);
  background:var(--glass-tint);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--hairline-strong);box-shadow:var(--el-5),var(--glass-edge)}
#omnilist.on{display:block;animation:pop .13s var(--ease-out)}
#omnilist .palitem.ask .pi{color:var(--acc)}
#omnilist .palitem.ask .pl{color:var(--acc)}
#omnilist .palitem.sel.ask .pl{color:var(--txt)}
#omnilist .palitem{position:relative}
#omnilist .palitem .ptext{flex:1;min-width:0}
#omnilist .palitem .pl,#omnilist .palitem .ph{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#omnilist .palitem .ok{flex:none;font-size:var(--fs-2xs);font-weight:600;color:var(--dim2);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;opacity:0;transition:opacity var(--d-fast) var(--ease-out)}
#omnilist .palitem:hover .ok,#omnilist .palitem.sel .ok{opacity:1}
.omni-hint{display:flex;gap:14px;padding:8px 12px 4px;margin-top:4px;border-top:1px solid var(--hairline);
  font-size:var(--fs-2xs);color:var(--dim2)}
.omni-hint kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-right:4px}
#omnibar button{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-full);color:var(--dim);transition:background var(--d-fast) var(--ease-out),color var(--d-fast) var(--ease-out)}
#omnibar button:hover{background:rgba(255,255,255,.08);color:var(--txt)}
:root[data-theme=light] #omnibar button:hover{background:rgba(0,0,0,.07)}
/* Summoned: Ctrl+Space, a double-tap of Ctrl, or typing on the desktop lifts the
   bar over whatever is in front — including a full-screen window. Let go (Esc or
   click away) and it drops back into the desktop, behind your work. */
#omnibar.summoned,#omnicards.raised{z-index:99999}
#omnibar.summoned{box-shadow:var(--el-5),0 0 34px color-mix(in srgb,var(--acc) 26%,transparent)}
body.has-fullwin #omnibar.summoned,body.has-fullwin #omnicards.raised{opacity:1;pointer-events:auto}

/* ---- answer cards ---- */
#omnicards{position:absolute;left:50%;transform:translateX(-50%);bottom:142px;z-index:8;
  width:min(560px,86vw);display:flex;flex-direction:column;gap:10px;pointer-events:none}
.ocard{pointer-events:auto;border-radius:var(--r-lg);padding:12px 14px 8px;max-height:44vh;display:flex;flex-direction:column;
  background:var(--glass-tint);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--hairline-strong);box-shadow:var(--el-4),var(--glass-edge)}
.ocard .oc-q{font-size:var(--fs-sm);font-weight:600;color:var(--dim);margin-bottom:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.ocard .oc-feed{overflow-y:auto;min-height:22px;user-select:text}
.ocard .oc-tools{display:flex;justify-content:flex-end;gap:6px;margin-top:6px;flex:none}
.ocard .oc-tools button{font-size:var(--fs-2xs);font-weight:600;color:var(--dim);padding:3px 10px;border-radius:var(--r-full);
  transition:background var(--d-fast) var(--ease-out),color var(--d-fast) var(--ease-out)}
.ocard .oc-tools button:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.ocard .oc-tools .oc-stop{margin-right:auto;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}

/* ---- shared mini-feed pieces (omnibar cards + copilot panels) ---- */
.mf-user{align-self:flex-end;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 20%,var(--bg3)),color-mix(in srgb,var(--acc2) 14%,var(--bg3)));
  border:1px solid color-mix(in srgb,var(--acc) 25%,transparent);
  padding:6px 11px;border-radius:var(--r-lg) 4px var(--r-lg) var(--r-lg);font-size:var(--fs-md);max-width:88%;margin:4px 0}
.mf-body{font-size:var(--fs-md);line-height:1.5;margin:4px 0;user-select:text}
.mf-think{max-height:76px;overflow-y:auto;opacity:.75;font-size:var(--fs-xs)}
.mf-working{display:flex;align-items:center;gap:8px;padding:6px 2px;color:var(--dim);font-size:var(--fs-sm)}
.mf-working .mfo{width:10px;height:10px;border-radius:var(--r-full);flex:none;
  background:radial-gradient(circle at 32% 30%,var(--acc),var(--acc2));animation:obusy 1s ease-in-out infinite}

/* ---- copilot panel inside windows ---- */
.win .wmain{flex:1;min-height:0;display:flex}
.win .wmain .wbody{flex:1;min-width:0}
.win .ttl .tright{display:flex;justify-content:flex-end;align-items:center}
.win .cp-btn{width:26px;height:26px;border-radius:var(--r-md);font-size:var(--fs-md);color:var(--dim);
  display:flex;align-items:center;justify-content:center;opacity:0;
  transition:background var(--d-fast) var(--ease-out),color var(--d-fast) var(--ease-out),text-shadow var(--d-fast) var(--ease-out)}
.win:hover .cp-btn,.win.active .cp-btn,.win .cp-btn.on{opacity:.85}
.win .cp-btn:hover{background:rgba(255,255,255,.08);color:var(--acc);opacity:1}
.win .cp-btn.on{color:var(--acc);text-shadow:0 0 12px var(--acc)}
.win .copanel{width:0;flex:none;overflow:hidden;display:flex;flex-direction:column;
  border-left:1px solid transparent;background:color-mix(in srgb,var(--bg2) 55%,transparent);
  transition:width var(--d-slow) var(--ease-out),border-color var(--d-slow) var(--ease-out)}
.win .copanel.open{width:min(300px,46%);border-left-color:var(--hairline)}
.cp-head{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--hairline);flex:none;min-width:0}
.cp-ava{color:var(--acc);font-size:var(--fs-md);text-shadow:0 0 10px color-mix(in srgb,var(--acc) 60%,transparent)}
.cp-name{font-size:var(--fs-md);font-weight:700;white-space:nowrap}
.cp-app{font-size:var(--fs-2xs);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-open{color:var(--dim);border-radius:var(--r-sm);padding:2px 6px}
.cp-open:hover{color:var(--txt);background:rgba(255,255,255,.08)}
.cp-feed{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;min-width:260px}
.cp-feed .tool{font-size:var(--fs-xs)}
.cp-starters{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px;flex:none;min-width:260px}
.cp-chip{font-size:var(--fs-xs);padding:5px 11px;border-radius:var(--r-full);text-align:left;
  background:var(--bg3);border:1px solid var(--line);color:var(--dim);
  transition:border-color var(--d-fast) var(--ease-out),color var(--d-fast) var(--ease-out)}
.cp-chip:hover{border-color:var(--acc);color:var(--txt)}
.cp-inbar{display:flex;gap:7px;padding:9px 12px;border-top:1px solid var(--hairline);flex:none;min-width:260px}
.cp-in{flex:1;resize:none;max-height:88px;font-size:var(--fs-md);border-radius:var(--r-md)}
.cp-send{width:30px;height:30px;flex:none;border-radius:var(--r-full);font-weight:800;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06211d}

/* chat sidebar: embedded-thread sections */
.convgrp{font-size:var(--fs-2xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);
  padding:10px 10px 3px}

/* ---- visible hands: a window/dock tile glows while the agent acts on it ---- */
.win.agent-touch{box-shadow:var(--el-4),0 0 0 1.5px color-mix(in srgb,var(--acc) 70%,transparent),0 0 28px color-mix(in srgb,var(--acc) 30%,transparent)}
.dockb.agent-touch .aicon{box-shadow:0 0 0 2px var(--acc),0 5px 14px rgba(0,0,0,.42)}

/* ================= the app deck (bento tiles above the bar) =================
   The deck claims as much desktop as it needs: groups WRAP into rows and the
   whole thing grows upward from the bar, capped at the free space between the
   menu bar and the prompt bar (then it scrolls). Its measured height feeds
   --deckh, which every other bottom-anchored surface offsets by. */
:root{--deckh:0px}
#icons{display:none}            /* apps live in the deck now — the desktop is wallpaper */
#deck{position:absolute;left:50%;transform:translateX(-50%);bottom:138px;z-index:6;
  width:min(1680px,96vw);max-height:calc(100% - 170px);
  display:flex;align-items:flex-end;gap:8px}
#deck-toggle{flex:none;width:26px;height:26px;border-radius:var(--r-full);align-self:flex-end;margin-bottom:6px;
  background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--hairline);color:var(--dim);
  font-size:var(--fs-2xs);box-shadow:var(--el-1);transition:color var(--d-fast) var(--ease-out)}
#deck-toggle:hover{color:var(--txt)}
#deck-scroll{flex:1;min-width:0;max-height:100%;display:flex;flex-wrap:wrap;gap:12px;
  align-content:flex-end;justify-content:center;overflow-y:auto;overflow-x:hidden;padding:2px 2px 6px;
  scrollbar-color:var(--line) transparent}
body:not(.deck-open) #deck-scroll{display:none}
#deck-scroll::-webkit-scrollbar{width:6px}
#deck-scroll::-webkit-scrollbar-track{background:transparent}
#deck-scroll::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--txt) 22%,transparent);border-radius:4px}
#deck-scroll::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--txt) 38%,transparent)}
.deck-group{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px;border-radius:var(--r-lg);
  background:var(--glass-tint);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--hairline-strong);box-shadow:var(--el-3),var(--glass-edge);
  transition:border-color var(--d-base) var(--ease-out),box-shadow var(--d-base) var(--ease-out)}
.deck-group:hover{border-color:color-mix(in srgb,var(--acc) 26%,var(--hairline-strong));
  box-shadow:var(--el-4),var(--glass-edge)}
.deck-gname{font-size:var(--fs-2xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim2);padding-left:2px;cursor:context-menu;display:flex;align-items:center;gap:6px}
.deck-tiles{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-flow:column;gap:4px 2px;
  align-content:start;flex:1;min-height:0}
.deck-tile{width:84px;padding:6px 2px 5px;border-radius:var(--r-md);display:flex;flex-direction:column;
  align-items:center;gap:5px;transition:background var(--d-fast) var(--ease-out),transform var(--d-fast) var(--ease-out)}
.deck-tile:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
:root[data-theme=light] .deck-tile:hover{background:rgba(0,0,0,.06)}
.deck-tile span{font-size:var(--fs-2xs);line-height:1.2;text-align:center;max-width:80px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.deck-new{flex:none;align-self:flex-end;width:96px;height:96px;border-radius:var(--r-lg);color:var(--dim2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-xl);
  border:1.5px dashed var(--line);transition:border-color var(--d-fast) var(--ease-out),color var(--d-fast) var(--ease-out)}
.deck-new span{font-size:var(--fs-2xs)}
.deck-new:hover{border-color:var(--acc);color:var(--acc)}
.deck-wgroup .deck-wframe{width:280px;height:150px;border-radius:var(--r-md);overflow:hidden;
  background:color-mix(in srgb,var(--bg2) 40%,transparent)}
.deck-wgroup iframe{width:100%;height:100%;border:none;display:block}
.deck-wx{margin-left:auto;color:var(--dim2);font-size:var(--fs-2xs)}
.deck-wx:hover{color:var(--err)}
body.exposing #deck,body.omni-pop #deck{opacity:0;pointer-events:none;transition:opacity var(--d-fast) var(--ease-out)}

/* widgets pinned beside the prompt bar */
#barwidgets{position:absolute;bottom:86px;left:calc(50% + min(292px,45vw));z-index:7;display:none;gap:8px}
#barwidgets.on{display:flex}
.barwidget{width:210px;height:132px;display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;
  background:var(--glass-tint);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--hairline-strong);box-shadow:var(--el-3),var(--glass-edge)}
.bw-h{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;font-size:var(--fs-2xs);
  font-weight:700;color:var(--dim);border-bottom:1px solid var(--hairline)}
.bw-h button{color:var(--dim2);font-size:var(--fs-2xs)}
.bw-h button:hover{color:var(--err)}
.barwidget iframe{flex:1;border:none;width:100%;background:transparent}

/* a widget shrunk into the menu bar */
#mbwidgets{display:flex;align-items:center;gap:8px;margin-left:12px}
.mbwidget{width:200px;height:var(--mbh);border:none;background:transparent;display:block}

/* surfaces that sit above the dock must clear the deck too */
body.deck-open #omnicards{bottom:calc(142px + var(--deckh))}
body.deck-open #toasts{bottom:calc(var(--tbh) + var(--deckh) + 12px)}
body.deck-open #startmenu{bottom:calc(var(--tbh) + var(--deckh) + 16px)}
body.deck-open .procard{bottom:calc(var(--tbh) + var(--deckh) + 14px)}

/* ================= AI presence bubble (bottom-right) ================= */
#aibubble{position:fixed;right:16px;bottom:88px;z-index:9400;display:none;align-items:center;gap:9px;
  padding:8px 14px 8px 11px;border-radius:var(--r-full);cursor:pointer;
  background:var(--glass-tint);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--hairline-strong);box-shadow:var(--el-3),var(--glass-edge);
  transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out)}
#aibubble.on{display:flex;animation:pop .18s var(--ease-out)}
#aibubble:hover{transform:translateY(-2px);box-shadow:var(--el-4)}
#aibubble .ab-orb{width:14px;height:14px;flex:none;border-radius:var(--r-full);
  background:radial-gradient(circle at 32% 30%,var(--acc),var(--acc2) 75%)}
#aibubble.busy .ab-orb{animation:obusy 1s ease-in-out infinite}
#aibubble .ab-t{font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
#aibubble .ab-n{min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-full);background:var(--acc);color:#06211d;
  font-size:var(--fs-2xs);font-weight:800;display:flex;align-items:center;justify-content:center}

/* shortcut editor rows (Settings → Shortcuts) */
.sc-row{display:flex;align-items:center;gap:10px;padding:5px 2px;border-bottom:1px solid var(--hairline)}
.sc-row:last-child{border-bottom:none}
.sc-l{flex:1;font-size:var(--fs-md)}
.sc-l em{font-style:normal;font-size:var(--fs-2xs);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);
  border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:middle}
.sc-k{flex:none;min-width:120px;text-align:center;font-size:var(--fs-sm);font-weight:600;padding:4px 10px;
  border-radius:var(--r-sm);background:var(--bg3);border:1px solid var(--line);color:var(--txt);
  transition:border-color var(--d-fast) var(--ease-out)}
.sc-k:hover{border-color:var(--acc)}
.sc-k.rec{border-color:var(--acc);color:var(--acc);animation:obusy 1s ease-in-out infinite}

/* ================= preferences: a real settings layout =================
   GNOME/macOS grammar: category rail on the left, preference GROUPS on the
   right, each a card of ROWS with the label+description left and the control
   right. One row primitive means every panel can adopt it. */
.prefs{flex:1;min-height:0;display:flex;background:var(--bg)}
.prefs-side{flex:0 0 188px;padding:10px 8px;overflow-y:auto;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px}
.prefs-side button{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r-md);
  font-size:var(--fs-md);font-weight:600;color:var(--dim);text-align:left;
  transition:background var(--d-fast) var(--ease-out),color var(--d-fast) var(--ease-out)}
.prefs-side button:hover{background:color-mix(in srgb,var(--txt) 7%,transparent);color:var(--txt)}
.prefs-side button.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--txt)}
.prefs-side .psi{width:16px;text-align:center;opacity:.85;flex:none}
.prefs-main{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 30px}
.prefs-main > h2{font-size:var(--fs-xl);font-weight:750;margin-bottom:4px}
.prefs-main > .lead{font-size:var(--fs-md);color:var(--dim);margin-bottom:18px;max-width:62ch;line-height:1.5}
.pgroup{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:18px;overflow:hidden}
.pgroup > h3{font-size:var(--fs-xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);
  padding:12px 16px 0}
.pgroup > .ghint{font-size:var(--fs-sm);color:var(--dim);padding:6px 16px 0;line-height:1.5}
.prow{display:flex;align-items:center;gap:16px;padding:13px 16px;border-top:1px solid var(--line)}
.pgroup > h3 + .prow,.pgroup > .ghint + .prow,.pgroup > .prow:first-child{border-top:none}
.prow:first-of-type{margin-top:4px}
.prow .pl{flex:1;min-width:0}
.prow .pl b{display:block;font-size:var(--fs-base);font-weight:600}
.prow .pl small{display:block;font-size:var(--fs-sm);color:var(--dim);margin-top:2px;line-height:1.45}
.prow .pc{flex:0 0 auto;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.prow .pc input[type=text],.prow .pc input[type=password],.prow .pc input[type=number],.prow .pc select{
  min-width:240px;max-width:340px}
.prow .pc input[type=number]{min-width:96px}
.prow.stack{display:block}
.prow.stack .pc{margin-top:9px;justify-content:flex-start}
.prow.stack .pc input,.prow.stack .pc select{width:100%;max-width:none}
/* a switch instead of a raw checkbox — the single biggest "cheap form" tell */
.psw{position:relative;width:40px;height:23px;flex:none;cursor:pointer}
.psw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.psw i{position:absolute;inset:0;border-radius:var(--r-full);background:var(--bg4);border:1px solid var(--line);
  transition:background var(--d-fast) var(--ease-out),border-color var(--d-fast) var(--ease-out)}
.psw i::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:var(--r-full);
  background:var(--txt);opacity:.75;transition:transform var(--d-base) var(--ease-spring),opacity var(--d-fast) var(--ease-out)}
.psw input:checked + i{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.psw input:checked + i::after{transform:translateX(17px);background:#06211d;opacity:1}
.psw input:focus-visible + i{outline:2px solid var(--acc);outline-offset:2px}
.prow.danger .pl b{color:var(--err)}
.pgroup.danger{border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
.prefs-main .savebar{position:sticky;bottom:-30px;margin:0 -26px -30px;padding:12px 26px;
  background:linear-gradient(transparent,var(--bg) 34%);display:flex;justify-content:flex-end;gap:10px}

/* a stored secret: shown, never re-editable until you ask to replace it */
.psecret{display:flex;align-items:center;gap:8px}
.psecret i{font-style:normal;font-size:var(--fs-2xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:var(--r-sm);padding:2px 7px}
.psecret code{font-family:var(--mono);font-size:var(--fs-sm);color:var(--dim)}

/* omnibar attachments: paste, drop or capture a screenshot with the question */
#omni-shots{position:absolute;bottom:calc(100% + 8px);left:14px;display:none;gap:8px;z-index:2}
#omni-shots.on{display:flex}
.oshot{position:relative;display:block}
.oshot img{height:56px;width:auto;max-width:120px;object-fit:cover;border-radius:var(--r-sm);
  border:1px solid var(--hairline-strong);box-shadow:var(--el-2);display:block}
.oshot button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:var(--r-full);
  background:var(--bg3);border:1px solid var(--line);color:var(--dim);font-size:var(--fs-2xs);
  display:flex;align-items:center;justify-content:center}
.oshot button:hover{color:var(--err);border-color:var(--err)}
#omnibar.dropping{border-color:var(--acc);box-shadow:var(--el-4),0 0 26px color-mix(in srgb,var(--acc) 30%,transparent)}

/* the build "what next?" card — a dead end becomes one click */
.bchoice{margin:10px 0;padding:12px 14px;border-radius:var(--r-md);background:var(--bg2);
  border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));display:flex;flex-direction:column;gap:8px}
.bchoice b{font-size:var(--fs-md)}
.bchoice span{font-size:var(--fs-sm);color:var(--dim)}
.bchoice .row{display:flex;gap:8px;align-items:center}
.bchoice select{flex:1;min-width:0}

/* stop controls: visible the moment something is running */
#aibubble .ab-stop{width:22px;height:22px;border-radius:var(--r-full);flex:none;font-size:var(--fs-2xs);
  background:var(--bg3);border:1px solid var(--line);color:var(--dim);display:flex;align-items:center;justify-content:center}
#aibubble .ab-stop:hover{color:var(--err);border-color:var(--err)}
.cp-send.stop{background:var(--err);color:#2b0606}
.ocard .oc-tools .oc-stopnow{margin-right:auto;color:var(--err);
  border:1px solid color-mix(in srgb,var(--err) 40%,transparent)}
/* system apps sit on the same shelf as AgentOS's own, with a quieter header */
.deck-native .deck-gname .mut{font-size:var(--fs-2xs);opacity:.6;font-weight:600}
.deck-nat img.na{width:46px;height:46px;object-fit:contain}
.deck-nat .nafallback{width:46px;height:46px}
/* ================= cross-device layout =================
   AgentOS runs the same desktop on a phone, a tablet and a workstation. Nothing
   here changes what the OS *is* — the menu bar, the dock, the prompt bar, the
   deck and windows are all still there. What changes is how much room each one
   takes and whether windows float or fill the screen.

   Rules are keyed off body.dev-mobile / .dev-tablet / .dev-touch (set in
   00a-device.js) rather than raw media queries, so a single classification
   drives CSS and JS alike and they can never disagree. This file loads last, so
   it wins over the desktop chrome above it without !important gymnastics —
   except where the base rule is itself !important (windows) or a theme's
   injected CSS would otherwise take over (the sheet geometry).

   Safe areas: every screen-edge surface pads by env(safe-area-inset-*) so the
   dock clears a home indicator and the menu bar clears a notch. */

:root{
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}

/* ---------- touch: bigger targets everywhere, no hover-only affordances ---------- */
body.dev-touch .win .tbtns button{width:17px;height:17px}
body.dev-touch .win .ttl{height:46px}
body.dev-touch #omnibar button,body.dev-touch #tray button{min-width:36px;min-height:36px}
body.dev-touch .widget .wgh{opacity:1;pointer-events:auto}   /* no hover to reveal the grip */
body.dev-touch .dockb::before,body.dev-touch .tbwin::before,
body.dev-touch .tbnat::before,body.dev-touch #startbtn::before{display:none}   /* tooltips need a cursor */
body.dev-touch ::-webkit-scrollbar{width:0;height:0}

/* ================================================================
   TABLET — windows still float, but the chrome slims down and the
   deck/dock scale to a hand rather than a mouse.
   ================================================================ */
body.dev-tablet{--mbh:32px;--tbh:132px}
body.dev-tablet #menubar{padding:0 10px;gap:8px}
body.dev-tablet #mbwidgets{display:none}
body.dev-tablet #tray{gap:9px}
body.dev-tablet #taskbar{max-width:calc(100vw - 20px)}
body.dev-tablet .dockb .aicon,body.dev-tablet .tbwin .aicon,
body.dev-tablet .tbnat .aicon,body.dev-tablet #startbtn .mark{width:42px;height:42px}
body.dev-tablet #tbnative{max-width:22vw}
body.dev-tablet #deck{width:calc(100vw - 24px)}
body.dev-tablet .deck-tile{width:76px}
body.dev-tablet #omnibar{width:min(560px,92vw)}
body.dev-tablet #omnicards{width:min(560px,92vw)}
body.dev-tablet #barwidgets{display:none!important}     /* the bar needs the whole width */
body.dev-tablet #ccpop,body.dev-tablet #notifpanel{width:min(380px,calc(100vw - 20px))}
/* a 208px rail inside a 700px window is half the app — collapse to icons */
body.dev-tablet .cside{width:150px;min-width:150px}
body.dev-tablet .stside{flex-basis:170px;width:170px;max-width:170px}

/* ================================================================
   MOBILE — one thing at a time. Windows become full-bleed sheets, the
   dock becomes a fixed bottom bar, the launcher becomes a full screen
   of apps, and every popover becomes a bottom sheet.
   ================================================================ */
body.dev-mobile{--mbh:34px;--tbh:150px;--fs-2xs:11px;--fs-xs:12px;--fs-sm:13px;
  /* the bottom chrome a phone always shows: dock (64) + prompt bar (48) + gaps.
     Windows and the deck both reserve it so nothing hides behind the agent. */
  --chrome-b:calc(132px + var(--safe-b));
  overscroll-behavior:none}

/* ---- menu bar: identity + status only ---- */
body.dev-mobile #menubar{height:calc(var(--mbh) + var(--safe-t));padding:var(--safe-t) 10px 0;gap:6px}
body.dev-mobile #mbmenus,body.dev-mobile #mbwidgets,
body.dev-mobile #pager,body.dev-mobile #mbapp{display:none!important}
body.dev-mobile #tray{gap:6px;padding-left:0}
body.dev-mobile #tray-voice,body.dev-mobile #tray-power{padding:2px 5px}
body.dev-mobile #tbclock .dt{display:none}

/* ---- windows are sheets: full canvas, no chrome to drag or resize ---- */
body.dev-mobile #desktop{inset:calc(var(--mbh) + var(--safe-t)) 0 0 0}
body.dev-mobile .win{inset:0!important;left:0!important;top:0!important;
  width:100%!important;height:100%!important;max-width:none!important;
  min-width:0!important;min-height:0!important;
  border-radius:0!important;border:none!important;resize:none!important;
  padding-bottom:var(--chrome-b)}
body.dev-mobile .win .rz{display:none!important}
body.dev-mobile .win .ttl{grid-template-columns:auto 1fr auto;height:48px;padding:0 12px}
body.dev-mobile .win .tbtns .mn,body.dev-mobile .win .tbtns .mx{display:none}
body.dev-mobile .win .tbtns .cls{width:26px;height:26px;border-radius:var(--r-full);
  background:var(--bg4);border:1px solid var(--hairline);color:var(--txt);font-size:var(--fs-sm)}
body.dev-mobile .win .tname{font-size:var(--fs-base)}
body.dev-mobile .copanel{display:none!important}   /* the copilot rail needs a second column */

/* ---- in-app rails collapse: a phone shows one pane ---- */
body.dev-mobile .cside,body.dev-mobile .stside{display:none!important}
body.dev-mobile .inner,body.dev-mobile #combox{max-width:100%;padding-left:12px;padding-right:12px}
body.dev-mobile .msg.user .bubble{max-width:92%}
body.dev-mobile .pad{padding:12px 14px}
body.dev-mobile table.plist,body.dev-mobile table.loglist{font-size:var(--fs-xs)}
/* a panel header costs three lines on a phone — the title carries it alone */
body.dev-mobile .phead .ps{display:none}
/* hot corners need a pointer that can rest in a corner; a phone has neither the
   pointer nor the corners to spare, so the picker isn't offered here */
body.dev-mobile .hc-box{display:none}
/* app toolbars are built for a wide window — let them wrap instead of clipping */
body.dev-mobile #topbar,body.dev-mobile .stcompose{flex-wrap:wrap}
body.dev-mobile #topbar>select,body.dev-mobile #modelsel{flex:1 1 46%;min-width:0;max-width:none}
body.dev-mobile .stcompose .stmodel{max-width:none;flex:1 1 100%}
body.dev-mobile .psearch{max-width:none}
/* a one-row textarea can't show a three-line placeholder — truncate it instead */
body.dev-mobile #input::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* wide tables and code stay inside the sheet by scrolling themselves */
body.dev-mobile .pad table,body.dev-mobile .pbody table{display:block;overflow-x:auto}
body.dev-mobile pre{overflow-x:auto}

/* ---- the dock becomes a fixed bottom bar ---- */
body.dev-mobile #taskbar{left:0;right:0;bottom:0;transform:none;max-width:none;
  border-radius:0;border:none;border-top:1px solid var(--hairline);
  padding:8px 10px calc(8px + var(--safe-b));gap:6px;
  justify-content:space-between;align-items:center;overflow:hidden}
body.dev-mobile #dock{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
body.dev-mobile #dock::-webkit-scrollbar{display:none}
body.dev-mobile #tbwins{flex:none;max-width:36vw;overflow-x:auto;scrollbar-width:none}
body.dev-mobile #tbwins::-webkit-scrollbar{display:none}
body.dev-mobile #tbnative,body.dev-mobile .dsep{display:none!important}
body.dev-mobile .dockb .aicon,body.dev-mobile .tbwin .aicon,
body.dev-mobile #startbtn .mark{width:40px;height:40px}
body.dev-mobile .dockb:hover,body.dev-mobile .tbwin:hover,body.dev-mobile #startbtn:hover{transform:none}
body.dev-mobile .dockb:active,body.dev-mobile .tbwin:active,body.dev-mobile #startbtn:active{transform:scale(.92)}
/* the auto-hide-on-maximize trick is wrong here — every window is maximized */
body.dev-mobile.dock-hide #taskbar{transform:none;opacity:1;pointer-events:auto}

/* ---- the prompt bar spans the width, just above the dock ---- */
body.dev-mobile #omnibar{left:10px;right:10px;width:auto;transform:none;
  bottom:calc(72px + var(--safe-b));height:48px;z-index:9100}
body.dev-mobile #omnibar.pop{width:auto;height:52px}
body.dev-mobile #omni-in{min-width:0}   /* the input yields, the buttons never clip */
body.dev-mobile #omnicards{left:10px;right:10px;width:auto;transform:none;
  bottom:var(--chrome-b);z-index:9100}
body.dev-mobile .ocard{max-height:48vh}
body.dev-mobile #omnilist{max-height:min(56vh,440px)}
body.dev-mobile #barwidgets{display:none!important}

/* ---- the deck fills what's left: one column of full-width groups ---- */
/* column-reverse puts the ▾ toggle under the list, where a thumb reaches it */
/* align-items:flex-end is a right-edge pin once the axis flips — stretch instead */
body.dev-mobile #deck{left:0;right:0;width:auto;transform:none;
  flex-direction:column-reverse;align-items:stretch;
  bottom:var(--chrome-b);max-height:calc(100% - var(--chrome-b) - 24px);padding:0 10px 4px}
body.dev-mobile #deck-toggle{align-self:center;margin:0 0 4px}
body.dev-mobile #deck-scroll{flex-wrap:nowrap;flex-direction:column;
  align-content:stretch;justify-content:flex-start;gap:8px}
body.dev-mobile .deck-group{flex:none;width:100%}
body.dev-mobile .deck-tiles{grid-template-rows:none;grid-auto-flow:row;
  grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:2px}
body.dev-mobile .deck-tile{width:auto}
body.dev-mobile .deck-new{width:100%;height:64px;flex-direction:row;gap:8px}
body.dev-mobile .deck-wgroup .deck-wframe{width:100%}
body.dev-mobile #widgets{display:none}   /* free-floating widgets need a canvas */

/* ---- launcher and popovers become sheets pinned to the bottom edge ---- */
body.dev-mobile #startmenu{left:0;right:0;bottom:0;top:calc(var(--mbh) + var(--safe-t));
  width:auto;transform:none;border-radius:0;border:none;
  display:none;flex-direction:column;padding-bottom:var(--safe-b)}
body.dev-mobile #startmenu.show{display:flex;animation:sheetup .18s var(--ease-out)}
@keyframes sheetup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
body.dev-mobile #smapps{flex:1;max-height:none;
  grid-template-columns:repeat(auto-fill,minmax(84px,1fr));align-content:start}
body.dev-mobile #ccpop,body.dev-mobile #notifpanel,body.dev-mobile #powermenu{
  top:auto;bottom:0;left:0;right:0;width:auto;max-width:none;
  max-height:76vh;border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding-bottom:calc(10px + var(--safe-b));z-index:10500}
body.dev-mobile #powermenu button{padding:12px 14px;font-size:var(--fs-base)}
body.dev-mobile #notifpanel .np-item{padding:10px 12px}

/* ---- overlays sized for a phone ---- */
body.dev-mobile #palbox,body.dev-mobile #keysbox{width:calc(100vw - 20px)}
body.dev-mobile #swbox{max-width:calc(100vw - 24px)}
body.dev-mobile .swcard{width:88px}
body.dev-mobile .wiz-stage{width:calc(100vw - 24px)}
body.dev-mobile #shell-exit,body.dev-mobile #js-exit{top:calc(var(--safe-t) + 6px);right:8px}

/* the voice experience is the one shell that already fills the screen — just
   stack its two columns so the orb keeps the room it needs */
body.dev-mobile #js-mid{flex-direction:column}
body.dev-mobile #js-side{width:auto;padding:0 14px 10px}
body.dev-mobile #js-orb{width:150px;height:150px}
body.dev-mobile #js-orb .rg.a{width:96px;height:96px}
body.dev-mobile #js-orb .rg.b{width:124px;height:124px}
body.dev-mobile #js-orb .rg.c{width:150px;height:150px}
body.dev-mobile #js-orb .core{width:66px;height:66px}
body.dev-mobile .js-node{width:60px;height:60px}
body.dev-mobile #js-top{padding:10px 14px}
body.dev-mobile #js-bottom{padding:0 14px calc(16px + var(--safe-b))}
</style>
</head>
<body>

<div id="menubar">
  <div id="mb-brand"><span class="mark"></span><span id="mb-name">AgentOS</span></div>
  <span id="mbapp" title="focused app"></span>
  <div id="mbmenus" role="menubar"></div>
  <div id="mbwidgets"></div>
  <div id="mb-spacer"></div>
  <div id="pager" title="Virtual desktops — click to switch, right-click to move the active window here"></div>
  <div id="tray">
    <button id="tray-voice" title="Voice mode — Alt+J"></button>
    <button id="tray-ctl" title="Sound & battery — click for Quick Settings"></button>
    <button id="tray-bell" title="Notifications"></button>

<script>
'use strict';
const $=s=>document.querySelector(s);
let ws=null, running=false, currentConv=null, cfg=null;

/* ================= voice / Jarvis mode =================
   (previously mis-placed inside the <style> block, which left JARVIS and these
    functions undefined and threw on every turn — now a live part of the app) */
let JARVIS={on:false,phase:'idle',rec:null,cid:null,busy:false};
let jarvisReply='';
function jarvisSetPhase(p,status){
  JARVIS.phase=p;const ov=$('#jarvis-ov');if(!ov)return;
  ov.classList.remove('listening','thinking','speaking');
  if(p!=='idle')ov.classList.add(p);
  document.body.classList.remove('js-listening','js-thinking','js-speaking');
  if(p!=='idle')document.body.classList.add('js-'+p);       // animate the Jarvis-experience orb too
  if(status){const st=$('#j-status');if(st)st.textContent=status;const jv=$('#js-voice');if(jv)jv.textContent=status}
}
function jarvisMode(on){
  const ov=$('#jarvis-ov');if(!ov)return;
  if(on){
    if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window))return toast('speech recognition not available in this browser');
    JARVIS.on=true;ov.classList.add('show');
    $('#j-transcript').textContent='';$('#j-reply').textContent='';
    JARVIS.cid=JARVIS.cid||currentConv;
    jarvisListen();
  }else{
    JARVIS.on=false;ov.classList.remove('show');
    try{JARVIS.rec&&JARVIS.rec.stop()}catch(e){}
    try{speechSynthesis.cancel()}catch(e){}
    jarvisSetPhase('idle');
  }
}
function jarvisListen(){
  if(!JARVIS.on)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{JARVIS.rec&&JARVIS.rec.abort()}catch(e){}
  const rec=new SR();JARVIS.rec=rec;
  rec.lang=(VOICE&&VOICE.lang)||'en-IN';rec.interimResults=true;rec.continuous=false;
  let finalText='';
  jarvisSetPhase('listening','listening…');
  rec.onresult=e=>{
    let interim='';finalText='';
    for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=r[0].transcript;else interim+=r[0].transcript}
    $('#j-transcript').textContent=(finalText||interim).trim();
  };
  rec.onerror=ev=>{if(ev.error==='no-speech'&&JARVIS.on){jarvisListen()}};
  rec.onend=()=>{
    const t=$('#j-transcript').textContent.trim();
    if(!JARVIS.on)return;
    if(t){jarvisAsk(t)}else{jarvisListen()}   // nothing heard → keep listening
  };
  try{rec.start()}catch(e){setTimeout(jarvisListen,400)}
}
function jarvisAsk(text){
  if(!ws||ws.readyState!==1){jarvisSetPhase('idle','not connected');return}
  jarvisSetPhase('thinking',agentName()+' is working…');
  $('#j-reply').textContent='';
  JARVIS.busy=true;jarvisReply='';
  ws.send(JSON.stringify({type:'chat',text,conversation_id:JARVIS.cid,model:($('#modelsel')&&$('#modelsel').value)||undefined}));
  setRunning(true);
}
function jarvisSpeakAndListen(text){
  jarvisSetPhase('speaking',agentName()+' is speaking…');
  const clean=(text||'').replace(/```[\s\S]*?```/g,' code block. ').replace(/[*_#`>|]/g,'').slice(0,900);
  if(!clean.trim()||!window.speechSynthesis){if(JARVIS.on)jarvisListen();return}
  const u=new SpeechSynthesisUtterance(clean);
  u.rate=(VOICE&&VOICE.rate)||1;
  const v=speechSynthesis.getVoices().find(v=>v.name===(VOICE&&VOICE.voice));if(v)u.voice=v;
  u.onend=()=>{if(JARVIS.on)jarvisListen();else jarvisSetPhase('idle')};
  u.onerror=()=>{if(JARVIS.on)jarvisListen()};
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
const RUNNING=new Set();   // conversation_ids with a live turn (several may run at once)
const STREAMS={};          // conversation_id -> {html, text}: buffered stream for chats not on screen
const QUEUES={};           // conversation_id -> [{id,text,status,reason}]: typed while a turn ran.
                           // The server owns it; this is the mirror the composer renders as "Up next".
let APPS_READY=false;   // APPS (const) is in the temporal dead zone until its definition — gate on this
let curBody=null, curThink=null, curText='';
let feed=null, chatEl=null, input=null, sendBtn=null;   // bound when the Chat window is open

/* ================= helpers ================= */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function md(src){
  const blocks=[]; src=src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{blocks.push('<pre><code>'+esc(c)+'</code></pre>');return '\x00B'+(blocks.length-1)+'\x00';});
  let h=esc(src);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?<![\w*])\*([^*\n]+)\*(?![\w*])/g,'<em>$1</em>');
  h=h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/\[([^\]]+)\]\(([\w][\w./-]*\.md(?:#[\w-]*)?)\)/g,'<a href="#" class="doclink" data-doc="$2">$1</a>');
  h=h.replace(/^#### (.+)$/gm,'<h4>$1</h4>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/gm,'<hr>');
  h=h.replace(/((?:^&gt;.*\n?)+)/gm,m=>'<blockquote>'+m.replace(/^&gt; ?/gm,'').trim().replace(/\n/g,'<br>')+'</blockquote>');
  h=h.replace(/((?:^\|.*\|[ \t]*\n?)+)/gm,m=>{
    const rows=m.trim().split(/\n/).map(r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim()));
    if(rows.length<2||!/^[:\s-]+$/.test(rows[1].join('')))return m;   // not a table
    const cells=(r,tag)=>'<tr>'+r.map(c=>`<${tag}>${c}</${tag}>`).join('')+'</tr>';
    return '<table><thead>'+cells(rows[0],'th')+'</thead><tbody>'+rows.slice(2).map(r=>cells(r,'td')).join('')+'</tbody></table>';
  });
  h=h.replace(/((?:^[ \t]*[-*] .+\n?)+)/gm,m=>'<ul>'+m.trim().split(/\n/).map(l=>'<li>'+l.replace(/^[ \t]*[-*] /,'')+'</li>').join('')+'</ul>');
  h=h.replace(/((?:^[ \t]*\d+\. .+\n?)+)/gm,m=>'<ol>'+m.trim().split(/\n/).map(l=>'<li>'+l.replace(/^[ \t]*\d+\. /,'')+'</li>').join('')+'</ol>');
  h=h.split(/\n{2,}/).map(p=>/^<(h\d|hr|ul|ol|pre|table|blockquote|\x00)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return h.replace(/\x00B(\d+)\x00/g,(m,i)=>blocks[+i]);
}

function toast(t){
  let box=document.getElementById('toasts');
  if(!box){box=document.createElement('div');box.id='toasts';document.body.appendChild(box)}
  const d=document.createElement('div');d.className='toast';d.textContent=t;
  box.prepend(d);
  while(box.children.length>5)box.lastChild.remove();   // never stack unbounded
  if(typeof Motion!=='undefined')Motion.run(d,[{transform:'translateX(40px)',opacity:0},{transform:'none',opacity:1}],{duration:220,easing:'cubic-bezier(.22,1,.36,1)'});
  setTimeout(()=>{
    if(!d.isConnected)return;
    const done=()=>d.remove();
    if(typeof Motion!=='undefined')Motion.run(d,[{transform:'none',opacity:1},{transform:'translateX(40px)',opacity:0}],{duration:180,easing:'cubic-bezier(.4,0,.7,.2)'}).finished.then(done);
    else done();
  },3500);
}
const fmtBytes=b=>b>=1e12?(b/1e12).toFixed(2)+' TB':b>=1e9?(b/1e9).toFixed(1)+' GB':(b/1e6).toFixed(0)+' MB';

/* ================= device classes =================
   One desktop, three form factors. The CSS in 15-responsive.css does the layout
   work off `body.dev-*`; this file owns the classification and the handful of
   behaviours CSS cannot express (windows become sheets on a phone, the dock
   rebuilds at a new size, panels close when the shape changes under them).

   Breakpoints are on the *viewport*, not on the user agent: a narrow browser
   window on a laptop gets the phone layout, which is exactly what you want when
   AgentOS is docked beside an editor. Touch is tracked separately, because a
   tablet and a touchscreen laptop want the same hit targets at different widths. */
const DEV_BP={mobile:720, tablet:1180};   // < mobile → phone, < tablet → tablet, else desktop
let DEVICE='desktop', DEVICE_TOUCH=false;
function deviceClassFor(w){return w<DEV_BP.mobile?'mobile':w<DEV_BP.tablet?'tablet':'desktop'}
function isMobile(){return DEVICE==='mobile'}
function isTablet(){return DEVICE==='tablet'}
function isHandheld(){return DEVICE!=='desktop'}
function isTouch(){return DEVICE_TOUCH}

function applyDevice(){
  const b=document.body, prev=DEVICE;
  DEVICE=deviceClassFor(innerWidth);
  DEVICE_TOUCH=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
  b.classList.toggle('dev-mobile',DEVICE==='mobile');
  b.classList.toggle('dev-tablet',DEVICE==='tablet');
  b.classList.toggle('dev-desktop',DEVICE==='desktop');
  b.classList.toggle('dev-handheld',DEVICE!=='desktop');
  b.classList.toggle('dev-touch',DEVICE_TOUCH);
  b.classList.toggle('dev-portrait',innerHeight>=innerWidth);
  document.documentElement.dataset.device=DEVICE;
  return DEVICE!==prev;
}
applyDevice();

/* A phone has no room for overlapping windows: every window is a full-bleed
   sheet, and the WM's maximize state is what already means "fill the screen",
   so reuse it rather than inventing a second mode. `wasMax` remembers the
   window's own choice so going back to a desktop width restores it. */
function fitWindowsToDevice(){
  if(typeof WM==='undefined')return;
  WM.wins.forEach(w=>{
    if(isMobile()){
      if(!w.max){w.wasMax=false;if(typeof toggleMax==='function')toggleMax(w)}
    }else if(w.wasMax===false&&w.max){
      w.wasMax=undefined;if(typeof toggleMax==='function')toggleMax(w);
    }
  });
}
/* Popovers are anchored to chrome that just moved — close them rather than
   leave them pointing at nothing. */
function closeTransientSurfaces(){
  ['#powermenu','#notifpanel','#startmenu','#ctxmenu','#ccpop'].forEach(s=>{
    const el=document.querySelector(s);if(el)el.classList.remove('show');
  });
  document.body.classList.remove('sheet-open');
}
let _devT=null;
addEventListener('resize',()=>{
  clearTimeout(_devT);
  _devT=setTimeout(()=>{
    if(!applyDevice())return;                 // same class → CSS already handled it
    closeTransientSurfaces();
    fitWindowsToDevice();
    if(typeof buildDock==='function')buildDock();
    if(typeof buildDeck==='function')buildDeck();
    if(typeof buildDesktop==='function')buildDesktop();
  },140);
});
addEventListener('orientationchange',()=>setTimeout(()=>{applyDevice();fitWindowsToDevice()},220));

/* iOS/Android address bars change the visual viewport without firing resize on
   `window`; --vh keeps full-height surfaces honest when they do. */
function trackViewportHeight(){
  const vv=window.visualViewport;
  const set=()=>document.documentElement.style.setProperty('--vh',((vv?vv.height:innerHeight)/100)+'px');
  set();
  if(vv){vv.addEventListener('resize',set);vv.addEventListener('scroll',set)}
  else addEventListener('resize',set);
}
trackViewportHeight();

function appIcon(id,px,cls){
  px=px||46;
  const st=`width:${px}px;height:${px}px`;
  const ic=ICONS[id];
  if(ic)return `<span class="aicon${cls?' '+cls:''}" style="${st};background:linear-gradient(180deg,${ic[0]},${ic[1]})">`+
    `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ic[2]}</svg></span>`;
  const a=(APPS_READY&&APPS[id])||null;   // APPS is a const in TDZ until defined — gate on APPS_READY first
  const emoji=((a&&a.icon)||'').trim();
  if(emoji)return `<span class="aicon${cls?' '+cls:''}" style="${st};background:${tileBg(id)}">`+
    `<span class="em" style="font-size:${Math.round(px*.5)}px">${emoji}</span></span>`;
  const ch=((a&&a.title)||id).replace(/^ua_/,'').trim().charAt(0).toUpperCase()||'?';
  return `<span class="aicon${cls?' '+cls:''}" style="${st};background:${tileBg(id)}">`+
    `<span class="em" style="font-size:${Math.round(px*.44)}px;font-weight:800;color:#fff">${ch}</span></span>`;
}
function emojiIcon(emoji,px,cls){
  return `<span class="aicon${cls?' '+cls:''}" style="width:${px}px;height:${px}px;background:linear-gradient(180deg,#3f4653,#242a34)">`+
    `<span class="em" style="font-size:${Math.round(px*.5)}px">${emoji||'▭'}</span></span>`;
}

const CUSTOM_THEMES={};   // name -> theme object, loaded from the server
function allThemes(){const m={};for(const k in THEMES)m[k]={...THEMES[k],id:k};for(const n in CUSTOM_THEMES)m[n]={...CUSTOM_THEMES[n],id:n};return m}
let CURRENT_THEME=localStorage.getItem('theme')||'agentos';
function applyThemeObj(t){
  // crossfade the whole desktop through the theme change instead of hard-cutting
  if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&document.body.dataset.themed){
    const apply=()=>_applyThemeObj(t);
    try{document.startViewTransition(apply);return}catch(e){}
  }
  document.body.dataset.themed='1';
  _applyThemeObj(t);
}
let THEME_VARS=[];   // custom properties the previous theme set, so switching away clears them
function _applyThemeObj(t){
  const r=document.documentElement,v=t.v||t.vars||{};
  // a theme may override any token (radii, elevation, glass recipe — not just hues),
  // so drop the last theme's overrides first or they leak into the next one
  THEME_VARS.forEach(k=>{if(!(k in v))r.style.removeProperty('--'+k)});
  THEME_VARS=Object.keys(v);
  Object.entries(v).forEach(([k,val])=>r.style.setProperty('--'+k,val));
  r.dataset.theme=(t.mode==='light')?'light':'dark';
  let fl=document.getElementById('theme-font');
  if(t.font&&t.font.url){
    if(!fl){fl=document.createElement('link');fl.id='theme-font';fl.rel='stylesheet';document.head.appendChild(fl)}
    fl.href=t.font.url;
    if(t.font.family)r.style.setProperty('--sans',"'"+t.font.family+"',system-ui,sans-serif");
  }else{if(fl)fl.remove();r.style.removeProperty('--sans')}
  let st=document.getElementById('theme-extra');
  if(!st){st=document.createElement('style');st.id='theme-extra';document.head.appendChild(st)}
  st.textContent=t.css||'';
  setExperience(t.shell?'custom':(t.exp||'standard'),t.shell);
}

/* ================= experience shells ================= */
let EXPERIENCE='standard';
function setExperience(exp,shellHtml){
  const cs=$('#custom-shell');
  if(exp==='custom'&&cs){
    // An AI-designed shell fully replaces the desktop. It runs in a same-origin iframe:
    // its scripts get their own global scope (no collisions with the desktop's globals)
    // while keeping full access to the REST API and the /ws websocket.
    try{
      cs.innerHTML='';
      const f=document.createElement('iframe');
      f.style.cssText='flex:1;width:100%;height:100%;border:none;background:var(--bg)';
      cs.appendChild(f);
      f.contentDocument.open();
      f.contentDocument.write(shellHtml||'');
      f.contentDocument.close();
    }catch(e){cs.innerHTML='';toast('shell failed to load: '+e.message);exp='standard'}
  }else if(cs){cs.innerHTML=''}
  if(exp===EXPERIENCE&&exp!=='custom')return;
  EXPERIENCE=exp;
  document.body.classList.toggle('exp-jarvis',exp==='jarvis');
  document.body.classList.toggle('exp-custom',exp==='custom');
  if(exp==='jarvis')buildJarvisShell();
  else{const sh=$('#jarvis-shell');if(sh){clearInterval(sh._t);sh.innerHTML=''}}
}

function applyTheme(name){
  const t=allThemes()[name];if(!t)return;
  const changed=name!==CURRENT_THEME;
  applyThemeObj(t);CURRENT_THEME=name;localStorage.setItem('theme',name);
  // a theme can ship a wallpaper; picking the theme should dress the desktop for
  // it too, unless the user's own wallpaper (a file, or a built-in they chose)
  // already outranks it — loadWallpaper owns that precedence
  if(changed&&typeof loadWallpaper==='function'&&document.body.dataset.themed)loadWallpaper();
}
async function loadThemes(){
  try{const d=await (await fetch('/api/themes')).json();
    for(const k in CUSTOM_THEMES)delete CUSTOM_THEMES[k];
    (d.themes||[]).forEach(t=>{CUSTOM_THEMES[t.name]=t});
  }catch(e){}
  if(allThemes()[CURRENT_THEME])applyTheme(CURRENT_THEME);   // re-apply if it's a custom theme
}

let DESKS=+localStorage.getItem('desks')||2;

function buildPager(){
  const p=$('#pager');if(!p)return;p.innerHTML='';
  for(let i=1;i<=DESKS;i++){
    const b=document.createElement('button');b.className='pgb'+(i===curDesk?' on':'');b.textContent=i;
    const names=[];WM.wins.forEach(w=>{if((w.desk||1)===i&&!w.min)names.push(w.app.title)});
    b.title=`Desktop ${i}`+(names.length?` — ${names.join(', ')}`:' — empty')
      +'\nclick to switch · right-click to send the active window here · drop a window to move it';
    b.classList.toggle('has',names.length>0);
    b.onclick=()=>switchDesk(i);
    b.oncontextmenu=e=>{e.preventDefault();moveActiveToDesk(i)};
    // the pager is a drop target for windows dragged out of the Spaces overview
    b.ondragover=e=>{e.preventDefault();b.classList.add('drop')};
    b.ondragleave=()=>b.classList.remove('drop');
    b.ondrop=e=>{
      e.preventDefault();b.classList.remove('drop');
      const w=WM.wins.get(e.dataTransfer.getData('text/agentos-window'));
      if(!w||w.desk===i)return;
      w.desk=i;applyDeskVisibility();buildPager();
      if(typeof EXPO!=='undefined'&&EXPO.on){exposeSpaces();exposeGrid()}
      toast(`moved "${w.app.title}" to Desktop ${i}`);
    };
    p.appendChild(b);
  }
  if(DESKS<6){const a=document.createElement('button');a.className='pgb add';a.textContent='+';a.title='add a desktop';
    a.onclick=()=>{DESKS++;localStorage.setItem('desks',DESKS);buildPager()};p.appendChild(a)}
}
function deskVisible(w){return (w.desk||1)===curDesk}
function applyDeskVisibility(){
  WM.wins.forEach(w=>{
    const on=deskVisible(w);
    w.el.style.display=(on&&!w.min)?'':'none';
    w.tb.style.display=on?'':'none';
  });
}
function switchDesk(n){
  if(n===curDesk)return;
  const dir=n>curDesk?1:-1;
  // outgoing windows slide away, incoming slide in from the travel direction
  const out=[];WM.wins.forEach(w=>{if(deskVisible(w)&&!w.min)out.push(w)});
  out.forEach(w=>Motion.run(w.el,[{transform:'none',opacity:1},{transform:`translateX(${-46*dir}px)`,opacity:0}],{duration:200,easing:EASE.in}));
  curDesk=n;localStorage.setItem('curDesk',n);
  // In session mode a desktop is a real sway workspace, so external windows move
  // with it instead of following you everywhere. The shell comes along too.
  if(typeof PLATFORM!=='undefined'&&PLATFORM.mode==='de')
    fetch('/api/wm/desktop',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({desktop:n})}).then(()=>{
        if(typeof updateNativeWindows==='function')setTimeout(updateNativeWindows,200)}).catch(()=>{});
  const go=()=>{
    applyDeskVisibility();renderWidgets();buildPager();
    if(typeof deckAuto==='function')deckAuto();
    let top=null;WM.wins.forEach(o=>{if(deskVisible(o)&&!o.min&&(!top||+o.el.style.zIndex>+top.el.style.zIndex))top=o});
    WM.wins.forEach(w=>{if(deskVisible(w)&&!w.min)Motion.run(w.el,[{transform:`translateX(${46*dir}px)`,opacity:0},{transform:'none',opacity:1}],{duration:220,easing:EASE.out})});
    if(top)focusWin(top);
  };
  Motion.reduced||!out.length?go():setTimeout(go,170);
  toast('▪ Desktop '+n);
}
/* Ctrl+← / Ctrl+→ walk the desktops (wrapping), Ctrl+Shift+← / → carry the
   focused window with you — the pair people reach for without being told. */
function switchDeskBy(delta){
  if(DESKS<2)return toast('only one desktop — add another in Spaces (F3)');
  switchDesk(((curDesk-1+delta)%DESKS+DESKS)%DESKS+1);
}
function moveActiveDeskBy(delta){
  if(DESKS<2)return toast('only one desktop — add another in Spaces (F3)');
  const a=(typeof activeWin==='function')&&activeWin();
  if(!a)return toast('no active window to move');
  const n=((curDesk-1+delta)%DESKS+DESKS)%DESKS+1;
  a.desk=n;applyDeskVisibility();buildPager();
  switchDesk(n);
  toast(`"${a.app.title}" → Desktop ${n}`);

function moveActiveToDesk(n){
  let act=null;WM.wins.forEach(w=>{if(w.el.classList.contains('active'))act=w});
  if(!act)return toast('no active window to move');
  act.desk=n;applyDeskVisibility();

/* ================= motion =================
   One motion vocabulary for the whole shell (WAAPI). Everything routes through
   Motion so prefers-reduced-motion is honored in one place. Durations/curves
   mirror the CSS tokens in 00-tokens-base.css. */
const EASE={out:'cubic-bezier(.22,1,.36,1)',in:'cubic-bezier(.4,0,.7,.2)',spring:'cubic-bezier(.34,1.4,.64,1)',inout:'cubic-bezier(.65,0,.35,1)'};
const Motion={
  get reduced(){return matchMedia('(prefers-reduced-motion: reduce)').matches},
  run(el,frames,opts){                       // animate, resolving immediately under reduced motion
    if(this.reduced||!el.animate){return {finished:Promise.resolve(),cancel(){}}}
    const a=el.animate(frames,opts);
    a.finished.catch(()=>{});                // cancelled animations must never surface as unhandled rejections
    return a;
  },
};
/* where on screen an app's icon lives right now (dock tile, window tile, or start button) —
   the anchor that windows zoom out of and minimize into */
function iconRect(appId){
  const el=document.querySelector(`#dock .dockb[data-app="${CSS.escape(appId)}"]`)
    ||[...document.querySelectorAll('#tbwins .tbwin')].find(b=>b.dataset.app===appId)
    ||$('#startbtn');
  return el?el.getBoundingClientRect():null;
}
/* zoom a window between its icon and its on-screen frame. dir: 1 = open (icon→frame), -1 = close */
function zoomWin(el,appId,dir){
  const r=el.getBoundingClientRect(), ir=iconRect(appId);
  const dx=ir?(ir.left+ir.width/2)-(r.left+r.width/2):0;
  const dy=ir?(ir.top+ir.height/2)-(r.top+r.height/2):(innerHeight-r.top);
  const at=`translate(${dx}px,${dy}px) scale(.06)`;
  const frames=dir>0?[{transform:at,opacity:.2},{transform:'none',opacity:1}]
                    :[{transform:'none',opacity:1},{transform:at,opacity:.15}];
  return Motion.run(el,frames,{duration:dir>0?300:230,easing:dir>0?EASE.out:EASE.in}).finished;
}
/* FLIP a window between two layout states: call with a fn that mutates geometry */
function flipWin(el,mutate){
  const a=el.getBoundingClientRect(); mutate(); const b=el.getBoundingClientRect();
  if(Motion.reduced)return Promise.resolve();
  const sx=a.width/b.width, sy=a.height/b.height;
  return Motion.run(el,[
    {transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${sx},${sy})`,transformOrigin:'top left'},
    {transform:'none',transformOrigin:'top left'},
  ],{duration:320,easing:EASE.out}).finished;
}
/* popover entrance: scales out of its anchor edge. origin: 'top'|'bottom'|'point' */
function popIn(el,o){
  o=o||{};
  el.style.transformOrigin=o.origin||'top right';
  Motion.run(el,[{transform:'scale(.9)',opacity:0},{transform:'none',opacity:1}],{duration:170,easing:EASE.out});
}
function popOut(el,done){
  const fin=Motion.run(el,[{transform:'none',opacity:1},{transform:'scale(.94)',opacity:0}],{duration:120,easing:EASE.in}).finished;
  (fin||Promise.resolve()).then(done);
}
/* dock launch feedback: the macOS bounce */
function dockBounce(appId){
  const b=document.querySelector(`#dock .dockb[data-app="${CSS.escape(appId)}"]`);
  if(!b)return;
  Motion.run(b,[
    {transform:'translateY(0)'},{transform:'translateY(-22px)',offset:.3},
    {transform:'translateY(0)',offset:.6},{transform:'translateY(-9px)',offset:.78},
    {transform:'translateY(0)'},
  ],{duration:620,easing:EASE.inout});
}

/* ---- context menu: one animated positioner for every menu in the shell ---- */
function ctxShow(e,m){
  m=m||$('#ctxmenu');
  m.classList.add('show');
  const mw=m.offsetWidth||200, mh=m.offsetHeight||200;
  m.style.left=Math.min(e.clientX,innerWidth-mw-8)+'px';
  m.style.top=Math.max(34,Math.min(e.clientY,innerHeight-mh-8))+'px';
  m.style.transformOrigin=(e.clientY+mh>innerHeight?'bottom':'top')+' '+(e.clientX+mw>innerWidth?'right':'left');
  Motion.run(m,[{transform:'scale(.92)',opacity:0},{transform:'none',opacity:1}],{duration:150,easing:EASE.out});
}
function showCtxItems(e,items){
  const m=$('#ctxmenu');
  m.innerHTML=items.map((it,i)=>it===null?'<hr>':`<button data-i="${i}"${it.danger?' style="color:var(--err)"':''}>${it.label}</button>`).join('');
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{m.classList.remove('show');const it=items[+b.dataset.i];if(it&&it.fn)it.fn()});
  ctxShow(e,m);
