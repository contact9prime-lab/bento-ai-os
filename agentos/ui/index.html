<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentOS</title>
<style>
:root{
  --bg:#0b0d10; --bg2:#111419; --bg3:#171b22; --bg4:#1e242e;
  --line:#232a35; --txt:#e6ebf2; --dim:#8a94a6; --dim2:#5c6577;
  --acc:#5eead4; --acc2:#22d3ee; --warn:#fbbf24; --err:#f87171; --ok:#4ade80;
  --glass:rgba(17,20,25,.82);
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  --mbh:30px;      /* top menu bar */
  --tbh:78px;      /* clearance reserved above the floating dock (toasts, start menu) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--txt);background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ================= app icons (SVG squircle tiles) ================= */
.aicon{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;
  border-radius:24.5%;border:.5px solid rgba(255,255,255,.14);
  box-shadow:0 5px 14px rgba(0,0,0,.42),0 1px 2px rgba(0,0,0,.35),inset 0 .5px 0 rgba(255,255,255,.32);
  background:linear-gradient(180deg,#6b7280,#374151)}
.aicon::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 40%,rgba(0,0,0,.06) 88%)}
.aicon svg{width:56%;height:56%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}
.aicon .em{line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}

/* ================= desktop ================= */
#desktop{position:fixed;inset:var(--mbh) 0 0 0;overflow:hidden;
  background:
    radial-gradient(1100px 700px at 78% 18%,rgba(34,211,238,.13),transparent 60%),
    radial-gradient(900px 650px at 15% 85%,rgba(94,234,212,.10),transparent 60%),
    radial-gradient(700px 500px at 45% 45%,rgba(56,80,120,.14),transparent 65%),
    linear-gradient(160deg,#0a0f16,#0b0d10 55%,#0d1118);
}
#desktop::after{content:'▲';position:absolute;right:4%;bottom:6%;font-size:220px;color:rgba(94,234,212,.035);pointer-events:none;line-height:1}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;pointer-events:none}
#wall.has::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(11,13,16,.30),rgba(11,13,16,.55))}
#jarvis{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity .7s}
#jarvis.on{opacity:1}
#icons{z-index:2}
#widgets{position:absolute;inset:0;z-index:2;pointer-events:none}

/* ===== experience shells (a theme can replace the whole desktop layout) ===== */
#jarvis-shell{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;font-family:var(--sans)}
body.exp-jarvis #jarvis-shell{display:flex}
body.exp-jarvis #icons{display:none}
body.exp-jarvis #taskbar,body.exp-jarvis #menubar{display:none}   /* fully immersive — no chrome */
body.exp-jarvis #desktop{inset:0}                      /* reclaim the menu bar's space */
/* custom AI-designed shells: a theme can carry `shell` HTML that fully replaces the desktop */
#custom-shell{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;overflow:auto}
body.exp-custom #custom-shell{display:flex}
body.exp-custom #icons{display:none}
body.exp-custom #taskbar,body.exp-custom #menubar{display:none}
body.exp-custom #desktop{inset:0}
#shell-exit{position:fixed;top:10px;right:12px;z-index:9400;font-size:11px;color:var(--dim);
  border:1px solid var(--line);border-radius:8px;padding:5px 12px;background:var(--glass);display:none}
body.exp-custom #shell-exit{display:block}
#shell-exit:hover{color:var(--txt);border-color:var(--acc)}
#js-top{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;font-size:11px;letter-spacing:.14em;color:var(--dim2)}
#js-top .brand{font-family:'Orbitron',var(--sans);font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--acc)}
#js-top .tag{font-size:9.5px;border:1px solid var(--line);border-radius:4px;padding:3px 8px;color:var(--dim2);margin-left:10px}
#js-top .stats{display:flex;gap:20px}
#js-top .stats b{color:var(--acc);font-weight:500}
#js-mid{flex:1;display:flex;min-height:0}
#js-side{width:300px;padding:0 0 20px 26px;display:flex;flex-direction:column;gap:14px}
.js-panel{border:1px solid var(--line);border-radius:12px;background:var(--glass);backdrop-filter:blur(10px);padding:14px 16px}
.js-panel .h{font-size:9.5px;letter-spacing:.22em;color:var(--dim2);margin-bottom:10px}
#js-stream{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;font-size:11.5px}
#js-stream .ln{display:flex;gap:9px;line-height:1.5}
#js-stream .ln .t{color:var(--dim2);flex:none}
#js-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
#js-ring{position:absolute;inset:0}
.js-node{position:absolute;width:78px;height:78px;border-radius:16px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:.15s;transform:translate(-50%,-50%)}
.js-node:hover{border-color:var(--acc);box-shadow:0 0 24px rgba(94,234,212,.25);transform:translate(-50%,-50%) scale(1.06)}
.js-node .g{font-size:22px}
.js-node .n{font-size:8.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
#js-orb{width:220px;height:220px;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
#js-orb .core{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--acc),var(--acc2));box-shadow:0 0 60px 10px rgba(94,234,212,.45);transition:.3s}
#js-orb .rg{position:absolute;border-radius:50%;border:1.5px solid rgba(94,234,212,.24)}
#js-orb .rg.a{width:140px;height:140px}#js-orb .rg.b{width:180px;height:180px}#js-orb .rg.c{width:220px;height:220px}
#js-orb .lbl{position:absolute;font-family:'Orbitron',var(--sans);font-size:10px;letter-spacing:.3em;color:var(--acc);pointer-events:none}
body.exp-jarvis.js-listening #js-orb .rg{animation:jpulse 1.6s ease-in-out infinite}
body.exp-jarvis.js-listening #js-orb .core{box-shadow:0 0 70px 14px rgba(94,234,212,.65)}
body.exp-jarvis.js-thinking #js-orb{animation:jspin 2.4s linear infinite}
body.exp-jarvis.js-speaking #js-orb .core{animation:jspeak .5s ease-in-out infinite}
#js-bottom{padding:0 26px 26px;display:flex;justify-content:center}
#js-ask{width:min(680px,86%);display:flex;align-items:center;gap:12px;padding:0 18px;height:54px;border-radius:14px;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);box-shadow:0 0 30px rgba(94,234,212,.06)}
#js-ask input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:var(--sans);font-size:14px}
#js-ask .mic{cursor:pointer;font-size:16px;color:var(--acc)}
#js-exit{position:absolute;top:12px;right:26px;z-index:3;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:5px 12px;background:var(--glass)}
#js-exit:hover{color:var(--txt);border-color:var(--acc)}
/* frameless by default — the app's own look shows through; controls appear on hover */
.widget{position:absolute;display:flex;flex-direction:column;pointer-events:auto;
  background:transparent;border:1px solid transparent;border-radius:16px;overflow:hidden;
  resize:both;min-width:150px;min-height:100px;transition:box-shadow .15s,border-color .15s}
.widget:hover{border-color:rgba(94,234,212,.22);box-shadow:0 10px 34px rgba(0,0,0,.45)}
.widget .wgh{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;gap:6px;
  padding:0 6px 0 10px;cursor:grab;z-index:2;touch-action:none;pointer-events:none;opacity:0;transition:opacity .15s;
  background:linear-gradient(rgba(11,13,16,.75),rgba(11,13,16,0))}
.widget:hover .wgh{opacity:1;pointer-events:auto}
.widget .wgh:active{cursor:grabbing}
.widget .wgh::before{content:'⠿';color:var(--dim2);font-size:12px}
.widget .wgt{flex:1;font-size:10.5px;font-weight:600;color:#cfd6e2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.widget .wgh button{width:22px;height:20px;border-radius:5px;color:#cfd6e2;font-size:11px;display:flex;align-items:center;justify-content:center;background:rgba(30,36,46,.6)}
.widget .wgh button:hover{background:var(--bg4);color:var(--txt)}
.widget .wgh .x:hover{background:var(--err);color:#fff}
.widget iframe{flex:1;border:none;background:transparent;width:100%;border-radius:16px}

/* desktop icons */
#icons{position:absolute;inset:0}
.dicon{position:absolute;width:88px;padding:10px 4px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:grab;border:1px solid transparent;touch-action:none}
.dicon.dragging{cursor:grabbing;opacity:.9;z-index:6}
.dicon.dragging .aicon{transform:scale(1.1);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 .5px 0 rgba(255,255,255,.35)}
.dicon.settle{transition:left .24s cubic-bezier(.2,.8,.25,1),top .24s cubic-bezier(.2,.8,.25,1)}
.dicon .aicon{transition:transform .13s ease,box-shadow .13s ease}
.dicon:hover .aicon{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.35)}
.dicon:active .aicon{transform:translateY(0) scale(.95)}
.dicon .dlbl{font-size:11.5px;font-weight:500;color:#eef1f6;text-align:center;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.9);max-width:84px}
.dicon:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.08)}
.dicon.sel{background:rgba(94,234,212,.12);border-color:rgba(94,234,212,.35)}
#marquee{position:absolute;display:none;z-index:5;pointer-events:none;border-radius:4px;
  border:1px solid rgba(94,234,212,.55);background:rgba(94,234,212,.10)}
.bento{position:absolute;border-radius:18px;pointer-events:none;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.bento .blbl{position:absolute;top:8px;left:15px;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(255,255,255,.5);text-shadow:0 1px 3px rgba(0,0,0,.6)}
:root[data-theme=light] .bento{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.08)}
:root[data-theme=light] .bento .blbl{color:rgba(0,0,0,.45);text-shadow:none}

/* ================= windows (desktop chrome) ================= */
.win{position:absolute;display:flex;flex-direction:column;min-width:360px;min-height:240px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid rgba(255,255,255,.09);border-radius:13px;
  box-shadow:0 24px 68px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  resize:both;overflow:hidden}
.win.active{border-color:rgba(255,255,255,.14);box-shadow:0 32px 90px rgba(0,0,0,.62),0 3px 10px rgba(0,0,0,.35)}
.win.maxed{inset:0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win .ttl{display:grid;grid-template-columns:66px 1fr 66px;align-items:center;height:40px;flex:none;padding:0 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border-bottom:1px solid rgba(0,0,0,.28);cursor:default}
.win.active .ttl{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03))}
.win .tmid{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.win .ticon{display:flex}
.win .ticon .aicon{width:17px;height:17px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.win .tname{font-size:12.5px;font-weight:600;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win.active .tname{color:var(--txt)}
.win .tbtns{display:flex;gap:8px;justify-self:start}
.win .tbtns button{width:13px;height:13px;border-radius:50%;padding:0;position:relative;
  border:.5px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:9px;font-weight:800;line-height:1;transition:.12s}
.win .tbtns .cls{background:#ff5f57}.win .tbtns .mn{background:#febc2e}.win .tbtns .mx{background:#28c840}
.win:not(.active) .tbtns button{background:#5a606c}
.win .tbtns:hover button{color:rgba(0,0,0,.55)}
.win .tbtns .cls{order:0}.win .tbtns .mn{order:1}.win .tbtns .mx{order:2}
.win .wbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pad{padding:16px 18px;overflow-y:auto;user-select:text}

/* ================= top menu bar ================= */
#menubar{position:fixed;left:0;right:0;top:0;height:var(--mbh);display:flex;align-items:center;gap:10px;padding:0 12px;
  background:rgba(13,16,21,.72);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border-bottom:1px solid rgba(255,255,255,.06);z-index:9000;font-size:12.5px;color:var(--txt)}
#mb-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;padding:2px 8px;border-radius:6px;cursor:default}
#mb-brand .mark{width:17px;height:17px;border-radius:5px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center}
#mb-spacer{flex:1}
#pager{display:flex;gap:4px;align-items:center}
.pgb{width:22px;height:20px;border-radius:6px;font-size:10.5px;font-weight:700;color:var(--dim);border:1px solid transparent;display:flex;align-items:center;justify-content:center}
.pgb:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.pgb.on{background:rgba(255,255,255,.14);color:var(--txt)}
.pgb.add{color:var(--dim2);font-size:13px}
#tray{display:flex;align-items:center;gap:11px;padding:0 0 0 10px}
#statdot{width:8px;height:8px;border-radius:50%;background:var(--err);transition:.3s}
#statdot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#spin{display:none;width:12px;height:12px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
#spin.on{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
#tray-ctl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);padding:2px 7px;border-radius:6px}
#tray-ctl:hover{background:rgba(255,255,255,.1)}
#tray-voice{font-size:13px;padding:2px 7px;border-radius:6px;color:var(--txt)}
#tray-voice:hover{background:rgba(255,255,255,.1)}

/* ================= dock (floating, centered) ================= */
#taskbar{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;height:auto;max-width:min(94vw,1100px);
  display:flex;align-items:flex-end;gap:4px;padding:7px 10px;border-radius:22px;
  background:rgba(17,20,26,.58);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
  border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.12);z-index:9000}
#startbtn{display:flex;flex-direction:column;align-items:center;padding:0;position:relative;border-radius:14px;
  transition:transform .14s ease}
#startbtn .mark{width:46px;height:46px;border-radius:24.5%;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;border:.5px solid rgba(255,255,255,.16);
  box-shadow:0 5px 14px rgba(0,0,0,.42),inset 0 .5px 0 rgba(255,255,255,.32)}
#startbtn:hover{transform:translateY(-7px) scale(1.12)}
#startbtn.on .mark{box-shadow:0 0 0 2px rgba(94,234,212,.5),0 5px 14px rgba(0,0,0,.42)}
.dsep{width:1px;align-self:stretch;margin:4px 5px;background:rgba(255,255,255,.14);flex:none}
#dock,#tbwins,#tbnative{display:flex;align-items:flex-end;gap:4px}
#tbwins{overflow:visible}
#tbnative{max-width:30vw;overflow-x:auto}
.dockb,.tbwin,.tbnat{display:flex;flex-direction:column;align-items:center;padding:0;position:relative;border-radius:14px;
  transition:transform .14s ease;font-size:0}
.dockb .aicon,.tbwin .aicon,.tbnat .aicon{width:46px;height:46px}
.dockb:hover,.tbwin:hover,.tbnat:hover,.dicon:focus-visible{transform:translateY(-7px) scale(1.12)}
.dockb:active,.tbwin:active{transform:translateY(-3px) scale(1.02)}
.dockb.running::after,.tbwin::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 5px rgba(255,255,255,.6)}
.tbwin.mini::after{background:rgba(255,255,255,.35);box-shadow:none}
.tbwin.on::after{background:var(--acc);box-shadow:0 0 7px var(--acc)}
.tbwin.indock{display:none!important}
.dockb .aicon,.tbwin .aicon,.tbnat .aicon,#startbtn .mark{pointer-events:none}
/* dock tooltips */
.dockb::before,.tbwin::before,.tbnat::before,#startbtn::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 12px);left:50%;
  transform:translateX(-50%) translateY(3px);padding:4px 10px;border-radius:7px;white-space:nowrap;font-size:11.5px;font-weight:600;
  color:var(--txt);background:rgba(20,24,31,.92);border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 18px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:.12s;z-index:2}
.dockb:hover::before,.tbwin:hover::before,.tbnat:hover::before,#startbtn:hover::before{opacity:1;transform:translateX(-50%) translateY(0)}
.tbnat .aicon{background:linear-gradient(180deg,#3f4653,#242a34)}
.tbnat .aicon .em{font-size:20px;color:#fff;font-weight:700}
.naicon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:11px;border:1px solid transparent}
.naicon:hover{background:var(--bg3);border-color:var(--line)}
.naicon img{width:44px;height:44px;object-fit:contain}
.naicon .nafallback{width:44px;height:44px;border-radius:11px;background:linear-gradient(145deg,var(--bg4),var(--bg2));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--acc);text-transform:uppercase}
.naicon .nalbl{font-size:11px;color:#cfd6e2;text-align:center;line-height:1.2;max-width:88px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ===== light theme overrides ===== */
:root[data-theme=light] #desktop{background:
  radial-gradient(1100px 700px at 78% 18%,rgba(233,84,32,.10),transparent 60%),
  radial-gradient(900px 650px at 15% 85%,rgba(119,33,111,.07),transparent 60%),
  linear-gradient(160deg,#f3f1ef,#eceae8 55%,#e7e4e1)}
:root[data-theme=light] #desktop::after{color:rgba(0,0,0,.05)}
:root[data-theme=light] .body strong{color:#000}
:root[data-theme=light] #wall.has::after{background:linear-gradient(rgba(250,249,248,.12),rgba(250,249,248,.30))}
:root[data-theme=light] .dicon .dlbl,:root[data-theme=light] .naicon .nalbl,:root[data-theme=light] .widget .wgt{text-shadow:none;color:#1d1b19}
:root[data-theme=light] .msg.assistant .body strong{color:#000}
:root[data-theme=light] #send,:root[data-theme=light] .save{color:#fff}
:root[data-theme=light] #menubar{background:rgba(250,249,248,.72);border-bottom-color:rgba(0,0,0,.08);color:#1d1b19}
:root[data-theme=light] #taskbar{background:rgba(250,249,248,.6);border-color:rgba(0,0,0,.1)}
:root[data-theme=light] .pgb:hover,:root[data-theme=light] #tray-ctl:hover,:root[data-theme=light] #tray-voice:hover{background:rgba(0,0,0,.07)}
:root[data-theme=light] .pgb.on{background:rgba(0,0,0,.12);color:#1d1b19}
:root[data-theme=light] .dockb.running::after,:root[data-theme=light] .tbwin::after{background:rgba(0,0,0,.55);box-shadow:none}
:root[data-theme=light] .win .ttl{border-bottom-color:rgba(0,0,0,.12)}
#tbclock{text-align:right;line-height:1;cursor:default;display:flex;gap:8px;align-items:center}
#tbclock .tm{font-size:12.5px;font-weight:600}
#tbclock .dt{font-size:11.5px;color:var(--dim)}

/* ================= start menu (launcher) ================= */
#startmenu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tbh) + 16px);width:min(680px,92vw);z-index:9500;display:none;
  background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);border:1px solid rgba(255,255,255,.12);border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
#startmenu.show{display:block;animation:smpop .14s ease-out}
@keyframes smpop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
#smhead{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
#smhead .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center}
#smhead b{font-size:14px}
#smhead small{display:block;color:var(--dim2);font-size:11px;font-weight:400}
#smapps{padding:6px 12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:2px;max-height:52vh;overflow-y:auto}
.smapp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:13px;text-align:center}
.smapp:hover{background:rgba(255,255,255,.07)}
.smapp .aicon{width:48px;height:48px}
.smapp .n{font-size:11.5px;font-weight:500;color:var(--txt);line-height:1.2;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#smsearch{padding:2px 14px 6px}
#smsearch input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--txt)}
:root[data-theme=light] #smsearch input{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1)}
.smsect{grid-column:1/-1;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2);padding:10px 6px 3px}
.smapp img.na{width:44px;height:44px;object-fit:contain;margin:2px 0}
.smapp .nafallback{width:44px;height:44px;border-radius:11px;background:linear-gradient(145deg,var(--bg4),var(--bg2));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:var(--acc);text-transform:uppercase;margin:2px 0}
#smfoot{border-top:1px solid rgba(255,255,255,.08);padding:9px 18px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim)}
:root[data-theme=light] .smapp:hover{background:rgba(0,0,0,.06)}
:root[data-theme=light] #smfoot{border-top-color:rgba(0,0,0,.08)}

/* ================= context menu ================= */
#ctxmenu{position:fixed;z-index:9600;display:none;min-width:190px;background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.6);padding:5px}
#ctxmenu.show{display:block}
#ctxmenu button{display:flex;gap:9px;width:100%;padding:7px 10px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--txt)}
#ctxmenu button:hover{background:var(--bg4)}
#ctxmenu hr{border:none;border-top:1px solid var(--line);margin:4px 6px}

/* ================= boot splash ================= */
#boot{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s}
#boot.off{opacity:0;pointer-events:none}
#boot .mark{width:74px;height:74px;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#04211c;font-size:36px;font-weight:900;box-shadow:0 0 60px rgba(94,234,212,.3)}
#boot h1{font-size:22px;letter-spacing:.5px}
#boot .bbar{width:180px;height:3px;border-radius:3px;background:var(--bg4);overflow:hidden}
#boot .bbar i{display:block;height:100%;width:35%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:boot 1s ease-in-out infinite}
@keyframes boot{0%{transform:translateX(-120%)}100%{transform:translateX(520%)}}

/* ================= chat app ================= */
.chatwrap{flex:1;display:flex;min-height:0}
.cside{width:210px;min-width:170px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(11,13,16,.4)}
#newchat{margin:10px 10px 8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg3);color:var(--txt);font-weight:600;font-size:12.5px;transition:.15s}
#newchat:hover{border-color:var(--acc);color:var(--acc)}
#convs{flex:1;overflow-y:auto;padding:2px 6px 8px}
.conv{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--dim);font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden}
.conv:hover{background:var(--bg3);color:var(--txt)}
.conv.active{background:var(--bg4);color:var(--txt)}
.conv .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.conv .del{opacity:0;color:var(--dim2);font-size:14px;padding:0 2px}
.conv:hover .del{opacity:1}
.conv .del:hover{color:var(--err)}
.cmain{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
#modelsel{max-width:240px;font-size:12.5px;padding:5px 8px;flex:1}
#autosel{font-size:12.5px;padding:5px 8px}
#chat{flex:1;overflow-y:auto;padding:18px 0 10px;user-select:text}
.inner{max-width:780px;margin:0 auto;padding:0 20px}

/* team / subagent wizard */
.sawrow{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:5px 0;cursor:pointer;transition:.12s;background:var(--bg3)}
.sawrow:hover{border-color:var(--acc)}
.sawrow.on{border-color:var(--acc);background:var(--bg4)}
.sawrow input{width:auto;margin-top:2px;flex:0 0 auto;accent-color:var(--acc)}
.sawrow .n{font-size:13px;font-weight:600;color:var(--txt);letter-spacing:.1px}
.sawrow .d{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}
.sawgrp{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin:12px 2px 4px}
.sawchip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg3);color:var(--dim);font-size:12px;flex:0 0 auto}
.sawchip:hover{border-color:var(--acc);color:var(--txt)}
.sawh{font-size:17px;font-weight:700;margin:0 0 2px}
.sawsub{font-size:12.5px;color:var(--dim);margin:0 0 12px;line-height:1.5}
.teamcard{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.12s;background:var(--bg3)}
.teamcard:hover{border-color:var(--acc)}
.teamcard .tile{flex:0 0 38px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--bg);background:linear-gradient(135deg,var(--acc),var(--acc2))}
.teamcard .n{font-size:14px;font-weight:650;color:var(--txt)}
.teamcard .meta{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
.teamcard .meta b{color:var(--txt);font-weight:600}
.teamcard .persona{font-size:12px;color:var(--dim2);margin-top:3px;font-style:italic}
.badge{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:999px;font-size:10.5px;color:var(--dim2);margin-left:6px;vertical-align:1px}

#welcome{text-align:center;padding-top:7vh}
#welcome h1{font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
#welcome p{color:var(--dim);margin-bottom:26px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:600px;margin:0 auto}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--dim);font-size:12.5px;transition:.15s;text-align:left}
.chip:hover{border-color:var(--acc);color:var(--txt);transform:translateY(-1px)}

.msg{margin-bottom:18px}
.msg.user .bubble{background:var(--bg4);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:10px 14px;margin-left:auto;max-width:80%;width:fit-content;white-space:pre-wrap}
.msg.assistant .body{line-height:1.62}
.msg .who{font-size:10.5px;color:var(--dim2);margin-bottom:5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.msg.user .who{text-align:right}
.body p{margin:0 0 10px}
.body h1,.body h2,.body h3{margin:14px 0 8px;font-size:1.1em}
.body ul,.body ol{margin:0 0 10px 22px}
.body li{margin:3px 0}
.body code{font-family:var(--mono);font-size:.88em;background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.body pre{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.body pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.5}
.body table{border-collapse:collapse;margin:0 0 12px;font-size:12.5px}
.body th,.body td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.body th{background:var(--bg3);font-weight:600}
.body blockquote{margin:0 0 12px;padding:7px 12px;border-left:3px solid var(--acc,#5eead4);background:var(--bg2);border-radius:0 8px 8px 0;color:var(--dim)}
/* ---- Docs app typography ---- */
.docbody{font-size:13.5px;line-height:1.65;color:var(--txt)}
.docbody>*{max-width:780px}
.docbody h1{font-size:22px;margin:4px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.docbody h2{font-size:17px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.docbody h3{font-size:14.5px;margin:20px 0 8px}
.docbody h4{font-size:13.5px;margin:16px 0 6px;color:var(--dim)}
.docbody p{margin:0 0 10px}
.docbody ul,.docbody ol{margin:0 0 12px 22px;padding:0}
.docbody li{margin:3px 0}
.docbody code{font-family:var(--mono);font-size:.87em;background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.docbody pre{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:0 0 14px}
.docbody pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.55;display:block}
.docbody table{border-collapse:collapse;margin:0 0 14px;width:100%;max-width:780px;font-size:12.8px}
.docbody th,.docbody td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.docbody th{background:var(--bg3);font-weight:600}
.docbody tr:nth-child(even) td{background:var(--bg2)}
.docbody blockquote{margin:0 0 12px;padding:8px 14px;border-left:3px solid var(--acc,#5eead4);background:var(--bg2);border-radius:0 8px 8px 0;color:var(--dim)}
.docbody hr{border:none;border-top:1px solid var(--line);margin:20px 0}
.docbody a{color:var(--acc,#5eead4);text-decoration:none}
.docbody a:hover{text-decoration:underline}
.doc-nav{flex:0 0 230px;overflow:auto;border-right:1px solid var(--line);padding:10px}
.doc-nav .item{border-radius:8px;margin-bottom:2px}
.doc-nav .item:hover{background:var(--bg3)}
.body a{color:var(--acc2)}
.body strong{color:#fff}

.tool{border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin:0 0 12px;overflow:hidden;font-size:13px}
.tool .head{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;user-select:none}
.tool .head:hover{background:var(--bg3)}
.tool .tname2{font-family:var(--mono);font-weight:600;color:var(--acc)}
.tool .targ{font-family:var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:12px}
.tool .tstat{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg4);color:var(--dim)}
.tool .tstat.run{color:var(--acc2);animation:pulse 1.2s infinite}
.tool .tstat.ok{color:var(--ok)}
.tool .tstat.fail{color:var(--err)}
.tool .out{display:none;border-top:1px solid var(--line);padding:10px 12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;max-height:280px;overflow-y:auto;color:var(--dim);background:var(--bg)}
.tool.open .out{display:block}
@keyframes pulse{50%{opacity:.4}}
.think{color:var(--dim2);font-size:12.5px;font-style:italic;border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px;max-height:120px;overflow-y:auto;white-space:pre-wrap}
.working{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.working .orb{width:26px;height:26px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 45%,var(--acc),var(--acc2));
  box-shadow:0 0 0 0 rgba(94,234,212,.5);animation:orbpulse 1.3s ease-in-out infinite}
@keyframes orbpulse{0%,100%{transform:scale(.82);box-shadow:0 0 14px 2px rgba(94,234,212,.35)}50%{transform:scale(1);box-shadow:0 0 22px 6px rgba(34,211,238,.5)}}
.working .dots{display:flex;gap:4px}
.working .dots i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:dot 1.1s infinite}
.working .dots i:nth-child(2){animation-delay:.18s}.working .dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.working .wtxt{font-size:12.5px;color:var(--dim)}

.approval{border:1px solid var(--warn);border-radius:12px;background:rgba(251,191,36,.06);padding:13px;margin:0 0 12px}
.approval .atitle{color:var(--warn);font-weight:700;font-size:13px;margin-bottom:6px}
.approval .acmd{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0;white-space:pre-wrap;word-break:break-all}
.approval .areason{color:var(--dim);font-size:12.5px}
.approval .btns{display:flex;gap:8px;margin-top:11px}
.approval .allow{background:var(--warn);color:#1c1503;font-weight:700;padding:7px 18px;border-radius:8px}
.approval .deny{border:1px solid var(--line);color:var(--dim);padding:7px 18px;border-radius:8px}
.approval .deny:hover{color:var(--err);border-color:var(--err)}
.approval.resolved{opacity:.55}
.approval.resolved .btns{display:none}
.errmsg{color:var(--err);background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}

#composer{padding:10px 16px 14px}
#attach{display:flex;gap:8px;padding:0 0 8px;flex-wrap:wrap}
#attach .att{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#attach .att img{width:100%;height:100%;object-fit:cover;display:block}
#attach .att button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.bubble .bimgs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bubble .bimgs img{max-width:220px;max-height:160px;border-radius:8px;display:block}
#combox{max-width:780px;margin:0 auto;position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:14px;transition:.15s}
#combox:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(94,234,212,.08)}
#input{width:100%;background:none;border:none;resize:none;padding:12px 88px 12px 14px;max-height:160px;line-height:1.5}
#mic{position:absolute;right:46px;bottom:8px;width:32px;height:32px;border-radius:9px;color:var(--dim);font-size:14px;display:flex;align-items:center;justify-content:center}
#mic:hover{background:var(--bg4);color:var(--txt)}
#mic.rec{background:var(--err);color:#fff;animation:pulse 1.2s infinite}
#send{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04211c;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s}
#send:disabled{opacity:.35;cursor:default}
#send.stop{background:var(--err);color:#fff;font-size:12px}

/* ================= settings / memory / tasks ================= */
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:600}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pad input,.pad select,.pad textarea{width:100%}
.save{margin-top:18px;width:100%;padding:10px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04211c;font-weight:700}
.provbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.provbox .ptitle{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px}
.provbox .ptitle input[type=checkbox]{width:auto}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.item .grow{flex:1;min-width:0}
.item .sub{color:var(--dim2);font-size:11.5px;margin-top:2px}
.item button{color:var(--dim2);font-size:14px}
.item button:hover{color:var(--err)}
.mut{color:var(--dim2);font-size:12.5px}

/* ================= task manager ================= */
.tmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--bg2)}
.stat .lbl{font-size:10.5px;color:var(--dim2);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.stat .val{font-size:21px;font-weight:800;margin:3px 0 7px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:11px;color:var(--dim2);font-weight:500}
.bar{height:5px;border-radius:4px;background:var(--bg4);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.bar i.hot{background:linear-gradient(90deg,var(--warn),var(--err))}
.tmsec{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim2);margin:14px 0 8px}
table.plist{width:100%;border-collapse:collapse;font-size:12.5px}
table.plist th{text-align:left;color:var(--dim2);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:4px 8px;border-bottom:1px solid var(--line)}
table.plist td{padding:5px 8px;border-bottom:1px solid rgba(35,42,53,.5);font-variant-numeric:tabular-nums}
table.plist td.n{font-family:var(--mono);font-size:12px}
table.plist td.r{text-align:right}
table.plist th.r{text-align:right}
.endbtn{border:1px solid var(--line);border-radius:7px;padding:3px 10px;font-size:11.5px;color:var(--dim)}
.endbtn:hover{border-color:var(--err);color:var(--err)}

/* ================= mcp / telegram / logs / kg ================= */
.badge{font-size:10.5px;padding:2px 9px;border-radius:20px;background:var(--bg4);color:var(--dim);font-weight:600;white-space:nowrap}
.badge.ok{color:var(--ok)}
.badge.err{color:var(--err)}
.badge.run{color:var(--acc2)}
.tools-mini{font-family:var(--mono);font-size:11px;color:var(--dim2);margin-top:3px;word-break:break-word}
details.mtools{margin-top:5px}
details.mtools summary{cursor:pointer;font-size:11.5px;color:var(--acc2);user-select:none;list-style:none}
details.mtools summary::before{content:'▸ ';font-size:10px}
details.mtools[open] summary::before{content:'▾ '}
.mtool{display:flex;gap:8px;padding:4px 0 4px 12px;font-size:11.5px;border-left:2px solid var(--line);margin-top:4px;align-items:baseline}
.mtool code{font-family:var(--mono);font-size:11px;color:var(--txt);flex:none}
.mtool span{color:var(--dim2);line-height:1.4}
.minstr{font-size:11.5px;color:var(--dim);border-left:2px solid var(--acc);padding:4px 0 4px 12px;margin-top:5px;line-height:1.45;white-space:pre-wrap}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px;margin:8px 0 4px}
.catcard{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:var(--bg2);display:flex;flex-direction:column;gap:3px;text-align:left;position:relative}
.catcard:hover{border-color:var(--acc)}
.catcard .cn{font-size:12.5px;font-weight:700}
.catcard .cd{font-size:11px;color:var(--dim2);line-height:1.35}
.catcard .ck{font-size:9.5px;color:var(--warn);margin-top:2px}
.catcard.inst{opacity:.5;pointer-events:none}
.catcard.inst::after{content:'✓ added';position:absolute;top:8px;right:9px;font-size:10px;color:var(--ok)}
table.loglist{width:100%;border-collapse:collapse;font-size:12px}

<script>
'use strict';
const $=s=>document.querySelector(s);
let ws=null, running=false, currentConv=null, cfg=null;

/* ================= voice / Jarvis mode =================
   (previously mis-placed inside the <style> block, which left JARVIS and these
    functions undefined and threw on every turn — now a live part of the app) */
let JARVIS={on:false,phase:'idle',rec:null,cid:null,busy:false};
let jarvisReply='';
function jarvisSetPhase(p,status){
  JARVIS.phase=p;const ov=$('#jarvis-ov');if(!ov)return;
  ov.classList.remove('listening','thinking','speaking');
  if(p!=='idle')ov.classList.add(p);
  document.body.classList.remove('js-listening','js-thinking','js-speaking');
  if(p!=='idle')document.body.classList.add('js-'+p);       // animate the Jarvis-experience orb too
  if(status){const st=$('#j-status');if(st)st.textContent=status;const jv=$('#js-voice');if(jv)jv.textContent=status}
}
function jarvisMode(on){
  const ov=$('#jarvis-ov');if(!ov)return;
  if(on){
    if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window))return toast('speech recognition not available in this browser');
    JARVIS.on=true;ov.classList.add('show');
    $('#j-transcript').textContent='';$('#j-reply').textContent='';
    JARVIS.cid=JARVIS.cid||currentConv;
    jarvisListen();
  }else{
    JARVIS.on=false;ov.classList.remove('show');
    try{JARVIS.rec&&JARVIS.rec.stop()}catch(e){}
    try{speechSynthesis.cancel()}catch(e){}
    jarvisSetPhase('idle');
  }
}
function jarvisListen(){
  if(!JARVIS.on)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{JARVIS.rec&&JARVIS.rec.abort()}catch(e){}
  const rec=new SR();JARVIS.rec=rec;
  rec.lang=(VOICE&&VOICE.lang)||'en-IN';rec.interimResults=true;rec.continuous=false;
  let finalText='';
  jarvisSetPhase('listening','listening…');
  rec.onresult=e=>{
    let interim='';finalText='';
    for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=r[0].transcript;else interim+=r[0].transcript}
    $('#j-transcript').textContent=(finalText||interim).trim();
  };
  rec.onerror=ev=>{if(ev.error==='no-speech'&&JARVIS.on){jarvisListen()}};
  rec.onend=()=>{
    const t=$('#j-transcript').textContent.trim();
    if(!JARVIS.on)return;
    if(t){jarvisAsk(t)}else{jarvisListen()}   // nothing heard → keep listening
  };
  try{rec.start()}catch(e){setTimeout(jarvisListen,400)}
}
function jarvisAsk(text){
  if(!ws||ws.readyState!==1){jarvisSetPhase('idle','not connected');return}
  jarvisSetPhase('thinking',agentName()+' is working…');
  $('#j-reply').textContent='';
  JARVIS.busy=true;jarvisReply='';
  ws.send(JSON.stringify({type:'chat',text,conversation_id:JARVIS.cid,model:($('#modelsel')&&$('#modelsel').value)||undefined}));
  setRunning(true);
}
function jarvisSpeakAndListen(text){
  jarvisSetPhase('speaking',agentName()+' is speaking…');
  const clean=(text||'').replace(/```[\s\S]*?```/g,' code block. ').replace(/[*_#`>|]/g,'').slice(0,900);
  if(!clean.trim()||!window.speechSynthesis){if(JARVIS.on)jarvisListen();return}
  const u=new SpeechSynthesisUtterance(clean);
  u.rate=(VOICE&&VOICE.rate)||1;
  const v=speechSynthesis.getVoices().find(v=>v.name===(VOICE&&VOICE.voice));if(v)u.voice=v;
  u.onend=()=>{if(JARVIS.on)jarvisListen();else jarvisSetPhase('idle')};
  u.onerror=()=>{if(JARVIS.on)jarvisListen()};
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
const RUNNING=new Set();   // conversation_ids with a live turn (several may run at once)
const STREAMS={};          // conversation_id -> {html, text}: buffered stream for chats not on screen
let APPS_READY=false;   // APPS (const) is in the temporal dead zone until its definition — gate on this
let curBody=null, curThink=null, curText='';
let feed=null, chatEl=null, input=null, sendBtn=null;   // bound when the Chat window is open

/* ================= helpers ================= */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function md(src){
  const blocks=[]; src=src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{blocks.push('<pre><code>'+esc(c)+'</code></pre>');return '\x00B'+(blocks.length-1)+'\x00';});
  let h=esc(src);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?<![\w*])\*([^*\n]+)\*(?![\w*])/g,'<em>$1</em>');
  h=h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/\[([^\]]+)\]\(([\w][\w./-]*\.md(?:#[\w-]*)?)\)/g,'<a href="#" class="doclink" data-doc="$2">$1</a>');
  h=h.replace(/^#### (.+)$/gm,'<h4>$1</h4>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/gm,'<hr>');
  h=h.replace(/((?:^&gt;.*\n?)+)/gm,m=>'<blockquote>'+m.replace(/^&gt; ?/gm,'').trim().replace(/\n/g,'<br>')+'</blockquote>');
  h=h.replace(/((?:^\|.*\|[ \t]*\n?)+)/gm,m=>{
    const rows=m.trim().split(/\n/).map(r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim()));
    if(rows.length<2||!/^[:\s-]+$/.test(rows[1].join('')))return m;   // not a table
    const cells=(r,tag)=>'<tr>'+r.map(c=>`<${tag}>${c}</${tag}>`).join('')+'</tr>';
    return '<table><thead>'+cells(rows[0],'th')+'</thead><tbody>'+rows.slice(2).map(r=>cells(r,'td')).join('')+'</tbody></table>';
  });
  h=h.replace(/((?:^[ \t]*[-*] .+\n?)+)/gm,m=>'<ul>'+m.trim().split(/\n/).map(l=>'<li>'+l.replace(/^[ \t]*[-*] /,'')+'</li>').join('')+'</ul>');
  h=h.replace(/((?:^[ \t]*\d+\. .+\n?)+)/gm,m=>'<ol>'+m.trim().split(/\n/).map(l=>'<li>'+l.replace(/^[ \t]*\d+\. /,'')+'</li>').join('')+'</ol>');
  h=h.split(/\n{2,}/).map(p=>/^<(h\d|hr|ul|ol|pre|table|blockquote|\x00)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return h.replace(/\x00B(\d+)\x00/g,(m,i)=>blocks[+i]);
}
function scrollDown(){if(chatEl)chatEl.scrollTop=chatEl.scrollHeight}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
const fmtBytes=b=>b>=1e12?(b/1e12).toFixed(2)+' TB':b>=1e9?(b/1e9).toFixed(1)+' GB':(b/1e6).toFixed(0)+' MB';

function appIcon(id,px,cls){
  px=px||46;
  const st=`width:${px}px;height:${px}px`;
  const ic=ICONS[id];
  if(ic)return `<span class="aicon${cls?' '+cls:''}" style="${st};background:linear-gradient(180deg,${ic[0]},${ic[1]})">`+
    `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ic[2]}</svg></span>`;
  const a=(APPS_READY&&APPS[id])||null;   // APPS is a const in TDZ until defined — gate on APPS_READY first
  const emoji=((a&&a.icon)||'').trim();
  if(emoji)return `<span class="aicon${cls?' '+cls:''}" style="${st};background:${tileBg(id)}">`+
    `<span class="em" style="font-size:${Math.round(px*.5)}px">${emoji}</span></span>`;
  const ch=((a&&a.title)||id).replace(/^ua_/,'').trim().charAt(0).toUpperCase()||'?';
  return `<span class="aicon${cls?' '+cls:''}" style="${st};background:${tileBg(id)}">`+
    `<span class="em" style="font-size:${Math.round(px*.44)}px;font-weight:800;color:#fff">${ch}</span></span>`;
}
function emojiIcon(emoji,px,cls){
  return `<span class="aicon${cls?' '+cls:''}" style="width:${px}px;height:${px}px;background:linear-gradient(180deg,#3f4653,#242a34)">`+
    `<span class="em" style="font-size:${Math.round(px*.5)}px">${emoji||'▭'}</span></span>`;
}

const CUSTOM_THEMES={};   // name -> theme object, loaded from the server
function allThemes(){const m={};for(const k in THEMES)m[k]={...THEMES[k],id:k};for(const n in CUSTOM_THEMES)m[n]={...CUSTOM_THEMES[n],id:n};return m}
let CURRENT_THEME=localStorage.getItem('theme')||'agentos';
function applyThemeObj(t){
  const r=document.documentElement,v=t.v||t.vars||{};
  Object.entries(v).forEach(([k,val])=>r.style.setProperty('--'+k,val));
  r.dataset.theme=(t.mode==='light')?'light':'dark';
  let fl=document.getElementById('theme-font');
  if(t.font&&t.font.url){
    if(!fl){fl=document.createElement('link');fl.id='theme-font';fl.rel='stylesheet';document.head.appendChild(fl)}
    fl.href=t.font.url;
    if(t.font.family)r.style.setProperty('--sans',"'"+t.font.family+"',system-ui,sans-serif");
  }else{if(fl)fl.remove();r.style.removeProperty('--sans')}
  let st=document.getElementById('theme-extra');
  if(!st){st=document.createElement('style');st.id='theme-extra';document.head.appendChild(st)}
  st.textContent=t.css||'';
  setExperience(t.shell?'custom':(t.exp||'standard'),t.shell);
}

/* ================= experience shells ================= */
let EXPERIENCE='standard';
function setExperience(exp,shellHtml){
  const cs=$('#custom-shell');
  if(exp==='custom'&&cs){
    // An AI-designed shell fully replaces the desktop. It runs in a same-origin iframe:
    // its scripts get their own global scope (no collisions with the desktop's globals)
    // while keeping full access to the REST API and the /ws websocket.
    try{
      cs.innerHTML='';
      const f=document.createElement('iframe');
      f.style.cssText='flex:1;width:100%;height:100%;border:none;background:var(--bg)';
      cs.appendChild(f);
      f.contentDocument.open();
      f.contentDocument.write(shellHtml||'');
      f.contentDocument.close();
    }catch(e){cs.innerHTML='';toast('shell failed to load: '+e.message);exp='standard'}
  }else if(cs){cs.innerHTML=''}
  if(exp===EXPERIENCE&&exp!=='custom')return;
  EXPERIENCE=exp;
  document.body.classList.toggle('exp-jarvis',exp==='jarvis');
  document.body.classList.toggle('exp-custom',exp==='custom');
  if(exp==='jarvis')buildJarvisShell();
  else{const sh=$('#jarvis-shell');if(sh){clearInterval(sh._t);sh.innerHTML=''}}
}
const JS_RING=['chat','models','scheduler','kg','memory','files','logs','terminal'];
function buildJarvisShell(){
  const sh=$('#jarvis-shell');if(!sh||!APPS_READY)return;   // APPS loads later; init re-builds
  sh.innerHTML=`
    <button id="js-exit" onclick="applyTheme('agentos')">⊞ Standard desktop</button>
    <div id="js-top">
      <div style="display:flex;align-items:center"><span class="brand">AGENTOS</span><span class="tag">VOICE CORE</span></div>
      <div class="stats"><span>MCP <b id="js-mcp">–</b></span><span>MODEL <b id="js-model">–</b></span><span id="js-clock">–</span></div>
    </div>
    <div id="js-mid">
      <div id="js-side">
        <div class="js-panel"><div class="h">VOICE LINK</div><div id="js-voice" style="font-size:13px;color:var(--acc)">tap the orb to speak</div></div>
        <div class="js-panel" style="flex:1;display:flex;flex-direction:column;min-height:0"><div class="h">ACTIVITY STREAM</div><div id="js-stream"></div></div>
      </div>
      <div id="js-stage">
        <div id="js-ring"></div>
        <div id="js-orb"><span class="rg a"></span><span class="rg b"></span><span class="rg c"></span><span class="core"></span><span class="lbl">TAP TO SPEAK</span></div>
      </div>
    </div>
    <div id="js-bottom"><div id="js-ask">
      <span style="color:var(--acc);font-size:15px">⌕</span>
      <input id="js-input" placeholder="Ask ${esc(agentName())} or search apps… (Enter)">
      <span class="mic" onclick="jarvisMode(true)">${svgMic(16)}</span>
    </div></div>`;
  // ring of app nodes
  const ring=$('#js-ring');
  JS_RING.forEach((id,i)=>{
    const a=APPS[id];if(!a)return;
    const ang=(i/JS_RING.length)*2*Math.PI - Math.PI/2;
    const rx=50+Math.cos(ang)*34, ry=50+Math.sin(ang)*40;   // % of stage
    const n=document.createElement('div');n.className='js-node';
    n.style.left=rx+'%';n.style.top=ry+'%';
    n.innerHTML=`${appIcon(id,36)}<span class="n">${esc(a.title)}</span>`;
    n.onclick=()=>openApp(id);
    ring.appendChild(n);
  });
  $('#js-orb').onclick=()=>jarvisMode(true);
  const inp=$('#js-input');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=inp.value.trim();if(!q)return;
    const app=Object.keys(APPS).find(k=>APPS[k].title.toLowerCase()===q.toLowerCase());
    if(app){openApp(app)}else{openApp('chat');if(input){input.value=q;input.dispatchEvent(new Event('input'));send()}}
    inp.value='';}});
  jarvisShellRefresh();
  clearInterval(sh._t);sh._t=setInterval(jarvisShellRefresh,4000);
}
async function jarvisShellRefresh(){
  if(EXPERIENCE!=='jarvis')return;
  const cl=$('#js-clock');if(cl)cl.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const mo=$('#js-model');if(mo&&$('#modelsel'))mo.textContent=(($('#modelsel').value||'').split('/').pop()||'–').slice(0,14);
  try{const m=await (await fetch('/api/mcp')).json();const c=$('#js-mcp');if(c)c.textContent=(m.servers||[]).filter(s=>s.status==='connected').length}catch(e){}
  try{const d=await (await fetch('/api/logs?limit=8')).json();const s=$('#js-stream');
    if(s)s.innerHTML=(d.logs||[]).slice(0,8).map(l=>`<div class="ln"><span class="t">${new Date(l.created_at*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><span>${esc((l.kind+' · '+l.message).slice(0,60))}</span></div>`).join('');
  }catch(e){}
}

/* ================= virtual desktops ================= */
let DESKS=+localStorage.getItem('desks')||2;
let curDesk=+localStorage.getItem('curDesk')||1;
function buildPager(){
  const p=$('#pager');if(!p)return;p.innerHTML='';
  for(let i=1;i<=DESKS;i++){
    const b=document.createElement('button');b.className='pgb'+(i===curDesk?' on':'');b.textContent=i;
    b.onclick=()=>switchDesk(i);
    b.oncontextmenu=e=>{e.preventDefault();moveActiveToDesk(i)};
    p.appendChild(b);
  }
  if(DESKS<6){const a=document.createElement('button');a.className='pgb add';a.textContent='+';a.title='add a desktop';
    a.onclick=()=>{DESKS++;localStorage.setItem('desks',DESKS);buildPager()};p.appendChild(a)}
}
function deskVisible(w){return (w.desk||1)===curDesk}
function applyDeskVisibility(){
  WM.wins.forEach(w=>{
    const on=deskVisible(w);
    w.el.style.display=(on&&!w.min)?'':'none';
    w.tb.style.display=on?'':'none';
  });
}
function switchDesk(n){
  if(n===curDesk)return;
  curDesk=n;localStorage.setItem('curDesk',n);
  applyDeskVisibility();renderWidgets();buildPager();
  // focus topmost window on this desk
  let top=null;WM.wins.forEach(o=>{if(deskVisible(o)&&!o.min&&(!top||+o.el.style.zIndex>+top.el.style.zIndex))top=o});
  if(top)focusWin(top);
  toast('▪ Desktop '+n);
}
function moveActiveToDesk(n){
  let act=null;WM.wins.forEach(w=>{if(w.el.classList.contains('active'))act=w});
  if(!act)return toast('no active window to move');
  act.desk=n;applyDeskVisibility();

}

/* ================= window manager ================= */
const WM={wins:new Map(), z:100, cascade:0};

function openApp(id){
  const w=WM.wins.get(id);
  if(w){ if(w.desk!==curDesk){w.desk=curDesk;applyDeskVisibility()} if(w.min)restoreWin(w); focusWin(w); return w; }
  return createWin(APPS[id]);
}
function createWin(app){
  const desk=$('#desktop'), dw=desk.clientWidth, dh=desk.clientHeight;
  const el=document.createElement('div'); el.className='win';
  const width=Math.min(app.w,dw-30), height=Math.min(app.h,dh-30);
  const off=(WM.cascade++%6)*26;
  el.style.width=width+'px'; el.style.height=height+'px';
  el.style.left=Math.max(8,Math.min((dw-width)/2+off,dw-width-8))+'px';
  el.style.top=Math.max(8,Math.min((dh-height)/2-40+off,dh-height-8))+'px';
  el.innerHTML=`<div class="ttl">
    <div class="tbtns"><button class="cls" title="close">✕</button><button class="mn" title="minimize">–</button><button class="mx" title="maximize">＋</button></div>
    <div class="tmid"><span class="ticon">${appIcon(app.id,17)}</span><span class="tname">${esc(app.title)}</span></div>
    <span></span></div>
    <div class="wbody"></div>`;
  desk.appendChild(el);

  const tb=document.createElement('button'); tb.className='tbwin';
  if(DOCK.includes(app.id))tb.classList.add('indock');   // pinned apps surface in the dock itself
  tb.dataset.tip=app.title;
  tb.innerHTML=appIcon(app.id,46);
  $('#tbwins').appendChild(tb);

  const w={id:app.id,app,el,tb,min:false,max:false,prev:null,desk:curDesk};
  WM.wins.set(app.id,w);

  tb.onclick=()=>{ if(w.min){restoreWin(w);focusWin(w)} else if(el.classList.contains('active')) minimizeWin(w); else focusWin(w); };
  el.addEventListener('pointerdown',()=>focusWin(w));
  el.querySelector('.mn').onclick=e=>{e.stopPropagation();minimizeWin(w)};
  el.querySelector('.mx').onclick=e=>{e.stopPropagation();toggleMax(w)};
  el.querySelector('.cls').onclick=e=>{e.stopPropagation();closeWin(w)};
  const ttl=el.querySelector('.ttl');
  ttl.ondblclick=e=>{if(!e.target.closest('button'))toggleMax(w)};
  dragify(w,ttl);

  app.render(el.querySelector('.wbody'),w);
  focusWin(w);
  return w;
}
function focusWin(w){
  if(w.min)return;
  w.el.style.zIndex=++WM.z;
  WM.wins.forEach(o=>{o.el.classList.toggle('active',o===w);o.tb.classList.toggle('on',o===w&&!o.min)});
  if(typeof buildDock==='function')buildDock();
}
function minimizeWin(w){w.min=true;w.el.style.display='none';w.tb.classList.add('mini');w.tb.classList.remove('on');
  // hand focus to the topmost remaining window
  let top=null;WM.wins.forEach(o=>{if(!o.min&&(!top||+o.el.style.zIndex>+top.el.style.zIndex))top=o});
  if(top)focusWin(top);else if(typeof buildDock==='function')buildDock();}
function restoreWin(w){w.min=false;w.el.style.display='';w.tb.classList.remove('mini');if(typeof buildDock==='function')buildDock()}
function toggleMax(w){
  if(w.max){w.el.classList.remove('maxed');w.max=false;
    if(w.prev){w.el.style.left=w.prev.l;w.el.style.top=w.prev.t;w.el.style.width=w.prev.w;w.el.style.height=w.prev.h}}
  else{w.prev={l:w.el.style.left,t:w.el.style.top,w:w.el.style.width,h:w.el.style.height};
    w.el.classList.add('maxed');w.max=true}
  focusWin(w);
}
function closeWin(w){
  if(w.app.onClose&&w.app.onClose(w)===false)return;
  w.el.remove();w.tb.remove();WM.wins.delete(w.id);
  let top=null;WM.wins.forEach(o=>{if(!o.min&&(!top||+o.el.style.zIndex>+top.el.style.zIndex))top=o});
  if(top)focusWin(top);
  if(typeof buildDock==='function')buildDock();
}
function dragify(w,handle){
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    if(w.max)return;
    const el=w.el, sx=e.clientX, sy=e.clientY, ol=el.offsetLeft, ot=el.offsetTop;
    const desk=$('#desktop');
    handle.setPointerCapture(e.pointerId);
    const move=ev=>{
      let l=ol+ev.clientX-sx, t=ot+ev.clientY-sy;
      l=Math.max(-el.offsetWidth+90,Math.min(l,desk.clientWidth-90));
      t=Math.max(0,Math.min(t,desk.clientHeight-40));
      el.style.left=l+'px';el.style.top=t+'px';
    };
    const up=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up)};
    handle.addEventListener('pointermove',move);
    handle.addEventListener('pointerup',up);
  });
}

/* ===== icon layout engine: grid snap, multi-select, marquee, arrangements ===== */
const GRID={ox:14,oy:14,cx:96,cy:104};
const SEL=new Set();          // selected icon ids
function iconEls(){return [...document.querySelectorAll('#icons .dicon')]}
function iconEl(id){return document.querySelector(`.dicon[data-id="${CSS.escape(id)}"]`)}
function setSel(id,on){const el=iconEl(id);if(!el)return;
  if(on){SEL.add(id);el.classList.add('sel')}else{SEL.delete(id);el.classList.remove('sel')}}
function clearSel(){SEL.clear();document.querySelectorAll('.dicon.sel').forEach(x=>x.classList.remove('sel'))}
function snapXY(x,y){
  const desk=$('#desktop');
  let gx=GRID.ox+Math.round((x-GRID.ox)/GRID.cx)*GRID.cx;
  let gy=GRID.oy+Math.round((y-GRID.oy)/GRID.cy)*GRID.cy;
  gx=Math.max(GRID.ox,Math.min(gx,desk.clientWidth-92));
  gy=Math.max(GRID.oy,Math.min(gy,desk.clientHeight-100));
  return {x:gx,y:gy};
}
function occupiedMap(excludeIds){
  const m=new Set();
  launcherIds().forEach(id=>{if(excludeIds.has(id))return;const p=ICONPOS[id];if(p)m.add(p.x+','+p.y)});
  return m;
}
function freeCellNear(x,y,occ){
  // nearest free snapped cell, scanning outward ring by ring
  for(let r=0;r<14;r++){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const c=snapXY(x+dx*GRID.cx,y+dy*GRID.cy);
      const k=c.x+','+c.y;
      if(!occ.has(k)){occ.add(k);return c}
    }
  }
  return snapXY(x,y);
}
function settle(el){el.classList.add('settle');setTimeout(()=>el.classList.remove('settle'),280)}
function applyIconPositions(animate){
  iconEls().forEach(el=>{
    const p=ICONPOS[el.dataset.id];if(!p)return;
    if(animate)settle(el);
    el.style.left=p.x+'px';el.style.top=p.y+'px';
  });
  renderBento();
}
function iconDrag(d,id){
  d.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    e.stopPropagation();                     // an icon press never starts a marquee
    const desk=$('#desktop');
    d._moved=false;
    // dragging an unselected icon (no modifier) makes it the sole selection;
    // dragging a selected icon moves the whole selection together
    if(!SEL.has(id)&&!(e.ctrlKey||e.metaKey)){clearSel();setSel(id,true)}
    if(!SEL.has(id)&&(e.ctrlKey||e.metaKey)){setSel(id,true);d._addedOnDown=true}else d._addedOnDown=false;
    const members=[...SEL].map(mid=>({mid,el:iconEl(mid)})).filter(m=>m.el);
    const sx=e.clientX,sy=e.clientY;
    members.forEach(m=>{m.ox=m.el.offsetLeft;m.oy=m.el.offsetTop});
    d.setPointerCapture(e.pointerId);
    const move=ev=>{
      if(!d._moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<5)return;
      d._moved=true;
      members.forEach(m=>{
        m.el.classList.add('dragging');
        const x=Math.max(0,Math.min(m.ox+ev.clientX-sx,desk.clientWidth-92));
        const y=Math.max(0,Math.min(m.oy+ev.clientY-sy,desk.clientHeight-100));
        m.el.style.left=x+'px';m.el.style.top=y+'px';
      });
    };
    const up=()=>{
      d.removeEventListener('pointermove',move);d.removeEventListener('pointerup',up);
      if(!d._moved)return;
      const movedIds=new Set(members.map(m=>m.mid));
      const occ=occupiedMap(movedIds);
      members.forEach(m=>{                    // snap each to the nearest free cell, animated
        m.el.classList.remove('dragging');
        const c=freeCellNear(m.el.offsetLeft,m.el.offsetTop,occ);
        settle(m.el);
        m.el.style.left=c.x+'px';m.el.style.top=c.y+'px';
        ICONPOS[m.mid]={x:c.x,y:c.y};
      });
      saveIconPos();
    };
    d.addEventListener('pointermove',move);d.addEventListener('pointerup',up);
  });
  d.onclick=e=>{
    e.stopPropagation();
    if(d._moved)return;                      // a drag is not a click
    if(e.ctrlKey||e.metaKey){if(!d._addedOnDown)setSel(id,!SEL.has(id))}
    else{clearSel();setSel(id,true)}
  };
  d.ondblclick=()=>openApp(id);
}
/* rubber-band selection on empty desktop space */
function ensureMarquee(){
  const icons=$('#icons');
  if(!document.getElementById('marquee')){
    const mq=document.createElement('div');mq.id='marquee';icons.appendChild(mq);
  }
  if(icons._mqWired)return;
  icons._mqWired=true;
  icons.addEventListener('pointerdown',e=>{
    if(e.target!==icons||e.button!==0)return;
    const r=icons.getBoundingClientRect();
    const sx=e.clientX-r.left,sy=e.clientY-r.top;
    let active=false;
    icons.setPointerCapture(e.pointerId);
    const move=ev=>{
      const x=ev.clientX-r.left,y=ev.clientY-r.top;
      if(!active&&Math.hypot(x-sx,y-sy)<4)return;
      active=true;
      const L=Math.min(sx,x),T=Math.min(sy,y),W=Math.abs(x-sx),H=Math.abs(y-sy);
      const mq=$('#marquee');if(!mq)return;
      mq.style.display='block';
      mq.style.left=L+'px';mq.style.top=T+'px';mq.style.width=W+'px';mq.style.height=H+'px';
      iconEls().forEach(el=>{
        const hit=el.offsetLeft<L+W&&el.offsetLeft+el.offsetWidth>L&&el.offsetTop<T+H&&el.offsetTop+el.offsetHeight>T;
        el.classList.toggle('sel',hit);
        if(hit)SEL.add(el.dataset.id);else SEL.delete(el.dataset.id);
      });
    };
    const up=()=>{
      icons.removeEventListener('pointermove',move);icons.removeEventListener('pointerup',up);
      const mq=$('#marquee');if(mq)mq.style.display='none';
      if(!active)clearSel();                 // a plain click on empty space clears the selection
    };
    icons.addEventListener('pointermove',move);icons.addEventListener('pointerup',up);
  });
}

function arrangeBento(){
  const desk=$('#desktop'),PADX=16,PADT=32,PADB=12,GAP=18;
  const groups=BENTO_GROUPS.map(([label,ids])=>[label,ids.filter(id=>APPS[id])]).filter(g=>g[1].length);
  const ua=launcherIds().filter(id=>id.startsWith('ua_')&&APPS[id]);
  if(ua.length)groups.push(['Your apps',ua]);
  const known=new Set(groups.flatMap(g=>g[1]));
  const rest=launcherIds().filter(id=>APPS[id]&&!known.has(id));
  if(rest.length)groups.push(['More',rest]);
  const boxes=[];

async function loadWidgets(){

function widgetLayout(appId){return WIDGETS.find(w=>w.app_id===appId)}
function widgetDrag(el,handle,appId){
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    e.preventDefault();
    const desk=$('#desktop'),sx=e.clientX,sy=e.clientY,ol=el.offsetLeft,ot=el.offsetTop;
    el._dragging=true;el.style.zIndex=50;
    el.querySelector('iframe').style.pointerEvents='none';   // let the drag win over the page
    handle.setPointerCapture(e.pointerId);
    const move=ev=>{
      let l=Math.max(0,Math.min(ol+ev.clientX-sx,desk.clientWidth-60));
      let t=Math.max(0,Math.min(ot+ev.clientY-sy,desk.clientHeight-40));
      l=Math.round(l/8)*8;t=Math.round(t/8)*8;
      el.style.left=l+'px';el.style.top=t+'px';
    };
    const up=()=>{
      handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);
      el._dragging=false;el.style.zIndex='';el.querySelector('iframe').style.pointerEvents='';
      const wd=widgetLayout(appId);if(wd){wd.x=el.offsetLeft;wd.y=el.offsetTop;queueWidgetSave()}
    };

function widgetResize(el,appId){
  // CSS `resize:both` gives the corner grip; persist the final size only, and mark busy so
  // background reloads don't clobber it mid-resize.
  let t=0;
  const ro=new ResizeObserver(()=>{
    const wd=widgetLayout(appId);if(!wd)return;
    if(Math.abs(el.offsetWidth-wd.w)<2&&Math.abs(el.offsetHeight-wd.h)<2)return;  // no real change
    el._resizing=true;wd.w=el.offsetWidth;wd.h=el.offsetHeight;
    clearTimeout(t);t=setTimeout(()=>{el._resizing=false;queueWidgetSave()},400);
  });
  ro.observe(el);
}

/* ================= jarvis thinking animation ================= */
let jrRaf=0,jrPulse=0,jrActive=false,jrTimeout=0;
function jarvisOn(autoOffSecs){
  const c=$('#jarvis');c.classList.add('on');jrActive=true;
  if(!jrRaf)jrRaf=requestAnimationFrame(jarvisDraw);
  clearTimeout(jrTimeout);
  if(autoOffSecs)jrTimeout=setTimeout(()=>{if(!running)jarvisOff()},autoOffSecs*1000);
}
function jarvisOff(){jrActive=false;$('#jarvis').classList.remove('on')}
function jarvisDraw(ts){
  const c=$('#jarvis');
  if(!jrActive&&+getComputedStyle(c).opacity===0){jrRaf=0;return}
  const dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  if(c.width!==W*dpr){c.width=W*dpr}if(c.height!==H*dpr){c.height=H*dpr}
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const t=ts/1000,cx=W/2,cy=H/2,TAU=Math.PI*2;
  jrPulse*=.96;
  const A=.55+.2*Math.sin(t*2.4)+jrPulse*.3;
  // core glow
  const cr=26+5*Math.sin(t*3)+jrPulse*16;
  const g=x.createRadialGradient(cx,cy,0,cx,cy,cr*3);
  g.addColorStop(0,'rgba(94,234,212,'+(.30*A).toFixed(3)+')');
  g.addColorStop(1,'rgba(34,211,238,0)');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,cr*3,0,TAU);x.fill();
  x.fillStyle='rgba(94,234,212,'+(.85*A).toFixed(3)+')';x.beginPath();x.arc(cx,cy,4,0,TAU);x.fill();
  // segmented rotating rings
  const rings=[{r:60,s:1.1,n:3,w:2.5},{r:95,s:-.7,n:4,w:1.6},{r:135,s:.45,n:5,w:1.2},{r:185,s:-.28,n:3,w:1}];
  rings.forEach((R,i)=>{
    x.lineWidth=R.w;
    x.strokeStyle='rgba('+(i%2?'34,211,238':'94,234,212')+','+(.5*A).toFixed(3)+')';
    for(let k=0;k<R.n;k++){
      const a0=t*R.s+k*TAU/R.n;
      x.beginPath();x.arc(cx,cy,R.r,a0,a0+TAU/R.n*.62);x.stroke();
    }
  });
  // sweeping ticks on the outer ring
  x.strokeStyle='rgba(94,234,212,'+(.35*A).toFixed(3)+')';x.lineWidth=1;
  const head=Math.floor(t*22);
  for(let k=0;k<72;k++){
    if(((k-head)%72+72)%72>=10)continue;
    const a=k/72*TAU;
    x.beginPath();x.moveTo(cx+Math.cos(a)*205,cy+Math.sin(a)*205);
    x.lineTo(cx+Math.cos(a)*213,cy+Math.sin(a)*213);x.stroke();
  }
  // orbiting dots
  x.fillStyle='rgba(34,211,238,'+(.8*A).toFixed(3)+')';
  for(let k=0;k<3;k++){
    const a=t*(.9+k*.35)+k*2.1,r=60+k*38;
    x.beginPath();x.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2.5,0,TAU);x.fill();
  }
  jrRaf=requestAnimationFrame(jarvisDraw);
}

let VOICE=JSON.parse(localStorage.getItem('voice')||'{"tts":false,"voice":"","rate":1,"lang":"en-IN"}');

function speak(text){
  if(!VOICE.tts||!text||!window.speechSynthesis)return;
  const clean=text.replace(/```[\s\S]*?```/g,' code block. ').replace(/[*_#`>|]/g,'').slice(0,800);
  const u=new SpeechSynthesisUtterance(clean);
  u.rate=VOICE.rate||1;
  const v=speechSynthesis.getVoices().find(v=>v.name===VOICE.voice);
  if(v)u.voice=v;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
let rec=null,recOn=false;
function micToggle(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('speech recognition is not available in this browser');
  if(recOn){rec.stop();return}
  rec=new SR();rec.lang=VOICE.lang||'en-IN';rec.interimResults=true;rec.continuous=true;
  const base=input?input.value:'';
  rec.onresult=e=>{
    if(!input)return;
    let fin=base,inter='';
    for(let i=0;i<e.results.length;i++){const r=e.results[i];
      if(r.isFinal)fin=(fin+' '+r[0].transcript).trim();else inter+=r[0].transcript}

  rec.onend=()=>{recOn=false;$('#mic')?.classList.remove('rec')};
