/* A running native window reports its app_id (or X11 class); the desktop entry
   that owns that id is what has the real icon. Matching walks from exact id to
   the loosest sensible match, because toolkits disagree: "org.gnome.Nautilus",
   "nautilus" and "Nautilus" are all the same program. */
function natApp(appId){
  const list=(typeof NATIVEAPPS!=='undefined'?NATIVEAPPS:[]);
  if(!list.length||!appId)return null;
  const a=String(appId).toLowerCase(), tail=a.split('.').pop();
  return list.find(x=>x.id.toLowerCase()===a)
    || list.find(x=>x.id.toLowerCase()===tail)
    || list.find(x=>(x.wmclass||'').toLowerCase()===a)
    || list.find(x=>x.id.toLowerCase().endsWith('.'+tail)||x.id.toLowerCase().startsWith(tail+'-'))
    || list.find(x=>x.name.toLowerCase()===tail)
    || null;
}
function natIcon(w,px){
  px=px||46;
  const a=natApp(w.app);
  if(a&&a.has_icon)return `<img class="na" src="/api/native/icon/${encodeURIComponent(a.id)}" loading="lazy" alt="" style="width:${px}px;height:${px}px;object-fit:contain">`;
  const c=((w.app||w.title||'?').trim().charAt(0)||'?').toUpperCase();
  return `<span class="nafallback" style="width:${px}px;height:${px}px;font-size:${Math.round(px*.43)}px">${esc(/[A-Z0-9]/.test(c)?c:'▭')}</span>`;
}
function natName(w){const a=natApp(w.app);return (a&&a.name)||w.app||w.title||'window'}
let NATIVE_POLL=null,wmDebounce=null,NATWINS=[];
/* The compositor pushes window events, but focus moving BETWEEN two native
   windows is easy to miss; a short poll keeps the menu bar honest. */
async function updateNativeWindows(){
  const box=$('#tbnative');if(!box)return;
  let d;try{d=await (await fetch('/api/windows')).json()}catch(e){return}
  if(!d.available){box.classList.remove('has');box.innerHTML='';box._reason=d.reason||'';NATWINS=[];return}
  NATWINS=d.windows||[];
  paintNativeTiles();
}
function paintNativeTiles(){
  const box=$('#tbnative');if(!box)return;
  box.classList.toggle('has',NATWINS.length>0);
  box.innerHTML=NATWINS.slice(0,10).map(w=>`<button class="tbnat ${w.focused?'on':''} ${w.minimized?'mini':''}"
      data-id="${esc(w.id)}" data-tip="${esc(natName(w)+' — '+(w.title||''))}">${natIcon(w,46)}</button>`).join('');
  const wins=Object.fromEntries(NATWINS.map(w=>[String(w.id),w]));
  box.querySelectorAll('.tbnat').forEach(b=>{
    const w=wins[b.dataset.id]||{id:b.dataset.id,title:''};
    // exactly like an AgentOS window's taskbar tile: click the focused one to
    // put it away, click a hidden one to bring it back
    b.onclick=()=>natWin(w.minimized?'restore':(w.focused?'minimize':'focus'),w.id);
    b.oncontextmenu=e=>{e.preventDefault();natWinMenu(e,w)};
    b.onpointerenter=()=>natCtlShow(b,w);
    b.onpointerleave=()=>natCtlHide(600);
  });
  buildAppMenus();                 // the menu bar follows native focus too
  if(typeof updateDockSeps==='function')updateDockSeps();
}
/* Window controls for the tile under the pointer.
   They live in a FIXED-position element attached to the desktop, not inside the
   tile: #tbnative scrolls horizontally, and `overflow-x:auto` silently clipped
   an absolutely-positioned popup — the buttons were being drawn and then cut
   off, which is exactly what "minimize doesn't work" looked like. */
let NATCTL_T=0;
function natCtlEl(){
  let el=$('#natctl');
  if(!el){
    el=document.createElement('div');el.id='natctl';
    (($('#desktop'))||document.body).appendChild(el);
    el.onpointerenter=()=>clearTimeout(NATCTL_T);
    el.onpointerleave=()=>natCtlHide(200);
  }
  return el;
}
function natCtlShow(tile,w){
  clearTimeout(NATCTL_T);
  const el=natCtlEl();
  el.innerHTML=`<button data-do="${w.minimized?'restore':'minimize'}" title="${w.minimized?'Restore':'Minimize'} — Super+H">${w.minimized?'▴':'–'}</button>
    <button data-do="maximize" title="Maximize">▢</button>
    <button data-do="fullscreen" title="Full screen — Super+F">⤢</button>
    <button data-do="close" title="Close — Super+Q">✕</button>`;
  el.querySelectorAll('button').forEach(b=>b.onclick=e=>{
    e.stopPropagation();natCtlHide(0);
    const a=b.dataset.do;
    natWin(a,w.id,a==='maximize'?{maximize:true}:a==='fullscreen'?{fullscreen:!w.fullscreen}:undefined);
  });
  const r=tile.getBoundingClientRect();
  el.classList.add('on');
  el.style.left=Math.round(r.left+r.width/2-el.offsetWidth/2)+'px';
  el.style.top=Math.round(r.top-el.offsetHeight-8)+'px';
}
function natCtlHide(delay){
  clearTimeout(NATCTL_T);
  NATCTL_T=setTimeout(()=>{const el=$('#natctl');if(el)el.classList.remove('on')},delay||0);
}

/* One door for every native window command.
   The state is applied to the tile IMMEDIATELY and the request goes out behind
   it. The server answers in about two milliseconds, but waiting for the round
   trip before redrawing — and then waiting another 150ms on top — is what made
   minimizing a window feel slow when nothing slow was happening. The compositor
   event that follows reconciles anything we guessed wrong. */
const NAT_OPTIMISTIC={
  minimize:w=>({minimized:true,focused:false}),
  restore:w=>({minimized:false,focused:true}),
  focus:w=>({minimized:false,focused:true}),
  fullscreen:(w,x)=>({fullscreen:x&&x.fullscreen!==undefined?!!x.fullscreen:!w.fullscreen}),
};
function natWin(action,id,extra){
  const w=NATWINS.find(x=>String(x.id)===String(id));
  if(w&&NAT_OPTIMISTIC[action]){
    const patch=NAT_OPTIMISTIC[action](w,extra);
    if(patch.focused)NATWINS.forEach(o=>{o.focused=false});
    Object.assign(w,patch);
    paintNativeTiles();                      // redrawn now, not in 150ms
  }else if(action==='close'&&w){
    NATWINS=NATWINS.filter(x=>x!==w);paintNativeTiles();
  }
  return fetch('/api/windows/'+action,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id,...(extra||{})})})
    .then(r=>r.json()).catch(()=>({ok:false}))
    .then(d=>{if(!d||d.ok===false)updateNativeWindows();return d});
}
function natFocused(){return NATWINS.find(w=>w.focused&&!w.minimized)||null}
async function showDesktop(){
  const d=await fetch('/api/windows/showdesktop',{method:'POST'}).then(r=>r.json()).catch(()=>({ok:false}));
  setTimeout(updateNativeWindows,200);
  toast(d.ok?(d.message||'desktop shown'):'could not hide the windows');
}
/* Everything you can do to a native window, in one menu — the same verbs an
   AgentOS window offers, so there is no second-class kind of window here. */
function natWinItems(w){
  const arrange=cap('windows.arrange').available;
  const items=[
    w.minimized?{label:'Restore',keys:'Super+H',fn:()=>natWin('restore',w.id)}
               :{label:'Minimize',keys:'Super+H',fn:()=>natWin('minimize',w.id)},
    {label:'Maximize',fn:()=>natWin('maximize',w.id,{maximize:true})},
    {label:'Restore size',fn:()=>natWin('maximize',w.id,{maximize:false})},
    {label:w.fullscreen?'Leave full screen':'Full screen',keys:'Super+F',
     fn:()=>natWin('fullscreen',w.id,{fullscreen:!w.fullscreen})},
    {label:'Focus',fn:()=>natWin('focus',w.id)},
  ];
  if(arrange){
    items.push(null,{label:w.floating?'Tile':'Float',fn:()=>natWin('floating',w.id,{floating:!w.floating})});
    for(let n=1;n<=4;n++)items.push({label:'Move to desktop '+n,fn:()=>natWin('move',w.id,{workspace:String(n)})});
  }
  items.push(null,{label:'Show the desktop',fn:showDesktop},
             {label:'Close window',danger:true,fn:()=>natWin('close',w.id)});
  return items;
}
function natWinMenu(e,w){showCtxItems(e,natWinItems(w))}
function svgMic(px){

/* ================= file manager app ================= */
async function renderFiles(body,w){
  w.path=w.path||'';
  const FCOLORS={html:'#38BDF8',htm:'#38BDF8',md:'#a5b4fc',txt:'#8a94a6',json:'#fbbf24',csv:'#4ade80',
    log:'#8a94a6',pdf:'#f87171',sh:'#94a3b8',py:'#60a5fa'};
  const IMG_EXT=new Set(['png','jpg','jpeg','gif','webp','svg']);
  const icon=e=>{
    const s='width:17px;height:17px;display:block';
    if(e.dir)return `<svg viewBox="0 0 24 24" style="${s}"><path d="M3.5 7c0-.9.7-1.6 1.5-1.6h4.2l2 2.4h7.8c.8 0 1.5.7 1.5 1.6v8c0 .9-.7 1.6-1.5 1.6H5c-.8 0-1.5-.7-1.5-1.6Z" fill="#5EA3F7"/></svg>`;
    if(IMG_EXT.has(e.ext))return `<svg viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="${s}"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4.4 16.4l4.3-3.8 3.4 2.9 3-2.5 4.5 3.6"/></svg>`;
    const c=FCOLORS[e.ext]||'#8a94a6';
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="${s}"><path d="M6.5 4h7l4 4v12h-11Z"/><path d="M13.5 4v4h4"/></svg>`;
  };
  const fmt=n=>n<1024?n+' B':n<1e6?(n/1024).toFixed(0)+' KB':(n/1e6).toFixed(1)+' MB';
  let d;try{d=await (await fetch('/api/files?path='+encodeURIComponent(w.path))).json()}catch(e){body.innerHTML='<p class="mut" style="padding:16px">could not read files</p>';return}
  w.path=d.path;
  const crumbs=['<span class="fcrumb" data-p="">workspace</span>'];
  let acc='';d.path.split('/').filter(Boolean).forEach(seg=>{acc=acc?acc+'/'+seg:seg;crumbs.push('<span class="fsep">/</span><span class="fcrumb" data-p="'+esc(acc)+'">'+esc(seg)+'</span>')});
  body.innerHTML=`<div class="apptop">
      ${w.path?'<button class="endbtn f-up">Up</button>':''}
      <div style="flex:1;font-size:var(--fs-sm)" class="f-crumbs">${crumbs.join('')}</div>
      <span class="psearch" style="flex:0 0 220px">${SVG_SEARCH}<input class="f-search" placeholder="Search by meaning…" autocomplete="off"></span>
      <button class="endbtn" onclick="refreshApp('files')">⟳</button>
    </div>
    <div class="f-list" style="flex:1;overflow-y:auto;padding:6px 8px;user-select:text">
      ${d.entries.length?d.entries.map(e=>`<div class="fitem" data-rel="${esc(e.rel)}" data-dir="${e.dir?1:0}" data-ext="${esc(e.ext)}">
        <span class="fi">${icon(e)}</span><span class="fn">${esc(e.name)}</span>
        <span class="fmeta">${e.dir?'':fmt(e.size)+' · '+new Date(e.mtime*1000).toLocaleDateString()}</span>
      </div>`).join(''):'<p class="mut" style="padding:14px">empty folder</p>'}
    </div>`;
  // scoped lookups — Files is multi-instance, so no bare $('#…') in here
  body.querySelector('.f-crumbs').querySelectorAll('.fcrumb').forEach(c=>c.onclick=()=>{w.path=c.dataset.p;renderFiles(body,w)});
  const up=body.querySelector('.f-up');if(up)up.onclick=()=>{w.path=w.path.split('/').slice(0,-1).join('/');renderFiles(body,w)};
  const wire=()=>body.querySelectorAll('.fitem').forEach(it=>it.onclick=()=>{
    const rel=it.dataset.rel;
    if(it.dataset.dir==='1'){w.path=rel;renderFiles(body,w)}
    else openFile(rel,it.dataset.ext);
  });
  wire();
  // semantic search: meaning-ranked over the workspace + docs, substring fallback server-side
  const si=body.querySelector('.f-search');let st;
  si.oninput=()=>{
    clearTimeout(st);
    const q=si.value.trim();
    const list=body.querySelector('.f-list');
    if(!q){renderFiles(body,w);return}
    st=setTimeout(async()=>{
      list.innerHTML='<p class="mut" style="padding:14px">searching…</p>';
      let d2;try{d2=await (await fetch('/api/search?q='+encodeURIComponent(q))).json()}catch(e){d2={results:[]}}
      const res=d2.results||[];
      list.innerHTML=res.length?res.map(r=>`<div class="fitem fhit" data-path="${esc(r.path)}">
          <span class="fi">${icon({ext:(r.path.split('.').pop()||'').toLowerCase()})}</span>
          <span class="fn">${esc(r.path.split('/').pop())}<div class="fsnip">${esc(r.snippet)}</div></span>
          <span class="fmeta">${r.kind}</span>
        </div>`).join(''):'<p class="mut" style="padding:14px">nothing matched — the index may still be warming up</p>';
      list.querySelectorAll('.fhit').forEach(h=>h.onclick=()=>openHost({path:h.dataset.path}));
    },300);
  };
}
function openFile(rel,ext){
  // open the real file in the HOST OS default app (browser for html/pdf, viewer for images, etc.)
  openHost({path:rel});
}

let STORE_DISC={q:'',results:[],seq:0,ctl:null};
function renderStoreDiscover(box){
  box.innerHTML=`<p class="mut" style="margin-bottom:10px">Search the public MCP registry — thousands of servers published by the community.

    <div id="disc-results" class="cat" style="margin-top:10px">${storeDiscoverCards()}</div>`;
  STORE_DISC._sig=discSig();  // the grid just rendered — cache its signature
  const inp=$('#disc-q');
  let deb; // results come in as you type — no Search button to wait on
  inp.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(()=>storeDiscover(inp.value.trim()),350)});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(deb);storeDiscover(inp.value.trim())}});

function storeDiscoverCards(){
  if(!STORE_DISC.results.length)
    return `<p class="mut" style="grid-column:1/-1">${STORE_DISC.q?'nothing found — try a broader term':'start typing to search the worldwide registry…'}</p>`;
  return STORE_DISC.results.map((c,i)=>{
    const req=[...(c.env||[]).filter(e=>e.required).map(e=>e.name),
               ...(c.remote_headers||[]).filter(h=>h.required).map(h=>h.name)];
    const kind=c.origin_source==='github'?'GitHub repo':c.origin_source==='npm'?'npm (beyond the registry)'
              :c.remote_url?'remote':(c.registry_type||'package');
    return `<div class="catcard${c.installed?' inst':''}" title="${esc(c.registry_name)}${c.version?' · v'+esc(c.version):''}">
      <span class="cn">${esc(c.registry_name.split(/[/:]/).pop())}</span>
      <span class="cd" style="display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden">${esc(c.description||'(no description)')}</span>
      <span class="ck">${esc(kind)}${req.length?' · 🔑 key needed':''}${c.homepage?` · <a href="${esc(c.homepage)}" target="_blank" style="color:var(--acc2,#22d3ee)" onclick="event.stopPropagation()">homepage ↗</a>`:''}</span>
      ${c.agentic
        ?`<button class="save" style="margin-top:8px;padding:6px" title="No published package — the agent reads the repo, works out how to run it, and connects it (you approve each step)" onclick="storeAgentSetup(${i})">🤖 Set up with AI</button>`
        :`<button class="save" style="margin-top:8px;padding:6px" onclick="storeDiscoverInstall(${i})">Install</button>`}
    </div>`}).join('');
}
function discSig(){
  return STORE_DISC.results.map(c=>c.registry_name+(c.installed?'+':'')).join('|')
         +'|'+(STORE_DISC.q?'q':'');
}
function storeDiscoverPaint(status){
  const st=$('#disc-st');if(st&&status!==undefined)st.textContent=status;
  const el=$('#disc-results');if(!el)return;
  const sig=discSig();
  if(sig===STORE_DISC._sig)return;  // same cards — leave the DOM alone (no flicker)
  STORE_DISC._sig=sig;
  el.innerHTML=storeDiscoverCards();
}
async function storeDiscover(q){
  STORE_DISC.q=q;
  const seq=++STORE_DISC.seq;               // newer keystrokes win…
  if(STORE_DISC.ctl)STORE_DISC.ctl.abort(); // …and stale requests are cancelled
  clearTimeout(STORE_DISC.poll);
  if(!q){STORE_DISC.results=[];storeDiscoverPaint('');return}
  const ctl=new AbortController();STORE_DISC.ctl=ctl;
  // only announce "searching" when the grid is empty — sync-poll re-queries shouldn't
  // blink the status while results are already on screen
  const st=$('#disc-st');if(st&&!STORE_DISC.results.length)st.textContent='searching…';
  try{
    // searches hit the locally-synced index — instant; while the background sync is
    // still pulling the catalog down, results keep growing and we re-query on a timer
    const r=await fetch('/api/store/mcp/search?q='+encodeURIComponent(q)+'&limit=30',{signal:ctl.signal});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'search failed');
    if(seq!==STORE_DISC.seq)return;
    STORE_DISC.results=d.candidates||[];
    const ix=d.index||{};
    let status=STORE_DISC.results.length+' result'+(STORE_DISC.results.length===1?'':'s');
    if(ix.syncing)status+=' · indexing the registry — '+(ix.count||0)+' servers so far…';
    if(seq===STORE_DISC.seq&&ix.syncing)
      STORE_DISC.poll=setTimeout(()=>{if(seq===STORE_DISC.seq)storeDiscover(q)},4000);
    storeDiscoverPaint(status);
    // the registry isn't always enough — when results are sparse, the system widens
    // the net itself: npm + GitHub, fetched once per query (sync-poll re-queries
    // reuse the cached extras instead of re-sweeping and re-flickering)
    if(STORE_DISC.results.length<6){
      let extras=(STORE_DISC._deep&&STORE_DISC._deep.q===q)?STORE_DISC._deep.extras:null;
      if(!extras){
        storeDiscoverPaint(status+' · widening the search (npm & GitHub)…');
        const rd=await fetch('/api/store/mcp/discover_more?q='+encodeURIComponent(q),{signal:ctl.signal});
        const dd=await rd.json();
        if(seq!==STORE_DISC.seq)return;
        extras=rd.ok?(dd.candidates||[]):[];
        STORE_DISC._deep={q,extras};
      }
      const seen=new Set(STORE_DISC.results.map(c=>c.registry_name));
      STORE_DISC.results.push(...extras.filter(c=>!seen.has(c.registry_name)));
      let s2=STORE_DISC.results.length+' result'+(STORE_DISC.results.length===1?'':'s');
      if(ix.syncing)s2+=' · registry still indexing…';
      storeDiscoverPaint(s2);
    }
  }catch(e){
    if(e.name==='AbortError')return;
    if(seq===STORE_DISC.seq)storeDiscoverPaint('search failed — '+(e.message||e));
  }
}
function storeAgentSetup(i){
  const c=STORE_DISC.results[i];if(!c)return;

async function storeDiscoverInstall(i){
  const c=STORE_DISC.results[i];if(!c)return;
  const short=c.registry_name.split('/').pop();
  // discovery never installs silently — this is the user's yes/no gate
  if(!await osConfirm(`Discovered "${short}" — would you like to build around it and add it to your MCP Registry?`,c.description||'',{confirmText:'Install'}))return;
  const env={};
  const wants=[...c.env.map(e=>({n:e.name,req:e.required,d:e.description})),
               ...(c.remote_headers||[]).flatMap(h=>((h.value||'').match(/\{([\w.-]+)\}/g)||[]).map(v=>({n:v.slice(1,-1),req:h.required,d:h.description})))];
  for(const w of wants){
    const v=await osPrompt(w.n,{message:(w.d?w.d+' — ':'')+(w.req?'required — leave empty to fill later in the MCP app':'optional')});
    if(v===null)return;
    if(v.trim())env[w.n]=v.trim();
  }
  toast('⏳ installing '+short+'…');
  const r=await fetch('/api/store/mcp/install',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({registry_name:c.registry_name,env})});
  const d=await r.json();
  if(!r.ok)return toast(d.error||'install failed');
  c.installed=true;
  storeDiscoverPaint();  // signature changed (installed flag) — one clean repaint
  toast(`✓ ${d.name} added to the MCP Registry — manual in Docs`+(d.missing_env&&d.missing_env.length?` · disabled until you set: ${d.missing_env.join(', ')}`:''));
  setTimeout(async()=>{
    if(await osConfirm(`Build a desktop app around "${d.name}"?`,`${agentName()} will design an AI-native app that uses its tools (permissions are declared for your consent).`,{confirmText:'Build'})){
      openApp('studio');

        `not a suite; big apps take minutes on local models) around the newly installed MCP server "${d.name}". `+
        `Its tools are available as appTool('mcp_${d.name}_<tool>', args) — check GET /api/tools for the exact names `+
        `and build around the 1-2 most useful tools only. Purpose: ${c.description||short}. `+
        `Add ONE small AI touch via appLLM on the returned data. Compose the UI purely from the pre-injected design-system classes (.card/.row/.cols/.kpi/.empty) — no custom CSS. `+
        `Declare permissions: [{"action":"mcp.use","resource":"mcp:${d.name}/*","reason":"uses the ${d.name} integration","required":true}].`;
      setTimeout(()=>{if($('#st-prompt')){$('#st-prompt').value=p;studioBuild()}},300);
    }
  },400);
}

/* built apps postMessage their runtime JS errors here — surface them with a one-click fix */
window.addEventListener('message',ev=>{
  const d=ev.data;
  if(!d||d.agentos!=='app_error')return;
  if(!STUDIO.sel||d.app_id!==STUDIO.sel||!STUDIO.log||!STUDIO.log.isConnected||STUDIO.building)return;
  if(STUDIO._lastErr===d.message)return;   // don't spam repeats (e.g. errors in a poll loop)
  STUDIO._lastErr=d.message;
  studioLog(`<span style="color:var(--err)">app runtime error: ${esc(d.message)}${d.source&&d.source!==':0'?' @ '+esc(d.source):''}</span>
    <button style="font-size:11px;padding:3px 10px;margin-left:6px" onclick="studioAutoFix()">Fix automatically</button>`);
  // a just-deployed app that errors on first load gets ONE automatic repair build
  if(STUDIO._justBuilt&&Date.now()-STUDIO._justBuilt<8000&&!STUDIO._autofixed){
    STUDIO._autofixed=true;
    studioLog('<span class="mut">the fresh build crashed on load — repairing automatically…</span>');
    studioAutoFix();
  }
});

  const ago=t=>{const s=Math.max(1,Math.round(Date.now()/1000-t));return s<60?s+'s':s<3600?Math.round(s/60)+'m':s<86400?Math.round(s/3600)+'h':Math.round(s/86400)+'d'};

async function studioRestore(v){

function studioLog(html,cls){
  if(!STUDIO.log)return;
  const d=document.createElement('div');d.className=cls||'';d.style.margin='4px 0';d.innerHTML=html;
  STUDIO.log.appendChild(d);
  if(STUDIO._status&&STUDIO._status.isConnected&&STUDIO._status!==d)STUDIO.log.appendChild(STUDIO._status); // status line stays last
  STUDIO.log.scrollTop=STUDIO.log.scrollHeight;
  return d;
}
function studioTickStart(){
  studioTickStop();
  STUDIO._t0=Date.now();
  STUDIO._status=studioLog('<span class="mut">working…</span>');
  STUDIO._tick=setInterval(()=>{
    if(!STUDIO._status||!STUDIO._status.isConnected){if(STUDIO._tick){clearInterval(STUDIO._tick);STUDIO._tick=null}return}
    const s=Math.round((Date.now()-STUDIO._t0)/1000);
    STUDIO._status.innerHTML='<span class="mut">working… '+(s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s')
      +(STUDIO._smsg?' — '+esc(STUDIO._smsg):(s>45?' — the model is writing the app; large apps take a few minutes on local models. Cancel any time.':''))+'</span>';
  },1000);
}
function studioTickStop(){
  if(STUDIO._tick){clearInterval(STUDIO._tick);STUDIO._tick=null}
  if(STUDIO._status){STUDIO._status.remove();STUDIO._status=null}
}
function studioBuild(){
  if(STUDIO.building){                       // the button doubles as Cancel while a build runs
    if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'build_abort'}));
    return;
  }
  const p=$('#st-prompt');if(!p)return;
  const prompt=p.value.trim();if(!prompt)return;
  if(!ws||ws.readyState!==1)return toast('not connected');
  STUDIO.building=true;
  const b=$('#st-build');if(b){b.textContent='Cancel';b.classList.add('stop')}
  studioLog(`<b style="color:var(--acc2)">You:</b> ${esc(prompt)}`);
  STUDIO._cur=studioLog('');
  studioTickStart();
  jarvisOn();
  const bmodel=$('#st-model')?.value||STUDIO.model||'auto';
  ws.send(JSON.stringify({type:'build',prompt,app_id:STUDIO.sel,model:bmodel}));
  p.value='';
}
function studioBuildEnded(){
  STUDIO.building=false;STUDIO._smsg='';studioTickStop();jarvisOff();
  const b=$('#st-build');if(b){b.disabled=false;b.classList.remove('stop');b.textContent=STUDIO.sel?'Update':'Build'}
}
function studioBuildEvent(ev){
  switch(ev.type){
    case 'build_start': break;
    case 'build_thinking': break;   // keep the log clean; thinking drives the jarvis pulse
    case 'build_text':
      if(STUDIO._cur){STUDIO._cur._t=(STUDIO._cur._t||'')+ev.text;STUDIO._cur.innerHTML='<b>▲ '+esc(agentName())+':</b> '+esc(STUDIO._cur._t)}
      break;
    case 'build_tool':
      studioLog(`<span class="mut">▸ ${esc(ev.name)}${ev.name==='create_app'?' — deploying the app…':ev.name==='fetch_url'?' — checking the live data source…':''}</span>`);break;
    case 'build_tool_end':{ // failed tool calls must be VISIBLE — a silent retry loop looks like a hang
      const ok=ev.ok!==false;
      if(!ok)studioLog(`<span style="color:var(--err)">✗ ${esc(ev.name)} — ${esc((ev.output||'').slice(0,220))}</span>`);
      else if(ev.name==='create_app')studioLog(`<span class="mut">✓ create_app</span>`);
      break;}
    case 'build_choice':{  // the build produced nothing — the USER picks what runs next
      const opts=(ev.options||[]).filter(Boolean);
      const id='bc'+Date.now().toString(36);
      studioLog(`<div class="bchoice" id="${id}"><b>${esc(ev.message||'no app was produced')}</b>
        <span>Nothing was installed. Run it again with:</span>
        <span class="row">
          <select class="bc-m">${opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')||'<option value="">no other model configured</option>'}</select>
          <button class="pact bc-go">Retry</button>
          <button class="endbtn bc-x">Not now</button>
        </span></div>`);
      const box=document.getElementById(id);
      if(box){
        box.querySelector('.bc-go').onclick=()=>{
          const m=box.querySelector('.bc-m').value;
          if(!m)return toast('add a cloud key in Settings → AI providers first');
          const sel=$('#st-model');if(sel){sel.value=m;STUDIO.model=m;localStorage.setItem('studioModel',m)}
          box.remove();studioBuild();
        };
        box.querySelector('.bc-x').onclick=()=>box.remove();
      }
      break;}
    case 'build_status': // model-side heartbeat while it loads/evaluates
      STUDIO._smsg=ev.message||'';break;
    case 'build_error_note': // non-fatal error inside an attempt (the build continues/retries)
      studioLog(`<span style="color:var(--err)">${esc(ev.message||'error')}</span>`);break;
    case 'build_error':
      studioBuildEnded();
      studioLog(`<span style="color:var(--err)">${esc(ev.message||'error')}</span>`);break;
    case 'build_done':
      studioBuildEnded();
      if(ev.app_id){
        const wasNew=(STUDIO._logKey||'new')==='new';
        STUDIO.sel=ev.app_id;STUDIO._lastErr=null;
        STUDIO._justBuilt=Date.now();STUDIO._autofixed=false;   // arm the load-crash auto-repair
        studioLog(`<span style="color:var(--ok)">✓ ${esc(ev.name||'app')} ready — deployed live</span>`);
        if(ev.warnings&&ev.warnings.length)
          studioLog(`<span style="color:var(--warn,#e8b04b)">⚠ shipped with known issues: ${esc(ev.warnings.join('; ').slice(0,300))} — ask for a fix or rebuild</span>`);
        if(ev.manifest_status==='proposed')
          studioLog(`<span class="mut">it requests permissions — </span><button style="font-size:11px;padding:3px 10px" onclick="reviewManifest('${ev.app_id}')">Review &amp; grant</button>`);
        if(wasNew)delete STUDIO.logs['new'];   // this session now belongs to the built app
        STUDIO._logKey=ev.app_id;
        studioVersions();
        // re-render to refresh the picker, then preview + open action
        const w=WM.wins.get('studio');if(w){renderStudio(w.el.querySelector('.wbody'),w);}
        toast(''+(ev.name||'app')+' built');
      } else studioLog('<span class="mut">no app was produced — try rephrasing</span>');
      break;
  }
}

        <div class="mut" style="font-size:11px">or just ask the agent: “fine-tune a model on …” — it fetches &amp; starts the service itself</div>
        <div id="tf-msg" class="mut" style="max-width:480px">${esc(busy?'setting up…':'')}</div>
      </div>`;
    const b=$('#tf-start');
    if(b&&!busy)b.onclick=async()=>{
      b.disabled=true;b.textContent=notHere?'downloading…':'starting…';
      fetch('/api/train/service',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start'})})
        .then(r=>r.json()).then(r=>{const el=$('#tf-msg');if(el)el.textContent=r.result||''})
        .catch(e=>{const el=$('#tf-msg');if(el)el.textContent=''+e});
      // start returns only when up (or on error) — the poller flips us to the iframe
    };
  };
  // live setup progress from the server (download / install messages)
  w._onSetup=ev=>{if(ev.type==='train_setup'){const el=$('#tf-msg');if(el)el.textContent=ev.message||''}};
  TRAIN_SETUP_LISTENERS.add(w._onSetup);
  await paint();
  w.timer=setInterval(paint,4000);
}

let xtermLoading=null;
function loadXterm(){
  if(window.Terminal&&window.FitAddon)return Promise.resolve();
  if(xtermLoading)return xtermLoading;
  xtermLoading=new Promise((res,rej)=>{
    const l=document.createElement('link');l.rel='stylesheet';l.href='/assets/xterm.css';document.head.appendChild(l);
    const s=document.createElement('script');s.src='/assets/xterm.js';
    s.onload=()=>{const s2=document.createElement('script');s2.src='/assets/xterm-addon-fit.js';
      s2.onload=res;s2.onerror=rej;document.head.appendChild(s2)};
    s.onerror=rej;document.head.appendChild(s);
  });
  return xtermLoading;
}
async function renderTerminal(body,w){
  body.innerHTML='<div style="flex:1;min-height:0;background:#0b0d10;padding:6px 2px 4px 8px"></div>';
  const holder=body.firstChild;
  try{await loadXterm()}catch(e){holder.innerHTML='<p class="mut" style="padding:16px">could not load terminal assets</p>';return}
  const term=new Terminal({fontSize:13,cursorBlink:true,scrollback:4000,
    fontFamily:"'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace",
    theme:{background:'#0b0d10',foreground:'#e6ebf2',cursor:'#5eead4',cursorAccent:'#0b0d10',
      selectionBackground:'#234a55',black:'#171b22',brightBlack:'#5c6577'}});
  const fit=new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(holder);
  const tws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/terminal');
  const sendResize=()=>{if(tws.readyState===1)tws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}))};
  tws.onopen=()=>{fit.fit();sendResize();term.focus()};
  tws.onmessage=e=>term.write(e.data);
  tws.onclose=()=>{try{term.write('\r\n\x1b[90m[session ended — close and reopen the Terminal to start a new one]\x1b[0m\r\n')}catch(e){}};
  term.onData(d=>{if(tws.readyState===1)tws.send(JSON.stringify({type:'input',data:d}))});
  const ro=new ResizeObserver(()=>{try{fit.fit();sendResize()}catch(e){}});
  ro.observe(holder);
  w.term=term;w.tws=tws;w.ro=ro;
  setTimeout(()=>{try{fit.fit();sendResize();term.focus()}catch(e){}},80);
}

/* ================= omnibar: the always-present prompt bar =================
   The OS's one prompt surface. It sits above the dock permanently and is the
   launcher too: Ctrl+Space (or Ctrl+K / Alt+Space) pops it — bar grows, results
   list rises above it, input focused and selected. Typing filters direct
   actions (intent grammar) + apps; Enter runs the highlighted row, or asks the
   agent when the row is "Ask …". Answers stream into cards above the bar. */
const OMNI={cid:null,matches:[],idx:0,pop:false,imgs:[]};

function omniPresence(){
  const orb=$('#omni-orb'),inp=$('#omni-in');if(!orb)return;
  const n=RUNNING.size;
  orb.classList.toggle('busy',n>0);
  if(inp&&!inp.value&&document.activeElement!==inp)
    inp.placeholder=n>0?`${agentName()} is working${n>1?' ('+n+' turns)':''}…`
                       :`Ask ${agentName()} anything — or press Ctrl+Space`;
}
/* ---- pop: the launcher state. Pure state — it never re-selects text, so
   popping open as you type can't swallow the next keystroke. ---- */
function omniPop(on){
  const bar=$('#omnibar'),inp=$('#omni-in');if(!bar)return;
  on=!!on;
  const changed=on!==OMNI.pop;
  OMNI.pop=on;
  bar.classList.toggle('pop',on);
  document.body.classList.toggle('omni-pop',on);
  if(on){
    if(document.activeElement!==inp)inp.focus();
    omniRender(inp.value);
    if(changed)Motion.run(bar,[{transform:'translateX(-50%) scale(.97)'},{transform:'translateX(-50%) scale(1)'}],
      {duration:180,easing:EASE.spring});
  }else{
    $('#omnilist').classList.remove('on');
    OMNI.matches=[];OMNI.idx=0;
    if(!OMNI.imgs.length&&!$('#omnicards').children.length)omniSummon(false);
  }
}
/* the hotkey entry point (Ctrl+Space / Ctrl+K / Alt+Space): focus, select what's
   there so you can just retype, and show the list */
function omniSummon(on){
  const bar=$('#omnibar');if(!bar)return;
  const want=on!==false;
  bar.classList.toggle('summoned',want);
  // In session mode the whole shell is behind the native windows, so a z-index
  // inside the page cannot help: the desktop itself has to come forward.
  if(typeof raiseShell==='function')raiseShell(want);
}
function omniFocus(){
  const inp=$('#omni-in');if(!inp)return;
  omniSummon(true);                       // come to the front, over any window
  inp.focus();inp.select();
  omniPop(true);
}
function omniOpen(){return OMNI.pop}

/* ---- the results list (direct actions first, then apps, then "ask") ----
   Ranking rules that keep it a LAUNCHER, not a search box:
   - the name is what matters; a hint only counts as a whole-word match
   - when anything matches by prefix/substring, scattered-letter matches are
     dropped entirely (they are what turned "logs" into "Clipboard Manager")
   - AgentOS apps outrank built-in actions, which outrank host apps */
function omniScore(q,it){
  const ql=q.toLowerCase();
  const t=palScore(q,it.label);                       // 3 prefix · 2 substring · 1 scattered
  if(t>=2)return t;
  if((it.hint||'').toLowerCase().includes(ql))return 1.5;
  return t;                                           // 1 (scattered) or 0
}
function omniRender(q){
  const list=$('#omnilist');if(!list)return;
  q=(q||'').trim();
  const items=typeof palActions==='function'?palActions():[];
  const direct=q&&typeof palIntent==='function'?palIntent(q):[];
  let fuzzy;
  if(q){
    const scored=items.map(it=>({it,s:omniScore(q,it)})).filter(x=>x.s>0);
    const best=scored.reduce((m,x)=>Math.max(m,x.s),0);
    const kept=best>=1.5?scored.filter(x=>x.s>=1.5):scored;     // drop the scattered tail
    const rank=x=>x.s+(x.it.id?0.4:x.it.nat?0:0.2);             // apps > actions > host apps
    fuzzy=kept.sort((a,b)=>rank(b)-rank(a)).slice(0,Math.max(3,7-direct.length));
    fuzzy.forEach(x=>x.it._t=x.s);
    fuzzy=fuzzy.map(x=>x.it);
  }else fuzzy=items.slice(0,7);
  OMNI.matches=[...direct,...fuzzy];
  if(q)OMNI.matches.push({icon:'▲',label:`Ask ${agentName()}: “${q}”`,hint:'send to the agent · ⇧⏎',
    ask:true,run:()=>omniAsk(q)});
  OMNI.idx=omniDefaultIdx(q,direct);
  omniPaint();
  if(q&&!direct.length&&typeof palIntentAsync==='function')palIntentAsync(q);
}
/* What should Enter do? Launch, unless the query reads like something to ask. */
function omniDefaultIdx(q,direct){
  if(!q)return 0;
  if(direct.length)return 0;                                    // a command → run it
  const top=OMNI.matches[0];
  const words=q.split(/\s+/).length;
  const asks=/\?$/.test(q)||/^(what|who|why|how|when|where|is|are|can|should|do|does|tell|explain|summar|write|find out)\b/i.test(q);
  if(top&&!top.ask&&(top._t>=2)&&words<=3&&!asks)return 0;       // a name → launch it
  return OMNI.matches.length-1;                                 // otherwise → ask
}
function omniPaint(){
  const list=$('#omnilist');if(!list)return;
  if(!OMNI.matches.length){list.classList.remove('on');list.innerHTML='';return}
  list.innerHTML=OMNI.matches.map((it,i)=>`<div class="palitem${i===OMNI.idx?' sel':''}${it.intent?' act':''}${it.ask?' ask':''}" data-i="${i}">
    ${it.id?appIcon(it.id,32):it.nat?nativeIcon(it.nat,32):`<span class="pi">${it.icon||'▸'}</span>`}<span class="ptext"><div class="pl">${esc(it.label)}</div><div class="ph">${esc(it.hint||'')}</div></span>
    ${i<9?`<kbd class="ok">alt+${i+1}</kbd>`:''}</div>`).join('')
    +`<div class="omni-hint"><span><kbd>⏎</kbd> ${OMNI.matches[OMNI.idx]&&OMNI.matches[OMNI.idx].ask?'ask':'launch'}</span><span><kbd>⇧⏎</kbd> ask</span><span><kbd>alt+1…9</kbd> quick launch</span><span><kbd>↑↓</kbd> pick</span></div>`;
  list.classList.add('on');
  list.querySelectorAll('.palitem').forEach(el=>{
    el.onmousedown=e=>{e.preventDefault();omniRun(+el.dataset.i)};      // keep focus in the input
    el.onmousemove=()=>{OMNI.idx=+el.dataset.i;
      list.querySelectorAll('.palitem').forEach((x,i)=>x.classList.toggle('sel',i===OMNI.idx))};
  });
}
function omniRun(i){
  const it=OMNI.matches[i!==undefined?i:OMNI.idx];
  if(!it)return omniAsk($('#omni-in').value);
  $('#omni-in').value='';
  omniPop(false);
  it.run();
}
/* palIntentAsync (model-classified fallback) appends into whichever list is live */
function palRenderList(){omniPaint()}

async function omniThread(){
  if(OMNI.cid)return OMNI.cid;
  try{
    const d=await (await fetch('/api/conversations')).json();
    const hit=(d.conversations||[]).find(c=>c.origin==='omni');
    if(hit)OMNI.cid=hit.id;
  }catch(e){}
  return OMNI.cid;
}
function omniCard(question){
  const wrap=$('#omnicards');
  const card=document.createElement('div');card.className='ocard';
  card.innerHTML=`<div class="oc-q">${esc(question)}</div><div class="oc-feed"></div>
    <div class="oc-tools"><button class="oc-stopnow" style="display:none">◼ Stop</button>
      <button class="oc-chat">Open in Chat</button><button class="oc-x">✕</button></div>`;
  wrap.appendChild(card);
  wrap.classList.add('raised');
  while(wrap.children.length>3)wrap.firstChild.remove();
  popIn(card,{origin:'bottom'});
  const close=()=>{popOut(card,()=>{card.remove();
    if(!wrap.children.length){wrap.classList.remove('raised');if(!OMNI.pop)omniSummon(false)}})};
  card.querySelector('.oc-x').onclick=close;
  card.querySelector('.oc-chat').onclick=()=>{if(OMNI.cid){openApp('chat');openConv(OMNI.cid)}else openApp('chat');close()};
  return {card,feed:card.querySelector('.oc-feed'),close};
}
function omniContext(){
  const open=[];WM.wins.forEach(w=>{if(!w.min)open.push(w.app.title)});
  return [
    `You are ${agentName()}, answering from the AgentOS omnibar — the always-present prompt bar on the desktop.`,
    `The user asked in passing; be FAST and BRIEF (1-3 sentences unless asked for more), and prefer acting`,
    `through tools over explaining. This is the persistent Desktop thread.`,
    open.length?`Open right now: ${open.join(', ')}. Current desktop ${curDesk}/${DESKS}, theme ${CURRENT_THEME}.`:'',
  ].filter(Boolean).join('\n');
}
/* ---- attachments: a screenshot is often the whole question ---- */
function omniShots(){
  let box=$('#omni-shots');
  if(!box){box=document.createElement('div');box.id='omni-shots';$('#omnibar').appendChild(box)}
  box.innerHTML=OMNI.imgs.map((u,i)=>`<span class="oshot"><img src="${u}"><button data-i="${i}" title="Remove">✕</button></span>`).join('');
  box.classList.toggle('on',OMNI.imgs.length>0);
  box.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();OMNI.imgs.splice(+b.dataset.i,1);omniShots()});
}
function omniAddImage(fileOrUrl){
  const done=u=>{if(OMNI.imgs.length>=4)return toast('up to 4 images');OMNI.imgs.push(u);omniShots()};
  if(typeof fileOrUrl==='string')return done(fileOrUrl);
  const img=new Image();
  img.onload=()=>{   // downscale big screenshots so a turn stays light
    const MAX=1568,sc=Math.min(1,MAX/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    done(sc<1||fileOrUrl.size>800000?c.toDataURL('image/jpeg',.9):c.toDataURL('image/png'));
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(fileOrUrl);
}
async function omniShoot(){
  if(!cap('screen.capture').available)return toast('screen capture is not available here');
  toast('capturing the screen…');
  try{
    const r=await fetch('/api/screenshot',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({area:'full',inline:true})});
    const d=await r.json();
    if(!r.ok||!d.data_url)return toast(d.error||'could not capture the screen');
    omniAddImage(d.data_url);
    omniFocus();
  }catch(e){toast('screenshot failed')}
}
async function omniAsk(q){
  q=(q||'').trim();
  const imgs=OMNI.imgs.slice();
  if(!q&&!imgs.length)return;
  if(!q)q='What do you see here?';
  const inp=$('#omni-in');inp.value='';
  OMNI.imgs=[];omniShots();
  omniPop(false);
  await omniThread();
  const {card,feed,close}=omniCard(q);
  const stopBtn=card.querySelector('.oc-stopnow');
  stopBtn.onclick=()=>{stopAgent(OMNI.cid);stopBtn.textContent='stopping…';stopBtn.disabled=true};
  const sink=miniFeed(feed,{scrollEl:feed,showThinking:false,
    onStart:()=>{stopBtn.style.display='';stopBtn.disabled=false;stopBtn.textContent='◼ Stop'},
    onEnd:()=>{
    stopBtn.style.display='none';
    // linger, then fade — unless the pointer is on it or an approval is pending
    setTimeout(()=>{if(card.isConnected&&!card.matches(':hover')&&!card.querySelector('.approval:not(.resolved)'))close()},30000);
  }});
  const ok=agentTurn({text:q,cid:OMNI.cid,origin:'omni',title:'◉ Desktop',images:imgs,
    context:omniContext(),sink,onCid:id=>{OMNI.cid=id},
    onQueued:stop=>{
      const tools=card.querySelector('.oc-tools');
      if(tools.querySelector('.oc-stop'))return;
      const b=document.createElement('button');b.className='oc-stop';b.textContent='Stop current & send';
      b.onclick=()=>{b.disabled=true;b.textContent='stopping…';stop()};
      tools.prepend(b);
    }});
  if(!ok)close();
}
(function(){
  const inp=$('#omni-in'),bar=$('#omnibar');if(!inp)return;
  $('#omni-mic').innerHTML=svgMic(13);
  const shot=$('#omni-shot');
  if(shot){shot.innerHTML='▣';shot.onmousedown=e=>{e.preventDefault();omniShoot()}}
  // paste or drop an image straight onto the bar
  inp.addEventListener('paste',e=>{
    const items=[...(e.clipboardData?.items||[])].filter(it=>it.type.startsWith('image/'));
    if(!items.length)return;
    e.preventDefault();items.forEach(it=>omniAddImage(it.getAsFile()));
  });
  ['dragover','drop'].forEach(ev=>bar.addEventListener(ev,e=>{
    if(!(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')))return;
    e.preventDefault();
    if(ev==='drop')[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach(omniAddImage);
    bar.classList.toggle('dropping',ev==='dragover');
  }));
  bar.addEventListener('dragleave',()=>bar.classList.remove('dropping'));
  $('#omni-mic').onmousedown=e=>{e.preventDefault();jarvisMode(true)};
  $('#omni-chat').onmousedown=e=>{e.preventDefault();openApp('chat');if(OMNI.cid)openConv(OMNI.cid)};
  // clicking anywhere on the bar puts the caret in it
  bar.addEventListener('mousedown',e=>{if(!e.target.closest('button')&&e.target!==inp){e.preventDefault();omniFocus()}});
  // typing opens the launcher; clearing it collapses back to the bare bar
  inp.addEventListener('input',()=>{if(inp.value.trim())omniPop(true);else if(OMNI.pop)omniRender('')});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();OMNI.idx=Math.min(OMNI.idx+1,OMNI.matches.length-1);omniPaint();return}
    if(e.key==='ArrowUp'){e.preventDefault();OMNI.idx=Math.max(OMNI.idx-1,0);omniPaint();return}
    if(e.key==='Tab'&&OMNI.matches.length){e.preventDefault();omniRun();return}
    if(e.key==='Enter'){e.preventDefault();
      if(e.shiftKey){omniAsk(inp.value);return}         // ⇧⏎ always asks the agent
      if(OMNI.matches.length)omniRun();else omniAsk(inp.value);
      return}
    if(e.key==='Escape'){e.preventDefault();inp.value='';omniPop(false);omniSummon(false);inp.blur()}
  });
  // clicking away collapses the launcher (the bar itself stays, always)
  document.addEventListener('mousedown',e=>{
    if(e.target.closest('#omnibar')||e.target.closest('#omnilist')||e.target.closest('#omnicards'))return;
    if(OMNI.pop)omniPop(false);
    if(!$('#omnicards').children.length)omniSummon(false);        // back behind the windows
  });
  /* Double-tap Ctrl summons the bar — hands stay on the keyboard, no chord to learn. */
  let lastCtrl=0;
  document.addEventListener('keyup',e=>{
    if(e.key!=='Control')return;
    const now=Date.now();
    if(now-lastCtrl<450&&!OMNI.pop){lastCtrl=0;omniFocus();return}
    lastCtrl=now;
  });
  document.addEventListener('keydown',e=>{if(e.key!=='Control')lastCtrl=0});   // a chord is not a double-tap
  /* Alt+1…9 — always "launch the Nth thing in front of me": a result row when
     the launcher is open, otherwise the Nth app in the dock. */
  document.addEventListener('keydown',e=>{
    if(!e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
    const m=/^Digit([1-9])$/.exec(e.code||'')||/^([1-9])$/.exec(e.key||'');
    if(!m)return;
    e.preventDefault();
    const n=+m[1]-1;
    if(OMNI.pop&&OMNI.matches[n])return omniRun(n);
    const id=(typeof DOCK!=='undefined'&&DOCK[n])||null;
    if(id&&APPS[id]){openApp(id);toast('▸ '+APPS[id].title)}
  });
  // type-anywhere: printable keys with no text field focused land in the bar
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key.length!==1)return;                                   // printable only
    const t=document.activeElement;
    if(t&&(/^(input|textarea|select)$/i.test(t.tagName)||t.isContentEditable))return;
    if(e.target.closest&&(e.target.closest('.xterm')||e.target.closest('#setup-wiz')))return;
    omniSummon(true);
    inp.focus();                                                  // the keypress lands in the bar
  });
  omniPresence();
  setInterval(omniPresence,4000);
})();
/* ================= keyboard / shortcuts system ================= */

function activeWin(){let a=null;WM.wins.forEach(w=>{if(w.el.classList.contains('active'))a=w});return a}

// --- Ctrl+Tab window switcher (Cmd+Tab-style) ---
let SW={open:false,list:[],idx:0};
/* The switcher is the machine's window list, not AgentOS's: in session mode the
   external apps are windows on this desktop too, and leaving them out is what
   made Ctrl+Tab feel broken the moment a browser was open. */
function switcherList(){
  const arr=[];WM.wins.forEach(w=>{if(deskVisible(w)&&!w.min)arr.push(w)});
  arr.sort((a,b)=>(+b.el.style.zIndex||0)-(+a.el.style.zIndex||0));
  const nat=(typeof NATWINS!=='undefined'?NATWINS:[]).filter(w=>!w.minimized);

}
function switcherOpen(dir){
  SW.list=switcherList();
  if(SW.list.length<2){if(SW.list.length===1){SW.open=true;SW.idx=0;switcherCommit()}return}
  if(!SW.open){SW.open=true;SW.idx=1;$('#switcher').classList.add('show')}
  else{SW.idx=(SW.idx+dir+SW.list.length)%SW.list.length}
  switcherRender();
}
function switcherRender(){
  $('#swbox').innerHTML=SW.list.map((w,i)=>`<div class="swcard${i===SW.idx?' sel':''}">
    ${w.native?natIcon(w.native,48):appIcon(w.id,48)}<span class="sn">${esc(w.app.title)}</span></div>`).join('');
}
function switcherCommit(){
  if(!SW.open)return;SW.open=false;$('#switcher').classList.remove('show');
  const w=SW.list[SW.idx];if(!w)return;
  if(w.native){if(typeof raiseShell==='function')raiseShell(false);natWin('focus',w.native.id)}
  else focusWin(w);
}

// --- Spaces: every desktop as a card, every window a tile you can throw between them ---
let EXPO={on:false,wins:[]};
function deskWins(n){const a=[];WM.wins.forEach(w=>{if((w.desk||1)===n&&!w.min)a.push(w)});return a}
function exposeToggle(force){
  const on=force!==undefined?force:!EXPO.on;
  if(on===EXPO.on)return;
  let ov=$('#expose');
  // inside #desktop, like the deck: #desktop is position:fixed and therefore its
  // own stacking context — an overlay outside it would sit ABOVE the windows and
  // blur the very thumbnails it is meant to show.
  if(!ov){ov=document.createElement('div');ov.id='expose';$('#desktop').appendChild(ov);
    ov.addEventListener('mousedown',e=>{if(e.target===ov||e.target.id==='expose-grid')exposeToggle(false)})}
  if(on){
    EXPO.on=true;
    document.body.classList.add('exposing');
    ov.classList.add('show');
    ov.innerHTML=`<div id="expose-spaces"></div><div id="expose-grid"></div>
      <div id="expose-hint">click a space to switch · drag a window onto a space to move it · double-click a window to open it</div>`;
    exposeSpaces();exposeGrid();
  }else{
    EXPO.on=false;
    ov.classList.remove('show');ov.innerHTML='';
    EXPO.wins.forEach(w=>{w.el.style.transform='';
      setTimeout(()=>{w.el.classList.remove('exp-win');w.el.style.transformOrigin=''},300)});
    setTimeout(()=>document.body.classList.remove('exposing'),320);
    EXPO.wins=[];
  }
}
/* the spaces strip: a live mini-map of every desktop, and a drop target */
function exposeSpaces(){
  const box=$('#expose-spaces');if(!box)return;
  const cards=[];
  for(let n=1;n<=DESKS;n++){
    const wins=deskWins(n);
    const W=innerWidth,H=innerHeight;
    const mini=wins.map(w=>{
      const r=w.el.getBoundingClientRect();
      return `<i style="left:${(r.left/W*100).toFixed(1)}%;top:${(r.top/H*100).toFixed(1)}%;
        width:${(r.width/W*100).toFixed(1)}%;height:${(r.height/H*100).toFixed(1)}%"></i>`;
    }).join('');
    cards.push(`<div class="space${n===curDesk?' on':''}" data-n="${n}" title="Desktop ${n} — ${wins.length} window(s)">
      <div class="sp-map">${mini}</div>
      <div class="sp-lbl">Desktop ${n}${wins.length?` · ${wins.length}`:''}
        ${DESKS>1?`<button class="sp-x" title="Remove this desktop">✕</button>`:''}</div></div>`);
  }
  if(DESKS<9)cards.push(`<div class="space add" id="sp-add" title="Add a desktop">＋<div class="sp-lbl">New desktop</div></div>`);
  box.innerHTML=cards.join('');
  box.querySelectorAll('.space[data-n]').forEach(c=>{
    const n=+c.dataset.n;
    c.onclick=e=>{
      if(e.target.closest('.sp-x')){e.stopPropagation();removeDesk(n);return}
      if(n!==curDesk){switchDesk(n);setTimeout(()=>{exposeSpaces();exposeGrid()},260)}
    };
    c.ondragover=e=>{e.preventDefault();c.classList.add('drop')};
    c.ondragleave=()=>c.classList.remove('drop');
    c.ondrop=e=>{
      e.preventDefault();c.classList.remove('drop');
      const key=e.dataTransfer.getData('text/agentos-window');
      const w=WM.wins.get(key);if(!w||w.desk===n)return;
      w.desk=n;applyDeskVisibility();
      toast(`moved "${w.app.title}" to Desktop ${n}`);
      exposeSpaces();exposeGrid();
    };
  });
  const add=$('#sp-add');
  if(add)add.onclick=()=>{DESKS++;localStorage.setItem('desks',DESKS);buildPager();exposeSpaces()};
}
function removeDesk(n){
  if(DESKS<=1)return;
  deskWins(n).forEach(w=>{w.desk=Math.max(1,n-1)});     // never orphan a window
  DESKS--;localStorage.setItem('desks',DESKS);
  if(curDesk>DESKS)switchDesk(DESKS);
  applyDeskVisibility();buildPager();exposeSpaces();exposeGrid();
  toast('desktop removed');
}
/* the grid: the CURRENT desktop's real windows, scaled down and draggable */
function exposeGrid(){
  const ov=$('#expose'),grid=$('#expose-grid');if(!grid)return;
  EXPO.wins.forEach(w=>{w.el.style.transform='';w.el.classList.remove('exp-win')});
  grid.innerHTML='';
  const wins=deskWins(curDesk).sort((a,b)=>(+b.el.style.zIndex||0)-(+a.el.style.zIndex||0));
  EXPO.wins=wins;
  if(!wins.length){grid.innerHTML='<div class="exp-empty">No windows on this desktop</div>';return}
  const dr=$('#desktop').getBoundingClientRect();
  const top=dr.top+150, W=dr.width, H=dr.height-150-110, pad=30, gap=26;
  const n=wins.length, cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols);
  const cw=(W-pad*2-gap*(cols-1))/cols, ch=(H-gap*(rows-1))/rows;
  wins.forEach((w,i)=>{
    const r=w.el.getBoundingClientRect();
    const col=i%cols,row=Math.floor(i/cols);
    const s=Math.min(cw/r.width,ch/r.height,0.92);
    const cx=pad+col*(cw+gap)+(cw-r.width*s)/2, cy=top+row*(ch+gap)+(ch-r.height*s)/2;
    const lx=cx-dr.left, ly=cy-dr.top;                    // overlay coords are desktop-relative
    w.el.classList.add('exp-win');
    w.el.style.transformOrigin='top left';
    w.el.style.transform=`translate(${cx-r.left}px,${cy-r.top}px) scale(${s})`;
    const c=document.createElement('div');c.className='exp-catch';c.draggable=true;
    c.style.left=lx+'px';c.style.top=ly+'px';c.style.width=r.width*s+'px';c.style.height=r.height*s+'px';
    c.innerHTML=`<button class="exp-x" title="Close">✕</button>
      <span class="exp-lbl">${appIcon(w.id,15)} ${esc(w.app.title)}</span>`;
    c.ondragstart=e=>{e.dataTransfer.setData('text/agentos-window',w.key);e.dataTransfer.effectAllowed='move';
      c.classList.add('dragging')};
    c.ondragend=()=>c.classList.remove('dragging');
    c.onclick=e=>{if(e.target.closest('.exp-x')){e.stopPropagation();closeWin(w);setTimeout(()=>{exposeSpaces();exposeGrid()},260);return}
      exposeToggle(false);focusWin(w)};
    grid.appendChild(c);
  });
}

/* ================= launcher sources (rendered BY the omnibar) =================
   The omnibar is the command palette — there is no second overlay. These stay
   here as the sources it draws from: app/action rows, fuzzy scoring, and the
   intent grammar that turns language into direct actions. */
function togglePalette(force){force===false?omniPop(false):omniFocus()}   // legacy name, one surface
function paletteOpen(){return omniOpen()}
function palActions(){
  const items=Object.keys(APPS).map(id=>({id,icon:APPS[id].icon,label:APPS[id].title,hint:APPS[id].desc,run:()=>openApp(id)}));
  const g=inner=>`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block">${inner}</svg>`;

    {icon:g('<path d="M4.5 7h15M9.5 7V5.2h5V7M7 7l.9 12.3h8.2L17 7"/>'),label:'Clear session',hint:'wipe the current conversation',run:()=>{openApp('chat');clearSession()}},
    {icon:svgSpeaker(false),label:'Toggle voice',hint:'speak replies on/off',run:()=>{VOICE.tts=!VOICE.tts;saveVoice();toast(VOICE.tts?'voice on':'voice off')}},
    {icon:g('<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4.4 16.4l4.3-3.8 3.4 2.9 3-2.5 4.5 3.6"/>'),label:'Reset wallpaper',hint:'back to the default background',run:()=>fetch('/api/wallpaper',{method:'DELETE'})},
  );
  // saved automations are first-class palette entries — typing their name is the
  // ad-hoc way to fire one, alongside a hot corner or the Automations app
  (typeof AUTOMATIONS!=='undefined'?AUTOMATIONS:[]).forEach(a=>items.push({
    icon:a.icon||'▶',label:a.name,
    hint:a.steps.map(automationStepLabel).join(' → ').slice(0,90)||'automation',
    run:()=>runAutomation(a),
  }));
  NATIVEAPPS.forEach(a=>items.push({nat:a,label:a.name,hint:(a.comment||'')+(a.comment?' · ':'')+'system app',run:()=>launchNative(a.id,a.name)}));
  return items;
}
function palScore(q,text){
  q=q.toLowerCase();text=text.toLowerCase();
  if(text.startsWith(q))return 3;
  if(text.includes(q))return 2;
  let i=0;for(const ch of text){if(ch===q[i])i++}
  return i>=q.length?1:0;
}

/* ---- intent grammar: language goes straight to action, not into a chat box.
   Each rule returns {icon,label,hint,run} rows placed ABOVE fuzzy app matches. ---- */
function palFindApp(name){
  name=name.toLowerCase().trim();
  let best=null,bs=0;
  for(const id in APPS){const s=palScore(name,APPS[id].title)||palScore(name,id);if(s>bs){bs=s;best={id}}}
  NATIVEAPPS.forEach(a=>{const s=palScore(name,a.name);if(s>bs){bs=s;best={nat:a}}});
  return bs>=2?best:null;
}
function palIntent(q){
  const out=[];
  const P=(re)=>{const m=q.match(re);return m};
  let m;
  const act=(icon,label,hint,run)=>out.push({icon,label,hint,run,intent:true});
  // an automation's whole promise is that typing its name runs it, so it beats
  // the fuzzy app match ("start work" must not become "open Web")
  {
    const qq=q.toLowerCase().trim().replace(/^run\s+/,'');
    const a=(typeof AUTOMATIONS!=='undefined'?AUTOMATIONS:[])
      .find(x=>x.name.toLowerCase()===qq)||
      (qq.length>=3?(typeof AUTOMATIONS!=='undefined'?AUTOMATIONS:[]).find(x=>x.name.toLowerCase().startsWith(qq)):null);
    if(a)act(a.icon||'▶',`Run "${a.name}"`,a.steps.map(automationStepLabel).join(' → ').slice(0,90),()=>runAutomation(a));
  }
  if(m=P(/^(?:open|launch|start|show)\s+(.+)$/i)){
    const hit=palFindApp(m[1]);
    if(hit&&hit.id)act('▸',`Open ${APPS[hit.id].title}`,'AgentOS app',()=>openApp(hit.id));
    if(hit&&hit.nat)act('▸',`Open ${hit.nat.name}`,'system app',()=>launchNative(hit.nat.id,hit.nat.name));
  }
  if(m=P(/^close\s+(.+)$/i)){
    const hit=palFindApp(m[1]);
    if(hit&&hit.id&&winsOf(hit.id).length)act('✕',`Close ${APPS[hit.id].title}`,`${winsOf(hit.id).length} window(s)`,()=>winsOf(hit.id).forEach(w=>closeWin(w)));
  }
  if(m=P(/^(?:make it |go |switch to |theme )?(dark|light)(?:\s*mode)?$/i)){
    const dark=m[1].toLowerCase()==='dark';
    const name=dark?'agentos':'field';
    act(dark?'◐':'◑',`Switch to ${dark?'dark':'light'} mode`,`theme: ${name}`,()=>{applyTheme(name);toast((dark?'dark':'light')+' mode')});
  }
  if(m=P(/^theme\s+(.+)$/i)){
    const all=allThemes(),qq=m[1].toLowerCase().trim();
    const id=Object.keys(all).find(k=>k.toLowerCase()===qq)||Object.keys(all).find(k=>k.toLowerCase().includes(qq));
    if(id)act('◧',`Apply theme "${id}"`,'switch the whole desktop',()=>{applyTheme(id);toast('theme: '+id)});
  }
  if(m=P(/^(?:set\s+)?vol(?:ume)?\s+(?:to\s+)?(\d{1,3})%?$/i)){
    const v=Math.min(100,+m[1]);
    act('◈',`Volume ${v}%`,'set the output volume',()=>{ctlSet({volume:v});toast('volume '+v+'%')});
  }
  if(P(/^mute$/i))act('◈','Mute','silence the output',()=>{ctlSet({mute:true});toast('muted')});
  if(P(/^unmute$/i))act('◈','Unmute','sound back on',()=>{ctlSet({mute:false});toast('unmuted')});
  if(m=P(/^(?:set\s+)?brightness\s+(?:to\s+)?(\d{1,3})%?$/i)){
    const v=Math.min(100,+m[1]);
    if(cap('display.brightness').available)act('☼',`Brightness ${v}%`,'set the display brightness',
      async()=>{await fetch('/api/brightness',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({percent:v})});toast('brightness '+v+'%')});
  }
  if(m=P(/^(?:connect(?:\s+to)?\s+)?wi-?fi(?:\s+(.+))?$/i)){
    act('⌁',m[1]?`Join Wi-Fi "${m[1].trim()}"`:'Wi-Fi settings','open Network settings',()=>{openApp('syssettings')});
  }
  if(P(/^lock(?:\s+(?:the\s+)?screen)?$/i))act('⌗','Lock screen','',()=>powerDo('lock','Lock the screen?'));
  if(P(/^(?:suspend|sleep)$/i))act('☾','Suspend','put the machine to sleep',()=>powerDo('suspend','Suspend the machine?'));
  if(P(/^(?:restart|reboot)(?:\s+(?:the\s+)?(?:machine|computer|pc))?$/i))act('↻','Restart the machine','',()=>powerDo('restart','Restart the machine?'));
  if(P(/^(?:power\s*off|shut\s*down)$/i))act('⏻','Power off','',()=>powerDo('poweroff','Power off the machine?'));
  if(P(/^log\s*out$/i))act('⇥','Log out','end this session',()=>powerDo('logout','Log out of this session? Unsaved work in other apps will be lost.'));
  if(P(/^(?:take\s+a\s+)?screenshot$/i)&&cap('screen.capture').available)
    act('▣','Take a screenshot','saved to your workspace',()=>takeScreenshot('full'));
  if(m=P(/^wallpaper\s+(?:of\s+)?(.{3,})$/i)){
    const p=m[1];
    act('❋',`Generate wallpaper: “${p}”`,`${agentName()} paints it in the background`,
      async()=>{toast('generating wallpaper…');const r=await fetch('/api/wallpaper/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});const d=await r.json().catch(()=>({}));if(!r.ok)toast(d.error||'generation failed')});
  }
  if(m=P(/^desktop\s+([1-9])$/i)){const n=+m[1];if(n<=DESKS)act('▦',`Go to desktop ${n}`,'',()=>switchDesk(n))}
  if(P(/^(?:dnd|do not disturb)(?:\s+on)?$/i))act('◌','Do not disturb on','silence notifications',()=>{toggleDnd(true);toast('do not disturb on')});
  if(P(/^(?:dnd|do not disturb)\s+off$/i))act('◌','Do not disturb off','',()=>{toggleDnd(false);toast('do not disturb off')});
  // arithmetic: the answer inline, Enter copies it
  if(/^[\d\s+\-*/().^%]+$/.test(q)&&/\d/.test(q)&&/[+\-*/^%]/.test(q)){
    try{
      const v=Function('"use strict";return ('+q.replace(/\^/g,'**')+')')();
      if(typeof v==='number'&&isFinite(v)){
        const r=Math.round(v*1e10)/1e10;
        act('=',`${q} = ${r}`,'Enter copies the result',()=>{try{navigator.clipboard.writeText(String(r))}catch(e){}toast('copied '+r)});
      }
    }catch(e){}
  }
  return out;
}
/* model fallback: when the grammar misses, ask the server to classify the intent
   (debounced; appends a suggested action row when it answers) */
let palIntentT=0,palIntentSeq=0;
function palIntentAsync(q){
  clearTimeout(palIntentT);
  if(!q||q.length<8||q.split(/\s+/).length<2)return;
  const seq=++palIntentSeq;
  palIntentT=setTimeout(async()=>{
    try{
      const r=await fetch('/api/intent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});
      if(!r.ok)return;
      const d=await r.json();
      if(seq!==palIntentSeq||!omniOpen()||$('#omni-in').value.trim()!==q)return;   // stale
      if(!d||!d.action||d.action==='chat'||d.action==='ask')return;
      const row={icon:'✦',label:d.label||`Do it: ${q}`,hint:d.hint||'suggested action',intent:true,
        run:()=>{shellCmd({id:'',action:d.action,args:{target:d.target}});}};
      OMNI.matches.splice(Math.max(0,OMNI.matches.length-1),0,row);
      omniPaint();
    }catch(e){}
  },350);
}
function palAsk(q){
  // quick asks flow through the omnibar's Desktop thread (an answer card),
  // not a full Chat window — escalation is one click on the card
  if(typeof omniAsk==='function'){omniAsk(q);return}
  openApp('chat');
  if(input){input.value=q;input.dispatchEvent(new Event('input'));send()}
}

function scLoad(){
  const saved=(cfg&&cfg.shortcuts)||{};
  Object.keys(SC_DEFAULTS).forEach(k=>{
    SHORTCUTS[k]={...SC_DEFAULTS[k],...(saved[k]?{keys:saved[k]}:{})};
  });

function scParse(keys){
  const p={ctrl:false,alt:false,shift:false,meta:false,key:''};
  String(keys||'').split('+').map(s=>s.trim()).filter(Boolean).forEach(part=>{
    const l=part.toLowerCase();
    if(l==='ctrl'||l==='control')p.ctrl=true;
    else if(l==='alt'||l==='option')p.alt=true;
    else if(l==='shift')p.shift=true;
    else if(l==='meta'||l==='cmd'||l==='super'||l==='win')p.meta=true;
    else p.key=part;
  });
  return p;
}
/* "Left" in a binding and "ArrowLeft" from the browser are the same key — one
   normaliser so the table can be written the way a person would say it. */
const SC_ALIAS={left:'arrowleft',right:'arrowright',up:'arrowup',down:'arrowdown',
  esc:'escape',ret:'enter',return:'enter',del:'delete',ins:'insert',
  pgup:'pageup',pgdn:'pagedown','↑':'arrowup','↓':'arrowdown','←':'arrowleft','→':'arrowright'};
function scKeyName(k){k=String(k||'').toLowerCase();return SC_ALIAS[k]||k}
function scMatch(e,keys){
  const p=scParse(keys);if(!p.key)return false;
  // Cmd and Ctrl are interchangeable so the same table feels native on a Mac
  const modOk=(p.ctrl?(e.ctrlKey||e.metaKey):(p.meta?e.metaKey:!e.ctrlKey&&!e.metaKey))
    &&(!!p.alt===!!e.altKey)&&(!!p.shift===!!e.shiftKey);
  if(!modOk)return false;
  const want=scKeyName(p.key);
  if(want==='space')return e.code==='Space';
  return scKeyName(e.key)===want||(e.code||'').toLowerCase()==='key'+want;
}
const SC_ACTIONS={
  'omnibar.focus':()=>omniFocus(),
  'omnibar.focus2':()=>omniFocus(),
  'palette':()=>omniFocus(),
  'expose':()=>exposeToggle(),
  'expose.f3':()=>exposeToggle(),
  'windows.arrange':()=>arrangeWindows(),
  'desktop.prev':()=>switchDeskBy(-1),
  'desktop.next':()=>switchDeskBy(1),
  'desktop.move.prev':()=>moveActiveDeskBy(-1),
  'desktop.move.next':()=>moveActiveDeskBy(1),
  'switcher':e=>switcherOpen(e&&e.shiftKey?-1:1),
  'window.close':()=>{const a=activeWin();if(a)closeWin(a)},
  'window.minimize':()=>{const a=activeWin();if(a)minimizeWin(a)},
  'window.maximize':()=>{const a=activeWin();if(a)toggleMax(a)},
  'chat.new':()=>{openApp('chat');newChat()},
  'chat.open':()=>openApp('chat'),
  'agent.stop':()=>stopAllAgents(),   // works while typing, in any app, in any window
  'copilot':()=>{                     // works in full screen too — the panel is inside the window
    const a=activeWin();
    if(a)toggleCopilot(a);else omniFocus();
  },
  'terminal':()=>{omniPop(false);openApp('terminal')},
  'settings':()=>openApp('settings'),
  'voice':()=>jarvisMode(!JARVIS.on),
  'fullscreen':()=>toggleFullscreen(),
  'help':()=>keysHelp(),
  'deck':()=>deckToggle(),
  // named so hot corners and automation steps reach exactly the same behaviours
  // the keyboard does — one vocabulary, three ways to trigger it
  'showdesktop':()=>toggleShowDesktop(),
  'launcher':()=>toggleStart(),
  'control':()=>toggleControlCenter(),
  'notifications':()=>openNotifPanel(),
};
function scRun(name,e){const f=SC_ACTIONS[name];if(f){f(e);return true}return false}

document.addEventListener('keyup',e=>{if(e.key==='Control'||e.key==='Meta'||e.key==='Alt')switcherCommit()});
document.addEventListener('keydown',e=>{
  const inTerm=e.target.closest&&e.target.closest('.xterm');
  // "Typing" means a field with something in it. The prompt bar holds the caret
  // by default, so treating an EMPTY bar as typing would mute every desktop
  // shortcut on a fresh desktop — which is where you need them most.
  const el=document.activeElement;
  const inField=/^(input|textarea|select)$/i.test((el&&el.tagName)||'')||!!(el&&el.isContentEditable);
  const idleBar=el&&el.id==='omni-in'&&!el.value&&!(typeof OMNI!=='undefined'&&OMNI.pop);
  const typing=inField&&!idleBar;
  if(SC_REC)return;                       // a Settings row is recording a new binding
  // window switcher first: Alt+Tab is also accepted (sway forwards it in session mode)
  if((cmd(e)||e.altKey)&&e.key==='Tab'){e.preventDefault();switcherOpen(e.shiftKey?-1:1);return}
  const fsw=[...WM.wins.values()].find(w=>w.fs);
  if((e.key==='Escape'||(e.key.toLowerCase()==='f'&&!typing&&!inTerm))&&fsw){e.preventDefault();toggleFullWin(fsw);return}
  if(e.key==='Escape'){if(EXPO.on){exposeToggle(false);return}if(SW.open){switcherCommit();return}
    if($('#keyshelp').classList.contains('show')){keysHelp(false);return}}
  if(e.key==='?'&&!typing){e.preventDefault();keysHelp();return}
  if(cmd(e)&&!e.altKey&&e.key.toLowerCase()==='a'&&!typing&&!inTerm&&!activeWin()){
    e.preventDefault();launcherIds().forEach(id=>setSel(id,true));return}
  // everything else comes from the (editable) table
  for(const name in SHORTCUTS){
    const sc=SHORTCUTS[name];
    if(!scMatch(e,sc.keys))continue;
    // window actions need a window; typing surfaces keep their own text editing keys
    if(name.startsWith('window.')&&!activeWin())continue;
    // Ctrl+←/→ is word-jump inside text; these bindings stand aside while typing
    if(sc.typing===false&&(typing||inTerm))continue;
    if(name==='agent.stop'){e.preventDefault();scRun(name,e);return}   // never blocked
    if(inTerm&&!['omnibar.focus','omnibar.focus2','palette','chat.open','expose','fullscreen','help'].includes(name))continue;
    e.preventDefault();scRun(name,e);return;
  }
  if(e.ctrlKey&&!e.shiftKey&&!e.altKey&&/^[1-9]$/.test(e.key)&&!inTerm){
    const n=+e.key;if(n<=DESKS){e.preventDefault();switchDesk(n)}}
});


/* ---- the session's Alt-Tab overlay -------------------------------------
   In session mode the compositor owns Alt-Tab, so the shell cannot see the key
   at all — it is told what to draw. Same overlay as the in-shell switcher, fed
   from the server's ring (the AgentOS desktop, then every native window). */
function sessionSwitcher(ev){
  const box=$('#switcher');if(!box)return;
  if(!ev.open){box.classList.remove('show');return}
  const ring=ev.ring||[];
  $('#swbox').innerHTML=ring.map((w,i)=>{
    const icon=w.shell?appIcon('chat',48)
      :(typeof natIcon==='function'?natIcon(w,48):emojiIcon('▭',48));
    const name=w.shell?'Desktop'
      :((typeof natName==='function'?natName(w):w.app)||w.title||'window');
    return `<div class="swcard${i===ev.idx?' sel':''}">${icon}<span class="sn">${esc(name)}</span></div>`;
  }).join('');
  box.classList.add('show');
}
/* ================= logo ================= */
// A refined AgentOS mark: a rounded upward triangle (agency/ascent) with an agent "eye" node.
const LOGO_GLYPH=`<svg viewBox="0 0 24 24" width="64%" height="64%" style="display:block">
  <path d="M12 4.3 L19.6 18.4 Q20.1 19.3 19.1 19.3 L4.9 19.3 Q3.9 19.3 4.4 18.4 Z" fill="#04211c"/>
  <path d="M12 10.2 L15.9 17.6 L8.1 17.6 Z" fill="rgba(255,255,255,.22)"/>
  <circle cx="12" cy="8.6" r="1.5" fill="#04211c"/>
</svg>`;
function paintLogo(){document.querySelectorAll('.mark').forEach(m=>{m.innerHTML=LOGO_GLYPH})}

/* ================= init ================= */
paintLogo();
buildDesktop();
buildPager();
buildDock();
deckLoad();buildDeck();
/* the tray opens Control Center as a popover (macOS-style), not an app window */
$('#tray-ctl').onclick=e=>{e.stopPropagation();toggleControlCenter()};
$('#tray-voice').onclick=()=>jarvisMode(!JARVIS.on);
$('#tray-voice').innerHTML=svgMic(14);
/* power & session menu — AgentOS as the desktop environment carries real session
   controls in its menu bar (the boot-to-AgentOS direction) */
$('#tray-power').onclick=e=>{e.stopPropagation();
  const m=$('#powermenu');
  const on=!m.classList.contains('show');
  m.classList.toggle('show',on);
  if(on)popIn(m,{origin:'top right'});
};
document.addEventListener('click',e=>{
  if(!e.target.closest('#powermenu')&&!e.target.closest('#tray-power'))$('#powermenu').classList.remove('show');
});
async function powerDo(action,confirmMsg){
  $('#powermenu').classList.remove('show');
  const danger=['logout','restart','poweroff'].includes(action);
  if(confirmMsg&&!await osConfirm(confirmMsg,danger?'Anything unsaved in other apps will be lost.':'',
    {confirmText:{lock:'Lock',suspend:'Suspend',logout:'Log out',restart:'Restart',poweroff:'Power off','agentos-restart':'Restart'}[action]||'OK',danger}))return;
  try{
    const r=await fetch('/api/power',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
    const d=await r.json();
    if(!r.ok)return toast(d.error||action+' failed');
    if(action==='agentos-restart')toast('AgentOS is restarting — the desktop reconnects automatically');
    else toast('✓ '+action);
  }catch(e){toast(action+': '+e)}
}
$('#j-mic').innerHTML=svgMic(22);
$('#j-mic').onclick=()=>{if(JARVIS.phase==='listening'){try{JARVIS.rec.stop()}catch(e){}}else jarvisListen()};
$('#j-close').onclick=()=>jarvisMode(false);
$('#tray-bell').onclick=e=>{e.stopPropagation();openNotifPanel()};
document.addEventListener('click',e=>{
  if(!e.target.closest('#notifpanel')&&!e.target.closest('#tray-bell'))$('#notifpanel').classList.remove('show');
});
updateTray();setInterval(updateTray,15000);
// Polling is the fallback; the first compositor 'wm' event switches the
// taskbar to event-driven updates (see the WebSocket handler).
updateNativeWindows();NATIVE_POLL=setInterval(updateNativeWindows,1200);
tickClock();setInterval(tickClock,5000);
loadWallpaper();
loadThemes();
loadAutomations();   // the palette and the hot-corner picker both read this list
loadToolNames();     // tool + MCP names for automation steps
loadUserApps().then(loadWidgets);
loadNativeApps();
APPS_READY=true;
if(EXPERIENCE==='jarvis')buildJarvisShell();   // APPS now defined — populate the shell if a theme selected it early
connect();
/* the splash leaves when the desktop is actually ready (config + platform +
   setup state loaded), not on a timer; 8s is the give-up cap so a wedged
   endpoint can never trap the user behind the splash */
(async()=>{
  const t0=performance.now();
  try{
    await Promise.race([
      Promise.allSettled([loadPlatform(),loadConfig(),checkSetup()]),
      new Promise(r=>setTimeout(r,8000)),
    ]);
  }catch(e){}
  const wait=Math.max(0,650-(performance.now()-t0));   // let the mark breathe — no sub-frame flash
  setTimeout(()=>{
    const b=$('#boot');if(b){b.classList.add('off');setTimeout(()=>b.remove(),500)}
    if($('#setup-wiz'))return;
    // the prompt bar owns the caret from the first frame — the OS is ready to be told what to do
    const oi=$('#omni-in');if(oi)setTimeout(()=>oi.focus(),60);
  },wait);
})();
</script>
