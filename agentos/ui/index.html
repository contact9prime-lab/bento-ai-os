function handle(ev){
  if(ev.type&&ev.type.startsWith('build_')){studioBuildEvent(ev);if(ev.type==='build_thinking')jrPulse=Math.min(1.6,jrPulse+.12);return;}
  const _cid=ev.conversation_id, _cur=!_cid||_cid===currentConv, _s=_cid?STREAMS[_cid]:null;
  const _sk=_cid?CHAT_SINKS.get(_cid):null;
  switch(ev.type){
    case 'state_sync':{ // sent on every (re)connect: what is actually still running
      RUNNING.clear();
      (ev.running||[]).forEach(c=>{RUNNING.add(c);if(!STREAMS[c])STREAMS[c]={html:'',text:''}});
      for(const k in QUEUES)delete QUEUES[k];
      Object.assign(QUEUES,ev.queues||{});      // the backlog survives a reload too
      renderQueue();
      if(currentConv&&RUNNING.has(currentConv)){setRunning(true);showWorking();}
      else{setRunning(false);removeWorking();}
      updateSpin();
      if(window.STUDIO){
        if(ev.build_running){
          if(!STUDIO.building){STUDIO.building=true;const b=$('#st-build');if(b){b.textContent='Cancel';b.classList.add('stop')}studioTickStart();studioLog('<span class="mut">re-attached to the running build…</span>');}
        }else if(STUDIO.building){studioBuildEnded();studioLog('<span class="mut">the build ended while disconnected — check the app list</span>');if(typeof loadUserApps==='function')loadUserApps();}
      }
      break;}
    case 'status':{ // model-side heartbeat ("loading model / evaluating prompt…")
      if(_sk&&_sk.status)_sk.status(ev);
      if(!_cur)break;
      WORK_MSG=ev.message||'';
      if(running)showWorking();       // keep a live indicator up between/after tool calls
      break;}
    case 'conversation':{
      // omnibar/copilot threads announce themselves with an origin — they must
      // never steal the Chat window's current conversation
      if(typeof claimConversation==='function'&&claimConversation(ev)){loadConvs();break}
      currentConv=ev.id; loadConvs(); break;}
    case 'turn_start':{
      if(_cid){RUNNING.add(_cid);STREAMS[_cid]={html:'',text:''};}
      if(_cur)setRunning(true);
      updateSpin();
      if(_sk&&_sk.start)_sk.start(ev);
      loadConvs(); break;}
    case 'text_delta':{
      if(_s)_s.text+=ev.text;
      if(_sk&&_sk.delta)_sk.delta(ev.text,_s?_s.text:'');
      if(!_cur)break;
      curText+=ev.text;
      WORK_MSG='';removeWorking(); // real text is flowing now — drop the "working" placeholder
      if(JARVIS.busy){const r=$('#j-reply');if(r){r.textContent=curText;r.scrollTop=r.scrollHeight}}
      if(!curBody)startAssistant();
      if(curBody){curBody.innerHTML=md(curText);curBody.style.transform='translateZ(0)';scrollDown()} break;}
    case 'thinking_delta':{
      if(_sk&&_sk.thinking)_sk.thinking(ev.text);
      if(!_cur)break;
      if(!curBody)startAssistant();
      if(!curBody)break;
      if(!curThink){curThink=document.createElement('div');curThink.className='think';curBody.parentNode.insertBefore(curThink,curBody);}
      curThink.textContent+=ev.text; curThink.scrollTop=curThink.scrollHeight; scrollDown(); break;}
    case 'tool_start':{
      const argStr=ev.name==='run_command'?(ev.args.command||''):JSON.stringify(ev.args);
      if(_s){ // mirror into the buffer so switching chats mid-turn is lossless
        if(_s.text.trim())_s.html+='<div class="body">'+md(_s.text)+'</div>';
        _s.text='';
        _s.html+=`<div class="tool" data-buf="1"><div class="head"><span class="tname2">${esc(ev.name)}</span><span class="targ">${esc(argStr)}</span><span class="tstat run" data-b="${ev.call_id}">running</span></div><div class="out"></div></div>`;}
      if(typeof agentHands==='function')agentHands(ev);   // visible hands: glow the affected app
      if(_sk&&_sk.toolStart)_sk.toolStart(ev,argStr);
      if(!_cur)break;
      if(!curBody)startAssistant();
      if(!curBody)break;
      flushText();
      const card=document.createElement('div');card.className='tool';card.id='tc-'+ev.call_id;
      card.innerHTML=`<div class="head"><span class="tname2">${esc(ev.name)}</span><span class="targ">${esc(argStr)}</span><span class="tstat run">${ev.pending_approval?'awaiting approval':'running'}</span></div><div class="out"></div>`;
      card.querySelector('.head').onclick=()=>card.classList.toggle('open');
      curBody.parentNode.insertBefore(card,curBody); scrollDown(); break;}
    case 'tool_end':{
      if(_s)_s.html=_s.html.replace(`class="tstat run" data-b="${ev.call_id}">running`,
        `class="tstat ${ev.ok?'ok':'fail'}" data-b="${ev.call_id}">${ev.ok?'done':'failed'}`);
      if(_sk&&_sk.toolEnd)_sk.toolEnd(ev);
      if(!_cur)break;
      const card=$('#tc-'+ev.call_id);
      if(card){const st=card.querySelector('.tstat');st.className='tstat '+(ev.ok?'ok':'fail');st.textContent=ev.ok?'done':'failed';
        card.querySelector('.out').textContent=ev.output||'(no output)';
        if(!ev.ok)card.classList.add('open');}
      // the model is about to think about this result — often the slowest gap in a
      // turn; keep a live indicator so it never looks frozen (and repaints on macOS)
      if(running){WORK_MSG='';showWorking()}
      scrollDown(); break;}
    case 'approval_request':{
      const box=buildApprovalBox(ev,_cur);
      if(_sk&&_sk.approval&&_sk.approval(box,ev)){ /* the sink placed it */ }
      else if(_cur&&feed){
        if(!curBody)startAssistant();
        if(curBody)curBody.parentNode.insertBefore(box,curBody);
      }else{ // approval from a chat you're not looking at — float it, never deadlock
        box.style.cssText='position:fixed;right:18px;bottom:70px;z-index:9999;max-width:440px;box-shadow:0 18px 50px rgba(0,0,0,.5)';
        document.body.appendChild(box);
        box.addEventListener('click',()=>setTimeout(()=>{if(box.classList.contains('resolved'))box.remove()},1000));
      }
      toast('approval needed'); scrollDown(); break;}
    case 'error':{
      if(_s){if(_s.text.trim()){_s.html+='<div class="body">'+md(_s.text)+'</div>';_s.text='';}
        _s.html+='<div class="errmsg">'+esc(ev.message)+'</div>';}
      if(_sk&&_sk.error){_sk.error(ev);if(!_cur)break}
      if(!_cur){toast('chat error: '+ev.message);break}
      if(!curBody)startAssistant();
      if(!curBody){toast('error: '+ev.message);break}
      flushText();
      const d=document.createElement('div');d.className='errmsg';d.textContent=ev.message;
      curBody.parentNode.insertBefore(d,curBody); scrollDown(); break;}
    case 'turn_end':{
      if(_cid){RUNNING.delete(_cid);delete STREAMS[_cid];agentQueueFlush(_cid);}
      updateSpin();
      if(!_cur){AIB.seen++;setTimeout(()=>{if(!RUNNING.size){AIB.seen=0;aiBubble()}},20000)}
      if(_sk&&_sk.end){_sk.end(ev);if(!_cur){aiBubble();loadConvs();break}}
      if(!_cur){aiBubble();loadConvs();break}
      removeWorking();const reply=curText;
      if(JARVIS.on&&JARVIS.busy){JARVIS.busy=false;jarvisSpeakAndListen(reply);}
      else speak(reply);
      setRunning(false); curBody=null; curThink=null; curText=''; loadConvs(); break;}
    case 'queue_update':{
      if(ev.queue&&ev.queue.length)QUEUES[_cid]=ev.queue; else delete QUEUES[_cid];
      if(_sk&&_sk.queue)_sk.queue(ev);
      renderQueue();
      // a queued message just became its own turn — it needs the bubble send() skipped
      if(ev.started&&_cur&&feed){userBubble(ev.started.text||'',[]);showWorking();scrollDown()}
      if(ev.added&&!_cur)toast('queued in another chat');
      break;}
    case 'steer':{ // the running turn decided what to do with a queued message
      if(_sk&&_sk.steer)_sk.steer(ev);
      if(ev.mode==='now'){
        const line='took in: '+ev.text;
        if(_s){if(_s.text.trim()){_s.html+='<div class="body">'+md(_s.text)+'</div>';_s.text=''}
          _s.html+='<div class="steer">'+esc(line)+'</div>';}
        if(_cur){
          if(!curBody)startAssistant();
          if(curBody){flushText();
            const d=document.createElement('div');d.className='steer';d.textContent=line;
            d.title=ev.reason||'';curBody.parentNode.insertBefore(d,curBody);scrollDown()}
        }
        toast('folded into the running turn');
      }else if(_cur)toast('queued for after this turn');
      break;}
    case 'task_started': toast('background task running…'); break;
    case 'task_finished': toast('task done: '+(ev.result||'').slice(0,80)); loadConvs(); break;
    case 'control':    // a hardware key changed volume/brightness — show it at once
      updateTray();refreshApp('control');
      if(ev.volume!==undefined)toast('volume '+ev.volume+'%'+(ev.muted?' (muted)':''));
      else if(ev.brightness!==undefined)toast('brightness '+ev.brightness+'%');
      break;
    case 'platform':   // the compositor appeared (or went away) — re-read what we can do
      loadPlatform().then(()=>{updateNativeWindows();refreshApp('syssettings');refreshApp('control')});
      break;
    case 'wallpaper': loadWallpaper(); toast('wallpaper updated'); break;
    case 'shell_cmd': shellCmd(ev); break;   // the agent's hands on this desktop (contract: server shell_command())
    case 'briefing': showBriefing(ev); break;        // "while you were away" — OS-initiated
    case 'suggestion': showSuggestion(ev); break;    // at most one proactive idea at a time
    case 'config': loadConfig().then(()=>{loadModels()}); toast('configuration updated'); refreshApp('policies'); refreshApp('mcp'); break;
    case 'telegram_chats': refreshApp('telegram'); break;
    case 'knowledge_update': refreshApp('memory'); refreshApp('kg'); refreshApp('profile'); break;
    case 'fabric_event': fabricLiveRefresh(); break;
    case 'fabric_defs': refreshApp('fabric'); break;
    case 'setup': location.reload(); break;
    // the desktop is a page, so a new build only appears after a reload — this is
    // how a deploy reaches the screen without the user hunting for Ctrl+R
    case 'reload': setTimeout(()=>location.reload(),ev.delay||400); break;
    // back from suspend or the lock screen: the page may have been frozen for
    // hours, so repaint the things that go stale rather than sit there wrong
    case 'wake': onWake(); break;
    case 'switcher': sessionSwitcher(ev); break;   // Alt-Tab overlay, driven by sway
    case 'apps': loadUserApps(); refreshApp('studio'); toast('app library updated'); break;
    case 'grants': refreshApp('permissions'); if(ev.revoked)reloadAppFrames(); break;
    case 'widgets': if(Date.now()>widgetEchoUntil)loadWidgets(); break;
    case 'snapshots': refreshApp('snapshots'); break;
    case 'themes': loadThemes().then(()=>refreshApp('themes')); break;
    case 'automations': loadAutomations().then(()=>refreshApp('automations')); break;
    // the server never runs an automation itself — it says "run this" and the
    // desktop does, so a schedule, the agent's tool and the palette all land in
    // the same runner
    case 'automation.run': onAutomationBroadcast(ev.automation); break;
    case 'theme_apply':{const t=ev.theme;if(t){if(t.name)CUSTOM_THEMES[t.name]=t;applyThemeObj(t);if(t.name){CURRENT_THEME=t.name;localStorage.setItem('theme',t.name)}toast('theme applied: '+(t.name||''));refreshApp('themes')} break;}
    case 'train_setup': TRAIN_SETUP_LISTENERS.forEach(fn=>{try{fn(ev)}catch(e){}}); break;
    case 'hermes_setup': HERMES_SETUP_LISTENERS.forEach(fn=>{try{fn(ev)}catch(e){}}); break;
    case 'files': refreshApp('files'); break;
    case 'models': refreshApp('models'); loadModels(); break;
    case 'model_pull':{const p=$('#mdl-prog');if(p)p.textContent=ev.done?'':(''+ev.name+': '+ev.status);
      if(ev.done){refreshApp('models');toast(''+ev.name+' '+(String(ev.status).startsWith('error')?ev.status:'ready'))} break;}
    case 'telegram_in':{
      toast('Telegram: '+ev.text); jarvisOn(3);
      loadConvs(); if(feed&&currentConv===ev.conversation_id&&!RUNNING.has(currentConv))openConv(currentConv); break;}
    case 'telegram_out':{
      jarvisOff();
      loadConvs(); if(feed&&currentConv===ev.conversation_id&&!RUNNING.has(currentConv))openConv(currentConv); break;}
    case 'wm':{ // compositor event (AgentOS session) — replaces window polling
      if(NATIVE_POLL){clearInterval(NATIVE_POLL);NATIVE_POLL=null}
      clearTimeout(wmDebounce);
      wmDebounce=setTimeout(()=>{updateNativeWindows();
        if(ev.event==='output'||ev.event==='workspace')refreshApp('syssettings')},120);
      break;}
    case 'notification':{ // a native app's notification, via our own daemon
      toast((ev.app?ev.app+': ':'')+ev.summary); updateBell(); break;}
    case 'notification_center': updateBell(); break;
  }
  if(ev.type==='thinking_delta')jrPulse=Math.min(1.6,jrPulse+.12);
}

function flushText(){

    curBody.parentNode.insertBefore(d,curBody);}

function startAssistant(){

/* Coming back from suspend or the lock screen. The page was alive but frozen:
   the clock is wrong, the window list is from before, and the wallpaper canvas
   may have lost its GPU context. Repaint what goes stale — and if the page is
   genuinely broken (no websocket after a grace period), reload it rather than
   leave the user staring at a dead desktop with no way back. */
function onWake(){
  try{
    if(typeof tickClock==='function')tickClock();
    if(typeof updateNativeWindows==='function')updateNativeWindows();
    if(typeof loadPlatform==='function')loadPlatform();
    if(typeof loadWallpaper==='function')loadWallpaper();
    if(typeof deckMeasure==='function')deckMeasure();
    document.body.classList.remove('dock-hide','dock-peek');
  }catch(e){}
  setTimeout(()=>{
    const live=(typeof ws!=='undefined'&&ws&&ws.readyState===1);
    if(!live)location.reload();
  },4000);
}
/* ================= chat app ================= */

function renderChat(body){

function setRunning(r){running=r;
  $('#spin').classList.toggle('on',r);

  if(!sendBtn)return;
  input.placeholder=r?PLACEHOLDER_BUSY:PLACEHOLDER_IDLE;

}
/* One button, two jobs while a turn runs: with something typed it QUEUES that
   message (the running turn gets to decide whether it changes what it's doing);
   empty, it is the stop button it has always been. */
function syncSend(){
  if(!sendBtn||!input)return;
  const has=!!input.value.trim()||PENDING_IMGS.length>0;
  const stop=running&&!has;
  sendBtn.classList.toggle('stop',stop);
  sendBtn.textContent=stop?'◼':'➤';
  sendBtn.title=stop?'Stop the agent':(running?'Queue this — it runs next, or gets folded into what\'s running':'Send');
  sendBtn.disabled=!(has||stop);
}
/* the queue strip above the composer: this conversation's visible to-do list */
function renderQueue(){
  const box=$('#queue'); if(!box)return;
  const q=(currentConv&&QUEUES[currentConv])||[];
  box.classList.toggle('on',q.length>0);
  box.innerHTML='';
  if(!q.length)return;
  const h=document.createElement('div');h.className='qhead';
  h.textContent='Up next · '+q.length;box.appendChild(h);
  q.forEach(i=>{
    const el=document.createElement('div');el.className='qitem'+(i.status==='deferred'?' deferred':'');
    el.innerHTML='<span class="qt"></span><span class="qs"></span><button class="qx" title="remove">✕</button>';
    el.querySelector('.qt').textContent=i.text||'(image)';
    el.querySelector('.qs').textContent=i.status==='deferred'?'after this turn':'queued';
    if(i.reason)el.title=i.reason;
    el.querySelector('.qx').onclick=()=>{
      if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'queue_remove',conversation_id:currentConv,id:i.id}));
    };
    box.appendChild(el);
  });
}
let PENDING_IMGS=[];
function bubbleImgs(el,urls){
  if(!urls||!urls.length)return;
  const g=document.createElement('div');g.className='bimgs';
  urls.forEach(u=>{const im=document.createElement('img');im.src=u;g.appendChild(im)});
  el.appendChild(g);
}
function addPastedImage(file){
  if(!file)return;
  if(PENDING_IMGS.length>=4){toast('up to 4 images per message');return}
  const img=new Image();
  img.onload=()=>{
    const MAX=1568,sc=Math.min(1,MAX/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    // downscale/recompress large pastes (screenshots) so history stays light
    PENDING_IMGS.push((sc<1||file.size>800000)?c.toDataURL('image/jpeg',.9):c.toDataURL('image/png'));
    URL.revokeObjectURL(img.src);renderAttach();
  };
  img.src=URL.createObjectURL(file);
}
function renderAttach(){
  let a=$('#attach');
  if(!PENDING_IMGS.length){a?.remove();syncSend();return}
  if(!a){a=document.createElement('div');a.id='attach';const cb=$('#combox');cb.parentNode.insertBefore(a,cb)}
  a.innerHTML=PENDING_IMGS.map((u,i)=>`<div class="att"><img src="${u}"><button onclick="rmAttach(${i})" title="remove">×</button></div>`).join('');
  syncSend();
}
function rmAttach(i){PENDING_IMGS.splice(i,1);renderAttach()}
function userBubble(text,imgs){
  $('#welcome')?.remove();
  const m=document.createElement('div');m.className='msg user';
  m.innerHTML='<div class="who">you</div><div class="bubble"></div>';
  m.querySelector('.bubble').textContent=text;
  bubbleImgs(m.querySelector('.bubble'),imgs);
  feed.appendChild(m);
  return m;
}
function send(){
  const text=input.value.trim();const imgs=PENDING_IMGS.slice();
  // nothing typed while a turn runs → the button is the stop button
  if(running&&!text&&!imgs.length){ws.send(JSON.stringify({type:'abort',conversation_id:currentConv}));return}
  if((!text&&!imgs.length)||!ws||ws.readyState!==1)return;
  const wasRunning=running;
  // A turn is already running: the server queues this instead of refusing it. The
  // agent triages it at its next step boundary — folded into the live run, or kept
  // as the next turn. Either way the queue strip is the receipt, so no bubble yet.
  if(!wasRunning)userBubble(text,imgs);
  ws.send(JSON.stringify({type:'chat',text,images:imgs,conversation_id:currentConv,model:$('#modelsel').value}));
  input.value='';input.style.height='auto';PENDING_IMGS=[];renderAttach();
  if(wasRunning){syncSend();scrollDown();return}
  showWorking();scrollDown();setRunning(true);
}
let WORK_TICK=null, WORK_T0=0, WORK_MSG='';
function showWorking(){
  if(!feed)return;
  if(!$('#working')){
    const w=document.createElement('div');w.className='working';w.id='working';
    w.innerHTML=`<div class="orb"></div><div class="wtxt">${esc(agentName())} is working</div><div class="dots"><i></i><i></i><i></i></div><div class="wsub" style="font-size:11px;opacity:.6;margin-left:8px"></div>`;
    feed.appendChild(w);
  }
  WORK_T0=WORK_T0||Date.now();
  if(!WORK_TICK)WORK_TICK=setInterval(tickWorking,1000);
}
function tickWorking(){
  const w=$('#working'); if(!w){clearInterval(WORK_TICK);WORK_TICK=null;return}
  const s=Math.round((Date.now()-WORK_T0)/1000);
  const sub=w.querySelector('.wsub');
  if(sub)sub.textContent=WORK_MSG||(s>3?(s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s')+' · working…':'');
  // a visible per-second mutation forces the compositor to repaint — this is what
  // switching tabs was doing manually on macOS to make streamed text appear
  w.style.opacity=(0.999+(s%2)*0.001);
  scrollDown();
}
function removeWorking(){
  $('#working')?.remove();
  if(WORK_TICK){clearInterval(WORK_TICK);WORK_TICK=null}
  WORK_T0=0;WORK_MSG='';
}
async function loadConvs(){
  const box=$('#convs'); if(!box)return;
  const r=await fetch('/api/conversations');const d=await r.json();
  if(!$('#convs'))return;
  box.innerHTML='';
  // the agent's embedded threads (omnibar Desktop, per-app copilots) live in
  // their own sections so app-scoped exchanges never drown the real chats
  const groups=[['Desktop',c=>c.origin==='omni'],
                ['Copilots',c=>(c.origin||'').startsWith('copilot:')],
                ['',c=>c.origin!=='omni'&&!(c.origin||'').startsWith('copilot:')]];
  const row=c=>{
    const el=document.createElement('div');el.className='conv'+(c.id===currentConv?' active':'');
    el.innerHTML=`<span class="t"></span><button class="del">✕</button>`;
    el.querySelector('.t').textContent=(RUNNING.has(c.id)?'● ':'')+(c.title||'untitled');
    if(RUNNING.has(c.id))el.querySelector('.t').style.color='var(--acc,#5eead4)';
    el.onclick=e=>{if(!e.target.classList.contains('del'))openConv(c.id)};
    el.querySelector('.del').onclick=async e=>{e.stopPropagation();
      if(RUNNING.has(c.id))return toast('that chat has a turn running — stop it first');
      await fetch('/api/conversations/'+c.id,{method:'DELETE'});
      if(currentConv===c.id)newChat(); else loadConvs();};
    return el;
  };
  groups.forEach(([label,test])=>{
    const items=d.conversations.filter(test);
    if(!items.length)return;
    if(label){const h=document.createElement('div');h.className='convgrp';h.textContent=label;box.appendChild(h)}
    items.forEach(c=>box.appendChild(row(c)));
  });
}
async function openConv(cid){
  currentConv=cid;
  const r=await fetch('/api/conversations/'+cid);const d=await r.json();
  if(!feed)return;
  curBody=null;curThink=null;curText='';
  feed.innerHTML='';
  d.messages.forEach(msg=>{
    const m=document.createElement('div');m.className='msg '+msg.role;
    if(msg.role==='user'){m.innerHTML='<div class="who">you</div><div class="bubble"></div>';const bb=m.querySelector('.bubble');bb.textContent=msg.content;bubbleImgs(bb,msg.meta?.images);}
    else{m.innerHTML='<div class="who">▲ '+esc(agentName())+'</div>';
      (msg.meta?.steps||[]).forEach(s=>{
        if(s.type==='tool'){const card=document.createElement('div');card.className='tool';
          const argStr=s.name==='run_command'?(s.args.command||''):JSON.stringify(s.args);
          card.innerHTML=`<div class="head"><span class="tname2">${esc(s.name)}</span><span class="targ">${esc(argStr)}</span><span class="tstat ${s.ok?'ok':'fail'}">${s.ok?'done':'failed'}</span></div><div class="out"></div>`;
          card.querySelector('.out').textContent=s.output||'';
          card.querySelector('.head').onclick=()=>card.classList.toggle('open');
          m.appendChild(card);}
        else if(s.type==='steer'){   // something you said mid-run, taken into it
          const d=document.createElement('div');d.className='steer';
          d.textContent='took in: '+(s.text||'');d.title=s.reason||'';m.appendChild(d);}
      });
      const b=document.createElement('div');b.className='body';b.innerHTML=md(msg.content||'');m.appendChild(b);}
    feed.appendChild(m);
  });
  // a turn is live in this conversation: replay its buffered stream and keep streaming
  if(RUNNING.has(cid)){
    startAssistant();
    const s=STREAMS[cid];
    if(s&&curBody){
      if(s.html){const holder=document.createElement('div');holder.innerHTML=s.html;
        [...holder.children].forEach(el=>{
          const h=el.querySelector?.('.head');
          if(h)h.onclick=()=>el.classList.toggle('open');
          curBody.parentNode.insertBefore(el,curBody)});}
      curText=s.text;curBody.innerHTML=md(curText);
    }
    showWorking();
  }
  setRunning(RUNNING.has(cid));
  renderQueue();
  loadConvs();scrollDown();
}

async function loadModels(){

const pSwitch=(id,on)=>`<label class="psw"><input type="checkbox" id="${id}" ${on?'checked':''}><i></i></label>`;
/* A stored secret is never put back into an input: it shows as a locked chip

async function saveSettings(){
  // only the open category is in the DOM, so save exactly what is on screen —
  // reading a field from a hidden tab would throw and lose the whole save
  const el=id=>document.getElementById(id);
  const val=id=>{const e=el(id);return e?e.value:undefined};
  const on=id=>{const e=el(id);return e?e.checked:undefined};
  const list=id=>{const v=val(id);return v===undefined?undefined:v.split(',').map(x=>x.trim()).filter(Boolean)};
  const put=(o,k,v)=>{if(v!==undefined&&v!=='')o[k]=v;return o};
  const prov=(key,idOn,idKey,idModels,idUrl)=>{
    const o={};
    if(on(idOn)!==undefined)o.enabled=on(idOn);
    const k=val(idKey);
    if(k!==undefined&&k!==''&&!k.startsWith('•'))o.api_key=k;   // masks are display-only
    if(list(idModels)!==undefined)o.models=list(idModels);
    if(idUrl&&val(idUrl)!==undefined)o.base_url=val(idUrl);
    return Object.keys(o).length?o:undefined;
  };
  if(el('v-tts')){
    VOICE.tts=on('v-tts');VOICE.voice=val('v-voice')||'';
    VOICE.rate=+val('v-rate')||1;VOICE.lang=(val('v-lang')||'').trim()||'en-IN';
    saveVoice();
  }
  const patch={};
  put(patch,'workspace',val('s-workspace'));
  if(val('s-steps')!==undefined)patch.max_steps=+val('s-steps')||25;
  if(val('s-name')!==undefined)patch.agent_name=(val('s-name')||'').trim()||'Aria';
  if(on('s-sb-on')!==undefined)patch.sandbox={enabled:on('s-sb-on'),root:(val('s-sb-root')||'').trim()};
  const providers={};
  const add=(k,v)=>{if(v)providers[k]=v};
  add('ollama',val('s-ollama-url')!==undefined?{base_url:val('s-ollama-url')}:undefined);
  add('anthropic',prov('anthropic','s-ant-on','s-ant-key','s-ant-models'));
  add('openai',prov('openai','s-oai-on','s-oai-key','s-oai-models'));
  add('openrouter',prov('openrouter','s-or-on','s-or-key','s-or-models'));
  add('custom',prov('custom','s-cus-on','s-cus-key','s-cus-models','s-cus-url'));
  add('google',prov('google','s-goo-on','s-goo-key','s-goo-models'));
  if(Object.keys(providers).length)patch.providers=providers;
  if(val('s-build-model')!==undefined)patch.build={model:val('s-build-model')};
  if(val('s-img-prov')!==undefined)patch.image={provider:val('s-img-prov'),model:(val('s-img-model')||'').trim()};
  const ght=(val('s-gh-token')||'').trim();
  if((ght&&!ght.startsWith('•'))||val('s-gh-user')!==undefined)
    patch.github={...(ght&&!ght.startsWith('•')?{token:ght}:{}),username:(val('s-gh-user')||'').trim()};
  if(!Object.keys(patch).length){toast('nothing to save on this page');return}
  await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
  toast('settings saved');loadModels();loadConfig();
}


/* ---- shortcut editor: click a row, press the keys ---- */
let SC_REC=null;
function scRender(){
  const box=$('#sc-list');if(!box)return;
  box.innerHTML=Object.keys(SHORTCUTS).map(name=>{
    const sc=SHORTCUTS[name];
    return `<div class="sc-row" data-n="${esc(name)}">
      <span class="sc-l">${esc(sc.label||name)}${sc.session?'<em>session</em>':''}</span>
      <button class="sc-k">${esc(sc.keys||'—')}</button></div>`;
  }).join('');
  box.querySelectorAll('.sc-row').forEach(r=>{
    r.querySelector('.sc-k').onclick=()=>scRecord(r.dataset.n,r.querySelector('.sc-k'));
  });
}
function scRecord(name,btn){
  if(SC_REC&&SC_REC.btn)SC_REC.btn.classList.remove('rec');
  SC_REC={name,btn};btn.classList.add('rec');btn.textContent='press keys…';
  const done=e=>{
    e.preventDefault();e.stopPropagation();
    if(e.key==='Escape'){cancel();return}
    if(['Control','Alt','Shift','Meta'].includes(e.key))return;      // wait for a real key
    const parts=[];
    if(e.ctrlKey)parts.push('Ctrl');
    if(e.altKey)parts.push('Alt');
    if(e.shiftKey)parts.push('Shift');
    if(e.metaKey)parts.push('Meta');
    let k=e.key;
    if(e.code==='Space')k='Space';
    else if(k.length===1)k=k.toUpperCase();
    parts.push(k);
    const keys=parts.join('+');
    const clash=Object.keys(SHORTCUTS).find(n=>n!==name&&SHORTCUTS[n].keys===keys);
    SHORTCUTS[name].keys=keys;
    cleanup();
    scSave().then(()=>{scRender();toast(clash?`${keys} set — it was also ${SHORTCUTS[clash].label}`:`${keys} set`)});
  };
  const cancel=()=>{cleanup();scRender()};
  const cleanup=()=>{window.removeEventListener('keydown',done,true);SC_REC=null};
  window.addEventListener('keydown',done,true);
}
async function scSave(){
  const out={};Object.keys(SHORTCUTS).forEach(n=>out[n]=SHORTCUTS[n].keys);
  cfg.shortcuts=out;
  try{
    await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({shortcuts:out})});
    scApplySession(true);
  }catch(e){toast('could not save shortcuts')}
}
async function scReset(){
  SHORTCUTS=JSON.parse(JSON.stringify(SC_DEFAULTS));
  await scSave();scRender();toast('shortcuts restored');
}
async function scApplySession(quiet){
  try{
    const r=await fetch('/api/shortcuts/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    const d=await r.json();
    if(!quiet)toast(d.message||(d.ok?'session shortcuts applied':'not in session mode'));
  }catch(e){if(!quiet)toast('could not reach the session')}
}

      <p class="mut" style="margin-top:8px;font-size:12px">Memory and skills access (<code>use_skill</code>, <code>recall</code>, <code>kg_query</code>, <code>remember</code>) is always included.</p>`;

function sawRefreshList(){
  const box=$('#sw-list'),d=SAW.d,q=SAW.q.toLowerCase().trim();
  if(!box)return;
  const hit=t=>!q||t.name.toLowerCase().includes(q)||(t.description||'').toLowerCase().includes(q);
  // group: OS tools first, then one group per connected MCP server (mcp_<server>_<tool>)
  const groups={};
  SAW.tools.filter(hit).forEach(t=>{
    const g=t.name.startsWith('mcp_')?('MCP · '+(t.name.split('_')[1]||'server')):'OS tools';
    (groups[g]=groups[g]||[]).push(t);
  });
  const row=t=>{const on=d.tools.includes(t.name);
    return `<label class="sawrow ${on?'on':''}"><input type="checkbox" ${on?'checked':''}
      onchange="sawTool('${esc(t.name)}',this.checked);this.closest('.sawrow').classList.toggle('on',this.checked)">
      <div class="grow"><div class="n">${esc(t.name)}</div><div class="d">${esc((t.description||'').slice(0,130))}</div></div></label>`};
  box.innerHTML=Object.entries(groups).map(([g,ts])=>
    `<div class="sawgrp">${esc(g)} · ${ts.length}</div>`+ts.slice(0,80).map(row).join('')).join('')
    ||'<p class="mut" style="padding:8px 2px">Nothing matches — try a different word (search also looks at descriptions).</p>';
  const c=$('#sw-count');
  if(c)c.innerHTML=d.tools.length
    ?`Selected <b style="color:var(--txt)">${d.tools.length}</b>: ${d.tools.slice(0,10).map(esc).join(', ')}${d.tools.length>10?' …':''}`
    :'Nothing selected — it gets the safe read-only set.';
}
function sawCollect(){
  const d=SAW.d;
  if(SAW.step===1){if($('#sw-name'))d.name=$('#sw-name').value.trim();d.soul=$('#sw-soul').value;d.model=$('#sw-model').value;}
  if(SAW.step===3){d.autonomy_cap=$('#sw-cap').value;d.max_steps=+$('#sw-steps').value||12;d.max_seconds=+$('#sw-secs').value||300;}
}
function sawStep(delta){sawCollect();if(SAW.step===1&&delta>0&&!SAW.d.name)return toast('give it a name');SAW.step=Math.min(3,Math.max(1,SAW.step+delta));drawSAW()}
function sawTool(name,on){const t=SAW.d.tools;if(on&&!t.includes(name))t.push(name);if(!on)SAW.d.tools=t.filter(x=>x!==name);
  const c=$('#sw-count');if(c)sawRefreshCount();}
function sawRefreshCount(){const d=SAW.d,c=$('#sw-count');

    ?`Selected <b style="color:var(--txt)">${d.tools.length}</b>: ${d.tools.slice(0,10).map(esc).join(', ')}${d.tools.length>10?' …':''}`
    :'Nothing selected — it gets the safe read-only set.';}
function sawSkill(name,on){const s=SAW.d.skills;if(on&&!s.includes(name))s.push(name);if(!on)SAW.d.skills=s.filter(x=>x!==name)}

function wfLayers(steps){
  const done=new Set(),layers=[];let rem=[...steps];
  while(rem.length){
    let layer=rem.filter(s=>(s.depends_on||[]).every(d=>done.has(d)));
    if(!layer.length)layer=[rem[0]];
    layer.forEach(s=>done.add(s.id));rem=rem.filter(s=>!layer.includes(s));layers.push(layer);
  }return layers;
}
function wfSvg(wf,stepStatus){
  const layers=wfLayers(wf.steps||[]);
  const BW=158,BH=46,GX=200,GY=64,pos={};
  layers.forEach((layer,c)=>layer.forEach((s,r)=>pos[s.id]={x:16+c*GX,y:14+r*GY,s}));
  const H=Math.max(...layers.map(l=>l.length))*GY+22, W=16+layers.length*GX;
  const col=st=>st==='ok'?'var(--ok,#34d399)':st==='running'||st==='start'?'var(--acc,#5eead4)':(st==='error'||st==='timeout')?'var(--err,#f87171)':'var(--line,#333)';
  let lines='',boxes='';
  (wf.steps||[]).forEach(s=>{(s.depends_on||[]).forEach(d=>{const a=pos[d],b=pos[s.id];if(!a||!b)return;
    lines+=`<path d="M${a.x+BW} ${a.y+BH/2} C ${a.x+BW+24} ${a.y+BH/2}, ${b.x-24} ${b.y+BH/2}, ${b.x} ${b.y+BH/2}" fill="none" stroke="rgba(138,148,166,.5)" stroke-width="1.5" marker-end="url(#arr)"/>`;})});
  Object.values(pos).forEach(({x,y,s})=>{const st=(stepStatus||{})[s.id]||'';
    boxes+=`<g><rect x="${x}" y="${y}" rx="9" width="${BW}" height="${BH}" fill="rgba(255,255,255,.04)" stroke="${col(st)}" stroke-width="1.6">${st==='running'||st==='start'?'<animate attributeName="stroke-opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/>':''}</rect>
      <text x="${x+10}" y="${y+19}" fill="var(--txt,#e6ebf2)" font-size="12" font-weight="600">${esc(s.name||s.id)}</text>
      <text x="${x+10}" y="${y+35}" fill="var(--dim,#8a94a6)" font-size="10">${esc(s.subagent)}${s.model?' · '+esc(s.model.split('/').pop()):''}${st?' · '+st:''}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:${H+10}px"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="rgba(138,148,166,.7)"/></marker></defs>${lines}${boxes}</svg>`;
}

/* ================= first-run setup wizard (agent-led) =================
   Steps 1-2 are minimal forms (they must work before any model exists):
   welcome + name, then pick-a-brain. From step 3 on, the NAMED agent takes
   over: each remaining question arrives as a streamed in-character message
   (POST /api/setup/say) with inline choice chips. Offline-safe end to end —
   every line has a canned fallback baked in here too. */
let WIZ={agent_name:'Aria',autonomy:'balanced',default_model:'',providers:{},autostart:true,
  open_at_login:true,wallpaper_preset:'',voice:false,locale:null,step:1,info:null,convo:[],convoAt:0};

const WIZ_SAY_FALLBACK={
  locale:n=>`One thing that changes every answer: where you are. I read this off the machine — is it right? News, weather, prices and times all follow it.`,
  autonomy:n=>`I'm ${n} — good to meet you. How much should I do on my own? Balanced is a good start: I act freely and check with you before anything risky.`,
  autostart:()=>'Should I keep running in the background — for scheduled jobs, alerts and Telegram — even when this window is closed?',
  de_here:()=>"This is your desktop now, so I'm always here — nothing to install, nothing to start.",
  wallpaper:()=>"Let's make this place yours. Pick a wallpaper to start with — I can generate a custom one for you later.",
  voice:()=>'One more thing — should I speak my replies out loud, or keep things quiet?',
  done:()=>"That's everything — welcome to AgentOS. Let's get to work.",
};
const WIZ_WALLS={ // ids mirror setup.WALLPAPER_PRESETS; CSS gradients, no file written
  aurora:'linear-gradient(135deg,#0b3d40 0%,#123a5e 45%,#3b1d5a 100%)',
  dusk:'linear-gradient(135deg,#1a1533 0%,#3d2456 50%,#7a3b5e 100%)',
  ember:'linear-gradient(135deg,#2b1010 0%,#5e2a1d 55%,#8a5a24 100%)',
  deep:'linear-gradient(135deg,#05070c 0%,#0b1b2b 60%,#10333b 100%)',
};
/* stream one in-character line into `el`; canned fallback if the endpoint is
   unreachable (the endpoint itself falls back server-side on model errors) */
async function wizSay(step,el){
  const body={step,name:WIZ.agent_name,model:WIZ.default_model};
  const prov=Object.keys(WIZ.providers||{})[0];
  if(prov){body.provider=prov;body.key=(WIZ.providers[prov]||{}).api_key||'';}
  try{
    const r=await fetch('/api/setup/say',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok||!r.body)throw 0;
    const rd=r.body.getReader(),dec=new TextDecoder();let got='';
    for(;;){const c=await rd.read();if(c.done)break;
      const t=dec.decode(c.value,{stream:true});if(!t)continue;
      got+=t;el.textContent=got;el.scrollIntoView({block:'end'});}
    if(got.trim())return;
    throw 0;
  }catch(e){el.textContent=(WIZ_SAY_FALLBACK[step]||WIZ_SAY_FALLBACK.done)(WIZ.agent_name)}
}

    </div>

      <div class="row"><select id="wz-prov"><option value="anthropic">Anthropic (Claude)</option><option value="openai">OpenAI</option><option value="openrouter">OpenRouter</option></select>
      <input id="wz-key" placeholder="API key"></div>

function wizDots(on){return `<div class="wiz-dots">${[1,2,3].map(n=>`<span class="${n<=on?'on':''}"></span>`).join('')}</div>`}
function wizCollect(){
  if(WIZ.step===1&&$('#wz-name'))WIZ.agent_name=$('#wz-name').value.trim()||'Aria';
  if(WIZ.step===2&&document.querySelector('input[name="wz-model"]')){

    else{WIZ.default_model=v;WIZ.providers={};}}
}
/* one conversational beat: streamed agent message, then chips (or auto-advance) */
async function wizAsk(){
  const c=$('#wiz-convo');if(!c)return;
  const step=WIZ.convo[WIZ.convoAt];
  if(step===undefined){wizFinish();return}
  const row=document.createElement('div');row.className='wiz-msg';
  row.innerHTML=`<div class="wiz-ava">${esc((WIZ.agent_name||'A')[0].toUpperCase())}</div><div class="wiz-say"></div>`;
  c.appendChild(row);
  Motion.run(row,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:240,easing:EASE.out});
  await wizSay(step,row.querySelector('.wiz-say'));
  const chips=wizChips(step);
  if(!chips){ // confirmation beat (de_here): no question, just move on
    WIZ.convoAt++;setTimeout(wizAsk,900);return}
  c.appendChild(chips);
  Motion.run(chips,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:220,easing:EASE.out});
  c.scrollTop=c.scrollHeight;
}
function wizChips(step){
  let defs=null;
  if(step==='locale'){
    const el=document.createElement('div');el.className='wiz-chips';
    const draw=()=>{
      const lo=(WIZ.locale&&WIZ.locale.locale)||{};
      el.innerHTML=`<button class="wiz-chip rec" data-a="ok">${esc((lo.country_name||lo.country||'?')+' · '+(lo.timezone||'?'))}<em>detected</em></button>
        <button class="wiz-chip" data-a="edit">Somewhere else…</button>`;
      el.querySelector('[data-a=ok]').onclick=b=>wizPicked(el,el.querySelector('[data-a=ok]'));
      el.querySelector('[data-a=edit]').onclick=async()=>{
        const c=await osPrompt('Which country are you in?',{value:lo.country||'',placeholder:'IN, US, GB…',confirmText:'Set'});
        if(c===null)return;
        const tz=await osPrompt('Timezone',{value:lo.timezone||'',placeholder:'Asia/Kolkata',confirmText:'Set'});
        if(tz===null)return;
        WIZ.locale_override={country:(c||'').trim().toUpperCase(),timezone:(tz||'').trim()};
        await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({locale:WIZ.locale_override})});
        try{WIZ.locale=await (await fetch('/api/locale')).json()}catch(e){}
        draw();
      };
    };
    fetch('/api/locale').then(r=>r.json()).then(d=>{WIZ.locale=d;draw()}).catch(()=>draw());
    draw();
    return el;
  }
  if(step==='autonomy')defs=[
    ['Paranoid','asks before every action',()=>WIZ.autonomy='paranoid',false],
    ['Balanced','acts freely, asks for risky things',()=>WIZ.autonomy='balanced',true],
    ['Full','never asks',()=>WIZ.autonomy='full',false]];
  else if(step==='autostart')defs=[
    ['Start at login','background service + launcher',()=>{WIZ.autostart=true;WIZ.open_at_login=true},true],
    ['Only when I open it','',()=>{WIZ.autostart=false;WIZ.open_at_login=false},false]];
  else if(step==='voice')defs=[
    ['Yes, speak replies','',()=>WIZ.voice=true,false],
    ['Text only','',()=>WIZ.voice=false,true]];
  else if(step==='wallpaper'){
    const el=document.createElement('div');el.className='wiz-chips';
    el.innerHTML=Object.keys(WIZ_WALLS).map(id=>
      `<button class="wiz-chip wiz-swatch" data-w="${id}" title="${id}"><span style="background:${WIZ_WALLS[id]}"></span>${id}</button>`).join('')+
      `<button class="wiz-chip" data-w="">Let ${esc(WIZ.agent_name)} generate one later</button>`;

      wizPicked(el,b)});
    return el;
  }
  if(!defs)return null;
  const el=document.createElement('div');el.className='wiz-chips';
  el.innerHTML=defs.map(([t,d],i)=>`<button class="wiz-chip${defs[i][3]?' rec':''}" data-i="${i}" ${d?`title="${esc(d)}"`:''}>${esc(t)}${defs[i][3]?'<em>recommended</em>':''}</button>`).join('');
  el.querySelectorAll('.wiz-chip').forEach(b=>b.onclick=()=>{defs[+b.dataset.i][2]();wizPicked(el,b)});
  return el;
}

/* ================= automations =================
   A named, repeatable sequence of desktop steps. You set one up once, give it a
   name, and from then on it does exactly that — whether you fire it from the
   prompt bar, a hot corner, the Automations app, a schedule, or by asking the
   agent for it by name.

   The runner lives here, in the browser, because the steps ARE the desktop:
   open this app, switch to that theme, put the agent on this prompt. The server
   only stores them and broadcasts `automation.run`, so every entry point ends up
   in this one function and they can never drift apart. */

let AUTOMATIONS=[];
/* Every tool a `tool` step can call — the agent's own plus whatever the user's
   connected MCP servers expose, so the picker grows with the machine. */
let TOOLNAMES=[], TOOLDESCS={};
async function loadToolNames(){
  try{
    const d=await (await fetch('/api/tools')).json();
    TOOLNAMES=(d.tools||[]).map(t=>t.name).sort();
    TOOLDESCS={};(d.tools||[]).forEach(t=>TOOLDESCS[t.name]=t.description||'');
  }catch(e){TOOLNAMES=[]}
  return TOOLNAMES;
}
async function loadAutomations(){
  try{AUTOMATIONS=(await (await fetch('/api/automations')).json()).automations||[]}catch(e){AUTOMATIONS=[]}
  return AUTOMATIONS;
}
function automationByName(n){
  n=String(n||'').toLowerCase().trim();
  return AUTOMATIONS.find(a=>a.name.toLowerCase()===n)||null;
}

/* ---- the vocabulary a step can speak ----
   Deliberately small: every kind maps to something the desktop already does, so
   an automation composes existing behaviour instead of introducing a second way
   to do it. `action` reaches the same SC_ACTIONS table the keyboard uses. */
const AUTO_ACTIONS=['deck','expose','showdesktop','launcher','control','notifications',
                    'windows.arrange','chat.new','chat.open','terminal','settings',
                    'voice','fullscreen','copilot','agent.stop','help'];
function automationStepLabel(s){
  switch(s.kind){
    case 'app':return 'Open '+((APPS[s.app]&&APPS[s.app].title)||s.app);
    // reuse the hot-corner vocabulary's wording so the same action reads the
    // same everywhere ("Show desktop", not "showdesktop")
    case 'action':{const hit=HC_ACTIONS.find(a=>a[0]===s.action);return hit?hit[1]:'Do '+s.action}
    case 'theme':return 'Theme → '+((allThemes()[s.theme]||{}).label||s.theme);
    case 'wallpaper':return 'Wallpaper → '+s.wallpaper;
    case 'desktop':return 'Go to desktop '+s.desk;
    case 'wait':return 'Wait '+s.ms+'ms';
    case 'agent':return 'Ask: '+String(s.prompt||'').slice(0,70);
    case 'tool':return 'Call '+s.tool+(s.args&&s.args!=='{}'?' '+String(s.args).slice(0,40):'');
    case 'python':return 'Python: '+String(s.code||'').replace(/\s+/g,' ').slice(0,60);
  }
  return s.kind;
}

async function runAutomationStep(s){
  switch(s.kind){
    case 'app':      if(APPS[s.app])openApp(s.app); else toast('automation: no app "'+s.app+'"'); break;
    case 'action':   if(!scRun(s.action))toast('automation: unknown action "'+s.action+'"'); break;
    case 'theme':    if(allThemes()[s.theme])applyTheme(s.theme); else toast('automation: no theme "'+s.theme+'"'); break;
    case 'wallpaper':await setBuiltinWallpaper(s.wallpaper); break;
    case 'desktop':  switchDesk(Math.max(1,Math.min(DESKS,+s.desk||1))); break;
    case 'wait':     await new Promise(r=>setTimeout(r,Math.min(60000,+s.ms||0))); break;
    case 'agent':    palAsk(s.prompt); break;
    // tool and python go to the server, where the permission gate lives — an
    // automation gets no more reach than the agent does, it just skips the model
    case 'tool':     await runAutomationTool(s.tool,s.args); break;
    case 'python':   await runAutomationTool('run_python',JSON.stringify({code:s.code})); break;
  }
}
async function runAutomationTool(name,args){
  let parsed={};
  try{parsed=args?JSON.parse(args):{}}catch(e){return toast('automation: '+name+' args are not valid JSON')}
  try{
    const r=await fetch('/api/tool',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,args:parsed})});
    const d=await r.json();
    // /api/tool answers {output} on success and {error} when the permission gate
    // says no (403) — an automation must surface the refusal, not swallow it
    const out=String(d.output??d.error??'');
    if(!r.ok||d.error||out.startsWith('[error]')||out.startsWith('[denied]'))
      toast(name+': '+out.slice(0,140));
    else if(out.trim())automationOutput(name,out);
    return out;
  }catch(e){toast(name+' failed: '+e.message)}
}
/* Tool and Python steps produce real output; it surfaces as an omnibar card so
   a routine that computes something actually shows you what it found. */
function automationOutput(name,out){
  if(typeof omniCard!=='function')return toast(name+': '+out.slice(0,120));
  const c=omniCard(name);
  c.feed.innerHTML='<pre style="white-space:pre-wrap;margin:0;font-family:var(--mono);font-size:var(--fs-sm)">'
    +esc(out.slice(0,4000))+'</pre>';
}
let AUTO_RUNNING=false;
async function runAutomation(a){
  if(typeof a==='string')a=automationByName(a)||AUTOMATIONS.find(x=>x.id===a);
  if(!a)return toast('no such automation');
  if(AUTO_RUNNING)return toast('an automation is already running');
  AUTO_RUNNING=true;
  document.body.classList.add('auto-running');
  toast('▶ '+a.name);
  try{
    for(const s of (a.steps||[])){
      await runAutomationStep(s);
      // a beat between steps: windows animate in, and a theme swap runs a view
      // transition — firing the next step mid-flight looks (and feels) broken
      if(s.kind!=='wait')await new Promise(r=>setTimeout(r,160));
    }
  }catch(e){toast('automation "'+a.name+'" failed: '+e.message)}
  AUTO_RUNNING=false;
  document.body.classList.remove('auto-running');
}
/* Fired by the server (a schedule, the agent's run_automation tool, another
   window) — the payload carries the whole automation so this client runs the
   same steps even if its list is stale. */
function onAutomationBroadcast(a){if(a&&a.steps)runAutomation(a)}

async function saveAutomation(name,steps,icon){
  const r=await fetch('/api/automations',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,steps,icon:icon||''})});
  const d=await r.json();
  if(!r.ok)return toast(d.error||'could not save');
  await loadAutomations();
  toast('✓ saved "'+name+'"');
  return d;
}
async function deleteAutomation(id){
  if(!await osConfirm('Delete this automation?','Anything bound to it — a hot corner, a schedule — stops firing.',{confirmText:'Delete',danger:true}))return;
  await fetch('/api/automations/'+encodeURIComponent(id),{method:'DELETE'});
  await loadAutomations();refreshApp('automations');
  if(typeof hcRender==='function')hcRender();
}

/* ================= hot corners =================
   Four corners, four gestures, no clicking. Every corner ships bound to
   something useful — an unbound corner teaches you nothing, so the defaults are
   the four things you reach for most:

     top-left      Overview      every window on this desktop, laid out
     top-right     Control Centre  sound, brightness, network, battery
     bottom-left   App deck      the launcher
     bottom-right  Show desktop  everything out of the way, and back again

   Any corner can be rebound to a desktop action, an app, or one of your
   automations — which is the point: a corner is the fastest trigger a saved
   routine can have. Config is per-machine (localStorage), like the deck. */

const HC_DEFAULTS={tl:'expose',tr:'control',bl:'deck',br:'showdesktop'};
const HC_CORNERS=[['tl','Top left'],['tr','Top right'],['bl','Bottom left'],['br','Bottom right']];
const HC_SIZE=10;        // px of the square trigger zone in the very corner
let HOTCORNERS={...HC_DEFAULTS,enabled:true,delay:240};
function hcLoad(){
  try{HOTCORNERS={...HOTCORNERS,...(JSON.parse(localStorage.getItem('hotcorners')||'{}'))}}catch(e){}
}
function hcSave(){localStorage.setItem('hotcorners',JSON.stringify(HOTCORNERS))}
hcLoad();

/* What a corner can be bound to. Desktop actions come from the SAME table the
   keyboard uses, so a corner can never do something a shortcut cannot. */
const HC_ACTIONS=[
  ['','— nothing —'],
  ['expose','Overview — all windows'],
  ['showdesktop','Show desktop'],
  ['deck','App deck'],
  ['launcher','Launcher (start menu)'],
  ['control','Control Centre'],
  ['notifications','Notifications'],
  ['omnibar.focus','Prompt bar — ask the agent'],
  ['chat.open','Open Chat'],
  ['chat.new','New chat'],
  ['terminal','Terminal'],
  ['windows.arrange','Tile the windows'],
  ['voice','Voice mode'],
  ['fullscreen','Full screen'],
  ['settings','Settings'],
  ['lock','Lock the screen'],
];
function hcLabel(v){
  if(!v)return '— nothing —';
  if(v.startsWith('automation:')){
    const a=(AUTOMATIONS||[]).find(x=>x.id===v.slice(11));
    return a?('Automation — '+a.name):'Automation (deleted)';
  }
  if(v.startsWith('app:'))return 'Open '+((APPS[v.slice(4)]&&APPS[v.slice(4)].title)||v.slice(4));
  const hit=HC_ACTIONS.find(a=>a[0]===v);
  return hit?hit[1]:v;
}
function hcFire(corner){
  const v=HOTCORNERS[corner];
  if(!v)return;
  if(v.startsWith('automation:'))return runAutomation(v.slice(11));
  if(v.startsWith('app:'))return openApp(v.slice(4));
  if(v==='showdesktop')return toggleShowDesktop();
  if(v==='launcher')return toggleStart();
  if(v==='control')return toggleControlCenter();
  if(v==='notifications')return openNotifPanel();
  if(v==='lock')return powerDo('lock','Lock the screen?');
  scRun(v);
}

/* ---- show desktop: get everything out of the way, then put it back ---- */
let SHOWDESK=null;   // the windows we minimized, so the same corner restores them
function toggleShowDesktop(){
  if(SHOWDESK&&SHOWDESK.length){
    SHOWDESK.forEach(w=>{if(WM.wins.has(w.key))restoreWin(w)});
    SHOWDESK=null;toast('windows restored');return;
  }
  const hide=[];WM.wins.forEach(w=>{if(!w.min&&(w.desk||1)===curDesk)hide.push(w)});
  if(!hide.length)return toast('the desktop is already clear');
  hide.forEach(minimizeWin);
  SHOWDESK=hide;
}

/* ---- the trigger: dwell in the corner, not just touch it ----
   A pointer flying to a close button clips the corner constantly, so a corner
   only fires after the pointer has RESTED there, and it must leave the zone
   before it can fire again. The hint arc grows during the dwell, which is both
   the affordance and the escape hatch: see it filling, move away. */
let hcTimer=null, hcArmed=null, hcHint=null;
function hcZone(x,y){
  const w=innerWidth,h=innerHeight;
  if(x<=HC_SIZE&&y<=HC_SIZE)return 'tl';
  if(x>=w-HC_SIZE&&y<=HC_SIZE)return 'tr';
  if(x<=HC_SIZE&&y>=h-HC_SIZE)return 'bl';
  if(x>=w-HC_SIZE&&y>=h-HC_SIZE)return 'br';
  return null;
}
function hcCancel(){
  clearTimeout(hcTimer);hcTimer=null;hcArmed=null;
  if(hcHint){hcHint.classList.remove('on');hcHint.className='hc-hint'}
}
function hcActive(){
  if(!HOTCORNERS.enabled)return false;
  if(typeof isMobile==='function'&&isMobile())return false;    // no pointer to rest
  if(document.querySelector('.win.dragging'))return false;      // mid-drag, not a gesture
  if(typeof AUTO_RUNNING!=='undefined'&&AUTO_RUNNING)return false;
  return true;
}
addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  if(!hcActive())return hcCancel();
  const z=hcZone(e.clientX,e.clientY);
  if(z===hcArmed)return;              // still dwelling in the same corner
  hcCancel();
  if(!z||!HOTCORNERS[z])return;
  hcArmed=z;
  if(!hcHint){hcHint=document.createElement('div');document.body.appendChild(hcHint)}
  hcHint.className='hc-hint hc-'+z;
  hcHint.style.setProperty('--hc-ms',HOTCORNERS.delay+'ms');
  requestAnimationFrame(()=>hcHint.classList.add('on'));
  hcTimer=setTimeout(()=>{const c=hcArmed;hcCancel();if(c)hcFire(c)},HOTCORNERS.delay);
},{passive:true});
addEventListener('pointerdown',hcCancel,{passive:true});
addEventListener('blur',hcCancel);

async function mcpPreset(key){
  const e=MCP_CATALOG.find(x=>x.k===key);
  if(!e||MCPCFG[e.k])return;
  const fill=async(s)=>{      // resolve {WS} and every {ASK:question}; null = user cancelled
    s=s.replace('{WS}',(cfg&&cfg.workspace)||'~');
    let m;
    while((m=s.match(/\{ASK:([^}]+)\}/))){
      const v=await osPrompt(e.n,{message:m[1]});
      if(!v)return null;
      s=s.replace(m[0],v.trim());
    }
    return s;
  };
  let conf;
  if(e.t==='http'){
    const url=await fill(e.u);
    if(url===null)return;
    conf={transport:'http',url,enabled:true};
    if(e.bearer){
      const v=await osPrompt(e.n,{message:e.bearer});
      if(v===null)return;
      if(v.trim())conf.headers={Authorization:'Bearer '+v.trim()};
      else if(!e.opt)return;
    }
  }else{
    const args=await fill(e.a);
    if(args===null)return;
    conf={transport:'stdio',command:e.c,args,enabled:true};
    if(e.env){
      conf.env={};
      for(const [k,hint] of e.env){
        const v=await osPrompt(k,{message:hint});
        if(!v)return;
        conf.env[k]=v.trim();
      }
    }
  }
  if(e.oauth)toast('first connect opens a browser tab to sign in — approve it there');
  MCPCFG[e.k]=conf;mcpSave();
}
function mcpToggle(name){if(MCPCFG[name]){MCPCFG[name].enabled=!MCPCFG[name].enabled;mcpSave()}}
function mcpDel(name){delete MCPCFG[name];mcpSave()}

/* ================= knowledge graph app ================= */
async function renderKG(body,w){
  body.innerHTML=`<div class="apptop">
      <span class="psearch" style="flex:0 1 210px">${SVG_SEARCH}<input id="kg-q" placeholder="Filter the graph…" value="${esc(w._kgq||'')}"></span>
      <input id="kg-s" placeholder="subject"><input id="kg-r" placeholder="relation"><input id="kg-o" placeholder="object">
      <button class="save" style="margin:0;flex:0 0 64px;padding:8px" onclick="kgAdd()">Add</button>
      <button class="endbtn" title="merge duplicate entities, roll up idle sessions, re-index memory" onclick="tidyKnowledge()">Tidy</button>
      <button class="endbtn" onclick="kgClear()">Clear graph</button>
    </div>
    <div style="flex:1;min-height:0;position:relative">
      <canvas id="kgc" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
      <div id="kg-empty" class="mut" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px">
        The graph is empty.<br>Ask the agent to "add what you know about me to the knowledge graph",<br>or add a (subject, relation, object) triple above.</div>
    </div>`;
  {const qi=$('#kg-q');let t;
   qi.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{w._kgq=qi.value;renderKG(body,w).then(()=>{const q2=$('#kg-q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}})},250)};}
  const r=await fetch('/api/kg');const g=await r.json();
  const q=(w._kgq||'').toLowerCase().trim();
  if(q){
    const keep=new Set(g.nodes.filter(n=>(n.name||'').toLowerCase().includes(q)).map(n=>n.id));
    g.edges.forEach(e=>{if(e.relation.toLowerCase().includes(q)){keep.add(e.src);keep.add(e.dst)}});
    g.edges.forEach(e=>{if(keep.has(e.src)||keep.has(e.dst)){keep.add(e.src);keep.add(e.dst)}}); // 1-hop neighbours
    g.nodes=g.nodes.filter(n=>keep.has(n.id));
    g.edges=g.edges.filter(e=>keep.has(e.src)&&keep.has(e.dst));
  }
  const canvas=$('#kgc');if(!canvas)return;
  cancelAnimationFrame(w.raf);
  if(!g.nodes.length){$('#kg-empty').style.display='flex';
    if(q)$('#kg-empty').innerHTML='Nothing in the graph matches “'+esc(w._kgq)+'”.';return}
  const dpr=devicePixelRatio||1;
  const nodes=g.nodes.map((n,i)=>({...n,
    x:Math.cos(i/g.nodes.length*6.283)*120+(i%7)*13, y:Math.sin(i/g.nodes.length*6.283)*120+(i%5)*11, vx:0,vy:0}));
  const byid={};nodes.forEach(n=>byid[n.id]=n);
  const edges=g.edges.filter(e=>byid[e.src]&&byid[e.dst]);
  const COLORS={person:'#5eead4',org:'#22d3ee',project:'#fbbf24',tool:'#c084fc','':'#8a94a6'};
  let ticks=0;
  const step=()=>{
    if(!canvas.isConnected)return;
    const W=canvas.clientWidth,H=canvas.clientHeight;
    canvas.width=W*dpr;canvas.height=H*dpr;
    // physics
    if(ticks<400){
      for(const a of nodes){
        for(const b of nodes){ if(a===b)continue;
          let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);
          const f=1800/d2; a.vx+=dx/d*f; a.vy+=dy/d*f; }
        a.vx-=a.x*.012; a.vy-=a.y*.012;   // gravity to center
      }
      for(const e of edges){
        const a=byid[e.src],b=byid[e.dst];
        let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01;
        const f=(d-110)*.02; a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;
      }
      for(const n of nodes){n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.6;n.vy*=.6}
      ticks++;
    }
    // draw
    const ctx=canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,H/2);
    ctx.font='10px sans-serif';
    for(const e of edges){
      const a=byid[e.src],b=byid[e.dst];
      ctx.strokeStyle='rgba(94,234,212,.22)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.fillStyle='rgba(138,148,166,.85)';
      ctx.fillText(e.relation,(a.x+b.x)/2+4,(a.y+b.y)/2-3);
    }
    ctx.font='600 11.5px sans-serif';
    for(const n of nodes){
      ctx.fillStyle=COLORS[n.type]||COLORS[''];
      ctx.beginPath();ctx.arc(n.x,n.y,7,0,6.283);ctx.fill();
      ctx.strokeStyle='#0b0d10';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#e6ebf2';ctx.fillText(n.name,n.x+11,n.y+4);
    }
    ctx.restore();
    w.raf=requestAnimationFrame(step);
  };
  step();
}

  await fetch('/api/kg',{method:'POST',headers:{'Content-Type':'application/json'},

/* ================= permissions app: the policy console ================= */
let PERM={tab:'map',sel:null,q:'',showRevoked:false,grants:[],apps:[],opts:{principals:[],actions:[],resources:{}},att:null,_attPs:[],_mapPs:[]};
const PERM_FAMS=[['Tools','tool.'],['MCP','mcp.'],['Skills','skill.'],['Models','model.'],['Files','fs.'],['Net','net.'],['Memory','memory.','kg.'],['Agents','agent.'],['App data','app.data.']];
function globMatch(pat,val){pat=(pat==null||pat==='')?'*':String(pat);
  return new RegExp('^'+pat.split('*').map(s=>s.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$').test(val||'')}
function permFamOf(action){if(action==='*')return 'Full access';if(action==='legacy policy')return 'Legacy rules';
  for(const f of PERM_FAMS)for(let i=1;i<f.length;i++)if(action.startsWith(f[i]))return f[0];return 'Other'}
async function renderPermissions(body){
  try{PERM.grants=(await (await fetch('/api/grants'+(PERM.showRevoked?'?all=1':''))).json()).grants||[]}catch(e){PERM.grants=[]}
  try{PERM.opts=await (await fetch('/api/policy/options')).json()}catch(e){}
  try{PERM.apps=(await (await fetch('/api/apps')).json()).apps||[]}catch(e){PERM.apps=[]}
  await loadConfig();
  const pending=PERM.apps.filter(a=>(a.manifest_status||'none')==='proposed').length;
  body.innerHTML=`<div class="apptop" style="gap:6px">
    ${[['map','Policy map'],['grants','All grants'],['review','Review'+(pending?' ('+pending+')':'')],['attach','＋ Attach']].map(([t,l])=>`<button class="endbtn perm-tab${PERM.tab===t?' on':''}" data-t="${t}" ${t==='review'&&pending?'style="color:var(--err,#f87171)"':''}>${l}</button>`).join('')}
    <input id="perm-q" placeholder="search apps, agents, rules…" style="flex:1;max-width:250px;margin-left:auto" value="${esc(PERM.q)}">
  </div>
  <div id="perm-body" style="flex:1;overflow-y:auto;padding:12px 14px"></div>`;
  body.querySelectorAll('.perm-tab').forEach(b=>b.onclick=()=>{PERM.tab=b.dataset.t;renderPermissions(body)});
  $('#perm-q').oninput=e=>{PERM.q=e.target.value;permBody()};
  permBody();
}
function permBody(){
  const box=$('#perm-body');if(!box)return;
  ({map:permMap,grants:permGrantsView,review:permReview,attach:permAttachView}[PERM.tab]||permMap)(box);
}
function permPrincipals(){
  const map=new Map();
  (PERM.opts.principals||[]).forEach(p=>map.set(p.kind+':'+p.id,{...p,label:p.label||p.id||p.kind}));
  PERM.grants.forEach(g=>{if(g.principal_kind==='user')return;
    const k=g.principal_kind+':'+(g.principal_id||'');
    if(!map.has(k))map.set(k,{kind:g.principal_kind,id:g.principal_id||'',label:permPrincipalLabel(g.principal_kind,g.principal_id)})});
  const out=[...map.values()].map(p=>({...p,
    grants:PERM.grants.filter(g=>!g.revoked_at&&g.principal_kind===p.kind&&globMatch(g.principal_id||'*',p.id))}));
  // the system principal: the main agent acting as you — legacy policies live here
  out.unshift({kind:'user',id:'',label:'System — main agent',system:true,
    grants:[...PERM.grants.filter(g=>!g.revoked_at&&g.principal_kind==='user'),
            ...((cfg&&cfg.policies)||[]).map((p,i)=>({id:'legacy:'+i,action:'legacy policy',
              resource:p.match,effect:p.action==='deny'?'deny':'allow',source:'Policies app',readonly:true}))]});
  return out;
}
function permMap(box){
  const q=PERM.q.toLowerCase();
  const ps=permPrincipals().filter(p=>!q||p.label.toLowerCase().includes(q)||p.kind.includes(q));
  PERM._mapPs=ps;
  const famChip=(p,f)=>{
    const gs=p.grants.filter(g=>permFamOf(g.action)===f);
    if(!gs.length)return '';
    const d=gs.filter(g=>g.effect==='deny').length,a=gs.length-d;
    const col=d&&a?'#f2c94c':d?'var(--err,#f87171)':'var(--ok,#5eead4)';
    return `<span style="font-size:10px;padding:2px 7px;border-radius:9px;border:1px solid ${col};color:${col}">${esc(f)} ${gs.length}</span>`;
  };
  const fams=['Full access','Legacy rules',...PERM_FAMS.map(f=>f[0]),'Other'];
  box.innerHTML=`<p class="mut" style="margin-bottom:10px">Who may do what, at a glance. Click a card for its policy map — toggle any permission between allow/deny, or revoke it.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
    ${ps.map((p,i)=>{
      const full=p.grants.some(g=>g.action==='*'&&g.resource==='*'&&g.effect!=='deny');
      const sel=PERM.sel===p.kind+':'+p.id;
      const st=p.status==='proposed'?'<span class="badge err">review pending</span>':p.status==='approved'?'<span class="badge ok">manifest</span>':'';
      return `<div class="perm-card" data-i="${i}" style="cursor:pointer;background:var(--card,#171b22);border:1px solid ${sel?'var(--acc,#5eead4)':'var(--line,#232a35)'};border-radius:12px;padding:12px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
        <span style="width:30px;height:30px;border-radius:8px;background:${tileBg(p.id||p.kind)};display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 30px">${esc((p.label[0]||'?').toUpperCase())}</span>
        <div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.label)}</b>
        <div class="mut" style="font-size:10.5px">${esc(p.kind)} · ${p.grants.length} rule${p.grants.length===1?'':'s'}</div></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${full?'<span class="badge err">FULL ACCESS</span>':''}${st}
        ${fams.map(f=>famChip(p,f)).join('')||'<span class="mut" style="font-size:11px">no rules — every capability asks first</span>'}</div>
    </div>`}).join('')||'<p class="mut">no apps or agents yet</p>'}
  </div>
  <div id="perm-chart" style="margin-top:18px"></div>`;
  box.querySelectorAll('.perm-card').forEach(c=>c.onclick=()=>{
    const p=PERM._mapPs[+c.dataset.i];const k=p.kind+':'+p.id;
    PERM.sel=PERM.sel===k?null:k;permMap(box);
  });
  const selP=ps.find(p=>PERM.sel===p.kind+':'+p.id);
  if(selP)permChartInto($('#perm-chart'),selP);
}
function permChartInto(el,p){
  if(!el)return;
  const fams={};
  p.grants.forEach(g=>{const f=permFamOf(g.action);(fams[f]=fams[f]||[]).push(g)});

async function permSurfaces(gid,cur){

  const clean=v.trim()==='*'?'*':v.split(',').map(s=>s.trim()).filter(s=>PERM_SURFACES.includes(s)).join(',');
  if(v.trim()!=='*'&&!clean)return toast('no valid surfaces — use: '+PERM_SURFACES.join(', '));

  const shield='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--acc,#5eead4)"><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/></svg>';
  const ov=document.createElement('div');

  ov.innerHTML=`<div style="width:min(560px,92vw);max-height:82vh;overflow:auto;background:var(--glass,#171b22);border:1px solid var(--border,#232a35);border-radius:14px;padding:20px">

    <p class="mut" style="margin:6px 0 12px">${esc(manifest.description||'')} You can untick optional items — and revoke anything later in Permissions.</p>
    ${perms.length?perms.map((p,i)=>`<label class="item" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
      <input type="checkbox" data-i="${i}" checked ${p.required?'disabled':''} style="margin-top:3px;accent-color:var(--acc,#5eead4)">
      <div class="grow"><div style="font-family:var(--mono);font-size:12.5px">${esc(p.action||'*')} · ${esc(p.resource||'*')}</div>
        <div class="mut" style="font-size:12px">${esc(p.reason||'')}${p.required?' · required':' · optional'}</div></div></label>`).join('')
      :'<p class="mut">No capabilities requested — this app only uses its own private data.</p>'}
    ${(missing&&missing.length)?'<label style="display:block;margin-top:12px">Missing prerequisites</label>'+missing.map((m,j)=>`<div class="item"><div class="grow">${esc(m.label)}</div><button class="prq" data-j="${j}">Install</button></div>`).join(''):''}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="c-cancel">Cancel</button><button class="c-ok save" style="margin:0">Grant selected</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.prq').forEach(b=>{b.onclick=async()=>{
    b.textContent='installing…';b.disabled=true;
    try{await missing[+b.dataset.j].run();b.textContent='installed'}
    catch(e){b.textContent='failed';b.disabled=false}
  }});
  ov.querySelector('.c-cancel').onclick=()=>ov.remove();
  ov.querySelector('.c-ok').onclick=()=>{
    const granted=[...ov.querySelectorAll('input[type=checkbox]')].filter(c=>c.checked).map(c=>+c.dataset.i);
    ov.remove(); onApprove(granted);
  };
}

function renderBrowser(body,w){

/* ============ platform capabilities — the UI never asks "what OS?" ============ */
let PLATFORM={mode:'hosted',detected_mode:'hosted',capabilities:{},summary:''};
async function loadPlatform(){
  try{PLATFORM=await (await fetch('/api/platform')).json()}catch(e){}
  updateBell();
}
function cap(id){return PLATFORM.capabilities?.[id]||{available:false,supported:false,reason:'',component:''}}
function capNote(id){
  const c=cap(id);if(c.available)return '';
  return `<p class="mut" style="margin-top:6px;opacity:.8">${esc(c.reason||'Not available here.')}
    ${c.component?`<button class="endbtn" style="margin-left:6px" onclick="installComponent('${esc(c.component)}')">Install…</button>`:''}</p>`;
}
async function installComponent(id){
  let comp=null;
  try{const d=await (await fetch('/api/components')).json();comp=(d.components||[]).find(c=>c.id===id)}catch(e){}
  if(!comp)return toast('unknown component: '+id);
  if(!await osConfirm(`Install ${comp.title}?`,`Package: ${comp.package} (${comp.method}) · Licence: ${comp.licence}. ${comp.unlocks}`,{confirmText:'Install'}))return;
  toast('installing '+comp.title+'…');
  const r=await fetch('/api/components',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  const d=await r.json();
  if(d.ok){toast('✓ '+(d.message||'installed'));loadPlatform().then(()=>{refreshApp('control');refreshApp('syssettings')})}
  else if(d.needs_terminal){
    try{await navigator.clipboard.writeText(d.command)}catch(e){}
    await osAlert(d.message,d.command+'  (copied to the clipboard — paste it into the Terminal app)');
  }else toast(d.message||d.error||'install failed');
}

/* Control Center: the tray popover — same capability-driven content as the

function toggleControlCenter(){
  let p=$('#ccpop');
  if(!p){p=document.createElement('div');p.id='ccpop';document.body.appendChild(p);
    document.addEventListener('click',e=>{
      if(!e.target.closest('#ccpop')&&!e.target.closest('#tray-ctl'))p.classList.remove('show');

  if(!on){p.classList.remove('show');return}

}

/* ================= Remote access =================
   Reach this desktop from your phone. Off until a human turns it on here and
   sets a passphrase — and the server only accepts this call from the machine
   itself, so nothing signed in remotely (and no agent, and no app) can widen
   its own access. */
let REMOTE={};
async function sysRemote(el){
  try{REMOTE=await (await fetch('/api/remote')).json()}catch(e){REMOTE={}}
  const on=!!REMOTE.enabled, set=!!REMOTE.configured;
  el.innerHTML=`
    <div class="provbox">
      <div class="ptitle">Remote access

      <p class="mut" style="margin-top:8px;line-height:1.6">
        Serve this desktop to your phone or another machine on your network.
        <b>Everything you can do here, whoever signs in can do too</b> — including the
        Terminal and the agent's shell — so it stays off until you set a passphrase.
        Using AgentOS on this machine is unaffected either way.</p>

      <label style="margin-top:14px">${set?'Change the passphrase':'Set a passphrase'}</label>
      <div class="row" style="gap:8px">
        <input id="rm-pw" type="password" autocomplete="new-password"
               placeholder="at least 8 characters — a phrase beats a word" style="flex:1">
        <button class="endbtn" onclick="rmSetPass()">${set?'Update':'Set'}</button>
      </div>
      ${set?'<p class="mut" style="margin-top:6px;font-size:11px">A passphrase is set. Changing it signs every remote device out.</p>':''}

      <div class="row" style="margin-top:16px;gap:10px;align-items:center">
        <button class="save" style="margin:0;width:auto;padding:10px 18px${on?';background:var(--err);color:#fff':''}"
                onclick="rmToggle(${on?'false':'true'})" ${set?'':'disabled title="set a passphrase first"'}>
          ${on?'Turn remote access off':'Turn remote access on'}</button>
        <span class="mut" style="font-size:12px">${set?'':'a passphrase is required first'}</span>
      </div>
    </div>

    ${on?`<div class="provbox">
      <div class="ptitle">Reach it from your phone</div>
      ${(REMOTE.addresses||[]).length?`<div class="rm-addr">${REMOTE.addresses.map(a=>`
          <div class="rm-row"><code>${esc(a)}</code>
            <button class="endbtn" onclick="rmCopy('${esc(a)}')">Copy</button></div>`).join('')}</div>`
        :'<p class="mut" style="margin-top:6px">No network address detected.</p>'}
      <p class="mut" style="margin-top:10px;line-height:1.6">
        Open that on your phone, sign in with the passphrase, then
        <b>Share → Add to Home Screen</b> (iOS) or <b>⋮ → Install app</b> (Android) for a
        full-screen app with no browser chrome. The layout adapts to the phone on its own.</p>
      ${REMOTE.listening_on&&REMOTE.listening_on!=='127.0.0.1'?'':
        '<p class="mut" style="margin-top:8px;color:var(--warn)">Restart AgentOS for this to take effect — it is still listening on loopback only.</p>'}
    </div>`:''}

    <div class="provbox">
      <div class="ptitle">Before you open it up</div>
      <ul class="rm-notes">
        <li>This is <b>one shared passphrase for one machine</b>, not per-user accounts. Treat it like the key to the machine, because it is.</li>
        <li>Keep it on your <b>home network or a VPN</b>. Don't port-forward it to the open internet — there is no TLS here, so a passphrase would cross the network in the clear.</li>
        <li>Over the internet, put it behind something that terminates TLS and authenticates — Tailscale, WireGuard, or a reverse proxy you trust.</li>
        <li>Sign-in attempts back off after ${5} failures from one address, and every attempt is written to the Logs app.</li>
      </ul>
    </div>`;
}
async function rmPost(body){
  const r=await fetch('/api/remote',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){toast(d.error||'could not change remote access');return null}
  return d;
}
async function rmSetPass(){
  const pw=$('#rm-pw').value;
  if(!pw)return toast('type a passphrase first');
  if(await rmPost({passphrase:pw})){toast('✓ passphrase set');refreshApp('syssettings')}
}
async function rmToggle(on){
  if(on&&!await osConfirm('Turn remote access on?',

const NOTIF={unread:0,dnd:false};
function svgBell(px){px=px||14;return `<svg width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M6 9.5a6 6 0 0 1 12 0c0 5 1.7 6 1.7 6H4.3S6 14.5 6 9.5"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/></svg>`}
async function updateBell(){
  const bell=$('#tray-bell');if(!bell)return;
  try{
    const d=await (await fetch('/api/notifications')).json();
    NOTIF.unread=d.unread||0;NOTIF.dnd=!!d.dnd;
    bell.classList.toggle('dnd',NOTIF.dnd);
    bell.innerHTML=svgBell(14)+(NOTIF.unread?`<span class="badge">${NOTIF.unread>99?'99+':NOTIF.unread}</span>`:'');
    bell.style.display=(d.available===false&&PLATFORM.mode!=='de')?'none':'flex';
  }catch(e){}
}
async function renderNotifList(){
  const d=await (await fetch('/api/notifications')).json();
  const list=$('#np-list');
  // the agent's triage digest rides on top — "For you", not a raw log
  const foryou=d.digest&&d.digest.text?`<div class="np-foryou">
      <div class="np-fy-head">${appIcon('chat',15)} For you
        <span style="flex:1"></span>
        <button class="np-x" style="position:static" onclick="dismissDigest()">✕</button></div>
      <div class="np-fy-text">${esc(d.digest.text)}</div>
    </div>`:'';
  // group by app, newest group first — a feed of apps, not a flat log
  const groups=new Map();
  (d.items||[]).forEach(n=>{const k=n.app||'system';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(n)});
  list.innerHTML=foryou+([...groups.entries()].map(([app,items])=>`
    <div class="np-group">${groups.size>1?`<div class="np-gapp">${esc(app)}</div>`:''}
    ${items.map(n=>`<div class="np-item ${n.urgency>=2?'crit':''}${n.importance>=2?' imp':''}">
      <div class="np-app">${esc(app)} · ${new Date(n.time*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${n.importance>=2?' · <b>important</b>':''}</div>
      <div class="np-sum">${esc(n.summary)}</div>
      ${n.body?`<div class="np-body">${esc(n.body)}</div>`:''}
      <button class="np-x" onclick="dismissNotif(${n.id})">✕</button>
    </div>`).join('')}</div>`).join('')
    ||'<p class="mut" style="padding:10px">nothing here — you\'re all caught up</p>');
  const dnd=$('#np-dnd');
  dnd.innerHTML=svgBell(13)+(d.dnd?'<span class="np-slash"></span>':'');
  dnd.title=d.dnd?'Do not disturb is on':'Do not disturb';
  dnd.classList.toggle('on',!d.dnd);
  dnd.onclick=()=>toggleDnd(!d.dnd).then(renderNotifList);
  $('#np-clear').onclick=async()=>{await fetch('/api/notifications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'clear'})});renderNotifList()};
  return d;
}
async function openNotifPanel(){
  const p=$('#notifpanel');
  if(p.classList.contains('show')){p.classList.remove('show');return}
  $('#powermenu').classList.remove('show');

async function dismissNotif(id){

}
async function dismissDigest(){

  c.innerHTML=html+`<div class="pc-actions">
      ${onAccept?'<button class="pc-go">Open</button>':''}

  $('#desktop').appendChild(c);
