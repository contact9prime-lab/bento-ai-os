/* ---- modal dialogs: AgentOS sheets instead of window.confirm/alert ---- */
function osDialog(o){
  return new Promise(res=>{
    const scr=document.createElement('div');scr.className='dlg-scrim';
    scr.innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true">
      <div class="dlg-icn">${o.danger?'!':'?'}</div>
      <div class="dlg-t">${esc(o.title||'')}</div>
      ${o.message?`<div class="dlg-m">${esc(o.message)}</div>`:''}
      <div class="dlg-b">
        ${o.cancelText===null?'':`<button class="dlg-cancel">${esc(o.cancelText||'Cancel')}</button>`}
        <button class="dlg-ok${o.danger?' danger':''}">${esc(o.confirmText||'OK')}</button>
      </div></div>`;
    document.body.appendChild(scr);
    const dlg=scr.querySelector('.dlg');
    Motion.run(scr,[{opacity:0},{opacity:1}],{duration:140,easing:EASE.out});
    Motion.run(dlg,[{transform:'scale(.92) translateY(10px)',opacity:0},{transform:'none',opacity:1}],{duration:220,easing:EASE.spring});
    const close=v=>{
      Motion.run(scr,[{opacity:1},{opacity:0}],{duration:130,easing:EASE.in});
      popOut(dlg,()=>{scr.remove();res(v)});
    };
    scr.querySelector('.dlg-ok').onclick=()=>close(true);
    const c=scr.querySelector('.dlg-cancel'); if(c)c.onclick=()=>close(false);
    scr.onclick=e=>{if(e.target===scr&&o.cancelText!==null)close(false)};
    scr.addEventListener('keydown',e=>{if(e.key==='Escape'&&o.cancelText!==null)close(false);if(e.key==='Enter')close(true)});
    (c||scr.querySelector('.dlg-ok')).focus();
  });
}
const osConfirm=(title,message,opts)=>osDialog({title,message,...(opts||{})});
const osAlert=(title,message)=>osDialog({title,message,cancelText:null});
/* text-input dialog replacing window.prompt — resolves the string, or null on cancel */
function osPrompt(title,o){
  o=o||{};
  return new Promise(res=>{
    const scr=document.createElement('div');scr.className='dlg-scrim';
    scr.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">
      <div class="dlg-t">${esc(title||'')}</div>
      ${o.message?`<div class="dlg-m">${esc(o.message)}</div>`:''}
      <input class="dlg-in" type="${o.password?'password':'text'}" placeholder="${esc(o.placeholder||'')}">
      <div class="dlg-b">
        <button class="dlg-cancel">Cancel</button>
        <button class="dlg-ok">${esc(o.confirmText||'OK')}</button>
      </div></div>`;
    document.body.appendChild(scr);
    const dlg=scr.querySelector('.dlg'), inp=scr.querySelector('.dlg-in');
    inp.value=o.value||'';
    Motion.run(scr,[{opacity:0},{opacity:1}],{duration:140,easing:EASE.out});
    Motion.run(dlg,[{transform:'scale(.92) translateY(10px)',opacity:0},{transform:'none',opacity:1}],{duration:220,easing:EASE.spring});
    const close=v=>{Motion.run(scr,[{opacity:1},{opacity:0}],{duration:130,easing:EASE.in});popOut(dlg,()=>{scr.remove();res(v)})};
    scr.querySelector('.dlg-ok').onclick=()=>close(inp.value);
    scr.querySelector('.dlg-cancel').onclick=()=>close(null);
    scr.onclick=e=>{if(e.target===scr)close(null)};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')close(inp.value);if(e.key==='Escape')close(null)});
    inp.focus();inp.select();
  });
}

/* ================= window manager ================= */
/* WM.wins is keyed by instance key. The FIRST window of an app uses the bare app id as its
   key (so every existing WM.wins.get('<app>') caller keeps working); additional instances of
   multi-instance apps (APPS[id].multi) get '<app>#n'. w.id stays the app id everywhere. */
const WM={wins:new Map(), z:100, cascade:0, seq:0};
function winsOf(appId){const r=[];WM.wins.forEach(w=>{if(w.id===appId)r.push(w)});return r}

function openApp(id,opts){
  opts=opts||{};
  const app=APPS[id];if(!app)return null;
  if(!(app.multi&&opts.fresh)){
    const w=WM.wins.get(id)||winsOf(id)[0];
    if(w){ if(w.desk!==curDesk){w.desk=curDesk;applyDeskVisibility()} if(w.min)restoreWin(w); focusWin(w); return w; }
  }
  dockBounce(id);
  return createWin(app);
}
function openAppNew(id){return openApp(id,{fresh:true})}
function createWin(app){
  const desk=$('#desktop'), dw=desk.clientWidth, dh=desk.clientHeight;
  const el=document.createElement('div'); el.className='win';
  const width=Math.min(app.w,dw-30), height=Math.min(app.h,dh-30);
  const off=(WM.cascade++%6)*26;
  el.style.width=width+'px'; el.style.height=height+'px';
  el.style.left=Math.max(8,Math.min((dw-width)/2+off,dw-width-8))+'px';
  el.style.top=Math.max(8,Math.min((dh-height)/2-40+off,dh-height-8))+'px';
  el.innerHTML=`<div class="ttl">
    <div class="tbtns"><button class="cls" title="close">✕</button><button class="mn" title="minimize">–</button><button class="mx" title="maximize">＋</button></div>
    <div class="tmid"><span class="ticon">${appIcon(app.id,17)}</span><span class="tname">${esc(app.title)}</span></div>
    <span class="tright"><button class="cp-btn" title="${esc('Ask '+((typeof agentName==='function'&&agentName())||'the agent')+' about this app')}">✦</button></span></div>
    <div class="wmain"><div class="wbody"></div><div class="copanel"></div></div>
    ${['n','s','e','w','ne','nw','se','sw'].map(d=>`<div class="rz rz-${d}" data-d="${d}"></div>`).join('')}`;
  desk.appendChild(el);

  const tb=document.createElement('button'); tb.className='tbwin';
  tb.dataset.app=app.id;
  if(DOCK.includes(app.id))tb.classList.add('indock');   // pinned apps surface in the dock itself
  tb.dataset.tip=app.title;
  tb.innerHTML=appIcon(app.id,46);
  $('#tbwins').appendChild(tb);

  const key=WM.wins.has(app.id)?app.id+'#'+(++WM.seq):app.id;
  const w={id:app.id,key,app,el,tb,min:false,max:false,prev:null,snap:null,desk:curDesk};
  WM.wins.set(key,w);
  // on a phone a window IS the screen — open it as a sheet, remembering that the
  // full-screen state was the device's idea so a wider viewport can undo it
  if(typeof isMobile==='function'&&isMobile()){
    w.prev={l:el.style.left,t:el.style.top,w:el.style.width,h:el.style.height};
    w.wasMax=false;w.max=true;el.classList.add('maxed');
  }

  tb.onclick=()=>{ if(w.min){restoreWin(w);focusWin(w)} else if(el.classList.contains('active')) minimizeWin(w); else focusWin(w); };
  el.addEventListener('pointerdown',()=>focusWin(w));
  el.querySelector('.mn').onclick=e=>{e.stopPropagation();minimizeWin(w)};
  el.querySelector('.mx').onclick=e=>{e.stopPropagation();toggleMax(w)};
  el.querySelector('.cls').onclick=e=>{e.stopPropagation();closeWin(w)};
  const ttl=el.querySelector('.ttl');
  ttl.ondblclick=e=>{if(!e.target.closest('button'))toggleMax(w)};
  ttl.oncontextmenu=e=>{e.preventDefault();winMenu(e,w)};
  dragify(w,ttl);
  resizify(w);
  // the agent inside this app: ✦ toggles the copilot panel (remembered per app)
  el.querySelector('.cp-btn').onclick=e=>{e.stopPropagation();toggleCopilot(w)};
  // the panel never opens by itself — a window is a window until you ask for the
  // agent (✦ on the title bar, or the copilot shortcut, which also works in
  // full screen). Until then it sits quietly out of the way.

  app.render(el.querySelector('.wbody'),w);
  setMenubarApp(app.title);
  focusWin(w);
  zoomWin(el,app.id,1);
  return w;
}
function focusWin(w){
  if(w.min)return;
  w.el.style.zIndex=++WM.z;
  if(WM.z>9e5){ // renormalize so z never grows unbounded across a long session
    const order=[...WM.wins.values()].sort((a,b)=>(+a.el.style.zIndex||0)-(+b.el.style.zIndex||0));
    WM.z=100+order.length; order.forEach((o,i)=>o.el.style.zIndex=100+i);
    w.el.style.zIndex=WM.z=100+order.length+1;
  }
  WM.wins.forEach(o=>{o.el.classList.toggle('active',o===w);o.tb.classList.toggle('on',o===w&&!o.min)});
  setMenubarApp(w.app.title);
  updateDockHide();
  if(typeof deckAuto==='function')deckAuto();
  if(typeof buildPager==='function')buildPager();
  if(typeof buildDock==='function')buildDock();
}
/* the dock auto-hides while a maximized window is focused; a bottom-edge peek brings it back */
function updateDockHide(){
  let maxed=false;WM.wins.forEach(o=>{if(o.el.classList.contains('active')&&o.max&&!o.min)maxed=true});
  // on a phone every window is maximized, so hiding the dock for one would hide
  // it forever — and there is no pointer to peek with
  if(typeof isMobile==='function'&&isMobile())maxed=false;
  document.body.classList.toggle('dock-hide',maxed);
  if(!maxed)document.body.classList.remove('dock-peek');
}
document.addEventListener('pointermove',e=>{
  if(!document.body.classList.contains('dock-hide'))return;
  if(e.clientY>innerHeight-6)document.body.classList.add('dock-peek');
  else if(document.body.classList.contains('dock-peek')&&e.clientY<innerHeight-110)document.body.classList.remove('dock-peek');
});
function setMenubarApp(title){const el=$('#mbapp');if(el)el.textContent=title||'';
  if(typeof buildAppMenus==='function')buildAppMenus()}
function minimizeWin(w){
  w.min=true;w.tb.classList.add('mini');w.tb.classList.remove('on');
  zoomWin(w.el,w.id,-1).then(()=>{if(w.min)w.el.style.display='none'});
  // hand focus to the topmost remaining window
  let top=null;WM.wins.forEach(o=>{if(!o.min&&o!==w&&(!top||+o.el.style.zIndex>+top.el.style.zIndex))top=o});
  if(top)focusWin(top);else{setMenubarApp('');updateDockHide();if(typeof deckAuto==='function')deckAuto();if(typeof buildDock==='function')buildDock()}
}
function restoreWin(w){
  w.min=false;w.el.style.display='';w.tb.classList.remove('mini');
  zoomWin(w.el,w.id,1);
  if(typeof deckAuto==='function')deckAuto();
  if(typeof buildDock==='function')buildDock();
}
function toggleMax(w){
  flipWin(w.el,()=>{
    if(w.max){w.el.classList.remove('maxed');w.max=false;
      if(w.prev){w.el.style.left=w.prev.l;w.el.style.top=w.prev.t;w.el.style.width=w.prev.w;w.el.style.height=w.prev.h}}
    else{w.prev={l:w.el.style.left,t:w.el.style.top,w:w.el.style.width,h:w.el.style.height};
      w.el.classList.add('maxed');w.max=true}
  });
  focusWin(w);
  updateDockHide();
}
/* every window control in one place — the title bar's right-click menu */
function winMenu(e,w){
  const items=[
    {label:w.fs?'Leave full screen':'Full screen',fn:()=>toggleFullWin(w)},
    {label:w.max?'Restore size':'Maximize',fn:()=>toggleMax(w)},
    {label:'Minimize',fn:()=>minimizeWin(w)},
    null,
    {label:'Tile left',fn:()=>tileWin(w,'left')},
    {label:'Tile right',fn:()=>tileWin(w,'right')},
    {label:'Centre',fn:()=>tileWin(w,'centre')},
  ];
  if(DESKS>1){
    items.push(null);
    for(let n=1;n<=DESKS;n++)if(n!==w.desk)items.push({label:'Move to Desktop '+n,fn:()=>{
      w.desk=n;applyDeskVisibility();toast(`moved to Desktop ${n}`)}});
  }
  if(w.app.multi)items.push(null,{label:'New window',fn:()=>openAppNew(w.id)});
  items.push(null,{label:'Close',danger:true,fn:()=>closeWin(w)});
  showCtxItems(e,items);
}
/* true full screen: over the menu bar, dock and everything else */
function toggleFullWin(w){
  w.fs=!w.fs;
  if(w.fs&&!w.prev)w.prev={l:w.el.style.left,t:w.el.style.top,w:w.el.style.width,h:w.el.style.height};
  flipWin(w.el,()=>{
    w.el.classList.toggle('fullwin',w.fs);
    if(!w.fs&&w.prev){w.el.style.left=w.prev.l;w.el.style.top=w.prev.t;
      w.el.style.width=w.prev.w;w.el.style.height=w.prev.h;w.prev=null}
  });
  document.body.classList.toggle('has-fullwin',w.fs);
  if(w.fs)toast('full screen — Esc or F to exit');
  focusWin(w);
}
/* Ctrl+↓ organises whatever is on this desktop: grid → cascade → back where
   they were. Each window's pre-arrange geometry is remembered so the third
   press really does restore, not approximate. */
let ARRANGE_MODE=0;
function arrangeWindows(){
  const desk=$('#desktop'),W=desk.clientWidth,H=desk.clientHeight;
  const wins=[];WM.wins.forEach(x=>{if(!x.min&&(x.desk||1)===curDesk&&!x.fs)wins.push(x)});
  if(!wins.length)return toast('nothing to arrange on this desktop');
  wins.forEach(x=>{if(!x.arr)x.arr={l:x.el.style.left,t:x.el.style.top,w:x.el.style.width,h:x.el.style.height}});
  ARRANGE_MODE=(ARRANGE_MODE+1)%3;
  if(ARRANGE_MODE===1){                      // grid
    const n=wins.length,cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),gap=10;
    const cw=(W-gap*(cols+1))/cols, ch=(H-gap*(rows+1))/rows;
    wins.forEach((x,i)=>{
      const c=i%cols,r=Math.floor(i/cols);
      if(x.max)toggleMax(x);
      flipWin(x.el,()=>{x.el.style.left=(gap+c*(cw+gap))+'px';x.el.style.top=(gap+r*(ch+gap))+'px';
        x.el.style.width=cw+'px';x.el.style.height=ch+'px'});
    });
    toast('▦ tiled — press again to cascade');
  }else if(ARRANGE_MODE===2){                // cascade
    wins.forEach((x,i)=>{
      if(x.max)toggleMax(x);
      flipWin(x.el,()=>{x.el.style.left=(40+i*38)+'px';x.el.style.top=(30+i*34)+'px';
        x.el.style.width=Math.min(920,W-120)+'px';x.el.style.height=Math.min(620,H-110)+'px'});
      focusWin(x);
    });
    toast('▤ cascaded — press again to restore');
  }else{                                     // back where they were
    wins.forEach(x=>{if(x.arr){const a=x.arr;flipWin(x.el,()=>{x.el.style.left=a.l;x.el.style.top=a.t;
      x.el.style.width=a.w;x.el.style.height=a.h});x.arr=null}});
    toast('windows restored');
  }
}
function tileWin(w,where){
  const desk=$('#desktop'),W=desk.clientWidth,H=desk.clientHeight;
  const z=where==='left'?{l:0,t:0,w:W/2,h:H}
    :where==='right'?{l:W/2,t:0,w:W/2,h:H}
    :{l:W*0.15,t:H*0.08,w:W*0.7,h:H*0.8};
  if(w.max)toggleMax(w);
  if(!w.snap)w.snap={l:w.el.style.left,t:w.el.style.top,w:w.el.style.width,h:w.el.style.height};
  flipWin(w.el,()=>{w.el.style.left=z.l+'px';w.el.style.top=z.t+'px';
    w.el.style.width=z.w+'px';w.el.style.height=z.h+'px'});
  focusWin(w);
}
function closeWin(w){
  if(w.app.onClose&&w.app.onClose(w)===false)return;
  if(w.fs)document.body.classList.remove('has-fullwin');
  WM.wins.delete(w.key);w.tb.remove();
  zoomWin(w.el,w.id,-1).then(()=>w.el.remove());
  let top=null;WM.wins.forEach(o=>{if(!o.min&&(!top||+o.el.style.zIndex>+top.el.style.zIndex))top=o});
  if(top)focusWin(top);else{setMenubarApp('');updateDockHide()}
  if(typeof deckAuto==='function')deckAuto();
  if(typeof buildDock==='function')buildDock();
}

/* ---- drag with edge snapping: left/right halves, corners quarters, top maximizes ---- */
function snapZone(x,y,dw,dh){
  const c=140;
  if(x<8&&y<c)return {l:0,t:0,w:dw/2,h:dh/2};
  if(x<8&&y>dh-c)return {l:0,t:dh/2,w:dw/2,h:dh/2};
  if(x>dw-8&&y<c)return {l:dw/2,t:0,w:dw/2,h:dh/2};
  if(x>dw-8&&y>dh-c)return {l:dw/2,t:dh/2,w:dw/2,h:dh/2};
  if(x<8)return {l:0,t:0,w:dw/2,h:dh};
  if(x>dw-8)return {l:dw/2,t:0,w:dw/2,h:dh};
  if(y<4)return {l:0,t:0,w:dw,h:dh,max:true};
  return null;
}
function snapGhost(z){
  let g=$('#snapghost');
  if(!z){if(g)g.classList.remove('on');return}
  if(!g){g=document.createElement('div');g.id='snapghost';$('#desktop').appendChild(g)}
  g.style.left=z.l+'px';g.style.top=z.t+'px';g.style.width=z.w+'px';g.style.height=z.h+'px';
  g.classList.add('on');
}
function applySnap(w,z){
  if(z.max){toggleMax(w);return}
  if(!w.snap)w.snap={l:w.el.style.left,t:w.el.style.top,w:w.el.style.width,h:w.el.style.height};
  flipWin(w.el,()=>{w.el.style.left=z.l+'px';w.el.style.top=z.t+'px';w.el.style.width=z.w+'px';w.el.style.height=z.h+'px'});
}
function dragify(w,handle){
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    if(w.max)return;
    const el=w.el, sx=e.clientX, sy=e.clientY, ol=el.offsetLeft, ot=el.offsetTop;
    const wasSnapped=!!w.snap;
    const desk=$('#desktop');
    let moved=false, zone=null;
    handle.setPointerCapture(e.pointerId);
    const move=ev=>{
      let dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved&&Math.abs(dx)+Math.abs(dy)<3)return;
      if(!moved){moved=true;el.classList.add('dragging')}
      let l=ol+dx, t=ot+dy;
      // dragging a snapped window away releases it back to its remembered size
      if(wasSnapped&&w.snap&&(Math.abs(dx)>40||Math.abs(dy)>40)){
        const pw=parseInt(w.snap.w),ph=parseInt(w.snap.h);
        el.style.width=w.snap.w;el.style.height=w.snap.h;w.snap=null;
        l=ev.clientX-pw/2; t=ev.clientY-12;
      }
      l=Math.max(-el.offsetWidth+90,Math.min(l,desk.clientWidth-90));
      t=Math.max(0,Math.min(t,desk.clientHeight-40));
      el.style.left=l+'px';el.style.top=t+'px';
      zone=snapZone(ev.clientX,ev.clientY-(desk.getBoundingClientRect().top||0),desk.clientWidth,desk.clientHeight);
      snapGhost(zone);
    };
    const up=()=>{
      handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);
      el.classList.remove('dragging');snapGhost(null);
      if(zone&&moved)applySnap(w,zone);
    };
    handle.addEventListener('pointermove',move);
    handle.addEventListener('pointerup',up);
  });
}
/* ---- 8-way resize (replaces the browser's CSS resize grip) ---- */
function resizify(w){
  const MIN_W=320, MIN_H=180;
  w.el.querySelectorAll('.rz').forEach(h=>{
    h.addEventListener('pointerdown',e=>{
      if(w.max)return;
      e.stopPropagation();e.preventDefault();
      focusWin(w);
      const d=h.dataset.d, el=w.el, desk=$('#desktop');
      const sx=e.clientX, sy=e.clientY;
      const r={l:el.offsetLeft,t:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};
      h.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      const move=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        let {l,t,w:nw,h:nh}=r;
        if(d.includes('e'))nw=r.w+dx;
        if(d.includes('s'))nh=r.h+dy;
        if(d.includes('w')){nw=r.w-dx;l=r.l+dx}
        if(d.includes('n')){nh=r.h-dy;t=r.t+dy}
        if(nw<MIN_W){if(d.includes('w'))l-=(MIN_W-nw);nw=MIN_W}
        if(nh<MIN_H){if(d.includes('n'))t-=(MIN_H-nh);nh=MIN_H}
        nw=Math.min(nw,desk.clientWidth); nh=Math.min(nh,desk.clientHeight);
        el.style.left=l+'px';el.style.top=t+'px';el.style.width=nw+'px';el.style.height=nh+'px';
      };
      const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);el.classList.remove('dragging');w.snap=null};
      h.addEventListener('pointermove',move);
      h.addEventListener('pointerup',up);
    });
  });
}
function refreshApp(id){winsOf(id).forEach(w=>w.app.render(w.el.querySelector('.wbody'),w))}

/* ===== shared panel shell: header + search + actions + body ===== */
const SVG_SEARCH='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
const SVG_EMPTY='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 14h8"/></svg>';
function panelShell(body,o){
  o=o||{};
  body.innerHTML=`<div class="pshell">
    <div class="phead">
      <span class="pt">${o.title||''}</span>
      ${o.sub?`<span class="ps">${o.sub}</span>`:''}
      <span class="sp"></span>
      ${o.search?`<span class="psearch">${SVG_SEARCH}<input id="${o.search.id}" placeholder="${esc(o.search.placeholder||'Search…')}" autocomplete="off"></span>`:''}
      ${o.actions||''}
    </div>
    <div class="pbody${o.flush?' flush':''}"></div>
  </div>`;
  const pb=body.querySelector('.pbody');
  if(o.search){
    const inp=body.querySelector('#'+o.search.id);
    let t;inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>o.search.onquery?o.search.onquery(inp.value):listFilter(pb,inp.value),120)};
  }
  return pb;
}
/* generic client-side filter: hides any [data-f] row not matching q; hides [data-fgroup] sections left empty */
function listFilter(scope,q){
  q=(q||'').toLowerCase().trim();
  scope.querySelectorAll('[data-f]').forEach(el=>{
    el.style.display=!q||(el.getAttribute('data-f')||'').toLowerCase().includes(q)?'':'none'});
  scope.querySelectorAll('[data-fgroup]').forEach(g=>{
    const any=[...g.querySelectorAll('[data-f]')].some(el=>el.style.display!=='none');
    g.style.display=any?'':'none'});
}
function emptyBox(title,hint,action,askApp,askPrompt){
  // every empty state is an invitation: the ✦ chip opens this app's copilot
  const ask=askApp?`<button class="cp-chip" style="margin-top:10px" onclick="copilotAsk('${esc(askApp)}',${JSON.stringify(askPrompt||'').replace(/"/g,'&quot;')})">✦ Ask ${esc((typeof agentName==='function'&&agentName())||'the agent')}</button>`:'';
  return `<div class="empty">${SVG_EMPTY}<div class="et">${esc(title)}</div>${hint?`<div class="eh">${hint}</div>`:''}${action||''}${ask}</div>`;
}
/* open (if needed) an app + its copilot panel, prefill and send */
function copilotAsk(appId,prompt){
  const w=winsOf(appId)[0]||openApp(appId);
  if(!w)return;
  const panel=w.el.querySelector('.copanel');
  if(panel&&!panel.classList.contains('open'))toggleCopilot(w);
  let tries=0;
  const t=()=>{
    const i=w.el.querySelector('.cp-in');
    if(!i){if(++tries<20)setTimeout(t,120);return}
    i.value=prompt||'';
    if(prompt)i.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}));
    else i.focus();
  };
  setTimeout(t,160);
}
function segTabs(id,labels,active,fn){
  return `<span class="seg" id="${id}">${labels.map((l,i)=>
    `<button class="${i===active?'on':''}" onclick="${fn}(${i})">${esc(l)}</button>`).join('')}</span>`;
}

/* ================= the ever-present agent: turn client + copilot panels =================
   One shared machinery for every embedded agent surface:
   - agentTurn(): send a turn on any conversation, with per-surface context and a sink
   - miniFeed(): a compact live renderer (text, thinking, tool cards, approvals)
   - copilot panels: a ✦ conversation inside every app window, scoped to that app
   The Chat window remains the full-history surface; these are the in-place hands. */

let PENDING_SINKS=[];   // sinks waiting for their server-created conversation id, by origin
function claimConversation(ev){
  // Returns true when this new conversation belongs to an embedded surface
  // (omnibar/copilot) — the Chat window must not adopt it as currentConv.
  const i=PENDING_SINKS.findIndex(p=>p.origin===ev.origin);
  if(i>=0){
    const p=PENDING_SINKS.splice(i,1)[0];
    sinkOn(ev.id,p.sink);
    if(p.onCid)p.onCid(ev.id);
    return true;
  }
  return !!(ev.origin&&ev.origin!=='user');
}
/* One turn at a time per conversation is a server rule, so a second ask while
   the agent is busy gets QUEUED (and says so) instead of being dropped. */
const TURN_QUEUE=[];
function agentQueueFlush(cid){
  const i=TURN_QUEUE.findIndex(o=>o.cid===cid);
  if(i<0)return;
  const o=TURN_QUEUE.splice(i,1)[0];
  setTimeout(()=>agentTurn(o),150);
}
function agentTurn(o){
  // o: {text, cid?, origin, title?, context?, sink, onCid?}
  if(!ws||ws.readyState!==1){toast('not connected to the server');return false}
  if(o.cid&&RUNNING.has(o.cid)){
    TURN_QUEUE.push(o);
    if(o.sink){
      if(o.sink.start)o.sink.start();
      if(o.sink.status)o.sink.status({message:`queued — ${agentName()} is finishing something`});
    }
    // never a dead end: the caller can offer "stop what's running and send this now"
    if(o.onQueued)o.onQueued(()=>{
      try{ws.send(JSON.stringify({type:'abort',conversation_id:o.cid}))}catch(e){}
    });
    return true;
  }
  if(o.cid)sinkOn(o.cid,o.sink);
  else PENDING_SINKS.push({origin:o.origin,sink:o.sink,onCid:o.onCid});
  ws.send(JSON.stringify({type:'chat',text:o.text,conversation_id:o.cid||null,
    images:o.images||[],model:'',surface:'gui',origin:o.origin||'user',title:o.title||'',
    context:o.context||''}));
  return true;
}

/* ---- stopping: any turn, from anywhere, at any moment ---- */
function stopAgent(cid){
  if(!ws||ws.readyState!==1)return false;
  ws.send(JSON.stringify({type:'abort',conversation_id:cid||null}));   // no id = stop everything
  return true;
}
function stopAllAgents(){
  const n=RUNNING.size+((window.STUDIO&&STUDIO.building)?1:0);
  // drop anything queued behind it too, or the next turn starts the moment this one dies
  if(typeof TURN_QUEUE!=='undefined')TURN_QUEUE.length=0;
  if(!stopAgent(null))return toast('not connected to the server');
  toast(n?`stopping ${n} running turn${n>1?'s':''}…`:'nothing is running right now');
}

/* ---- miniFeed: renders one conversation's live events into a container ---- */
function miniFeed(box,opts){
  opts=opts||{};
  let body=null,text='',think=null,working=null;
  const scroll=()=>{const sc=opts.scrollEl||box;sc.scrollTop=sc.scrollHeight};
  const clearWorking=()=>{if(working){working.remove();working=null}};
  const ensureBody=()=>{
    if(!body){body=document.createElement('div');body.className='mf-body body';box.appendChild(body)}};
  return {
    start(){
      text='';body=null;think=null;clearWorking();
      if(opts.onStart)opts.onStart();
      working=document.createElement('div');working.className='mf-working';
      working.innerHTML='<span class="mfo"></span><span class="mft">thinking…</span>';
      box.appendChild(working);scroll();
    },
    status(ev){if(working)working.querySelector('.mft').textContent=ev.message||'working…'},
    thinking(t){
      // answer surfaces (cards) stay clean: the reasoning trace only says "thinking…"
      if(opts.showThinking===false){
        if(working)working.querySelector('.mft').textContent='thinking…';
        return;
      }
      if(!think){think=document.createElement('div');think.className='think mf-think';box.insertBefore(think,working)}
      think.textContent+=t;think.scrollTop=think.scrollHeight;
    },
    delta(t){
      clearWorking();ensureBody();
      text+=t;body.innerHTML=md(text);scroll();
    },
    toolStart(ev,argStr){
      body=null;text='';think=null;
      const card=document.createElement('div');card.className='tool';card.dataset.mf=ev.call_id;
      card.innerHTML=`<div class="head"><span class="tname2">${esc(ev.name)}</span><span class="targ">${esc(argStr)}</span><span class="tstat run">${ev.pending_approval?'awaiting approval':'running'}</span></div><div class="out"></div>`;
      card.querySelector('.head').onclick=()=>card.classList.toggle('open');
      box.insertBefore(card,working);scroll();
    },
    toolEnd(ev){
      const card=box.querySelector(`.tool[data-mf="${CSS.escape(ev.call_id)}"]`);
      if(card){const st=card.querySelector('.tstat');st.className='tstat '+(ev.ok?'ok':'fail');
        st.textContent=ev.ok?'done':'failed';card.querySelector('.out').textContent=ev.output||'(no output)';
        if(!ev.ok)card.classList.add('open')}
      if(opts.onTool)opts.onTool(ev);
    },
    approval(apBox){box.insertBefore(apBox,working);scroll();return true},
    error(ev){
      clearWorking();
      const d=document.createElement('div');d.className='errmsg';d.textContent=ev.message;
      box.appendChild(d);scroll();
    },
    end(ev){clearWorking();body=null;think=null;if(opts.onEnd)opts.onEnd(text);text=''},
  };
}

/* ---- visible hands: when a tool touches an app, that surface glows ---- */
function agentHands(ev){
  let appId=null;
  if(ev.name==='control_desktop'&&ev.args){
    const t=ev.args.target;
    appId=typeof shellResolveApp==='function'?shellResolveApp(t):null;
    if(ev.args.action==='apply_theme')appId=null;
  }
  else if(ev.name==='set_wallpaper'||ev.name==='generate_wallpaper')appId='personalize';
  else if(ev.name==='create_app'||ev.name==='develop_agentos')appId='studio';
  if(!appId)return;
  const w=(typeof winsOf==='function'?winsOf(appId):[])[0];
  const els=[w&&w.el,document.querySelector(`#dock .dockb[data-app="${CSS.escape(appId)}"]`)].filter(Boolean);
  els.forEach(el=>{
    el.classList.add('agent-touch');
    clearTimeout(el._ht);el._ht=setTimeout(()=>el.classList.remove('agent-touch'),2600);
  });
}

/* ---- copilot panels: the agent inside every app window ---- */
const COPILOT={cids:{}};                 // appId -> conversation id (session cache)
function copilotStarters(appId){

async function copilotThread(appId,title){
  if(COPILOT.cids[appId])return COPILOT.cids[appId];
  try{
    const d=await (await fetch('/api/conversations')).json();
    const hit=(d.conversations||[]).find(c=>c.origin==='copilot:'+appId);
    if(hit){COPILOT.cids[appId]=hit.id;return hit.id}
  }catch(e){}
  return null;   // created lazily on the first turn (origin routes it back to us)
}
function copilotContext(w){
  const app=w.app;
  let state='';
  try{state=app.context?String(app.context(w)||''):''}catch(e){}
  const others=[];WM.wins.forEach(o=>{if(o.id!==w.id&&!o.min)others.push(o.app.title)});
  return [
    `You are ${agentName()}, embedded as the copilot panel INSIDE the "${app.title}" app of AgentOS.`,
    `The user sees the app right beside your panel. Prefer ACTING through your tools over explaining;`,
    `keep replies short (a sentence or two unless asked). The app refreshes automatically after your tools run.`,
    `App: ${app.title} — ${app.desc||''}.`,
    state?`Live app state: ${state}`:'',
    others.length?`Also open: ${others.join(', ')}.`:'',
    `Desktop control is available via control_desktop/desktop_state; files via search_files/read_file/write_file.`,
  ].filter(Boolean).join('\n');
}
function toggleCopilot(w){
  const panel=w.el.querySelector('.copanel');
  const btn=w.el.querySelector('.cp-btn');
  const open=!panel.classList.contains('open');
  panel.classList.toggle('open',open);
  btn.classList.toggle('on',open);
  localStorage.setItem('copilot:'+w.id,open?'1':'');
  if(open&&!panel.dataset.ready)initCopilot(w,panel);
  if(open)setTimeout(()=>{const i=panel.querySelector('.cp-in');if(i)i.focus()},250);
}
async function initCopilot(w,panel){
  panel.dataset.ready='1';
  panel.innerHTML=`<div class="cp-head"><span class="cp-ava">✦</span><span class="cp-name">${esc(agentName())}</span>
      <span class="cp-app">${esc(w.app.title)}</span><span style="flex:1"></span>
      <button class="cp-open" title="Open in Chat">⤢</button></div>
    <div class="cp-feed"></div>
    <div class="cp-starters"></div>
    <div class="cp-inbar"><textarea class="cp-in" rows="1" placeholder="Ask about ${esc(w.app.title.toLowerCase())}…"></textarea><button class="cp-send">↑</button></div>`;
  const feedEl=panel.querySelector('.cp-feed');
  const input=panel.querySelector('.cp-in');
  const sendBtn2=panel.querySelector('.cp-send');
  const startersEl=panel.querySelector('.cp-starters');
  // starters: the panel invites action the moment it opens
  startersEl.innerHTML=copilotStarters(w.id).map(s=>`<button class="cp-chip">${esc(s)}</button>`).join('');
  startersEl.querySelectorAll('.cp-chip').forEach(b=>b.onclick=()=>{input.value=b.textContent;go()});
  panel.querySelector('.cp-open').onclick=()=>{
    if(COPILOT.cids[w.id]){openApp('chat');openConv(COPILOT.cids[w.id])}
    else{openApp('chat')}
  };
  // prior thread: compact replay of the persistent per-app conversation
  const cid=await copilotThread(w.id,w.app.title);
  if(cid){
    try{
      const d=await (await fetch('/api/conversations/'+cid)).json();
      const msgs=(d.messages||[]).slice(-12);
      feedEl.innerHTML=msgs.map(m=>m.role==='user'
        ?`<div class="mf-user">${esc(m.content)}</div>`
        :m.role==='assistant'?`<div class="mf-body body">${md(m.content||'')}</div>`:'').join('');
      feedEl.scrollTop=feedEl.scrollHeight;
    }catch(e){}
    if(RUNNING.has(cid))sinkOn(cid,mkSink());   // re-attach to a live turn
  }
  let live=null;
  const setBusy=on=>{
    sendBtn2.textContent=on?'◼':'↑';
    sendBtn2.classList.toggle('stop',on);
    sendBtn2.title=on?'Stop this agent':'Send';
  };
  function mkSink(){
    if(live)return live;
    live=miniFeed(feedEl,{scrollEl:feedEl,
      onStart:()=>setBusy(true),
      onTool:()=>{clearTimeout(panel._rt);panel._rt=setTimeout(()=>refreshApp(w.id),450)},
      onEnd:()=>{live=null;setBusy(false);startersEl.style.display='none'}});
    return live;
  }
  function go(){
    const text=input.value.trim();if(!text)return;
    input.value='';
    feedEl.insertAdjacentHTML('beforeend',`<div class="mf-user">${esc(text)}</div>`);
    feedEl.scrollTop=feedEl.scrollHeight;
    const sink=mkSink();
    agentTurn({text,cid:COPILOT.cids[w.id]||null,origin:'copilot:'+w.id,
      title:'✦ '+w.app.title,context:copilotContext(w),sink,
      onCid:id=>{COPILOT.cids[w.id]=id}});
  }
  sendBtn2.onclick=()=>{
    const cid=COPILOT.cids[w.id];
    if(cid&&RUNNING.has(cid)){stopAgent(cid);toast('stopping…');return}   // ◼ while it works
    go();
  };
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
}
/* ================= application menus =================
   Every window gets File · Edit · View · Window · Help in the menu bar, the way
   a desktop application is expected to. The set is generated for the focused
   window, so it is never stale and no app has to opt in; an app can add its own
   entries by declaring APPS[id].menus(w) — those are merged, not replacing the
   basics. Edit acts on whatever has the caret, which is what makes Copy/Paste
   behave like the rest of the system. */

function menuStd(w){
  const app=w&&w.app, id=w&&w.id;
  const has=sel=>!!(w&&w.el.querySelector(sel));
  const file=[];
  if(app&&app.multi)file.push({label:'New window',keys:'',fn:()=>openAppNew(id)});
  file.push({label:'New chat',fn:()=>{openApp('chat');newChat()}});
  if(has('.psearch input'))file.push({label:'Find in this app',keys:'',fn:()=>{
    const i=w.el.querySelector('.psearch input');if(i)i.focus()}});
  file.push(null,
    {label:'Take a screenshot',fn:()=>takeScreenshot('full')},
    {label:'Close window',keys:(SHORTCUTS['window.close']||{}).keys,fn:()=>closeWin(w)});

  const edit=[
    {label:'Undo',keys:'Ctrl+Z',fn:()=>document.execCommand('undo')},
    {label:'Redo',keys:'Ctrl+Shift+Z',fn:()=>document.execCommand('redo')},
    null,
    {label:'Cut',keys:'Ctrl+X',fn:()=>editDo('cut')},
    {label:'Copy',keys:'Ctrl+C',fn:()=>editDo('copy')},
    {label:'Paste',keys:'Ctrl+V',fn:()=>editPaste()},
    {label:'Select all',keys:'Ctrl+A',fn:()=>document.execCommand('selectAll')},
  ];

  const view=[
    {label:'Reload this app',fn:()=>refreshApp(id)},
    {label:w&&w.fs?'Leave full screen':'Full screen',keys:'',fn:()=>toggleFullWin(w)},
    {label:w&&w.max?'Restore size':'Maximize',keys:(SHORTCUTS['window.maximize']||{}).keys,fn:()=>toggleMax(w)},
    null,
    {label:(w&&w.el.querySelector('.copanel.open'))?'Hide the agent panel':'Ask the agent about this app',
     keys:(SHORTCUTS['copilot']||{}).keys,fn:()=>toggleCopilot(w)},
    {label:'Spaces overview',keys:(SHORTCUTS['expose']||{}).keys,fn:()=>exposeToggle(true)},
  ];

  const win=[
    {label:'Minimize',keys:(SHORTCUTS['window.minimize']||{}).keys,fn:()=>minimizeWin(w)},
    {label:'Tile left',fn:()=>tileWin(w,'left')},
    {label:'Tile right',fn:()=>tileWin(w,'right')},
    {label:'Centre',fn:()=>tileWin(w,'centre')},
    {label:'Organise all windows',keys:(SHORTCUTS['windows.arrange']||{}).keys,fn:()=>arrangeWindows()},
  ];
  if(DESKS>1){
    win.push(null);
    for(let n=1;n<=DESKS;n++)if(n!==w.desk)
      win.push({label:'Move to Desktop '+n,fn:()=>{w.desk=n;applyDeskVisibility();buildPager();toast('moved to Desktop '+n)}});
  }
  const openWins=[];WM.wins.forEach(o=>{if(o!==w&&!o.min)openWins.push(o)});
  if(openWins.length){
    win.push(null);
    openWins.slice(0,8).forEach(o=>win.push({label:o.app.title,fn:()=>focusWin(o)}));
  }

  const help=[
    {label:'Keyboard shortcuts',keys:(SHORTCUTS['help']||{}).keys,fn:()=>keysHelp(true)},
    {label:'AgentOS manual',fn:()=>openApp('docs')},
    {label:`Ask ${agentName()} about ${app?app.title:'this app'}`,fn:()=>copilotAsk(id,'')},
    null,
    {label:'About AgentOS',fn:()=>openApp('about')},
  ];

  const menus=[['File',file],['Edit',edit],['View',view],['Window',win],['Help',help]];
  // an app's own menus merge into the standard ones (or add a new menu)
  let extra=[];
  try{extra=(app&&app.menus)?app.menus(w)||[]:[]}catch(e){}
  extra.forEach(([title,items])=>{
    const hit=menus.find(m=>m[0].toLowerCase()===String(title).toLowerCase());
    if(hit)hit[1]=items.concat([null],hit[1]);
    else menus.splice(menus.length-1,0,[title,items]);
  });
  return menus;
}
function editDo(cmd){
  const el=document.activeElement;
  if(el&&/^(input|textarea)$/i.test(el.tagName||''))el.focus();
  if(!document.execCommand(cmd))toast('nothing selected');
}
async function editPaste(){
  const el=document.activeElement;
  if(!el||!/^(input|textarea)$/i.test(el.tagName||''))return toast('click into a text field first');
  try{
    const t=await navigator.clipboard.readText();
    const s=el.selectionStart??el.value.length, e=el.selectionEnd??s;
    el.value=el.value.slice(0,s)+t+el.value.slice(e);
    el.selectionStart=el.selectionEnd=s+t.length;
    el.dispatchEvent(new Event('input',{bubbles:true}));
  }catch(err){toast('press Ctrl+V — the browser kept the clipboard private')}
}
/* ---- native (external) windows get menus too -------------------------------
   We cannot reach inside someone else's app for its File and Edit, and
   pretending otherwise would be worse than useless. What we CAN offer is every
   verb the window manager owns — and saying so plainly, under the app's real
   name, is what makes an external app feel like part of the machine rather than
   a rectangle floating on top of it. */
function menuNative(w){
  const name=(typeof natName==='function'&&natName(w))||w.app||'Application';
  const app=[
    {label:'Show the desktop',keys:'Super+D',fn:showDesktop},
    {label:'Switch window',keys:'Alt+Tab',fn:()=>fetch('/api/windows/cycle',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({direction:'next'})})},
    null,
    {label:'Close '+name,keys:'Super+Q',danger:true,fn:()=>natWin('close',w.id)},
  ];
  const win=natWinItems(w).filter(it=>!it||it.label!=='Close window');
  const help=[
    {label:'Keyboard shortcuts',keys:(SHORTCUTS['help']||{}).keys,fn:()=>{
      raiseShell(true);keysHelp(true)}},
    {label:`Ask ${agentName()} about ${name}`,fn:()=>{raiseShell(true);
      omniFocus&&omniFocus();const i=$('#omni-in');if(i){i.value='About the '+name+' window: ';omniPop(true)}}},
    null,
    {label:'AgentOS desktop',keys:(SHORTCUTS['omnibar.focus']||{}).keys,fn:()=>raiseShell(true)},
  ];
  return [[name,app],['Window',win],['Help',help]];
}
/* Bring the AgentOS desktop in front of the native windows (or send it back).
   In session mode the shell is the tiled base layer and sway paints floating
   windows above tiled ones, so this is what "come to the front" has to mean. */
function raiseShell(on){
  if(PLATFORM.mode!=='de')return Promise.resolve();
  return fetch('/api/shell/raise',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({on:on!==false})}).catch(()=>{});
}
/* ---- the menu bar renders the focused window's menus ---- */
function buildAppMenus(){
  const box=$('#mbmenus');if(!box)return;
  // The COMPOSITOR's focus is the truth, not the shell's idea of it. A focused
  // external window owns the bar even while an AgentOS window is still marked
  // active inside the page — otherwise the bar says "Task Manager" while you are
  // typing in VS Code.
  const nat=(typeof natFocused==='function')?natFocused():null;
  const w=nat?null:((typeof activeWin==='function')&&activeWin());
  const label=$('#mbapp');
  if(label&&label.dataset.native){label.textContent='';delete label.dataset.native}
  if(!w&&!nat){box.innerHTML='';box.classList.remove('on');return}
  if(nat){
    if(label){label.textContent=natName(nat);label.dataset.native='1'}
    box.classList.add('on');
    paintMenuBar(box,menuNative(nat),()=>menuNative(natFocused()||nat));
    return;
  }
  const menus=menuStd(w);
  box.classList.add('on');
  // recomputed on open, not on focus: an app that renders asynchronously (or has
  // since changed folder / tab) gets menus that describe it as it is now
  paintMenuBar(box,menus,()=>(activeWin()===w?menuStd(w):menus));
}
function paintMenuBar(box,menus,live){
  box.innerHTML=menus.map(([title],i)=>`<button data-i="${i}">${esc(title)}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>{
    const open=()=>{
      const r=b.getBoundingClientRect();
      box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      let set=menus;
      try{set=live()||menus}catch(e){}
      const items=(set[+b.dataset.i]||menus[+b.dataset.i])[1];
      showCtxItems({clientX:r.left,clientY:r.bottom+2,preventDefault(){}},
        items.map(it=>it&&({...it,
          label:it.keys?`${it.label}<span class="mk">${esc(it.keys)}</span>`:it.label})));
      const clear=()=>{b.classList.remove('on');document.removeEventListener('click',clear,true)};
      setTimeout(()=>document.addEventListener('click',clear,true),0);
    };
    b.onclick=open;
    b.onmouseenter=()=>{if(box.querySelector('button.on'))open()};   // slide across like a real menu bar
  });
}

/* ===== icon layout engine: grid snap, multi-select, marquee, arrangements ===== */
const GRID={ox:14,oy:14,cx:96,cy:104};
const SEL=new Set();          // selected icon ids
function iconEls(){return [...document.querySelectorAll('#icons .dicon')]}
function iconEl(id){return document.querySelector(`.dicon[data-id="${CSS.escape(id)}"]`)}
function setSel(id,on){const el=iconEl(id);if(!el)return;
  if(on){SEL.add(id);el.classList.add('sel')}else{SEL.delete(id);el.classList.remove('sel')}}
function clearSel(){SEL.clear();document.querySelectorAll('.dicon.sel').forEach(x=>x.classList.remove('sel'))}
function snapXY(x,y){
  const desk=$('#desktop');
  let gx=GRID.ox+Math.round((x-GRID.ox)/GRID.cx)*GRID.cx;
  let gy=GRID.oy+Math.round((y-GRID.oy)/GRID.cy)*GRID.cy;
  gx=Math.max(GRID.ox,Math.min(gx,desk.clientWidth-92));
  gy=Math.max(GRID.oy,Math.min(gy,desk.clientHeight-100));
  return {x:gx,y:gy};
}
function occupiedMap(excludeIds){
  const m=new Set();
  launcherIds().forEach(id=>{if(excludeIds.has(id))return;const p=ICONPOS[id];if(p)m.add(p.x+','+p.y)});
  return m;
}
function freeCellNear(x,y,occ){
  // nearest free snapped cell, scanning outward ring by ring
  for(let r=0;r<14;r++){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const c=snapXY(x+dx*GRID.cx,y+dy*GRID.cy);
      const k=c.x+','+c.y;
      if(!occ.has(k)){occ.add(k);return c}
    }
  }
  return snapXY(x,y);
}
function settle(el){el.classList.add('settle');setTimeout(()=>el.classList.remove('settle'),280)}
function applyIconPositions(animate){
  iconEls().forEach(el=>{
    const p=ICONPOS[el.dataset.id];if(!p)return;
    if(animate)settle(el);
    el.style.left=p.x+'px';el.style.top=p.y+'px';
  });
  renderBento();
}
function iconDrag(d,id){
  d.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    e.stopPropagation();                     // an icon press never starts a marquee
    const desk=$('#desktop');
    d._moved=false;
    // dragging an unselected icon (no modifier) makes it the sole selection;
    // dragging a selected icon moves the whole selection together
    if(!SEL.has(id)&&!(e.ctrlKey||e.metaKey)){clearSel();setSel(id,true)}
    if(!SEL.has(id)&&(e.ctrlKey||e.metaKey)){setSel(id,true);d._addedOnDown=true}else d._addedOnDown=false;
    const members=[...SEL].map(mid=>({mid,el:iconEl(mid)})).filter(m=>m.el);
    const sx=e.clientX,sy=e.clientY;
    members.forEach(m=>{m.ox=m.el.offsetLeft;m.oy=m.el.offsetTop});
    d.setPointerCapture(e.pointerId);
    const move=ev=>{
      if(!d._moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<5)return;
      d._moved=true;
      members.forEach(m=>{
        m.el.classList.add('dragging');
        const x=Math.max(0,Math.min(m.ox+ev.clientX-sx,desk.clientWidth-92));
        const y=Math.max(0,Math.min(m.oy+ev.clientY-sy,desk.clientHeight-100));
        m.el.style.left=x+'px';m.el.style.top=y+'px';
      });
    };
    const up=()=>{
      d.removeEventListener('pointermove',move);d.removeEventListener('pointerup',up);
      if(!d._moved)return;
      const movedIds=new Set(members.map(m=>m.mid));
      const occ=occupiedMap(movedIds);
      members.forEach(m=>{                    // snap each to the nearest free cell, animated
        m.el.classList.remove('dragging');
        const c=freeCellNear(m.el.offsetLeft,m.el.offsetTop,occ);
        settle(m.el);
        m.el.style.left=c.x+'px';m.el.style.top=c.y+'px';
        ICONPOS[m.mid]={x:c.x,y:c.y};
      });
      saveIconPos();
    };
    d.addEventListener('pointermove',move);d.addEventListener('pointerup',up);
  });
  d.onclick=e=>{
    e.stopPropagation();
    if(d._moved)return;                      // a drag is not a click
    if(e.ctrlKey||e.metaKey){if(!d._addedOnDown)setSel(id,!SEL.has(id))}
    else{clearSel();setSel(id,true)}
  };
  d.ondblclick=()=>openApp(id);
}
/* rubber-band selection on empty desktop space */
function ensureMarquee(){
  const icons=$('#icons');
  if(!document.getElementById('marquee')){
    const mq=document.createElement('div');mq.id='marquee';icons.appendChild(mq);
  }
  if(icons._mqWired)return;
  icons._mqWired=true;
  icons.addEventListener('pointerdown',e=>{
    if(e.target!==icons||e.button!==0)return;
    const r=icons.getBoundingClientRect();
    const sx=e.clientX-r.left,sy=e.clientY-r.top;
    let active=false;
    icons.setPointerCapture(e.pointerId);
    const move=ev=>{
      const x=ev.clientX-r.left,y=ev.clientY-r.top;
      if(!active&&Math.hypot(x-sx,y-sy)<4)return;
      active=true;
      const L=Math.min(sx,x),T=Math.min(sy,y),W=Math.abs(x-sx),H=Math.abs(y-sy);
      const mq=$('#marquee');if(!mq)return;
      mq.style.display='block';
      mq.style.left=L+'px';mq.style.top=T+'px';mq.style.width=W+'px';mq.style.height=H+'px';
      iconEls().forEach(el=>{
        const hit=el.offsetLeft<L+W&&el.offsetLeft+el.offsetWidth>L&&el.offsetTop<T+H&&el.offsetTop+el.offsetHeight>T;
        el.classList.toggle('sel',hit);
        if(hit)SEL.add(el.dataset.id);else SEL.delete(el.dataset.id);
      });
    };
    const up=()=>{
      icons.removeEventListener('pointermove',move);icons.removeEventListener('pointerup',up);
      const mq=$('#marquee');if(mq)mq.style.display='none';
      if(!active)clearSel();                 // a plain click on empty space clears the selection
    };
    icons.addEventListener('pointermove',move);icons.addEventListener('pointerup',up);
  });
}
/* arrangements: auto grid, sort by name, bento groups */
function arrangeIcons(byName){
  const desk=$('#desktop');
  const rows=Math.max(1,Math.floor((desk.clientHeight-GRID.oy-6)/GRID.cy));
  let ids=launcherIds().filter(id=>APPS[id]);
  if(byName)ids=ids.slice().sort((a,b)=>APPS[a].title.localeCompare(APPS[b].title));
  ids.forEach((id,i)=>{ICONPOS[id]={x:GRID.ox+Math.floor(i/rows)*GRID.cx,y:GRID.oy+(i%rows)*GRID.cy}});
  localStorage.removeItem('bentoBoxes');
  saveIconPos();applyIconPositions(true);
  toast(byName?'icons sorted by name':'icons auto-arranged');
}
const BENTO_GROUPS=[
  ['Essentials',['chat','apps','browser','files','terminal']],
  ['Create',['store','studio','themes','personalize']],
  ['Intelligence',['models','memory','kg','soul','profile']],
  ['Automation',['fabric','tasks','skills','mcp','telegram']],
  ['System',['taskmgr','control','settings','policies','snapshots','logs','tokens']],
  ['Library',['docs','about']],
];
function arrangeBento(){
  const desk=$('#desktop'),PADX=16,PADT=32,PADB=12,GAP=18;
  const groups=BENTO_GROUPS.map(([label,ids])=>[label,ids.filter(id=>APPS[id])]).filter(g=>g[1].length);
  const ua=launcherIds().filter(id=>id.startsWith('ua_')&&APPS[id]);
  if(ua.length)groups.push(['Your apps',ua]);
  const known=new Set(groups.flatMap(g=>g[1]));
  const rest=launcherIds().filter(id=>APPS[id]&&!known.has(id));
  if(rest.length)groups.push(['More',rest]);
  const boxes=[];
  let x=GRID.ox,y=GRID.oy,rowH=0;
  const maxW=desk.clientWidth-16;
  groups.forEach(([label,ids])=>{
    const cols=Math.min(ids.length,ids.length<=4?2:3);
    const rows=Math.ceil(ids.length/cols);
    const w=PADX*2+cols*GRID.cx-8, h=PADT+PADB+rows*GRID.cy-8;
    if(x+w>maxW&&x>GRID.ox){x=GRID.ox;y+=rowH+GAP;rowH=0}
    ids.forEach((id,i)=>{ICONPOS[id]={x:x+PADX+(i%cols)*GRID.cx,y:y+PADT+Math.floor(i/cols)*GRID.cy}});
    boxes.push({label,x,y,w,h});
    x+=w+GAP;rowH=Math.max(rowH,h);
  });
  localStorage.setItem('bentoBoxes',JSON.stringify(boxes));
  saveIconPos();applyIconPositions(true);
  toast('bento layout applied');
}
function renderBento(){
  document.querySelectorAll('#icons .bento').forEach(b=>b.remove());

/* ---- dock magnification: continuous neighbor falloff, macOS-style ---- */
(function(){
  const bar=document.getElementById('taskbar');if(!bar)return;
  const RANGE=96, LIFT=16, GROW=.42;
  let raf=0,lastX=null;
  function tiles(){return bar.querySelectorAll('.dockb,.tbwin,.tbnat,#startbtn')}
  function apply(){
    raf=0;
    tiles().forEach(b=>{
      if(lastX===null){b.style.transform='';return}
      const r=b.getBoundingClientRect();
      const d=Math.abs(lastX-(r.left+r.width/2));
      const f=Math.max(0,1-(d/RANGE)*(d/RANGE));      // smooth quadratic falloff
      b.style.transform=f>0.01?`translateY(${-LIFT*f}px) scale(${1+GROW*f})`:'';
    });
  }
  bar.addEventListener('pointermove',e=>{
    if(Motion.reduced)return;
    lastX=e.clientX;
    if(!raf)raf=requestAnimationFrame(apply);
  });
  bar.addEventListener('pointerleave',()=>{
    lastX=null;
    tiles().forEach(b=>{
      b.style.transition='transform .28s cubic-bezier(.22,1,.36,1)';
      b.style.transform='';
      setTimeout(()=>b.style.transition='',300);
    });
  });
})();
function updateDockSeps(){

  const seps=document.querySelectorAll('#taskbar .dsep');
  const any=[...document.querySelectorAll('#tbwins .tbwin')].some(b=>!b.classList.contains('indock'))
    ||($('#tbnative')&&$('#tbnative').children.length>0);

}

  const lo=(cfg&&cfg.locale)||{};

  if(lo.timezone)o.timeZone=lo.timezone;
  const loc=lo.language||[];
  const n=new Date();
  try{

      hour12:lo.clock?lo.clock==='12h':undefined});

  }catch(e){

    $('#tbclock .dt').textContent=n.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});

/* ================= the deck: app tiles above the prompt bar =================
   The desktop is wallpaper, not a filing cabinet. Every app lives in a bento
   group inside one horizontally scrollable strip that sits directly above the
   omnibar — plus any widget you pin into it. Groups are yours: rename, create,
   move apps between them. Persisted in localStorage; nothing here is on the
   server, so it stays instant. */
const DECK_DEFAULTS=[
  ['Essentials',['chat','apps','browser','files','terminal']],
  ['Create',['store','studio','themes','personalize']],
  ['Intelligence',['models','memory','kg','soul','profile']],
  ['Automation',['automations','fabric','tasks','skills','mcp','telegram']],
  ['System',['taskmgr','control','syssettings','settings','policies','permissions','snapshots','logs','tokens']],
  ['Library',['docs','mission','train','hermes','about']],
];
let DECK=null;
function deckLoad(){
  try{DECK=JSON.parse(localStorage.getItem('deck')||'null')}catch(e){DECK=null}
  if(!DECK||!Array.isArray(DECK.groups))
    DECK={open:true,groups:DECK_DEFAULTS.map(([name,apps],i)=>({id:'g'+i,name,apps:apps.slice()}))};
  if(DECK.open===undefined)DECK.open=true;
  if(DECK.auto===undefined)DECK.auto=true;   // step aside while you're working in a window
  return DECK;
}
function deckSave(){localStorage.setItem('deck',JSON.stringify(DECK))}
function deckGroupOf(id){return DECK.groups.find(g=>g.apps.includes(id))}
/* every launchable app has a home: new built-ins land in More, user apps in Your apps */
function deckReconcile(){
  const ids=(typeof launcherIds==='function'?launcherIds():Object.keys(APPS)).filter(id=>APPS[id]);
  DECK.groups.forEach(g=>g.apps=g.apps.filter(id=>APPS[id]));
  const homeless=ids.filter(id=>!deckGroupOf(id));
  if(homeless.length){
    const ua=homeless.filter(id=>id.startsWith('ua_')), rest=homeless.filter(id=>!id.startsWith('ua_'));
    const into=(name,list)=>{
      if(!list.length)return;
      let g=DECK.groups.find(x=>x.name===name);
      if(!g){g={id:'g'+Date.now().toString(36),name,apps:[]};DECK.groups.push(g)}
      g.apps.push(...list);
    };
    into('Your apps',ua); into('More',rest);
  }
  DECK.groups=DECK.groups.filter(g=>g.apps.length||g.widget);
  deckSave();
}
/* auto mode: the deck shows on a bare desktop and gets out of the way the
   moment a window is in use. Toggling it by hand pins that choice. */
/* Which desktops carry the deck is a per-desktop choice: Desktop 1 is the
   launcher by default, the rest start clear so windows have the whole canvas. */
function deckAllowed(){
  const m=(DECK&&DECK.desks)||{};
  return m[curDesk]!==undefined?!!m[curDesk]:(curDesk===1);
}
function deckVisibleNow(){
  if(!DECK)return false;
  if(!deckAllowed())return false;                        // this space is kept clear
  if(DECK._override!==undefined)return DECK._override;   // the user just toggled it
  if(!DECK.auto)return !!DECK.open;
  let busy=false;WM.wins.forEach(w=>{if(!w.min&&(w.desk||1)===curDesk)busy=true});
  return !busy;
}
/* Window activity recomputes visibility and clears any manual override, so one
   click on ▾ never leaves the deck stuck open over your work. */
function deckAuto(){

function deckToggle(){

/* ================= desktop widgets =================
   Every app has two surfaces: the desktop window (the whole application) and a
   widget (the one glanceable fact). The widget's size is a property of the APP —
   chosen while editing it — not of wherever it happens to be pinned, so the same
   app looks the same on every desktop and after a re-pin. */
const WIDGET_SIZES={s:{w:260,h:170,label:'Small'},m:{w:340,h:240,label:'Medium'},l:{w:460,h:340,label:'Large'}};
function widgetSizeOf(appId){
  const a=(USERAPPS||[]).find(x=>x.id===appId);
  return WIDGET_SIZES[(a&&a.widget_size)||'m']||WIDGET_SIZES.m;
}
async function setWidgetSize(appId,size){
  const a=(USERAPPS||[]).find(x=>x.id===appId);if(a)a.widget_size=size;
  try{await fetch('/api/apps/'+appId,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({widget_size:size})})}catch(e){}
  const d=WIDGET_SIZES[size]||WIDGET_SIZES.m;
  WIDGETS.filter(w=>w.app_id===appId).forEach(w=>{w.w=d.w;w.h=d.h});
  // the iframe is told its size in the URL, so it must re-mount to re-render
  if(widgetEls[appId]){widgetEls[appId].remove();delete widgetEls[appId]}
  renderWidgets();saveWidgets();
  if(typeof refreshApp==='function')refreshApp('studio');
  toast('widget size → '+d.label);
}
let WIDGETS=[];              // [{app_id,x,y,w,h}]
const widgetEls={};         // app_id -> element (kept alive so iframes never reload)
let widgetSaveT=0, widgetEchoUntil=0;
async function loadWidgets(){
  try{const r=await fetch('/api/widgets');const d=await r.json();WIDGETS=d.widgets||[]}catch(e){WIDGETS=[]}

/* A widget can live in four places: free on the desktop (default), as a card in
   the deck, in the strip beside the prompt bar, or shrunk into the menu bar. */
const WIDGET_PLACES=[['','Desktop'],['deck','App deck'],['bar','Beside the prompt bar'],['menubar','Menu bar']];
function setWidgetPlace(appId,place){
  let wd=WIDGETS.find(w=>w.app_id===appId);
  if(!wd){wd={app_id:appId,desk:curDesk,x:200,y:60,w:300,h:210};WIDGETS.push(wd)}
  wd.place=place||'';
  if(!place){wd.desk=curDesk}
  // the element is rebuilt in its new home; drop the cached one so it re-mounts
  if(widgetEls[appId]){widgetEls[appId].remove();delete widgetEls[appId]}
  renderWidgets();saveWidgets();
  toast('widget → '+((WIDGET_PLACES.find(p=>p[0]===(place||''))||[])[1]||'desktop'));
}
function renderPlacedWidgets(){
  const apps={};(USERAPPS||[]).forEach(a=>apps[a.id]=a);
  // beside the bar: compact live cards
  const bar=$('#barwidgets');
  if(bar){
    const list=WIDGETS.filter(w=>w.place==='bar'&&apps[w.app_id]);
    bar.classList.toggle('on',list.length>0);
    bar.innerHTML=list.map(w=>`<div class="barwidget"><div class="bw-h">${esc(apps[w.app_id].name)}
        <button onclick="setWidgetPlace('${esc(w.app_id)}','')" title="Unpin">✕</button></div>
      <iframe src="/api/apps/${esc(w.app_id)}/page?surface=widget&size=${esc((apps[w.app_id].widget_size)||'m')}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></div>`).join('');
  }
  // menu bar: a thin always-visible readout
  const mb=$('#mbwidgets');
  if(mb){
    const list=WIDGETS.filter(w=>w.place==='menubar'&&apps[w.app_id]);
    mb.innerHTML=list.map(w=>`<iframe class="mbwidget" title="${esc(apps[w.app_id].name)}"
      src="/api/apps/${esc(w.app_id)}/page?surface=widget&size=s" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`).join('');
  }
  if(typeof buildDeck==='function'&&$('#deck'))buildDeck();
}
function renderWidgets(){
  const box=$('#widgets');if(!box)return;
  const apps={};(USERAPPS||[]).forEach(a=>apps[a.id]=a);
  renderPlacedWidgets();
  // only free desktop widgets pinned to the CURRENT desktop are shown here
  const here=WIDGETS.filter(w=>apps[w.app_id]&&!w.place&&(w.desk||1)===curDesk);
  const want=new Set(here.map(w=>w.app_id));
  Object.keys(widgetEls).forEach(id=>{if(!want.has(id)){widgetEls[id].remove();delete widgetEls[id]}});
  here.forEach(wd=>{
    const a=apps[wd.app_id];
    let el=widgetEls[wd.app_id];
    if(!el){el=createWidgetEl(a);widgetEls[wd.app_id]=el;box.appendChild(el)}
    if(el._dragging||el._resizing)return;             // don't fight the user mid-gesture
    const dim=widgetSizeOf(wd.app_id);
    el.style.left=(wd.x??40)+'px';el.style.top=(wd.y??40)+'px';
    el.style.width=(wd.w??dim.w)+'px';el.style.height=(wd.h??dim.h)+'px';
  });

function createWidgetEl(a){

    showCtxItems(e,Object.entries(WIDGET_SIZES).map(([k,d])=>({label:d.label+' widget',fn:()=>setWidgetSize(a.id,k)}))
      .concat([null],WIDGET_PLACES.map(([p,label])=>({label:'Move to '+label,fn:()=>setWidgetPlace(a.id,p)})))
      .concat([null,{label:'Unpin',danger:true,fn:()=>unpinWidget(a.id)}]))};
  widgetDrag(el,el.querySelector('.wgh'),a.id);
  widgetResize(el,a.id);
  return el;
}
function widgetLayout(appId){return WIDGETS.find(w=>w.app_id===appId)}
function widgetDrag(el,handle,appId){
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    e.preventDefault();
    const desk=$('#desktop'),sx=e.clientX,sy=e.clientY,ol=el.offsetLeft,ot=el.offsetTop;
    el._dragging=true;el.style.zIndex=50;
    el.querySelector('iframe').style.pointerEvents='none';   // let the drag win over the page
    handle.setPointerCapture(e.pointerId);
    const move=ev=>{
      let l=Math.max(0,Math.min(ol+ev.clientX-sx,desk.clientWidth-60));
      let t=Math.max(0,Math.min(ot+ev.clientY-sy,desk.clientHeight-40));
      l=Math.round(l/8)*8;t=Math.round(t/8)*8;
      el.style.left=l+'px';el.style.top=t+'px';
    };
    const up=()=>{
      handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);
      el._dragging=false;el.style.zIndex='';el.querySelector('iframe').style.pointerEvents='';
      const wd=widgetLayout(appId);if(wd){wd.x=el.offsetLeft;wd.y=el.offsetTop;queueWidgetSave()}
    };
    handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up);
  });
}
function widgetResize(el,appId){
  // CSS `resize:both` gives the corner grip; persist the final size only, and mark busy so
  // background reloads don't clobber it mid-resize.
  let t=0;
  const ro=new ResizeObserver(()=>{
    const wd=widgetLayout(appId);if(!wd)return;
    if(Math.abs(el.offsetWidth-wd.w)<2&&Math.abs(el.offsetHeight-wd.h)<2)return;  // no real change
    el._resizing=true;wd.w=el.offsetWidth;wd.h=el.offsetHeight;
    clearTimeout(t);t=setTimeout(()=>{el._resizing=false;queueWidgetSave()},400);
  });
  ro.observe(el);
}
function queueWidgetSave(){clearTimeout(widgetSaveT);widgetSaveT=setTimeout(saveWidgets,500)}
async function saveWidgets(){
  widgetEchoUntil=Date.now()+1500;   // ignore the broadcast our own PUT triggers (prevents reload/flicker)
  try{await fetch('/api/widgets',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({widgets:WIDGETS})})}catch(e){}
}
function pinWidget(appId){
  if(WIDGETS.some(w=>w.app_id===appId&&(w.desk||1)===curDesk))return toast('already on this desktop');
  const n=WIDGETS.filter(w=>(w.desk||1)===curDesk).length,dim=widgetSizeOf(appId);
  WIDGETS.push({app_id:appId,desk:curDesk,x:170+(n%3)*320,y:40+(n%2)*235,w:dim.w,h:dim.h});
  renderWidgets();saveWidgets();toast('pinned to Desktop '+curDesk);
}
function unpinWidget(appId){
  WIDGETS=WIDGETS.filter(w=>!(w.app_id===appId&&(w.place||(w.desk||1)===curDesk)));
  renderWidgets();saveWidgets();toast('unpinned');refreshApp('studio');
}
function arrangeWidgets(){
  const desk=$('#desktop'),cols=Math.max(1,Math.floor((desk.clientWidth-180)/320));
  WIDGETS.filter(w=>(w.desk||1)===curDesk).forEach((w,i)=>{
    const dim=widgetSizeOf(w.app_id);
    w.w=dim.w;w.h=dim.h;w.x=170+(i%cols)*315;w.y=20+Math.floor(i/cols)*225});

}

/* ================= wallpaper =================
   Four sources, most-specific first:
     1. a wallpaper file the user generated or adopted from the host,
     2. a built-in they picked by hand (remembered per-machine),
     3. the wallpaper the current theme ships with — this is what makes picking
        Claymorphism also dress the desktop for it,
     4. the wizard's preset gradient, or the stylesheet's mesh.
   The built-ins are SVG: a few KB each, sharp from a phone to a 4K panel, and
   cheap to rasterise on slow GPUs (no blur filters — gradients only). */
const BUILTIN_WALLS=['bento','clay','liquid','minimal','spatial'];
const builtinWallURL=id=>'/assets/wallpapers/'+encodeURIComponent(id)+'.svg';
function pickedWall(){return localStorage.getItem('wallpaper.builtin')||''}
function themeWall(){
  const t=allThemes()[CURRENT_THEME];
  return (t&&t.wall_img&&BUILTIN_WALLS.includes(t.wall_img))?t.wall_img:'';
}
function applyWallImage(url){
  const w=$('#wall');
  if(!w)return;
  if(url){w.style.backgroundImage='url("'+url+'")';w.classList.add('has')}
  else{w.style.backgroundImage='';w.classList.remove('has')}
}
function loadWallpaper(){
  const url='/api/wallpaper?t='+Date.now();
  const img=new Image();
  img.onload=()=>applyWallImage(url);
  img.onerror=()=>{
    const id=pickedWall()||themeWall();
    if(id)return applyWallImage(builtinWallURL(id));
    const preset=cfg&&cfg.desktop&&cfg.desktop.wallpaper_preset;
    if(preset&&typeof WIZ_WALLS!=='undefined'&&WIZ_WALLS[preset]){
      const w=$('#wall');w.style.backgroundImage=WIZ_WALLS[preset];w.classList.add('has');
    }else applyWallImage('');
  };
  img.src=url;
}
/* Picking a built-in clears any generated wallpaper file, because a file always
   wins — leaving one behind would make the choice look like it did nothing. */
async function setBuiltinWallpaper(id){
  if(!BUILTIN_WALLS.includes(id))return toast('no built-in wallpaper "'+id+'"');
  localStorage.setItem('wallpaper.builtin',id);
  try{await fetch('/api/wallpaper',{method:'DELETE'})}catch(e){}
  loadWallpaper();
}
function clearBuiltinWallpaper(){localStorage.removeItem('wallpaper.builtin');loadWallpaper()}

/* ================= jarvis thinking animation ================= */
let jrRaf=0,jrPulse=0,jrActive=false,jrTimeout=0;
function jarvisOn(autoOffSecs){
  const c=$('#jarvis');c.classList.add('on');jrActive=true;
  if(!jrRaf)jrRaf=requestAnimationFrame(jarvisDraw);
  clearTimeout(jrTimeout);
  if(autoOffSecs)jrTimeout=setTimeout(()=>{if(!running)jarvisOff()},autoOffSecs*1000);
}
function jarvisOff(){jrActive=false;$('#jarvis').classList.remove('on')}
function jarvisDraw(ts){
  const c=$('#jarvis');
  if(!jrActive&&+getComputedStyle(c).opacity===0){jrRaf=0;return}
  const dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  if(c.width!==W*dpr){c.width=W*dpr}if(c.height!==H*dpr){c.height=H*dpr}
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const t=ts/1000,cx=W/2,cy=H/2,TAU=Math.PI*2;
  jrPulse*=.96;
  const A=.55+.2*Math.sin(t*2.4)+jrPulse*.3;
  // core glow
  const cr=26+5*Math.sin(t*3)+jrPulse*16;
  const g=x.createRadialGradient(cx,cy,0,cx,cy,cr*3);
  g.addColorStop(0,'rgba(94,234,212,'+(.30*A).toFixed(3)+')');
  g.addColorStop(1,'rgba(34,211,238,0)');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,cr*3,0,TAU);x.fill();
  x.fillStyle='rgba(94,234,212,'+(.85*A).toFixed(3)+')';x.beginPath();x.arc(cx,cy,4,0,TAU);x.fill();
  // segmented rotating rings
  const rings=[{r:60,s:1.1,n:3,w:2.5},{r:95,s:-.7,n:4,w:1.6},{r:135,s:.45,n:5,w:1.2},{r:185,s:-.28,n:3,w:1}];
  rings.forEach((R,i)=>{
    x.lineWidth=R.w;
    x.strokeStyle='rgba('+(i%2?'34,211,238':'94,234,212')+','+(.5*A).toFixed(3)+')';
    for(let k=0;k<R.n;k++){
      const a0=t*R.s+k*TAU/R.n;
      x.beginPath();x.arc(cx,cy,R.r,a0,a0+TAU/R.n*.62);x.stroke();
    }
  });
  // sweeping ticks on the outer ring
  x.strokeStyle='rgba(94,234,212,'+(.35*A).toFixed(3)+')';x.lineWidth=1;
  const head=Math.floor(t*22);
  for(let k=0;k<72;k++){
    if(((k-head)%72+72)%72>=10)continue;
    const a=k/72*TAU;
    x.beginPath();x.moveTo(cx+Math.cos(a)*205,cy+Math.sin(a)*205);
    x.lineTo(cx+Math.cos(a)*213,cy+Math.sin(a)*213);x.stroke();
  }
  // orbiting dots
  x.fillStyle='rgba(34,211,238,'+(.8*A).toFixed(3)+')';
  for(let k=0;k<3;k++){
    const a=t*(.9+k*.35)+k*2.1,r=60+k*38;
    x.beginPath();x.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2.5,0,TAU);x.fill();
  }
  jrRaf=requestAnimationFrame(jarvisDraw);
}

let VOICE=JSON.parse(localStorage.getItem('voice')||'{"tts":false,"voice":"","rate":1,"lang":"en-IN"}');
function saveVoice(){localStorage.setItem('voice',JSON.stringify(VOICE))}
function speak(text){
  if(!VOICE.tts||!text||!window.speechSynthesis)return;
  const clean=text.replace(/```[\s\S]*?```/g,' code block. ').replace(/[*_#`>|]/g,'').slice(0,800);
  const u=new SpeechSynthesisUtterance(clean);
  u.rate=VOICE.rate||1;
  const v=speechSynthesis.getVoices().find(v=>v.name===VOICE.voice);
  if(v)u.voice=v;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
let rec=null,recOn=false;
function micToggle(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('speech recognition is not available in this browser');
  if(recOn){rec.stop();return}
  rec=new SR();rec.lang=VOICE.lang||'en-IN';rec.interimResults=true;rec.continuous=true;
  const base=input?input.value:'';
  rec.onresult=e=>{
    if(!input)return;
    let fin=base,inter='';
    for(let i=0;i<e.results.length;i++){const r=e.results[i];
      if(r.isFinal)fin=(fin+' '+r[0].transcript).trim();else inter+=r[0].transcript}
    input.value=(fin+' '+inter).trim();input.dispatchEvent(new Event('input'));
  };
  rec.onend=()=>{recOn=false;$('#mic')?.classList.remove('rec')};
  rec.onerror=e=>toast('mic: '+e.error);
  rec.start();recOn=true;$('#mic')?.classList.add('rec');
}

/* ---- shell command channel: the agent (via the server) drives THIS desktop.
   Every shell_cmd is answered with POST /api/shell/result {id, ok, data}. ---- */
function shellResolveApp(t){
  t=String(t||'').toLowerCase().trim();
  if(!t)return null;
  if(APPS[t])return t;
  for(const id in APPS)if(APPS[id].title.toLowerCase()===t)return id;
  for(const id in APPS)if(APPS[id].title.toLowerCase().includes(t)||id.toLowerCase().includes(t))return id;
  return null;
}
async function shellCmd(ev){
  let ok=true,data=null;
  const target=ev.args&&ev.args.target;
  try{
    switch(ev.action){
      case 'open_app':{
        const id=shellResolveApp(target);
        if(!id)throw `no AgentOS app matches "${target}"`;
        openApp(id);data=`opened ${APPS[id].title}`;break}
      case 'close_app':{
        const id=shellResolveApp(target);
        const ws=id?winsOf(id):[];
        if(!ws.length)throw `no open window for "${target}"`;
        ws.forEach(w=>closeWin(w));data=`closed ${ws.length} ${id} window${ws.length>1?'s':''}`;break}
      case 'focus_app':{
        const id=shellResolveApp(target);
        const w=id?winsOf(id)[0]:null;
        if(!w)throw `no open window for "${target}"`;
        if(w.desk!==curDesk)switchDesk(w.desk);
        if(w.min)restoreWin(w);focusWin(w);data=`focused ${w.app.title}`;break}
      case 'switch_desktop':{
        const n=parseInt(target,10);
        if(!(n>=1&&n<=DESKS))throw `desktop ${target} doesn't exist (1–${DESKS})`;
        switchDesk(n);data=`on desktop ${n}`;break}
      case 'apply_theme':{
        const all=allThemes(), q=String(target||'').toLowerCase().trim();
        const id=Object.keys(all).find(k=>k.toLowerCase()===q)
          ||Object.keys(all).find(k=>(all[k].name||'').toLowerCase()===q)
          ||Object.keys(all).find(k=>k.toLowerCase().includes(q));
        if(!id)throw `no theme called "${target}" — themes: ${Object.keys(all).join(', ')}`;
        applyTheme(id);data=`theme is now ${id}`;break}
      case 'shell_action':{            // a compositor keybinding reached the shell
        if(typeof scRun!=='function'||!scRun(String(target)))throw `unknown action "${target}"`;
        data=`ran ${target}`;break}
      case 'list_open_apps':{
        const arr=[];WM.wins.forEach(w=>arr.push({app:w.id,title:w.app.title,minimized:w.min,maximized:w.max,desktop:w.desk,active:w.el.classList.contains('active')}));
        data={open:arr,current_desktop:curDesk,desktops:DESKS,theme:CURRENT_THEME};break}
      default: throw `unknown shell action "${ev.action}"`;
    }
  }catch(e){ok=false;data=String(e)}
  if(!ok&&!ev.id)toast(String(data));   // palette-suggested actions surface their failure locally
  if(ev.id)try{await fetch('/api/shell/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:ev.id,ok,data})})}catch(e){}
}

/* ---- chat-event sinks: any surface (omnibar, copilot panels) can render a
   conversation's live stream by registering a handler here. The Chat window
   keeps its inline path below; sinks are additive — buffering into STREAMS
   still happens so opening the conversation in Chat mid-turn stays lossless. */
const CHAT_SINKS=new Map();   // conversation_id -> {start,delta,thinking,toolStart,toolEnd,status,approval,error,end}
function sinkOn(cid,sink){if(cid)CHAT_SINKS.set(cid,sink)}
function sinkOff(cid){CHAT_SINKS.delete(cid)}
/* one approval card builder for every surface (Chat inline, floating, sinks) */
function buildApprovalBox(ev,cur){
  const box=document.createElement('div');box.className='approval';box.id='ap-'+ev.id;
  const detail=ev.name==='run_command'?(ev.args.command||''):(ev.name+' '+JSON.stringify(ev.args,null,1));
  const who=ev.offer?permPrincipalLabel(ev.offer.principal_kind,ev.offer.principal_id):'';
  box.innerHTML=`<div class="atitle">Approval needed${who?' · '+esc(who):''}${cur?'':' · another chat'}</div><div class="acmd">${esc(detail)}</div><div class="areason">${esc(ev.reason||'')}</div><div class="btns"><button class="allow">Allow</button><button class="deny">Deny</button><button class="deny always">${ev.offer?'Allow &amp; remember':'Always allow'}</button></div>`;
  box.querySelector('.allow').onclick=()=>resolveApproval(ev.id,true);
  box.querySelector('.deny:not(.always)').onclick=()=>resolveApproval(ev.id,false);
  box.querySelector('.always').onclick=async()=>{
    if(ev.offer){ // principal-scoped grant, written server-side; revocable in Permissions
      resolveApproval(ev.id,true,true);
      toast('granted to '+who+': '+ev.offer.action+' '+ev.offer.resource);
    }else{
      const pat=ev.name==='run_command'?('run_command '+((ev.args.command||'').trim().split(/\s+/)[0]||'')+' *'):(ev.name+' *');
      await addPolicy('allow',pat);
      resolveApproval(ev.id,true);
      toast('policy added: always allow "'+pat+'"');
    }
  };
  return box;
}

/* ---- the AI presence bubble (bottom-right): wherever a turn is running — a
   copilot panel, the omnibar, a background task — it shows here, and one click
   opens that conversation in Agent Chat. ---- */
let AIB={last:null,seen:0};
function aiBubble(){

    b=document.createElement('div');b.id='aibubble';
