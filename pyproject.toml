[project]
name = "agentos"
version = "0.99.5"
description = "Bento Box AI — a local-first agentic OS: one interface, any AI (local or cloud), real actions on your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "websockets>=12",
    # 2.x: the client reads both majors (mcp_client._field, _http_streams), tested against real
    # servers in tests/test_mcp_sdk.py. Below 3, because a major moves the API.
    "mcp>=1.30,<3",
    "textual>=8.2.8",
    "truststore>=0.10",
    "pyyaml>=6",
    "dbus-fast>=2.24",
    # 50 fixes PYSEC-2026-3552 (packaging/audit-vulns.py), on every machine. Its 32-bit ARM
    # wheel needs glibc 2.31 (Bullseye): a Pi on Buster can't take it, and agentos/oldpi.py
    # says so. The old armv7 pin (46.0.3, for Buster) is gone with the advisory it carried.
    "cryptography>=50",
    # Every Bento database is encrypted at rest with this machine's key (agentos/dbcrypt.py).
    # SQLCipher in a wheel (zlib licence; SQLCipher itself is BSD-style). There is no 32-bit
    # ARM wheel, so a 32-bit Pi (deprecated, oldpi.py) keeps plain databases and says so, and
    # install.sh/updates skip the package there rather than compile it.
    "sqlcipher3>=0.6.5; platform_machine != 'armv7l' and platform_machine != 'armv6l'",
]

[project.scripts]
# `bento` is the command; `agentos` is kept as an alias, permanently.
# The product is Bento Box AI, but a rename that breaks the command people have
# in their shell history — and in their systemd units, cron entries and scripts —
# is a rename that costs the user something for a change that was ours to make.
bento = "agentos.__main__:main"
agentos = "agentos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.hatch.build.targets.wheel.force-include]
# the manual ships with the product: served at /api/docs -> Docs app + TUI tab 8
"docs" = "agentos/docs"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
