[project]
name = "agentos"
version = "0.4.0"
description = "Bento Box AI — a local-first agentic OS: one interface, any AI (local or cloud), real actions on your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "websockets>=12",
    "mcp>=1.28.1",
    "textual>=8.2.8",
    "truststore>=0.10",
    "pyyaml>=6",
    "dbus-fast>=2.24",
]

[project.scripts]
# `bento` is the command; `agentos` is kept as an alias, permanently.
# The product is Bento Box AI, but a rename that breaks the command people have
# in their shell history — and in their systemd units, cron entries and scripts —
# is a rename that costs the user something for a change that was ours to make.
bento = "agentos.__main__:main"
agentos = "agentos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.hatch.build.targets.wheel.force-include]
# the manual ships with the product: served at /api/docs -> Docs app + TUI tab 8
"docs" = "agentos/docs"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
