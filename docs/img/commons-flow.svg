<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#5eead4" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="920" height="360" rx="14" fill="#0d1117"/>
  <text x="460" y="34" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="middle">The app commons — nobody hosts it</text>

  <!-- author repos -->
  <rect x="36" y="70" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="136" y="96" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">✍ pat/notes-app</text>
  <text x="136" y="116" fill="#8b949e" font-size="11.5" text-anchor="middle">bento.agentapp.json</text>
  <text x="136" y="134" fill="#5eead4" font-size="11.5" text-anchor="middle">topic: bento-app</text>

  <rect x="36" y="180" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="136" y="206" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">🤖 arie/daily-brief</text>
  <text x="136" y="226" fill="#8b949e" font-size="11.5" text-anchor="middle">bento.agentapp.json</text>
  <text x="136" y="244" fill="#5eead4" font-size="11.5" text-anchor="middle">topic: bento-app</text>

  <text x="136" y="298" fill="#8b949e" font-size="11.5" text-anchor="middle">each author's OWN repo —</text>
  <text x="136" y="314" fill="#8b949e" font-size="11.5" text-anchor="middle">free hosting, two CDNs</text>

  <!-- github index -->
  <rect x="330" y="118" width="220" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="440" y="146" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">GitHub topic search</text>
  <text x="440" y="166" fill="#8b949e" font-size="11.5" text-anchor="middle">IS the directory —</text>
  <text x="440" y="182" fill="#8b949e" font-size="11.5" text-anchor="middle">no server, no index repo,</text>
  <text x="440" y="198" fill="#8b949e" font-size="11.5" text-anchor="middle">tagging = listing</text>

  <!-- installer -->
  <rect x="648" y="70" width="236" height="200" rx="10" fill="#161b22" stroke="#5eead4"/>
  <text x="766" y="98" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">any AgentOS · Store → Import</text>
  <text x="766" y="124" fill="#8b949e" font-size="11.5" text-anchor="middle">owner/repo — or pin forever:</text>
  <text x="766" y="141" fill="#5eead4" font-size="11.5" font-family="ui-monospace,monospace" text-anchor="middle">owner/repo@commit-hash</text>
  <text x="766" y="160" fill="#8b949e" font-size="11" text-anchor="middle">(a git hash is a Merkle root —</text>
  <text x="766" y="175" fill="#8b949e" font-size="11" text-anchor="middle">the chain, without the gas)</text>
  <line x1="664" y1="192" x2="868" y2="192" stroke="#30363d"/>
  <text x="766" y="214" fill="#e6edf3" font-size="12" text-anchor="middle">consent screen:</text>
  <text x="766" y="232" fill="#8b949e" font-size="11.5" text-anchor="middle">permissions · author label</text>
  <text x="766" y="249" fill="#8b949e" font-size="11.5" text-anchor="middle">local scan · pin check · signature</text>

  <line x1="240" y1="112" x2="326" y2="146" stroke="#5eead4" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="240" y1="222" x2="326" y2="188" stroke="#5eead4" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="554" y1="166" x2="644" y2="166" stroke="#5eead4" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="599" y="156" fill="#8b949e" font-size="10.5" text-anchor="middle">discover</text>
</svg>
