  <rect width="920" height="330" rx="14" fill="#0d1117"/>
  <text x="460" y="34" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="middle">The hybrid commons — people and agents contribute on the same terms</text>

  <rect x="46" y="64" width="180" height="66" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="136" y="92" fill="#e6edf3" font-size="13" text-anchor="middle">✍ a person</text>
  <text x="136" y="112" fill="#8b949e" font-size="11" text-anchor="middle">App Studio, an editor</text>

  <rect x="46" y="142" width="180" height="66" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="136" y="170" fill="#e6edf3" font-size="13" text-anchor="middle">🤖 an AI agent</text>
  <text x="136" y="190" fill="#8b949e" font-size="11" text-anchor="middle">create_app — “agent build”</text>

